  <style>
/* FANTASY MMA */
.fant-hero { text-align:center; padding:52px 20px 28px; }
.fant-hero-title { font-family:'Montserrat',sans-serif; font-weight:900; font-size:clamp(2rem,5vw,2.8rem); text-transform:uppercase; color:#fff; margin:0 0 8px; letter-spacing:0.02em; }
.fant-hero-title span { color:#e06b1a; }
.fant-hero-sub { font-family:'Inter',sans-serif; font-size:0.88rem; color:rgba(255,255,255,.4); margin:0 0 4px; }
.fant-tab-bar { display:flex; gap:4px; background:rgba(255,255,255,.04); border-radius:10px; padding:4px; margin:0 auto 28px; max-width:340px; }
.fant-tab { flex:1; padding:9px 12px; border:none; border-radius:7px; background:none; cursor:pointer; font-family:'Montserrat',sans-serif; font-weight:700; font-size:0.68rem; letter-spacing:0.08em; text-transform:uppercase; color:rgba(255,255,255,.35); transition:all 0.15s; }
.fant-tab.active { background:rgba(255,255,255,.1); color:#fff; }
.fant-root { max-width:860px; margin:0 auto; padding:0 20px 60px; }
.fant-loading { text-align:center; color:rgba(255,255,255,.3); font-family:'Inter',sans-serif; font-size:.85rem; padding:40px; }
.fant-season-chip { display:inline-block; background:rgba(255,138,61,.1); border:1px solid rgba(255,138,61,.25); color:#ff8a3d; font-family:'Montserrat',sans-serif; font-weight:800; font-size:.58rem; letter-spacing:.14em; text-transform:uppercase; padding:3px 10px; border-radius:4px; margin-bottom:18px; }
.fant-slot-info { font-family:'Inter',sans-serif; font-size:.8rem; color:rgba(255,255,255,.35); margin-bottom:16px; }
.fant-slot-info strong { color:#e06b1a; }
.fant-roster-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(145px,1fr)); gap:12px; margin-bottom:20px; }
.fant-fighter-card { background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:16px 12px 12px; text-align:center; position:relative; transition:border-color .15s, background .15s; }
.fant-fighter-card.filled { border-color:rgba(224,107,26,.4); background:rgba(224,107,26,.06); }
.fant-fighter-card.empty { border-style:dashed; border-color:rgba(255,255,255,.1); cursor:default; }
.fant-fighter-img { width:56px; height:56px; border-radius:50%; object-fit:cover; background:rgba(255,255,255,.06); margin:0 auto 8px; display:block; }
.fant-fighter-name { font-family:'Montserrat',sans-serif; font-weight:800; font-size:.74rem; color:#fff; margin-bottom:2px; word-break:break-word; }
.fant-fighter-class { font-family:'Inter',sans-serif; font-size:.62rem; color:rgba(255,255,255,.3); }
.fant-fighter-pts { font-family:'Montserrat',sans-serif; font-weight:900; font-size:1rem; color:#e06b1a; margin-top:6px; }
.fant-fighter-pts span { font-size:.6rem; color:rgba(255,255,255,.3); font-weight:600; }
.fant-remove-btn { position:absolute; top:6px; right:8px; background:none; border:none; cursor:pointer; color:rgba(255,255,255,.18); font-size:13px; padding:2px 5px; transition:color .15s; line-height:1; min-height:0; }
.fant-remove-btn:hover { color:rgba(255,80,80,.7); }
.fant-add-btn { display:inline-flex; align-items:center; gap:8px; background:linear-gradient(135deg,#e06b1a,#a87a0a); color:#000; font-family:'Montserrat',sans-serif; font-weight:900; font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; padding:13px 24px; border-radius:10px; border:none; cursor:pointer; transition:opacity .15s, transform .15s; margin-bottom:16px; }
.fant-add-btn:hover { opacity:.9; transform:translateY(-1px); }
.fant-secondary-btn { display:inline-flex; align-items:center; gap:8px; background:rgba(255,255,255,.06); color:rgba(255,255,255,.6); border:1px solid rgba(255,255,255,.12); font-family:'Montserrat',sans-serif; font-weight:800; font-size:.7rem; letter-spacing:.08em; text-transform:uppercase; padding:11px 20px; border-radius:10px; cursor:pointer; transition:background .15s; }
.fant-secondary-btn:hover { background:rgba(255,255,255,.1); }
.fant-picker { margin-top:16px; background:rgba(255,255,255,.02); border:1px solid rgba(255,255,255,.07); border-radius:14px; padding:16px; }
.fant-picker-title { font-family:'Montserrat',sans-serif; font-weight:800; font-size:.8rem; color:#fff; margin:0 0 12px; }
.fant-search { width:100%; box-sizing:border-box; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); border-radius:10px; color:#fff; font-family:'Inter',sans-serif; font-size:.85rem; padding:10px 14px; margin-bottom:12px; }
.fant-search:focus { outline:none; border-color:rgba(255,138,61,.4); }
.fant-search::placeholder { color:rgba(255,255,255,.25); }
.fant-picker-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px; max-height:300px; overflow-y:auto; }
.fant-pick-item { background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.07); border-radius:10px; padding:12px 8px; text-align:center; cursor:pointer; transition:border-color .15s, background .15s; }
.fant-pick-item:hover { border-color:rgba(224,107,26,.5); background:rgba(224,107,26,.08); }
.fant-pick-item img { width:44px; height:44px; border-radius:50%; object-fit:cover; background:rgba(255,255,255,.06); margin:0 auto 6px; display:block; }
.fant-pick-item-name { font-family:'Montserrat',sans-serif; font-weight:700; font-size:.65rem; color:#fff; word-break:break-word; }
.fant-pick-item-class { font-family:'Inter',sans-serif; font-size:.58rem; color:rgba(255,255,255,.3); margin-top:2px; }
.fant-lb-wrap { background:rgba(255,255,255,.02); border:1px solid rgba(255,255,255,.07); border-radius:14px; overflow:hidden; }
.fant-lb-row { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid rgba(255,255,255,.05); transition:background .12s; }
.fant-lb-row:last-child { border-bottom:none; }
.fant-lb-row:hover { background:rgba(255,255,255,.03); }
.fant-lb-row.me { background:rgba(255,138,61,.04); }
.fant-lb-pos { font-family:'Montserrat',sans-serif; font-weight:900; font-size:.85rem; color:rgba(255,255,255,.3); width:22px; text-align:center; flex-shrink:0; }
.fant-lb-pos.gold { color:#e06b1a; }
.fant-lb-pos.silver { color:#aaa; }
.fant-lb-pos.bronze { color:#cd7f32; }
.fant-lb-avatar { width:30px; height:30px; border-radius:50%; object-fit:cover; background:rgba(255,255,255,.08); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-family:'Montserrat',sans-serif; font-weight:800; font-size:.62rem; color:rgba(255,255,255,.5); overflow:hidden; }
.fant-lb-avatar img { width:100%; height:100%; object-fit:cover; }
.fant-lb-name { font-family:'Montserrat',sans-serif; font-weight:700; font-size:.82rem; color:#fff; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.fant-lb-you { font-size:.58rem; color:rgba(255,138,61,.7); margin-left:5px; font-family:'Montserrat',sans-serif; font-weight:800; }
.fant-lb-pts { font-family:'Montserrat',sans-serif; font-weight:900; font-size:1rem; color:#e06b1a; flex-shrink:0; }
.fant-lb-pts span { font-size:.6rem; color:rgba(255,255,255,.3); font-weight:600; margin-left:2px; }
.fant-group-box { background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:20px; margin-bottom:20px; }
.fant-group-name { font-family:'Montserrat',sans-serif; font-weight:900; font-size:1rem; color:#fff; margin:0 0 4px; }
.fant-group-code { font-family:'Montserrat',sans-serif; font-weight:900; font-size:1.1rem; color:#e06b1a; letter-spacing:.15em; }
.fant-group-meta { font-family:'Inter',sans-serif; font-size:.75rem; color:rgba(255,255,255,.35); margin-bottom:14px; }
.fant-modal-bg { position:fixed; inset:0; z-index:9000; background:rgba(0,0,0,.78); backdrop-filter:blur(8px); display:flex; align-items:flex-end; justify-content:center; padding:16px; }
.fant-modal { background:#111318; border:1px solid rgba(255,255,255,.1); border-radius:20px 20px 0 0; padding:28px 24px 36px; width:100%; max-width:440px; animation:slideUp .3s cubic-bezier(.22,1,.36,1) both; }
@keyframes slideUp { from { transform:translateY(60px); opacity:0; } to { transform:none; opacity:1; } }
.fant-modal-title { font-family:'Montserrat',sans-serif; font-weight:900; font-size:1rem; color:#fff; margin:0 0 14px; }
.fant-modal-input { width:100%; box-sizing:border-box; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); border-radius:10px; color:#fff; font-family:'Inter',sans-serif; font-size:.9rem; padding:12px 16px; margin-bottom:12px; }
.fant-modal-input:focus { outline:none; border-color:rgba(255,138,61,.4); }
.fant-modal-err { color:rgba(255,80,80,.75); font-family:'Inter',sans-serif; font-size:.75rem; margin-top:6px; min-height:18px; }
.fant-empty { text-align:center; padding:36px 16px; color:rgba(255,255,255,.25); font-family:'Inter',sans-serif; font-size:.85rem; line-height:1.6; }
.fant-empty a { color:#e06b1a; text-decoration:none; font-weight:700; }
.fant-section-hd { font-family:'Montserrat',sans-serif; font-weight:800; font-size:.8rem; text-transform:uppercase; letter-spacing:.08em; color:rgba(255,255,255,.35); margin:0 0 12px; }
.fant-btns-row { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
@media (max-width:600px) {
  .fant-roster-grid { grid-template-columns:repeat(2,1fr); }
  .fant-picker-grid { grid-template-columns:repeat(2,1fr); }
}
/* Light mode */
body.light-mode .fant-hero-title { color:#111 !important; }
body.light-mode .fant-hero-sub { color:rgba(0,0,0,.45) !important; }
body.light-mode .fant-tab-bar { background:rgba(0,0,0,.05) !important; }

body.light-mode .fant-fighter-card { background:rgba(0,0,0,.03) !important; border-color:rgba(0,0,0,.1) !important; }
body.light-mode .fant-fighter-name { color:#111 !important; }
body.light-mode .fant-lb-name { color:#111 !important; }
body.light-mode .fant-lb-row { background:rgba(0,0,0,.02) !important; }
body.light-mode .fant-lb-row.me { background:rgba(0,100,150,.05) !important; }
body.light-mode .fant-group-box { background:rgba(0,0,0,.03) !important; border-color:rgba(0,0,0,.08) !important; }
body.light-mode .fant-group-name { color:#111 !important; }
body.light-mode .fant-search { background:rgba(0,0,0,.04) !important; border-color:rgba(0,0,0,.12) !important; color:#000 !important; }
body.light-mode .fant-pick-item { background:rgba(0,0,0,.03) !important; }
body.light-mode .fant-pick-item-name { color:#111 !important; }
body.light-mode .fant-modal { background:#fff !important; }
body.light-mode .fant-modal-title { color:#111 !important; }
body.light-mode .fant-modal-input { background:rgba(0,0,0,.04) !important; color:#000 !important; }
  </style>
