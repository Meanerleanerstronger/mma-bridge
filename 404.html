<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="images/mma-bridge-logo.png?v=2">
  <link rel="apple-touch-icon" href="images/mma-bridge-logo.png?v=2">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | MMA Bridge</title>
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Montserrat:wght@400;700;900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=9.22" />
  <style>
    @keyframes fadeUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
    @keyframes glitch {
      0%,100%{clip-path:inset(0 0 100% 0)} 10%{clip-path:inset(30% 0 50% 0)} 20%{clip-path:inset(70% 0 10% 0)}
      30%{clip-path:inset(10% 0 80% 0)} 40%{clip-path:inset(50% 0 20% 0)} 50%{clip-path:inset(0 0 100% 0)}
    }
    body { background: #060608; min-height: 100vh; display: flex; flex-direction: column; }
    .not-found-wrap {
      flex: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 60px 24px 100px;
      text-align: center;
      animation: fadeUp 0.5s ease both;
    }
    .not-found-code {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: clamp(7rem, 22vw, 14rem);
      line-height: 0.9;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, rgba(255,138,61,0.15) 0%, rgba(255,138,61,0.04) 60%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      position: relative;
      margin-bottom: 8px;
      user-select: none;
    }
    .not-found-code::after {
      content: '404';
      position: absolute; inset: 0;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      background: linear-gradient(135deg, #ff8a3d 0%, #0080ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      opacity: 0.06;
    }
    .not-found-label {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 0.72rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255,138,61,0.5);
      margin-bottom: 20px;
    }
    .not-found-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: clamp(1.6rem, 5vw, 2.6rem);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #fff;
      margin: 0 0 12px;
    }
    .not-found-sub {
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.3);
      max-width: 360px;
      line-height: 1.6;
      margin: 0 auto 36px;
    }
    .not-found-actions {
      display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
    }
    .not-found-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 28px;
      border-radius: 10px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700; font-size: 0.72rem;
      letter-spacing: 0.12em; text-transform: uppercase;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s, transform 0.15s;
    }
    .not-found-btn:hover { transform: translateY(-2px); }
    .not-found-btn-primary {
      background: rgba(255,138,61,0.1);
      border: 1px solid rgba(255,138,61,0.35);
      color: #ff8a3d;
    }
    .not-found-btn-primary:hover { background: rgba(255,138,61,0.18); border-color: rgba(255,138,61,0.55); }
    .not-found-btn-secondary {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.5);
    }
    .not-found-btn-secondary:hover { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.75); }
    .not-found-divider {
      width: 60px; height: 1px;
      background: linear-gradient(to right, transparent, rgba(255,138,61,0.2), transparent);
      margin: 32px auto;
    }
    .not-found-links {
      display: flex; gap: 24px; flex-wrap: wrap; justify-content: center;
    }
    .not-found-links a {
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.3);
      text-decoration: none;
      transition: color 0.15s;
    }
    .not-found-links a:hover { color: rgba(255,138,61,0.7); }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a class="logo" href="index.html">
        <img src="images/mma-bridge-logo.png" class="nav-logo-img" alt="MMA Bridge">
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Trending</a></li>
        <li><a href="events.html">Upcoming Events</a></li>
        <li><a href="pfp.html">Rankings</a></li>
        <li><a href="reviews.html">Review</a></li>
        <li><a href="leaderboard.html">Leaderboard</a></li>
      </ul>
      <div class="nav-auth"></div>
    </div>
  </nav>

  <div class="not-found-wrap">
    <div class="not-found-code">404</div>
    <div class="not-found-label">Page Not Found</div>
    <h1 class="not-found-title">You've Been Taken Down</h1>
    <p class="not-found-sub">This page doesn't exist or may have been moved. Let's get you back to the action.</p>
    <div class="not-found-actions">
      <a href="index.html" class="not-found-btn not-found-btn-primary">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
        Back to Home
      </a>
      <a href="events.html" class="not-found-btn not-found-btn-secondary">Upcoming Events</a>
    </div>
    <div class="not-found-divider"></div>
    <div class="not-found-links">
      <a href="pfp.html">P4P Rankings</a>
      <a href="reviews.html">Reviews</a>
      <a href="leaderboard.html">Leaderboard</a>
      <a href="about.html">About</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="auth.js?v=3.3"></script>
</body>
</html>
