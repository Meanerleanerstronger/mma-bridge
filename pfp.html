  <style>
    /* ── KEYFRAMES ── */
    @keyframes shimmerSlide {
      0%   { background-position: -300% center; }
      100% { background-position: 300% center; }
    }
    @keyframes heroContentIn {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes rowIn {
      from { opacity: 0; transform: translateX(-12px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes goldPulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(255,138,61,0.5); }
      50%      { box-shadow: 0 0 0 6px rgba(255,138,61,0); }
    }

    .pfp-page {
      background: #060608;
      background-image:
        radial-gradient(ellipse 70% 40% at 80% 0%, rgba(255,138,61,0.04) 0%, transparent 60%),
        radial-gradient(ellipse 50% 30% at 10% 100%, rgba(255,138,61,0.03) 0%, transparent 50%);
      min-height: 100vh;
    }

    /* ── Page wrap (holds the tab nav above the spotlight) ── */
    .pfp-list-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 56px 0;
    }

    /* ── Rankings tabs ── */
    .rnk-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 28px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 4px;
      width: fit-content;
    }
    .rnk-tab {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 9px 22px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.4);
      cursor: pointer;
      transition: background 0.2s, color 0.2s, box-shadow 0.2s;
      white-space: nowrap;
    }
    .rnk-tab.active {
      background: rgba(255,138,61,0.15);
      color: #ff8a3d;
      box-shadow: 0 0 0 1px rgba(255,138,61,0.25) inset;
    }
    .rnk-tab[data-tab="womens-p4p"].active {
      background: rgba(210,100,190,0.18);
      color: #f0b4e8;
      box-shadow: 0 0 0 1px rgba(210,100,190,0.3) inset;
    }
    .rnk-tab[data-tab="divisional"].active {
      background: rgba(255,138,61,0.1);
      color: #ff8a3d;
      box-shadow: 0 0 0 1px rgba(255,138,61,0.2) inset;
    }
    body.light-mode .rnk-tabs { background:rgba(0,0,0,0.04); border-color:rgba(0,0,0,0.1); }
    body.light-mode .rnk-tab { color:rgba(0,0,0,0.4); }
    body.light-mode .rnk-tab.active { color:#e06b1a; background:rgba(255,138,61,0.12); }
    @media(max-width:480px) {
      .rnk-tabs { width: 100%; }
      .rnk-tab { flex: 1; padding: 9px 8px; font-size: 0.6rem; letter-spacing: 0.08em; }
    }

    /* light mode — champ-spotlight photo stays dark (text sits on a photo
       overlay, same convention used across the site), everything on a
       plain panel background gets real light-appropriate colors */
    body.light-mode .pfp-page { background: #f2f2f2; }
    body.light-mode .pfp-list-wrap { background: #f2f2f2; }

    body.light-mode .div-spotlight-right { background: #f2f2f2; }
    body.light-mode .div-pill { color: rgba(0,0,0,0.4); border-color: rgba(0,0,0,0.14); }
    body.light-mode .div-pill:hover { color: rgba(0,0,0,0.7); border-color: rgba(0,0,0,0.25); }
    body.light-mode .div-pill.women { color: rgba(190,40,140,0.6); border-color: rgba(190,40,140,0.2); }
    body.light-mode .div-pill-sep { background: rgba(0,0,0,0.12); }
    body.light-mode .div-contenders-label { color: rgba(0,0,0,0.3); }
    body.light-mode .div-contenders-line { background: rgba(0,0,0,0.08); }
    body.light-mode .div-contender-row { border-bottom-color: rgba(0,0,0,0.06); }
    body.light-mode .div-contender-row:hover { background: rgba(0,0,0,0.045); }
    body.light-mode .div-contender-rank { color: rgba(0,0,0,0.25); }
    body.light-mode .div-contender-photo { background-color: #ddd; border-color: rgba(0,0,0,0.1); color: rgba(0,0,0,0.35); }
    body.light-mode .div-contender-name { color: #111; }
    body.light-mode .div-contender-rec { color: rgba(0,0,0,0.4); }

    /* Every tab shows the same spotlight layout now, so the tab nav
       always sits full-width flush against it — no separate "divisional
       mode" margin/collapse rules needed any more. */
    .pfp-list-wrap {
      max-width: 100%;
      padding: 0;
      margin: 0;
    }
    .rnk-tabs {
      margin: 20px 0 0 32px;
      margin-bottom: 0;
    }
    @media (max-width: 768px) {
      .rnk-tabs { margin: 14px 14px 0; }
    }

    /* ── Division Spotlight layout ── */
    .div-spotlight {
      display: flex;
      height: calc(100vh - 132px); /* navbar ~66px + tabs area ~56px + buffer */
      min-height: 480px;
      overflow: hidden;
    }

    /* Left: champion full-body photo */
    .div-spotlight-left {
      position: relative;
      width: 42%;
      flex-shrink: 0;
      background: #080810;
      overflow: hidden;
    }

    /* Double-buffer photo layers for cross-fade */
    .div-photo-layer {
      position: absolute; inset: 0;
      background-size: cover;
      background-position: center 5%;
      opacity: 0;
      transition: opacity 0.38s ease;
    }
    .div-photo-layer.active { opacity: 1; }

    /* Right-edge + bottom gradient overlay on photo */
    .div-spotlight-left::after {
      content: '';
      position: absolute; inset: 0;
      background:
        linear-gradient(to right, transparent 52%, #060608 100%),
        linear-gradient(to top, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.2) 40%, transparent 65%);
      z-index: 1;
      pointer-events: none;
    }

    /* Champion info pinned to bottom-left of photo */
    .div-champ-info {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 40px 44px;
      z-index: 2;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .div-champ-info.fading { opacity: 0; transform: translateY(8px); }

    .div-champ-badge {
      display: inline-flex;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.48rem; font-weight: 900;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: #ff8a3d;
      background: rgba(255,138,61,0.1);
      border: 1px solid rgba(255,138,61,0.28);
      border-radius: 3px; padding: 3px 8px;
      margin-bottom: 10px;
    }
    .div-champ-info.women-div .div-champ-badge {
      color: #f0b4e8;
      background: rgba(240,100,200,0.1);
      border-color: rgba(240,100,200,0.25);
    }
    .div-champ-badge-new {
      color: #4ade80 !important;
      background: rgba(74,222,128,0.1) !important;
      border-color: rgba(74,222,128,0.3) !important;
    }
    .div-champ-division {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.56rem; font-weight: 700;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: rgba(255,255,255,0.32);
      margin-bottom: 6px;
    }
    .div-champ-nickname {
      font-family: 'Inter', sans-serif;
      font-size: 0.68rem; font-style: italic;
      color: rgba(255,138,61,0.55);
      margin-bottom: 4px;
    }
    .div-champ-name {
      font-family: 'Montserrat', sans-serif;
      font-size: 2.1rem; font-weight: 900;
      text-transform: uppercase;
      color: #fff;
      line-height: 1.05; letter-spacing: -0.015em;
      margin-bottom: 8px;
      text-shadow: 0 2px 24px rgba(0,0,0,0.85);
    }
    .div-champ-record {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.68rem; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: rgba(255,255,255,0.42);
    }

    /* Right: pill nav + contenders */
    .div-spotlight-right {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column;
      background: #060608;
      overflow: hidden;
    }

    /* Division pill switcher — Divisional tab only; P4P has no weight
       classes to pick between, so this stays hidden on those two tabs. */
    .div-pill-nav {
      display: none;
      align-items: center;
      gap: 5px; flex-wrap: nowrap;
      padding: 28px 36px 16px;
      overflow-x: auto; scrollbar-width: none;
      flex-shrink: 0;
    }
    .is-divisional .div-pill-nav { display: flex; }
    .div-pill-nav::-webkit-scrollbar { display: none; }

    .div-pill {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.58rem; font-weight: 800;
      letter-spacing: 0.1em; text-transform: uppercase;
      padding: 6px 13px; border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
      background: transparent;
      color: rgba(255,255,255,0.32);
      cursor: pointer; white-space: nowrap; flex-shrink: 0;
      transition: background 0.16s, color 0.16s, border-color 0.16s, box-shadow 0.16s;
    }
    .div-pill.women { color: rgba(240,100,200,0.38); border-color: rgba(240,100,200,0.14); }
    .div-pill:hover  { color: rgba(255,255,255,0.65); border-color: rgba(255,255,255,0.22); }
    .div-pill.active {
      background: rgba(255,138,61,0.14);
      color: #ff8a3d;
      border-color: rgba(255,138,61,0.32);
      box-shadow: 0 0 14px rgba(255,138,61,0.14);
    }
    .div-pill.women.active {
      background: rgba(240,100,200,0.12);
      color: #f0b4e8;
      border-color: rgba(240,100,200,0.3);
      box-shadow: 0 0 14px rgba(240,100,200,0.16);
    }
    .div-pill-sep {
      width: 1px; height: 18px;
      background: rgba(255,255,255,0.09);
      flex-shrink: 0; margin: 0 3px;
    }

    /* Scrollable contenders area */
    .div-contender-wrap {
      flex: 1; overflow-y: auto;
      padding: 6px 36px 80px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.07) transparent;
    }
    .div-contender-wrap::-webkit-scrollbar { width: 4px; }
    .div-contender-wrap::-webkit-scrollbar-track { background: transparent; }
    .div-contender-wrap::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

    .div-contender-list {
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .div-contender-list.fading { opacity: 0; transform: translateY(5px); }

    .div-contenders-header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 4px; padding-top: 2px;
    }
    .div-contenders-label {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.52rem; font-weight: 800;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: rgba(255,255,255,0.16); white-space: nowrap;
    }
    .div-contenders-line { flex: 1; height: 1px; background: rgba(255,255,255,0.05); }

    .div-contender-row {
      display: flex; align-items: center; gap: 13px;
      padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
      cursor: pointer; border-radius: 0 6px 6px 0;
      transition: padding-left 0.16s ease, background 0.14s;
    }
    .div-contender-row:hover {
      padding-left: 6px; background: rgba(255,255,255,0.04);
    }
    .div-champ-info { cursor: pointer; }
    .div-contender-rank {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.68rem; font-weight: 900;
      color: rgba(255,255,255,0.14);
      width: 26px; text-align: right; flex-shrink: 0;
    }
    .div-contender-photo {
      width: 42px; height: 42px; border-radius: 50%;
      background-size: cover; background-position: center top;
      background-color: #161620;
      border: 1.5px solid rgba(255,255,255,0.07);
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.68rem; font-weight: 800;
      color: rgba(255,255,255,0.22);
      overflow: hidden;
    }
    .div-contender-info { flex: 1; min-width: 0; }
    .div-contender-name {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.77rem; font-weight: 700;
      color: #fff; text-transform: uppercase;
      letter-spacing: 0.02em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .div-contender-rec {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.6rem; font-weight: 600;
      color: rgba(255,255,255,0.25); margin-top: 2px;
    }
    .div-move {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.6rem; font-weight: 800;
      letter-spacing: 0.04em;
      padding: 3px 7px; border-radius: 4px;
      flex-shrink: 0; white-space: nowrap;
    }
    .div-move-up   { color: #4ade80; background: rgba(74,222,128,0.1); }
    .div-move-down { color: #f87171; background: rgba(248,113,113,0.1); }
    .div-move-new  { color: #60a5fa; background: rgba(96,165,250,0.1); }
    /* Neutral "no change" marker — every row gets a movement indicator now,
       not just the ones that happened to move, so the list doesn't read
       like most rows were never updated. */
    .div-move-same { color: rgba(255,255,255,0.18); background: transparent; padding: 3px 4px; }
    body.light-mode .div-move-up   { background: rgba(34,197,94,0.12); }
    body.light-mode .div-move-down { background: rgba(239,68,68,0.12); }
    body.light-mode .div-move-new  { background: rgba(59,130,246,0.12); }
    body.light-mode .div-move-same { color: rgba(0,0,0,0.18); }

    /* Mobile: stack layout */
    @media (max-width: 768px) {
      .div-spotlight {
        flex-direction: column;
        height: auto; min-height: 0;
      }
      .div-spotlight-left {
        width: 100%; height: 280px; flex-shrink: 0;
      }
      .div-spotlight-left::after {
        background:
          linear-gradient(to bottom, transparent 40%, #060608 100%),
          linear-gradient(to right, transparent 50%, transparent 100%);
      }
      .div-spotlight-right { flex: none; min-height: 60vh; }
      .div-pill-nav { padding: 14px 14px 10px; }
      .div-contender-wrap { padding: 4px 14px 100px; }
      .div-champ-info { padding: 20px 20px; }
      .div-champ-name { font-size: 1.35rem; }
    }
  </style>
</head>

  <script>
  (function(){
    var wrap=document.getElementById('lucasNudge'),card=document.getElementById('lucasNudgeCard'),closeBtn=document.getElementById('lucasNudgeClose');
    if(!wrap||localStorage.getItem('lnx_dismissed'))return;
    wrap.classList.add('lnx-visible');
    card.addEventListener('click',function(e){if(e.target===closeBtn||closeBtn.contains(e.target))return;window.toggleChat&&window.toggleChat();});
    closeBtn.addEventListener('click',function(e){e.stopPropagation();wrap.classList.remove('lnx-visible');setTimeout(function(){wrap.style.display='none';},400);localStorage.setItem('lnx_dismissed','1');});
    var isDragging=false,startX,startY,startRight,startBottom;
    card.addEventListener('pointerdown',function(e){if(e.target===closeBtn||closeBtn.contains(e.target))return;isDragging=true;startX=e.clientX;startY=e.clientY;var rect=wrap.getBoundingClientRect();startRight=window.innerWidth-rect.right;startBottom=window.innerHeight-rect.bottom;wrap.classList.add('lnx-dragging');card.setPointerCapture(e.pointerId);});
    card.addEventListener('pointermove',function(e){if(!isDragging)return;var dx=e.clientX-startX,dy=e.clientY-startY;wrap.style.right=Math.max(0,startRight-dx)+'px';wrap.style.bottom=Math.max(0,startBottom-dy)+'px';wrap.style.left='auto';wrap.style.top='auto';});
    card.addEventListener('pointerup',function(){isDragging=false;wrap.classList.remove('lnx-dragging');});
  })();
  </script>
