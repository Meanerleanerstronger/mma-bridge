<div class="lnx-wrap" id="lucasNudge">
  <div class="lnx-card" id="lucasNudgeCard">
    <div class="lnx-eyebrow">Ask Lucas</div>
    <span class="lnx-text">How are tiers calculated? How do groups work? I know all of it.</span>
    <button class="lnx-close" id="lucasNudgeClose" aria-label="Dismiss">✕</button>
  </div>
</div>
<script>
(function(){
  var wrap=document.getElementById('lucasNudge'),card=document.getElementById('lucasNudgeCard'),closeBtn=document.getElementById('lucasNudgeClose');
  if(!wrap||localStorage.getItem('lnx_dismissed'))return;
  wrap.classList.add('lnx-visible');
  card.addEventListener('click',function(e){if(e.target===closeBtn||closeBtn.contains(e.target))return;window.toggleChat&&window.toggleChat();});
  closeBtn.addEventListener('click',function(e){e.stopPropagation();wrap.classList.remove('lnx-visible');setTimeout(function(){wrap.style.display='none';},400);localStorage.setItem('lnx_dismissed','1');});
  var isDragging=false,startX,startY,startRight,startBottom;
  card.addEventListener('pointerdown',function(e){if(e.target===closeBtn||closeBtn.contains(e.target))return;isDragging=true;startX=e.clientX;startY=e.clientY;var rect=wrap.getBoundingClientRect();startRight=window.innerWidth-rect.right;startBottom=window.innerHeight-rect.bottom;wrap.classList.add('lnx-dragging');card.setPointerCapture(e.pointerId);});
  card.addEventListener('pointermove',function(e){if(!isDragging)return;var dx=e.clientX-startX,dy=e.clientY-startY;wrap.style.right=Math.max(0,startRight-dx)+'px';wrap.style.bottom=Math.max(0,startBottom-dy)+'px';wrap.style.left='auto';wrap.style.top='auto';});
  card.addEventListener('pointerup',function(){isDragging=false;wrap.classList.remove('lnx-dragging');});
})();
</script>
