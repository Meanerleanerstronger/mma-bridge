<!DOCTYPE html>
<html lang="en">

<head>
  <script src="theme.js"></script>
  <link rel="icon" href="/favicon.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MMA Bridge</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Pacifico&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-container">

      <div class="logo">
        <span class="logo-mma">MMA</span>
        <img src="images/Cage.svg" class="logo-icon" alt="cage icon">
        <span class="logo-bridge">Bridge</span>
      </div>

      <ul class="nav-links">
        <li><a href="index.html" class="active">Trending</a></li>
        <li><a href="events.html">Upcoming Events</a></li>
        <li><a href="pfp.html">PFP</a></li>
        <li><a href="reviews.html">Review</a></li>
        <li><a href="lucas.html">Lucas Bot</a></li>
      </ul>

      <!-- SEARCH (NOW A FORM so Enter works) -->
      <button class="theme-toggle" id="themeToggle" title="Toggle light/dark mode">
          <div class="toggle-track"><div class="toggle-thumb"></div></div>
          <span class="toggle-label">LIGHT</span>
        </button>
      <form class="search-box" id="site-search-form" action="results.html" method="GET">
        <input id="site-search" name="q" type="text" placeholder="Search fighters, events..." autocomplete="off" />
        <span class="search-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M21 21l-4.3-4.3m1.8-5.2a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </span>
      </form>

    </div>
  </nav>
  
  <!-- LIVE EVENT TRACKER BANNER -->
  <div class="live-event-banner hidden" id="liveEventBanner">
    <!-- populated by JS -->
  </div>


    <!-- HERO — auto-updates to next upcoming event -->
  <section class="hero" id="heroSection" style="position:relative;overflow:hidden;min-height:560px;background:#111;">
    <div id="heroImg" style="position:absolute;inset:0;background-size:cover;background-position:center top;filter:brightness(0.92) saturate(1.05);transition:opacity 0.6s;"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(105deg, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.6) 35%, rgba(0,0,0,0.05) 65%, rgba(0,0,0,0) 100%);"></div>
    <div id="hero-content" style="position:relative;z-index:2;padding:80px 56px 64px;max-width:600px;">
      <div id="heroType" style="font-family:'Montserrat',sans-serif;font-size:0.65rem;font-weight:800;letter-spacing:0.18em;text-transform:uppercase;color:cyan;margin-bottom:12px;"></div>
      <h1 id="heroTitle" style="font-family:'Montserrat',sans-serif;font-weight:900;font-size:2.4rem;text-transform:uppercase;letter-spacing:0.04em;color:#fff;margin:0 0 10px;text-shadow:0 2px 20px rgba(0,0,0,0.8);max-width:700px;"></h1>
      <div id="heroMeta" style="font-family:'Inter',sans-serif;font-size:0.9rem;color:rgba(255,255,255,0.6);margin-bottom:28px;"></div>
      <a id="heroBtn" href="events.html" style="display:inline-block !important;background:cyan !important;color:#000 !important;font-family:'Montserrat',sans-serif;font-weight:800;font-size:0.78rem;letter-spacing:0.12em;text-transform:uppercase;padding:12px 28px;border-radius:6px;text-decoration:none !important;border:none;">View Full Card →</a>
    </div>
  </section>

  <!-- RECENT RESULTS - Infinite auto-scroll -->
  <div style="padding:36px 0 0;">
    <h3 style="font-family:'Montserrat',sans-serif;font-size:0.72rem;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.4);margin:0 0 18px;padding:0 48px;">Recent Results</h3>
    <div style="position:relative;">
      <!-- fade left -->
      <div style="position:absolute;left:0;top:0;bottom:16px;width:80px;background:linear-gradient(to right,#0f0f0f 0%,transparent 100%);z-index:2;pointer-events:none;"></div>
      <!-- fade right -->
      <div style="position:absolute;right:0;top:0;bottom:16px;width:80px;background:linear-gradient(to left,#0f0f0f 0%,transparent 100%);z-index:2;pointer-events:none;"></div>
      <div id="resultsTrack" style="overflow:hidden;width:100%;cursor:grab;">
        <div id="resultsInner" style="display:flex;gap:16px;width:max-content;will-change:transform;padding:0 120px 16px;"></div>
      </div>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="content-container">
    <div class="left-column">
      <h3 class="section-title" style="text-align:center;font-family:'Montserrat',sans-serif;font-size:0.95rem;font-weight:900;letter-spacing:0.08em;text-transform:uppercase;color:#fff;margin-bottom:24px;">Trending Today</h3>
      <div class="card-row" id="trending-cards"></div>
    </div>
    <div class="sidebar">
      <h3>TODAY IN MMA</h3>
      <ul id="today-list"></ul>
    </div>
  </div>

  <!-- LIVE ACTIVITY FEED -->
  <div style="max-width:1200px;margin:0 auto;padding:32px 48px 60px;">
    <h3 style="font-family:'Montserrat',sans-serif;font-size:0.72rem;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.4);margin:0 0 16px;">
      <span style="display:inline-block;width:7px;height:7px;background:cyan;border-radius:50%;margin-right:8px;animation:pulse 1.5s infinite;"></span>
      Live on MMA Bridge
    </h3>
    <div id="liveFeed" style="
      background:#0d0d0d;
      border:1px solid rgba(255,255,255,0.07);
      border-radius:14px;
      overflow:hidden;
      height:260px;
      display:flex;
      flex-direction:column;
      gap:0;
      position:relative;
    "></div>
  </div>
  <script type="module" src="script.js"></script>

  <script>
    // ── Sticky navbar scroll shadow ──
    window.addEventListener('scroll', () => {
      document.querySelector('.navbar').classList.toggle('scrolled', window.scrollY > 10);
    });

    // ── Live Event Tracker Banner ──
    (async function() {
      try {
        const res = await fetch('events.json');
        const events = await res.json();
        const now = new Date();
        const banner = document.getElementById('liveEventBanner');

        // Find the most recently completed event OR next upcoming event
        const completed = events.filter(e => e.status === 'completed').slice(-1)[0];
        const upcoming = events.find(e => {
          const d = new Date(e.isoDate);
          return d >= now;
        });

        // Show last completed results if within 3 days, else show next upcoming countdown
        const lastCompletedDate = completed ? new Date(completed.isoDate) : null;
        const daysSince = lastCompletedDate ? (now - lastCompletedDate) / 86400000 : 999;

        if (daysSince < 3 && completed) {
          // Show results banner
          const mainFights = (completed.mainCard || []).slice(0, 3).filter(f => f.winner);
          if (mainFights.length === 0) return;

          const fightHTML = mainFights.map((f, i) => `
            <span class="banner-fight-item">
              <span class="winner">${f.winner}</span>
              <span>def.</span>
              <span>${f.winner === f.a ? f.b : f.a}</span>
              <span class="method-badge">${f.method}</span>
            </span>
            ${i < mainFights.length - 1 ? '<span class="banner-sep">·</span>' : ''}
          `).join('');

          banner.innerHTML = `
            <span class="live-badge"><span class="live-dot"></span><span class="live-badge-text">Results</span></span>
            <span class="banner-event-name">${completed.name}</span>
            <div class="banner-fights">${fightHTML}</div>
            <a href="event-review.html?event=${completed.id}" class="banner-event-link">Full Results →</a>
          `;
          banner.classList.remove('hidden');

        } else if (upcoming) {
          // Show countdown to next event
          const eventDate = new Date(upcoming.isoDate + 'T22:00:00');
          
          function updateCountdown() {
            const diff = eventDate - new Date();
            if (diff <= 0) { banner.classList.add('hidden'); return; }
            const days = Math.floor(diff / 86400000);
            const hrs = Math.floor((diff % 86400000) / 3600000);
            const mins = Math.floor((diff % 3600000) / 60000);
            const secs = Math.floor((diff % 60000) / 1000);
            const countStr = days > 0
              ? `${days}d ${hrs}h ${mins}m ${secs}s`
              : `${hrs}h ${mins}m ${secs}s`;
            
            const mainFight = upcoming.mainCard ? upcoming.mainCard[0] : null;
            const fightTeaser = mainFight ? `<span class="banner-fight-item"><strong style="color:#fff">${mainFight.a}</strong> <span>vs</span> <strong style="color:#fff">${mainFight.b}</strong></span>` : '';

            banner.innerHTML = `
              <span class="banner-event-name">${upcoming.name}</span>
              <div class="banner-fights">${fightTeaser}</div>
              <span class="banner-countdown">${countStr}</span>
              <a href="events.html#ev-${upcoming.id}" class="banner-event-link">View Card →</a>
            `;
            banner.classList.remove('hidden');
          }
          updateCountdown();
          setInterval(updateCountdown, 1000);
        }
      } catch(e) { /* silent fail */ }
    })();
  </script>
</body>
</html>
