<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" href="/favicon.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MMA Bridge</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Pacifico&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-container">

      <div class="logo">
        <span class="logo-mma">MMA</span>
        <img src="images/Cage.svg" class="logo-icon" alt="cage icon">
        <span class="logo-bridge">Bridge</span>
      </div>

      <ul class="nav-links">
        <li><a href="index.html" class="active">Trending</a></li>
        <li><a href="events.html">Upcoming Events</a></li>
        <li><a href="pfp.html">PFP</a></li>
        <li><a href="reviews.html">Review</a></li>
        <li><a href="lucas.html">Lucas Bot</a></li>
      </ul>

      <!-- SEARCH (NOW A FORM so Enter works) -->
      <form class="search-box" id="site-search-form" action="results.html" method="GET">
        <input id="site-search" name="q" type="text" placeholder="Search fighters, events..." autocomplete="off" />
        <span class="search-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M21 21l-4.3-4.3m1.8-5.2a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </span>
      </form>

    </div>
  </nav>
  
  


    <!-- HERO — auto-updates to next upcoming event -->
  <section class="hero" id="heroSection" style="position:relative;overflow:hidden;min-height:420px;background:#111;">
    <div id="heroImg" style="position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(0.55) contrast(1.05);transition:opacity 0.5s;"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.85) 100%);"></div>
    <div id="hero-content" style="position:relative;z-index:2;padding:60px 48px 48px;">
      <div id="heroType" style="font-family:'Montserrat',sans-serif;font-size:0.65rem;font-weight:800;letter-spacing:0.18em;text-transform:uppercase;color:cyan;margin-bottom:12px;"></div>
      <h1 id="heroTitle" style="font-family:'Montserrat',sans-serif;font-weight:900;font-size:2.4rem;text-transform:uppercase;letter-spacing:0.04em;color:#fff;margin:0 0 10px;text-shadow:0 2px 20px rgba(0,0,0,0.8);max-width:700px;"></h1>
      <div id="heroMeta" style="font-family:'Inter',sans-serif;font-size:0.9rem;color:rgba(255,255,255,0.6);margin-bottom:28px;"></div>
      <a id="heroBtn" href="events.html" style="display:inline-block !important;background:cyan !important;color:#000 !important;font-family:'Montserrat',sans-serif;font-weight:800;font-size:0.78rem;letter-spacing:0.12em;text-transform:uppercase;padding:12px 28px;border-radius:6px;text-decoration:none !important;border:none;">View Full Card →</a>
    </div>
  </section>

  <!-- RECENT RESULTS -->
  <div style="padding:36px 48px 0;max-width:1200px;margin:0 auto;">
    <h3 style="font-family:'Montserrat',sans-serif;font-size:0.72rem;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.4);margin:0 0 18px;">Recent Results</h3>
    <div id="recentResults" style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;"></div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="content-container">
    <div class="left-column">
      <h3 class="section-title">Trending Today</h3>
      <div class="card-row" id="trending-cards"></div>
    </div>
    <div class="sidebar">
      <h3>TODAY IN MMA</h3>
      <ul id="today-list"></ul>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
