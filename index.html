<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" type="image/png" href="images/mma-bridge-logo.png">
  <link rel="shortcut icon" type="image/png" href="images/mma-bridge-logo.png">
  <link rel="apple-touch-icon" href="images/mma-bridge-logo.png">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script src="theme.js?v=2.4"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MMA Bridge</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Pacifico&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css?v=4.2" />

  <style>
    @media (max-width: 768px) {
      /* Results track */
      #resultsTrack { padding: 0; }
      #resultsInner { padding: 0 16px 14px; gap: 10px; }
      /* Live feed */
      #liveFeed { margin: 0 16px; border-radius: 10px; height: 220px; }
      /* Section headers */
      .section-title { font-size: 0.82rem !important; margin-bottom: 16px !important; }
      /* Today in MMA sidebar — full width below cards on mobile */
      .content-container { flex-direction: column; }
      .sidebar { width: 100%; box-sizing: border-box; margin-left: 0; }
    }
  </style>

  <style>
    /* ── KEYFRAMES ── */
    @keyframes shimmerSlide {
      0%   { background-position: -300% center; }
      100% { background-position: 300% center; }
    }
    @keyframes heroContentIn {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes heroBtnPulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(0,229,255,0.45); }
      55%      { box-shadow: 0 0 0 12px rgba(0,229,255,0); }
    }
    @keyframes sectionFadeIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.5; transform: scale(0.85); }
    }
    @keyframes liveDot {
      0%,100% { box-shadow: 0 0 0 0 rgba(0,229,255,0.6); }
      50%      { box-shadow: 0 0 0 6px rgba(0,229,255,0); }
    }

    /* ── BODY ── */
    body {
      background: #060608;
      background-image:
        radial-gradient(ellipse 70% 40% at 50% -5%, rgba(0,229,255,0.035) 0%, transparent 60%);
    }

    /* ── HERO ── */
    #hero-content { animation: heroContentIn 0.65s 0.15s ease both; }

    #heroBtn {
      animation: heroBtnPulse 3s 1.2s ease infinite !important;
      transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1) !important;
    }
    #heroBtn:hover {
      transform: translateY(-3px) scale(1.04) !important;
    }

    /* ── SECTION TITLES ── */
    .section-title {
      position: relative;
      animation: sectionFadeIn 0.5s 0.3s ease both;
    }
    .section-title::after {
      content: '';
      position: absolute;
      bottom: -8px; left: 50%;
      transform: translateX(-50%);
      width: 36px; height: 2px;
      background: linear-gradient(90deg, transparent, rgba(0,229,255,0.5), transparent);
      border-radius: 2px;
    }

    /* ── RESULTS TRACK FADES ── */
    #resultsTrack {
      mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
      -webkit-mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
    }

    /* ── LIVE FEED ── */
    #liveFeed {
      box-shadow:
        0 0 40px rgba(0,229,255,0.04),
        inset 0 1px 0 rgba(255,255,255,0.04),
        inset 0 -1px 0 rgba(0,0,0,0.3) !important;
    }

    /* Animate the live dot */
    span[style*="animation:pulse"] {
      animation: liveDot 2s infinite !important;
      box-shadow: 0 0 6px rgba(0,229,255,0.6);
    }

    /* ── TODAY IN MMA SIDEBAR ── */
    .sidebar h3 {
      background: linear-gradient(120deg, #00e5ff 0%, #80ffea 50%, #00e5ff 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmerSlide 5s linear infinite;
    }

    /* ── CONTENT SECTION ── */
    .content-container {
      animation: sectionFadeIn 0.5s 0.4s ease both;
    }

    /* ── LIGHT MODE overrides ── */
    body.light-mode {
      background: #f0f0f4 !important;
      background-image: radial-gradient(ellipse 70% 40% at 50% -5%, rgba(0,100,200,0.04) 0%, transparent 60%) !important;
    }
    body.light-mode #heroSection { background: #e8e8ed !important; }
    body.light-mode .results-fade-l { background: linear-gradient(to right, #f0f0f4, transparent) !important; }
    body.light-mode .results-fade-r { background: linear-gradient(to left, #f0f0f4, transparent) !important; }
    body.light-mode .sidebar h3 {
      background: linear-gradient(120deg, #009bb5 0%, #00c6d8 50%, #009bb5 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-container">

      <a class="logo" href="index.html">
        <img src="images/mma-bridge-logo.png" class="nav-logo-img" alt="MMA Bridge">
      </a>

      <ul class="nav-links">
        <li><a href="index.html" class="active">Trending</a></li>
        <li><a href="events.html">Upcoming Events</a></li>
        <li><a href="pfp.html">P4P</a></li>
        <li><a href="reviews.html">Review</a></li>
        <li><a href="lucas.html">Lucas Bot</a></li>
        <li><a href="leaderboard.html">Leaderboard</a></li><li><a href="about.html">About</a></li>
      </ul>

      <button class="theme-toggle" id="themeToggle" aria-label="Switch to light mode" title="Switch to light mode"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
      <!-- NOTIFICATION BELL -->
      <div id="notifBellMount"></div>
      <!-- SEARCH (NOW A FORM so Enter works) -->
      <form class="search-box" id="site-search-form" action="results.html" method="GET">
        <input id="site-search" name="q" type="text" placeholder="Search fighters, events..." autocomplete="off" />
        <span class="search-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M21 21l-4.3-4.3m1.8-5.2a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </span>
      </form>
      <div class="nav-auth"></div>
      <button class="nav-hamburger" id="nav-hamburger" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="nav-mobile-overlay" id="nav-mobile-overlay">
    <button class="nav-mobile-close" onclick="document.getElementById('nav-mobile-overlay').classList.remove('open');document.getElementById('nav-hamburger').classList.remove('open');document.body.classList.remove('no-scroll')">✕</button>
    <nav class="nav-mobile-links">
      <a href="index.html" class="active">Trending</a>
      <a href="events.html">Upcoming Events</a>
      <a href="pfp.html">P4P</a>
      <a href="reviews.html">Review</a>
      <a href="lucas.html">Lucas Bot</a>
      <a href="leaderboard.html">Leaderboard</a>
      <a href="about.html">About</a>
    </nav>
    <div class="nav-mobile-search">
      <form action="results.html" method="GET">
        <input name="q" type="text" placeholder="Search fighters, events..." autocomplete="off" />
      </form>
    </div>
    <div class="nav-auth-mobile"></div>
  </div>
  
  <!-- EVENT BANNER -->



    <!-- HERO — auto-updates to next upcoming event -->
  <section class="hero" id="heroSection" style="position:relative;overflow:hidden;min-height:560px;background:#111;">
    <div id="heroImg" style="position:absolute;inset:0;background-size:cover;background-position:center top;filter:brightness(0.92) saturate(1.05);transition:opacity 0.6s;"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(105deg, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.6) 35%, rgba(0,0,0,0.05) 65%, rgba(0,0,0,0) 100%);"></div>
    <div id="hero-content" style="position:relative;z-index:2;padding:80px 56px 64px;max-width:600px;">
      <div id="heroType" style="font-family:'Montserrat',sans-serif;font-size:0.65rem;font-weight:800;letter-spacing:0.18em;text-transform:uppercase;color:cyan;margin-bottom:12px;"></div>
      <h1 id="heroTitle" style="font-family:'Montserrat',sans-serif;font-weight:900;font-size:2.4rem;text-transform:uppercase;letter-spacing:0.04em;color:#fff;margin:0 0 10px;text-shadow:0 2px 20px rgba(0,0,0,0.8);max-width:700px;"></h1>
      <div id="heroMeta" style="font-family:'Inter',sans-serif;font-size:0.9rem;color:rgba(255,255,255,0.6);margin-bottom:28px;"></div>
      <a id="heroBtn" href="events.html" style="display:inline-block !important;background:cyan;color:#000;font-family:'Montserrat',sans-serif;font-weight:800;font-size:0.78rem;letter-spacing:0.12em;text-transform:uppercase;padding:12px 28px;border-radius:6px;text-decoration:none !important;border:none;">View Full Card →</a>
    </div>
  </section>

  <!-- RECENT RESULTS - Infinite auto-scroll -->
  <div style="padding:36px 0 0;">
    <h3 class="results-section-label" style="font-family:'Montserrat',sans-serif;font-size:0.72rem;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.4);margin:0 0 18px;padding:0 48px;">Recent Results</h3>
    <div style="position:relative;">
      <!-- fade left -->
      <div class="results-fade-l" style="position:absolute;left:0;top:0;bottom:16px;width:80px;background:linear-gradient(to right,#0f0f0f 0%,transparent 100%);z-index:2;pointer-events:none;"></div>
      <!-- fade right -->
      <div class="results-fade-r" style="position:absolute;right:0;top:0;bottom:16px;width:80px;background:linear-gradient(to left,#0f0f0f 0%,transparent 100%);z-index:2;pointer-events:none;"></div>
      <!-- carousel arrows -->
      <button class="carousel-arrow arrow-left" id="resultsPrev" aria-label="Previous results">
        <svg width="10" height="16" viewBox="0 0 10 16" fill="none"><polyline points="8,1 2,8 8,15" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="carousel-arrow arrow-right" id="resultsNext" aria-label="Next results">
        <svg width="10" height="16" viewBox="0 0 10 16" fill="none"><polyline points="2,1 8,8 2,15" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div id="resultsTrack" style="overflow:hidden;width:100%;cursor:grab;">
        <div id="resultsInner" style="display:flex;gap:16px;width:max-content;will-change:transform;padding:0 120px 16px;"></div>
      </div>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="content-container">
    <div class="left-column">
      <h3 class="section-title" style="text-align:center;font-family:'Montserrat',sans-serif;font-size:1.15rem;font-weight:900;letter-spacing:0.14em;text-transform:uppercase;color:#fff;margin-bottom:28px;">Trending Today</h3>
      <div class="card-row" id="trending-cards"></div>
    </div>
    <div class="sidebar">
      <h3>TODAY IN MMA</h3>
      <ul id="today-list"></ul>
    </div>
  </div>

  <script>
    window.addEventListener('scroll', () => {
      document.querySelector('.navbar').classList.toggle('scrolled', window.scrollY > 10);
    });
