<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="images/mma-bridge-logo.png">
  <link rel="shortcut icon" type="image/png" href="images/mma-bridge-logo.png">
  <link rel="apple-touch-icon" href="images/mma-bridge-logo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00e5ff">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script src="theme.js?v=2.4"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fighter Profile — MMA Bridge</title>
  <meta property="og:title" content="Fighter Profile — MMA Bridge">
  <meta property="og:description" content="View fighter stats, record, and recent form on MMA Bridge.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://meanerleanerstronger.github.io/mma-bridge/images/mma-bridge-logo.png">
  <meta name="description" content="View UFC fighter stats, record, and recent form on MMA Bridge.">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Montserrat:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=5.8" />
</head>
<body class="fp-page">

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-container">
      <a class="logo" href="index.html">
        <img src="images/mma-bridge-logo.png" class="nav-logo-img" alt="MMA Bridge">
      </a>
      <div id="notifBellMount"></div>
      <ul class="nav-links">
        <li><a href="index.html">Trending</a></li>
        <li><a href="events.html">Upcoming Events</a></li>
        <li><a href="pfp.html">P4P</a></li>
        <li><a href="reviews.html">Review</a></li>
        <li><a href="lucas.html">Lucas Bot</a></li>
        <li><a href="leaderboard.html">Leaderboard</a></li><li><a href="about.html">About</a></li>
      </ul>
      <button class="theme-toggle" id="themeToggle" aria-label="Switch to light mode" title="Switch to light mode">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <form class="search-box" id="site-search-form" action="results.html" method="GET">
        <input id="site-search" name="q" type="text" placeholder="Search fighters, events..." autocomplete="off" />
        <span class="search-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M21 21l-4.3-4.3m1.8-5.2a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </span>
      </form>
      <div class="nav-auth"></div>
      <button class="nav-hamburger" id="nav-hamburger" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="nav-mobile-overlay" id="nav-mobile-overlay">
    <button class="nav-mobile-close" onclick="document.getElementById('nav-mobile-overlay').classList.remove('open');document.getElementById('nav-hamburger').classList.remove('open');document.body.classList.remove('no-scroll')">✕</button>
    <nav class="nav-mobile-links">
      <a href="index.html">Trending</a>
      <a href="events.html">Upcoming Events</a>
      <a href="pfp.html">P4P</a>
      <a href="reviews.html">Review</a>
      <a href="lucas.html">Lucas Bot</a>
      <a href="leaderboard.html">Leaderboard</a>
      <a href="about.html">About</a>
    </nav>
    <div class="nav-mobile-search">
      <form action="results.html" method="GET">
        <input name="q" type="text" placeholder="Search fighters, events..." autocomplete="off" />
      </form>
    </div>
    <div class="nav-auth-mobile"></div>
  </div>

  <!-- FIGHTER PROFILE (rendered by fighter.js) -->
  <div id="fp-root"></div>

  <script>
    window.addEventListener('scroll', () => {
      document.querySelector('.navbar').classList.toggle('scrolled', window.scrollY > 10);
    });
    const navHamburger = document.getElementById('nav-hamburger');
    const navOverlay = document.getElementById('nav-mobile-overlay');
    if (navHamburger) navHamburger.addEventListener('click', () => {
      navHamburger.classList.toggle('open');
      navOverlay.classList.toggle('open');
      document.body.classList.toggle('no-scroll');
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="auth.js?v=3.2"></script>
  <script src="challenge.js?v=1.0"></script>
  <script src="search.js"></script>
  <script src="premium.js?v=3.3"></script>
  <script src="fighter.js"></script>
<script src="notifications.js?v=2.1"></script>
<script src="push.js?v=1.1"></script>
</body>
</html>
