<head>

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

  <meta http-equiv="Expires" content="0">

  <meta charset="UTF-8" />

  <meta name="twitter:description" content="View your UFC fight pick history, accuracy stats, favourite fighters, and community reputation on MMA Bridge.">
  <meta name="twitter:image" content="https://mmabridge.com/images/mma-bridge-logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Montserrat:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=6.9" />

  <style>
    /* ── KEYFRAMES ── */
    @keyframes fadeUp   { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    @keyframes shimmer  { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    @keyframes spin     { to { transform: rotate(360deg); } }
    @keyframes pulse    { 0%,100%{opacity:.5} 50%{opacity:1} }
    @keyframes countUp  { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    @keyframes ringPop  { 0%{transform:scale(0.85);opacity:0} 60%{transform:scale(1.04)} 100%{transform:scale(1);opacity:1} }

    body { background: #060608; }

    /* ── PROFILE HERO ── */
    .pr-hero {
      position: relative;
      padding: 0 0 0;
      overflow: hidden;
    }
    .pr-hero-bg {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 30% -10%, rgba(0,229,255,0.07) 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 80% 110%, rgba(200,168,75,0.04) 0%, transparent 50%);
      pointer-events: none;
    }
    .pr-hero-inner {
      position: relative;
      max-width: 860px;
      margin: 0 auto;
      padding: 52px 40px 40px;
      display: flex;
      align-items: flex-end;
      gap: 32px;
      animation: fadeUp 0.5s ease both;
    }

    /* Avatar */
    .pr-avatar-wrap { position: relative; flex-shrink: 0; animation: ringPop 0.6s 0.1s ease both; }
    .pr-avatar-ring {
      width: 110px; height: 110px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00e5ff 0%, #0080ff 50%, #00e5ff 100%);
      background-size: 200% 200%;
      animation: shimmer 3s linear infinite;
      padding: 3px;
      box-shadow: 0 0 32px rgba(0,229,255,0.25), 0 8px 40px rgba(0,0,0,0.6);
    }
    .pr-avatar-img {
      width: 100%; height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #141418;
      display: block;
    }
    .pr-avatar-initials {
      width: 104px; height: 104px;
      border-radius: 50%;
      background: #141418;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 2.2rem;
      color: #00e5ff;
      letter-spacing: -0.02em;
    }

    /* Name / meta */
    .pr-info { flex: 1; min-width: 0; padding-bottom: 4px; }
    .pr-label {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(0,229,255,0.6);
      margin-bottom: 6px;
    }
    .pr-name {
      font-family: 'Barlow Condensed', 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: clamp(2rem, 5vw, 3rem);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: #fff;
      line-height: 1;
      margin: 0 0 10px;
      text-shadow: 0 2px 20px rgba(0,0,0,0.5);
    }
    .pr-meta-row {
      display: flex; align-items: center; gap: 14px;
      flex-wrap: wrap;
    }
    .pr-meta-item {
      font-family: 'Inter', sans-serif;
      font-size: 0.88rem;
      color: rgba(255,255,255,0.35);
      display: flex; align-items: center; gap: 5px;
    }
    .pr-meta-item svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; }

    /* ── STATS STRIP ── */
    .pr-stats {
      background: rgba(255,255,255,0.02);
      border-top: 1px solid rgba(255,255,255,0.05);
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .pr-stats-inner {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 40px;
      display: flex;
    }
    .pr-stat {
      flex: 1;
      padding: 22px 0;
      text-align: center;
      position: relative;
      animation: countUp 0.5s ease both;
    }
    .pr-stat + .pr-stat::before {
      content: '';
      position: absolute; left: 0; top: 20%; bottom: 20%;
      width: 1px;
      background: rgba(255,255,255,0.07);
    }
    .pr-stat-num {
      font-family: 'Barlow Condensed', 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 2.5rem;
      color: #00e5ff;
      letter-spacing: -0.02em;
      line-height: 1;
      margin-bottom: 4px;
    }
    .pr-stat-lbl {
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
    }

    /* ── SECTION WRAPPER ── */
    .pr-body {
      max-width: 860px;
      margin: 0 auto;
      padding: 40px 40px 100px;
    }
    .pr-section { margin-bottom: 56px; animation: fadeUp 0.5s ease both; }
    .pr-section-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 0.78rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      margin: 0 0 20px;
      display: flex; align-items: center; gap: 10px;
    }
    .pr-section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, rgba(255,255,255,0.08), transparent);
    }
    .pr-section-count {
      font-size: 0.6rem;
      background: rgba(0,229,255,0.08);
      border: 1px solid rgba(0,229,255,0.15);
      color: rgba(0,229,255,0.6);
      border-radius: 20px;
      padding: 2px 8px;
      font-weight: 600;
      letter-spacing: 0.06em;
    }

    /* ── RATING CARDS (review history) ── */
    .pr-ratings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .pr-rating-card {
      background: #0e0e12;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s, transform 0.25s, box-shadow 0.25s;
      cursor: pointer;
      text-decoration: none;
    }
    .pr-rating-card:hover {
      border-color: rgba(0,229,255,0.3);
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.6), 0 0 24px rgba(0,229,255,0.06);
    }
    .pr-rc-poster-wrap {
      position: relative;
      height: 120px;
      overflow: hidden;
      background: #141418;
      flex-shrink: 0;
    }
    .pr-rc-poster {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: top center;
      transition: transform 0.5s ease;
    }
    .pr-rating-card:hover .pr-rc-poster { transform: scale(1.06); }
    .pr-rc-grad {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(14,14,18,0.98) 0%, rgba(14,14,18,0.3) 60%, transparent 100%);
    }
    .pr-rc-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
      background: linear-gradient(145deg, #141418, #0a0a0e);
    }
    .pr-rc-stars {
      position: absolute;
      bottom: 8px; left: 10px;
      display: flex; gap: 2px;
      z-index: 2;
    }
    .pr-star { color: rgba(200,150,12,0.3); font-size: 0.85rem; }
    .pr-star.lit { color: #c8960c; }
    .pr-rc-body { padding: 12px 14px 14px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .pr-rc-name {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 0.84rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: #fff;
      line-height: 1.25;
    }
    .pr-rc-meta {
      font-family: 'Inter', sans-serif;
      font-size: 0.67rem;
      color: rgba(255,255,255,0.3);
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .pr-rc-fotn {
      font-family: 'Inter', sans-serif;
      font-size: 0.67rem;
      color: rgba(0,229,255,0.65);
      margin-top: 2px;
    }
    .pr-rc-text {
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.4);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-top: 2px;
    }
    .pr-rc-pick-badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.52rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 3px;
    }
    .pr-rc-pick-badge.hit  { background: rgba(0,200,100,0.12); border: 1px solid rgba(0,200,100,0.3); color: #00c864; }
    .pr-rc-pick-badge.miss { background: rgba(255,80,80,0.08);  border: 1px solid rgba(255,80,80,0.2);  color: rgba(255,100,100,0.7); }
    .pr-rc-pick-badge.pending { background: rgba(255,200,0,0.08); border: 1px solid rgba(255,200,0,0.2); color: rgba(255,200,0,0.6); }

    /* ── PICK ACCURACY CARD ── */
    .pr-accuracy-card {
      background: linear-gradient(135deg, rgba(0,229,255,0.04) 0%, rgba(0,0,0,0) 60%);
      border: 1px solid rgba(0,229,255,0.12);
      border-radius: 14px;
      padding: 20px 24px;
      display: flex; align-items: center; gap: 24px;
    }
    .pr-accuracy-ring-wrap { flex-shrink: 0; }
    .pr-accuracy-ring { position: relative; width: 80px; height: 80px; }
    .pr-accuracy-ring svg { width: 80px; height: 80px; transform: rotate(-90deg); }
    .pr-accuracy-ring-bg  { fill: none; stroke: rgba(255,255,255,0.07); stroke-width: 6; }
    .pr-accuracy-ring-fill { fill: none; stroke: #00e5ff; stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 1s ease; }
    .pr-accuracy-pct {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Montserrat', sans-serif;
      font-weight: 900; font-size: 1.1rem;
      color: #fff;
    }
    .pr-accuracy-desc { flex: 1; }
    .pr-accuracy-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800; font-size: 0.72rem;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      margin-bottom: 6px;
    }
    .pr-accuracy-detail {
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.3);
      line-height: 1.5;
    }
    .pr-accuracy-detail strong { color: rgba(0,229,255,0.8); }

    /* ── YOUR CORNER (fighter favs) ── */
    @keyframes favCardIn { from{opacity:0;transform:scale(0.88) translateY(10px)} to{opacity:1;transform:scale(1) translateY(0)} }

    .pr-favs-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }
    .pr-fav-card {
      width: 148px;
      display: flex;
      flex-direction: column;
      background: #0e0e12;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px;
      overflow: visible;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.22s, border-color 0.22s, box-shadow 0.22s;
      position: relative;
      animation: favCardIn 0.35s ease both;
      flex-shrink: 0;
    }
    .pr-fav-card-inner {
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .pr-fav-card:hover {
      transform: translateY(-5px);
      border-color: rgba(0,229,255,0.3);
      box-shadow: 0 14px 36px rgba(0,0,0,0.6), 0 0 20px rgba(0,229,255,0.06);
    }
    .pr-fav-photo-wrap {
      height: 160px;
      overflow: hidden;
      background: #141418;
      position: relative;
    }
    .pr-fav-photo {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: top center;
      transition: transform 0.4s ease;
    }
    .pr-fav-card:hover .pr-fav-photo { transform: scale(1.05); }
    .pr-fav-photo-grad {
      position: absolute; bottom: 0; left: 0; right: 0; height: 70%;
      background: linear-gradient(to top, #0e0e12 10%, transparent 100%);
    }
    .pr-fav-initial-lg {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Barlow Condensed', 'Montserrat', sans-serif;
      font-weight: 900; font-size: 3.2rem;
      color: rgba(0,229,255,0.25);
      background: linear-gradient(145deg, #141418, #0a0a0e);
    }
    .pr-fav-next-badge {
      position: absolute; bottom: 8px; left: 8px;
      background: rgba(0,229,255,0.12);
      border: 1px solid rgba(0,229,255,0.28);
      color: #00e5ff;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.5rem; font-weight: 800;
      letter-spacing: 0.1em; text-transform: uppercase;
      padding: 3px 7px; border-radius: 4px;
      white-space: nowrap;
    }
    .pr-fav-body {
      padding: 10px 11px 12px;
    }
    .pr-fav-name {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800; font-size: 0.7rem;
      letter-spacing: 0.04em; text-transform: uppercase;
      color: #fff;
      line-height: 1.2;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .pr-fav-meta {
      font-family: 'Inter', sans-serif;
      font-size: 0.62rem;
      color: rgba(255,255,255,0.3);
      display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
    }
    .pr-fav-record {
      color: rgba(0,229,255,0.65);
      font-weight: 600;
    }
    .pr-fav-remove {
      position: absolute; top: -8px; right: -8px;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: rgba(20,20,26,0.95);
      border: 1.5px solid rgba(255,60,60,0.6);
      color: rgba(255,80,80,0.9);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.6rem; font-weight: 700; cursor: pointer;
      z-index: 10;
      box-shadow: 0 1px 6px rgba(0,0,0,0.6);
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      line-height: 1;
    }
    .pr-fav-remove:hover {
      background: rgba(220,40,40,0.95);
      border-color: transparent;
      color: #fff;
    }

    .pr-fav-add {
      width: 140px; height: 160px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; cursor: pointer;
      background: rgba(255,255,255,0.02);
      border: 1px dashed rgba(0,229,255,0.15);
      border-radius: 14px;
      transition: border-color 0.2s, background 0.2s;
      flex-shrink: 0;
    }
    .pr-fav-add:hover {
      border-color: rgba(0,229,255,0.35);
      background: rgba(0,229,255,0.03);
    }
    .pr-fav-add-icon {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: 2px dashed rgba(0,229,255,0.25);
      display: flex; align-items: center; justify-content: center;
      color: rgba(0,229,255,0.4);
      font-size: 1.3rem;
      transition: border-color 0.2s, color 0.2s;
    }
    .pr-fav-add:hover .pr-fav-add-icon {
      border-color: rgba(0,229,255,0.5);
      color: #00e5ff;
    }
    .pr-fav-add-label {
      font-family: 'Inter', sans-serif;
      font-size: 0.62rem;
      color: rgba(255,255,255,0.22);
      text-align: center;
    }

    /* ── FIGHTER PICKER MODAL ── */
    .pr-modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(6px);
      z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      animation: fadeUp 0.2s ease;
    }
    .pr-modal {
      background: #0d0d10;
      border: 1px solid rgba(0,229,255,0.2);
      border-radius: 20px;
      width: 480px; max-width: calc(100vw - 32px);
      max-height: 80vh;
      display: flex; flex-direction: column;
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0,0,0,0.8), 0 0 0 1px rgba(0,229,255,0.06);
    }
    .pr-modal-header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex; align-items: center; justify-content: space-between;
    }
    .pr-modal-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800; font-size: 0.78rem;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: #fff;
    }
    .pr-modal-close {
      background: none; border: none; color: rgba(255,255,255,0.3);
      cursor: pointer; font-size: 1.2rem; line-height: 1;
      padding: 4px; border-radius: 6px; transition: color 0.15s;
    }
    .pr-modal-close:hover { color: #fff; }
    .pr-modal-search {
      padding: 12px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .pr-modal-search input {
      width: 100%; background: #141418;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px; padding: 10px 14px;
      color: #fff; font-family: 'Inter', sans-serif; font-size: 0.85rem;
      outline: none; box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .pr-modal-search input:focus { border-color: rgba(0,229,255,0.4); }
    .pr-modal-search input::placeholder { color: rgba(255,255,255,0.2); }
    .pr-modal-list {
      overflow-y: auto;
      flex: 1;
      padding: 8px 0;
    }
    .pr-modal-list::-webkit-scrollbar { width: 3px; }
    .pr-modal-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
    .pr-modal-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 20px;
      cursor: pointer;
      transition: background 0.12s;
    }
    .pr-modal-row:hover { background: rgba(0,229,255,0.05); }
    .pr-modal-row.selected { background: rgba(0,229,255,0.08); }
    .pr-modal-row img {
      width: 38px; height: 38px;
      border-radius: 50%; object-fit: cover; object-position: top;
      background: #1c1c1c;
      flex-shrink: 0;
    }
    .pr-modal-row-info { flex: 1; min-width: 0; }
    .pr-modal-row-name {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700; font-size: 0.78rem;
      color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .pr-modal-row-meta {
      font-family: 'Inter', sans-serif;
      font-size: 0.65rem;
      color: rgba(255,255,255,0.3);
    }
    .pr-modal-row-check {
      width: 18px; height: 18px;
      border-radius: 50%;
      border: 2px solid rgba(0,229,255,0.3);
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      font-size: 0.6rem; color: #00e5ff;
      transition: background 0.15s, border-color 0.15s;
    }
    .pr-modal-row.selected .pr-modal-row-check {
      background: rgba(0,229,255,0.15);
      border-color: #00e5ff;
    }
    .pr-modal-done {
      padding: 14px 20px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .pr-modal-done button {
      width: 100%;
      background: rgba(0,229,255,0.12);
      border: 1px solid rgba(0,229,255,0.35);
      color: #00e5ff;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700; font-size: 0.72rem;
      letter-spacing: 0.12em; text-transform: uppercase;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .pr-modal-done button:hover {
      background: rgba(0,229,255,0.2);
      border-color: rgba(0,229,255,0.6);
    }

    /* ── SECTION SUB-LABEL ── */
    .pr-section-sub {
      font-family: 'Inter', sans-serif;
      font-size: 0.65rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      text-transform: none;
      color: rgba(255,255,255,0.25);
    }

    /* ── PREMIUM EMPTY STATES ── */
    .pr-empty-premium {
      text-align: center;
      padding: 40px 24px;
      background: rgba(255,255,255,0.015);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 14px;
    }
    .pr-empty-title {
      font-family: 'Barlow Condensed', 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.35);
      margin-bottom: 8px;
    }
    .pr-empty-sub {
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.2);
    }
    .pr-empty-sub a {
      color: rgba(0,229,255,0.6);
      text-decoration: none;
    }
    .pr-empty-sub a:hover { color: #00e5ff; }
    .pr-loading {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      padding: 80px 0;
      font-family: 'Inter', sans-serif; font-size: 0.82rem;
      color: rgba(255,255,255,0.25);
    }
    .pr-spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(0,229,255,0.2);
      border-top-color: #00e5ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .pr-sign-in-prompt {
      max-width: 400px; margin: 100px auto; text-align: center; padding: 0 20px;
    }
    .pr-sign-in-prompt .pr-icon { font-size: 3rem; margin-bottom: 16px; }
    .pr-sign-in-prompt h2 {
      font-family: 'Montserrat', sans-serif; font-weight: 900;
      font-size: 1.1rem; text-transform: uppercase; letter-spacing: 0.08em;
      color: #fff; margin: 0 0 10px;
    }
    .pr-sign-in-prompt p {
      font-family: 'Inter', sans-serif; font-size: 0.82rem;
      color: rgba(255,255,255,0.3); margin: 0 0 24px;
    }
    .pr-sign-in-btn {
      display: inline-block;
      background: rgba(0,229,255,0.1);
      border: 1px solid rgba(0,229,255,0.35);
      color: #00e5ff;
      font-family: 'Montserrat', sans-serif; font-weight: 700;
      font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase;
      padding: 12px 28px; border-radius: 10px; text-decoration: none;
      transition: background 0.15s;
    }
    .pr-sign-in-btn:hover { background: rgba(0,229,255,0.18); }

    /* ── BACK BUTTON ── */
    .pr-back {
      position: absolute; top: 20px; left: 40px;
      display: flex; align-items: center; gap: 7px;
      color: rgba(255,255,255,0.4);
      font-family: 'Montserrat', sans-serif;
      font-size: 0.65rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase;
      text-decoration: none;
      transition: color 0.2s;
    }
    .pr-back:hover { color: #00e5ff; }

    /* ── REMOVE CONFIRM ── */
    .pr-confirm-box {
      background: #0d0d10;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 28px 28px 24px;
      width: 320px;
      max-width: calc(100vw - 40px);
      box-shadow: 0 24px 60px rgba(0,0,0,0.8);
      animation: fadeUp 0.2s ease;
    }
    .pr-confirm-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900; font-size: 0.88rem;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: #fff; margin-bottom: 10px;
    }
    .pr-confirm-body {
      font-family: 'Inter', sans-serif;
      font-size: 0.84rem;
      color: rgba(255,255,255,0.45);
      line-height: 1.5; margin-bottom: 22px;
    }
    .pr-confirm-body strong { color: rgba(255,255,255,0.8); font-weight: 600; }
    .pr-confirm-actions { display: flex; gap: 10px; }
    .pr-confirm-cancel {
      flex: 1; padding: 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.5);
      font-family: 'Montserrat', sans-serif;
      font-weight: 700; font-size: 0.68rem;
      letter-spacing: 0.1em; text-transform: uppercase;
      border-radius: 8px; cursor: pointer;
      transition: background 0.15s;
    }
    .pr-confirm-cancel:hover { background: rgba(255,255,255,0.1); }
    .pr-confirm-yes {
      flex: 1; padding: 10px;
      background: rgba(255,60,60,0.1);
      border: 1px solid rgba(255,60,60,0.3);
      color: #ff6060;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700; font-size: 0.68rem;
      letter-spacing: 0.1em; text-transform: uppercase;
      border-radius: 8px; cursor: pointer;
      transition: background 0.15s;
    }
    .pr-confirm-yes:hover { background: rgba(255,60,60,0.2); }

    /* ── DANGER ZONE ── */
    .pr-danger-zone {
      margin-top: 8px;
      border: 1px solid rgba(255,60,60,0.15);
      border-radius: 14px;
      padding: 20px 24px;
      background: rgba(255,40,40,0.03);
    }
    .pr-danger-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800; font-size: 0.68rem;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: rgba(255,100,100,0.6);
      margin: 0 0 6px;
    }
    .pr-danger-desc {
      font-family: 'Inter', sans-serif;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.25);
      margin: 0 0 16px;
      line-height: 1.5;
    }
    .pr-delete-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 20px;
      background: rgba(255,40,40,0.08);
      border: 1px solid rgba(255,60,60,0.25);
      color: rgba(255,100,100,0.7);
      font-family: 'Montserrat', sans-serif;
      font-weight: 700; font-size: 0.68rem;
      letter-spacing: 0.1em; text-transform: uppercase;
      border-radius: 8px; cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .pr-delete-btn:hover {
      background: rgba(255,40,40,0.15);
      border-color: rgba(255,60,60,0.45);
      color: #ff6060;
    }
    .pr-delete-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── AVATAR UPLOAD BUTTON ── */
    .pr-avatar-upload-btn {
      position: absolute; bottom: -2px; right: -2px;
      width: 28px; height: 28px;
      border-radius: 50%;
      background: #141418;
      border: 2px solid rgba(0,229,255,0.4);
      color: rgba(255,255,255,0.8);
      font-size: 0.75rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 4;
      transition: background 0.15s, border-color 0.15s;
      line-height: 1;
      padding: 0;
    }
    .pr-avatar-upload-btn:hover { background: rgba(0,229,255,0.15); border-color: #00e5ff; }
    .pr-avatar-upload-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── SHARE BUTTON ── */
    .pr-share-btn {
      display: inline-flex; align-items: center; gap: 7px;
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12);
      border-radius: 8px; color: rgba(255,255,255,.7);
      font-family: 'Montserrat', sans-serif; font-weight: 700;
      font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase;
      padding: 8px 14px; cursor: pointer; transition: all 0.15s;
      margin-top: 12px;
    }
    .pr-share-btn:hover { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.25); color: #fff; }
    .pr-share-btn.copied { border-color: rgba(0,200,100,.5); color: #00c864; background: rgba(0,200,100,.08); }

    /* ── CHALLENGE BUTTON ── */
    .pr-challenge-btn {
      display: inline-flex; align-items: center; gap: 7px;
      margin-top: 10px;
      background: rgba(0,229,255,0.08);
      border: 1px solid rgba(0,229,255,0.28);
      color: #00e5ff;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700; font-size: 0.68rem;
      letter-spacing: 0.12em; text-transform: uppercase;
      padding: 8px 18px; border-radius: 8px; cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .pr-challenge-btn:hover { background: rgba(0,229,255,0.16); border-color: rgba(0,229,255,0.5); }

    /* ── TIER BADGE ── */
    .pr-tier-badge {
      display: inline-block;
      font-family: 'Montserrat', sans-serif; font-weight: 800;
      font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase;
      padding: 3px 10px; border-radius: 4px;
      background: rgba(200,150,12,.15); border: 1px solid rgba(200,150,12,.4);
      color: #c8960c; margin-top: 4px;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
      .pr-hero-inner { flex-direction: column; align-items: flex-start; padding: 44px 20px 28px; gap: 18px; }
      .pr-back { left: 20px; }
      .pr-stats-inner { padding: 0 10px; }
      .pr-stat-num { font-size: 1.9rem; }
      .pr-body { padding: 28px 20px 80px; }
      .pr-ratings-grid { grid-template-columns: 1fr; }
      .pr-accuracy-card { flex-direction: column; gap: 16px; }
    }
  </style>
</head>
