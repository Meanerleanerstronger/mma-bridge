<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="images/mma-bridge-logo.png">
  <meta name="robots" content="noindex">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fight Card | MMA Bridge</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600&family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh;
      background:#050506;
      font-family:'Inter',sans-serif;
      display:flex; flex-direction:column; align-items:center;
      padding:80px 16px 40px;
    }
    body.fc-light { background:#f6f3ec; }

    /* ── top controls (outside the card, not part of the screenshot) ── */
    .fc-controls {
      position:fixed; top:16px; left:0; right:0; z-index:20;
      display:flex; align-items:center; justify-content:space-between;
      padding:0 16px;
    }
    .fc-back {
      display:inline-flex; align-items:center; gap:6px;
      font-family:'Montserrat',sans-serif; font-weight:700; font-size:.68rem;
      letter-spacing:.08em; text-transform:uppercase;
      color:rgba(255,255,255,.5); text-decoration:none;
      background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14);
      border-radius:20px; padding:8px 16px;
    }
    body.fc-light .fc-back { color:rgba(0,0,0,.55); background:rgba(0,0,0,.05); border-color:rgba(0,0,0,.14); }
    .fc-right-controls { display:flex; gap:8px; }
    .fc-btn {
      font-family:'Montserrat',sans-serif; font-weight:700; font-size:.66rem;
      letter-spacing:.06em; text-transform:uppercase;
      background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.16);
      color:#fff; border-radius:20px; padding:8px 16px; cursor:pointer;
    }
    .fc-btn:hover { background:rgba(255,255,255,.12); }
    .fc-btn.active { background:#d97b3f; border-color:#d97b3f; color:#0a0a0a; }
    body.fc-light .fc-btn { background:rgba(0,0,0,.05); border-color:rgba(0,0,0,.14); color:#161514; }
    body.fc-light .fc-btn:hover { background:rgba(0,0,0,.1); }
    body.fc-light .fc-btn.active { background:#d97b3f; border-color:#d97b3f; color:#0a0a0a; }
    .fc-hint-pill {
      text-align:center; margin-top:70px; margin-bottom:-40px;
      font-family:'Inter',sans-serif; font-size:.72rem; color:rgba(255,255,255,.35);
    }
    body.fc-light .fc-hint-pill { color:rgba(0,0,0,.4); }

    /* ── shared card shell ── */
    .fc-card {
      position:relative; width:min(94vw, 720px);
      background:#0b0b0c; border-radius:8px; overflow:hidden;
      box-shadow:0 30px 90px rgba(0,0,0,.6);
      margin-top:24px;
    }
    body.fc-light .fc-card { background:#faf7f1; }

    .fc-header {
      position:relative; padding:18px 24px 14px;
      text-align:center;
      background:linear-gradient(160deg, rgba(217,123,63,.16), transparent 65%);
    }
    .fc-badge {
      display:inline-block; padding:5px 16px; margin-bottom:10px;
      background:#d97b3f; color:#0a0a0a; border-radius:3px;
      font-family:'Montserrat',sans-serif; font-weight:900; font-size:.68rem;
      letter-spacing:.14em; text-transform:uppercase;
    }
    .fc-event-name {
      font-family:'Barlow Condensed',sans-serif; font-weight:900; font-style:italic;
      text-transform:uppercase; color:#fff;
      font-size:clamp(1.7rem,5.4vw,2.5rem); line-height:.95;
      -webkit-text-stroke:.5px rgba(0,0,0,.3);
    }
    body.fc-light .fc-event-name { color:#161514; }
    .fc-event-sub {
      margin-top:4px;
      font-family:'Montserrat',sans-serif; font-weight:700; font-size:.62rem;
      letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.4);
    }
    body.fc-light .fc-event-sub { color:rgba(0,0,0,.45); }

    /* ── CARD MODE — dense 2-column grid of bout cells ── */
    .fc-section-bar {
      padding:9px 20px; margin-top:4px;
      background:rgba(217,123,63,.12);
      font-family:'Montserrat',sans-serif; font-weight:800; font-size:.64rem;
      letter-spacing:.18em; text-transform:uppercase; color:#d97b3f;
    }
    .fc-grid {
      padding:10px 12px 16px; display:grid;
      grid-template-columns:1fr 1fr; gap:8px;
    }
    @media(max-width:520px) { .fc-grid { grid-template-columns:1fr; } }
    .fc-cell {
      border:1px solid rgba(255,255,255,.09); border-radius:6px;
      padding:0; overflow:hidden;
      background:rgba(255,255,255,.015);
    }
    body.fc-light .fc-cell { border-color:rgba(0,0,0,.09); background:rgba(0,0,0,.015); }
    .fc-cell-photos { display:flex; align-items:stretch; }
    .fc-thumb {
      width:50%; height:104px; object-fit:cover;
      flex-shrink:0; background:#1a1a1c;
    }
    .fc-thumb.empty { display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,.15); font-size:1.8rem; }
    .fc-cell-names {
      display:flex; align-items:flex-start; justify-content:space-between; gap:6px;
      padding:8px 10px 2px;
    }
    .fc-cell-name {
      font-family:'Montserrat',sans-serif; font-weight:900; font-size:.72rem;
      color:#fff; text-transform:uppercase; letter-spacing:.005em;
      line-height:1.15; flex:1;
    }
    .fc-cell-name.b { text-align:right; }
    body.fc-light .fc-cell-name { color:#161514; }
    .fc-cell-vs {
      font-family:'Barlow Condensed',sans-serif; font-weight:900; font-style:italic;
      font-size:.6rem; color:#d97b3f; flex-shrink:0; padding-top:2px;
    }
    .fc-cell-weight {
      text-align:center; padding:0 10px 8px;
      font-family:'Montserrat',sans-serif; font-weight:700; font-size:.5rem;
      letter-spacing:.08em; text-transform:uppercase; color:rgba(255,255,255,.32);
    }
    body.fc-light .fc-cell-weight { color:rgba(0,0,0,.4); }

    /* ── NEXT-FIGHT MODE — stacked matchup list, now with headshots ── */
    .fc-next-rows { display:flex; flex-direction:column; }
    .fc-next-row {
      position:relative; padding:0 16px;
      min-height:104px;
      border-bottom:1px solid rgba(255,255,255,.07);
      display:flex; align-items:stretch; gap:12px;
    }
    body.fc-light .fc-next-row { border-bottom-color:rgba(0,0,0,.08); }
    .fc-next-row:last-child { border-bottom:none; }
    .fc-next-row:nth-child(odd) { background:rgba(217,123,63,.05); }
    .fc-next-row:nth-child(even) { background:rgba(96,165,250,.05); }
    .fc-next-photo {
      width:84px; height:auto; margin:8px 0; border-radius:6px; object-fit:cover; flex-shrink:0;
      border:1px solid rgba(255,255,255,.12);
    }
    .fc-next-photo.b-side { order:3; }
    .fc-next-body { flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; }
    .fc-next-tag {
      display:inline-block; margin-bottom:4px;
      font-family:'Montserrat',sans-serif; font-weight:800; font-size:.54rem;
      letter-spacing:.16em; text-transform:uppercase; color:#d97b3f;
    }
    .fc-next-matchup {
      font-family:'Barlow Condensed',sans-serif; font-weight:900; font-style:italic;
      text-transform:uppercase; color:#fff; line-height:1;
      font-size:clamp(1.2rem,4.4vw,1.8rem);
      display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;
    }
    body.fc-light .fc-next-matchup { color:#161514; }
    .fc-next-matchup .vs {
      font-size:.55em; color:#d97b3f; text-decoration:underline;
      text-underline-offset:3px;
    }
    .fc-next-weight {
      margin-top:4px;
      font-family:'Montserrat',sans-serif; font-weight:700; font-size:.56rem;
      letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.35);
    }
    body.fc-light .fc-next-weight { color:rgba(0,0,0,.4); }

    .fc-footer {
      padding:12px 24px; text-align:center;
      font-family:'Montserrat',sans-serif; font-weight:800; font-size:.56rem;
      letter-spacing:.2em; text-transform:uppercase; color:rgba(255,255,255,.35);
      border-top:1px solid rgba(255,255,255,.07);
    }
    body.fc-light .fc-footer { color:rgba(0,0,0,.4); border-top-color:rgba(0,0,0,.08); }

    .fc-empty {
      padding:60px 24px; text-align:center;
      font-family:'Inter',sans-serif; color:rgba(255,255,255,.3);
    }

    /* ── EDIT PANEL — lives below the card, never part of the screenshot ── */
    .fc-edit-panel {
      display:none; width:min(94vw, 720px); margin-top:20px;
      background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.1);
      border-radius:8px; padding:18px;
      font-family:'Inter',sans-serif;
    }
    body.fc-light .fc-edit-panel { background:rgba(0,0,0,.02); border-color:rgba(0,0,0,.1); }
    .fc-edit-panel.open { display:block; }
    .fc-edit-title {
      font-family:'Montserrat',sans-serif; font-weight:800; font-size:.7rem;
      letter-spacing:.12em; text-transform:uppercase; color:#d97b3f;
      margin-bottom:12px;
    }
    .fc-edit-list { display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
    .fc-edit-row {
      display:flex; align-items:center; gap:10px;
      background:rgba(255,255,255,.04); border-radius:6px; padding:8px 12px;
      font-size:.78rem; color:rgba(255,255,255,.85);
    }
    body.fc-light .fc-edit-row { background:rgba(0,0,0,.04); color:rgba(0,0,0,.8); }
    .fc-edit-row-text { flex:1; }
    .fc-edit-remove {
      background:transparent; border:none; color:#e05555; cursor:pointer;
      font-size:.72rem; font-weight:600; padding:4px 8px;
    }
    .fc-add-row {
      display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px;
      position:relative;
    }
    @media(max-width:520px) { .fc-add-row { grid-template-columns:1fr; } }
    .fc-add-row-extra { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
    @media(max-width:520px) { .fc-add-row-extra { grid-template-columns:1fr; } }
    .fc-input {
      background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.14);
      border-radius:6px; padding:9px 12px; color:#fff; font-size:.82rem;
      font-family:'Inter',sans-serif; width:100%;
    }
    body.fc-light .fc-input { background:rgba(0,0,0,.03); border-color:rgba(0,0,0,.14); color:#161514; }
    .fc-autocomplete { position:relative; }
    .fc-autocomplete-list {
      display:none; position:absolute; top:calc(100% + 4px); left:0; right:0;
      max-height:200px; overflow-y:auto; background:#17171a;
      border:1px solid rgba(255,255,255,.14); border-radius:8px; z-index:30;
      box-shadow:0 12px 30px rgba(0,0,0,.5);
    }
    .fc-autocomplete-list.open { display:block; }
    .fc-autocomplete-item {
      padding:9px 12px; font-size:.8rem; color:rgba(255,255,255,.85); cursor:pointer;
    }
    .fc-autocomplete-item:hover { background:rgba(217,123,63,.18); }
    .fc-add-btn {
      background:#d97b3f; border:none; color:#0a0a0a; font-weight:700;
      font-size:.76rem; padding:9px 20px; border-radius:20px; cursor:pointer;
      font-family:'Montserrat',sans-serif; letter-spacing:.04em; text-transform:uppercase;
    }
    .fc-add-btn:disabled { opacity:.4; cursor:not-allowed; }
  </style>
</head>
<body>
  <div class="fc-controls">
    <a class="fc-back" id="fcBack" href="admin.html">&larr; Back</a>
    <div class="fc-right-controls">
      <button class="fc-btn" id="fcThemeBtn" type="button">🌙 Dark</button>
      <button class="fc-btn" id="fcDownloadBtn" type="button">&#8681; Download</button>
      <button class="fc-btn" id="fcEditBtn" type="button">✎ Edit Fights</button>
    </div>
  </div>

  <div id="fcRoot" class="fc-card"><div class="fc-empty">Loading...</div></div>
  <div class="fc-edit-panel" id="fcEditPanel"></div>

  <script>
  (function(){
    const p = new URLSearchParams(location.search);
    let mode      = p.get('mode') === 'next' ? 'next' : 'card';
    let theme     = p.get('theme') === 'light' ? 'light' : 'dark';
    let eventName = p.get('eventName') || (mode === 'next' ? 'Fights We Want To See' : 'Fight Card');
    let eventSub  = p.get('eventSub') || '';

    function esc(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

    let bouts = [];
    try {
      const raw = p.get('bouts');
      if (raw) bouts = JSON.parse(decodeURIComponent(escape(atob(raw))));
    } catch (e) { bouts = []; }
    bouts.forEach((b, i) => { b._id = i + 1; });
    let boutSeq = bouts.length;

    const root       = document.getElementById('fcRoot');
    const editPanel  = document.getElementById('fcEditPanel');
    const themeBtn   = document.getElementById('fcThemeBtn');
    const editBtn    = document.getElementById('fcEditBtn');
    let editMode = false;

    function applyTheme() {
      document.body.classList.toggle('fc-light', theme === 'light');
      themeBtn.textContent = theme === 'light' ? '☀️ Light' : '🌙 Dark';
    }

    function renderCardMode() {
      if (!bouts.length) { root.innerHTML = '<div class="fc-empty">No fights added yet — click Edit Fights to add some.</div>'; return; }
      const sections = [];
      const bySection = new Map();
      bouts.forEach(b => {
        const sec = b.section || 'Fight Card';
        if (!bySection.has(sec)) { bySection.set(sec, []); sections.push(sec); }
        bySection.get(sec).push(b);
      });

      const sectionsHTML = sections.map(sec => `
        <div class="fc-section-bar">${esc(sec)}</div>
        <div class="fc-grid">
          ${bySection.get(sec).map(b => `
            <div class="fc-cell">
              <div class="fc-cell-photos">
                ${b.imgA ? `<img class="fc-thumb" src="${esc(b.imgA)}" onerror="this.outerHTML='<div class=&quot;fc-thumb empty&quot;>?</div>'">` : '<div class="fc-thumb empty">?</div>'}
                ${b.imgB ? `<img class="fc-thumb" src="${esc(b.imgB)}" onerror="this.outerHTML='<div class=&quot;fc-thumb empty&quot;>?</div>'">` : '<div class="fc-thumb empty">?</div>'}
              </div>
              <div class="fc-cell-names">
                <div class="fc-cell-name">${esc(b.a)}</div>
                <div class="fc-cell-vs">VS</div>
                <div class="fc-cell-name b">${esc(b.b)}</div>
              </div>
              ${b.weight ? `<div class="fc-cell-weight">${esc(b.weight)}</div>` : ''}
            </div>
          `).join('')}
        </div>
      `).join('');

      root.innerHTML = `
        <div class="fc-header">
          <div class="fc-badge">MMA Bridge</div>
          <div class="fc-event-name">${esc(eventName)}</div>
          ${eventSub ? `<div class="fc-event-sub">${esc(eventSub)}</div>` : ''}
        </div>
        ${sectionsHTML}
        <div class="fc-footer">mmabridge.com</div>
      `;
    }

    function renderNextMode() {
      if (!bouts.length) { root.innerHTML = '<div class="fc-empty">No matchups added yet — click Edit Fights to add some.</div>'; return; }
      const rowsHTML = bouts.map(b => `
        <div class="fc-next-row">
          ${b.imgA ? `<img class="fc-next-photo" src="${esc(b.imgA)}" onerror="this.style.display='none'">` : ''}
          <div class="fc-next-body">
            ${b.tag ? `<div class="fc-next-tag">${esc(b.tag)}</div>` : ''}
            <div class="fc-next-matchup">${esc(b.a)} <span class="vs">vs</span> ${esc(b.b)}</div>
            ${b.weight ? `<div class="fc-next-weight">${esc(b.weight)}</div>` : ''}
          </div>
          ${b.imgB ? `<img class="fc-next-photo b-side" src="${esc(b.imgB)}" onerror="this.style.display='none'">` : ''}
        </div>
      `).join('');

      root.innerHTML = `
        <div class="fc-header">
          <div class="fc-badge">MMA Bridge</div>
          <div class="fc-event-name">${esc(eventName)}</div>
          ${eventSub ? `<div class="fc-event-sub">${esc(eventSub)}</div>` : ''}
        </div>
        <div class="fc-next-rows">${rowsHTML}</div>
        <div class="fc-footer">mmabridge.com</div>
      `;
    }

    function render() {
      document.title = `${eventName} | MMA Bridge`;
      if (mode === 'next') renderNextMode(); else renderCardMode();
      if (editMode) renderEditPanel();
    }

    // ── Fighter search, used only by the edit panel ──
    let fightersCache = null;
    async function loadFighters() {
      if (!fightersCache) {
        try {
          const res = await fetch('data/fighters.json?_=' + Date.now(), { cache:'no-store' });
          fightersCache = await res.json();
        } catch (e) { fightersCache = []; }
      }
      return fightersCache;
    }
    function searchFighters(q) {
      const clean = q.trim().toLowerCase();
      if (!clean || !fightersCache) return [];
      return fightersCache.filter(f => (f.name||'').toLowerCase().includes(clean)).slice(0, 8);
    }

    function wireAutocomplete(inputEl, listEl, onPick) {
      inputEl.addEventListener('input', () => {
        const results = searchFighters(inputEl.value);
        if (!results.length) { listEl.classList.remove('open'); listEl.innerHTML=''; return; }
        listEl.innerHTML = results.map(f => `<div class="fc-autocomplete-item">${esc(f.name)}</div>`).join('');
        listEl.classList.add('open');
        listEl.querySelectorAll('.fc-autocomplete-item').forEach((el,i) => {
          el.addEventListener('click', () => {
            inputEl.value = results[i].name;
            inputEl.dataset.img = results[i].img || '';
            inputEl.dataset.weight = results[i].weightClass || '';
            listEl.classList.remove('open');
            onPick(results[i]);
          });
        });
      });
      inputEl.addEventListener('blur', () => setTimeout(() => listEl.classList.remove('open'), 150));
    }

    function renderEditPanel() {
      const extraFieldsHTML = mode === 'card'
        ? `<input type="text" class="fc-input" id="fcNewWeight" placeholder="Weight class (optional)">
           <select class="fc-input" id="fcNewSection">
             <option value="Main Card">Main Card</option>
             <option value="Co-Main">Co-Main</option>
             <option value="Prelims">Prelims</option>
             <option value="Early Prelims">Early Prelims</option>
           </select>`
        : `<input type="text" class="fc-input" id="fcNewWeight" placeholder="Weight class (optional)">
           <input type="text" class="fc-input" id="fcNewTag" placeholder="Tag (optional)">`;

      editPanel.innerHTML = `
        <div class="fc-edit-title">Title</div>
        <div class="fc-add-row-extra">
          <input type="text" class="fc-input" id="fcEditEventName" placeholder="Event name (e.g. UFC 331)" value="${esc(eventName)}">
          <input type="text" class="fc-input" id="fcEditEventSub" placeholder="Subtitle (optional, e.g. Sep 8 · Inglewood)" value="${esc(eventSub)}">
        </div>
        <div class="fc-edit-title">${mode === 'card' ? 'Fights on this card' : 'Matchups'} (${bouts.length})</div>
        <div class="fc-edit-list">
          ${bouts.length ? bouts.map(b => `
            <div class="fc-edit-row">
              <div class="fc-edit-row-text">${esc(b.a)} vs ${esc(b.b)}${b.weight ? ' &middot; ' + esc(b.weight) : ''}</div>
              <button class="fc-edit-remove" data-remove="${b._id}" type="button">Remove</button>
            </div>
          `).join('') : `<div style="opacity:.5;font-size:.8rem;">None yet — add one below.</div>`}
        </div>
        <div class="fc-edit-title">Add a fight</div>
        <div class="fc-add-row">
          <div class="fc-autocomplete">
            <input type="text" class="fc-input" id="fcNewA" placeholder="Fighter A" autocomplete="off">
            <div class="fc-autocomplete-list" id="fcNewAList"></div>
          </div>
          <div class="fc-autocomplete">
            <input type="text" class="fc-input" id="fcNewB" placeholder="Fighter B" autocomplete="off">
            <div class="fc-autocomplete-list" id="fcNewBList"></div>
          </div>
        </div>
        <div class="fc-add-row-extra">${extraFieldsHTML}</div>
        <button class="fc-add-btn" id="fcAddBoutBtn" type="button" disabled>+ Add</button>
      `;

      editPanel.querySelectorAll('[data-remove]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = parseInt(btn.dataset.remove, 10);
          bouts = bouts.filter(b => b._id !== id);
          render();
        });
      });

      // Title fields only re-render the poster itself, not the whole edit
      // panel — re-rendering the panel on every keystroke would blow away
      // focus and cursor position mid-type.
      document.getElementById('fcEditEventName').addEventListener('input', e => {
        eventName = e.target.value; document.title = `${eventName} | MMA Bridge`;
        if (mode === 'next') renderNextMode(); else renderCardMode();
      });
      document.getElementById('fcEditEventSub').addEventListener('input', e => {
        eventSub = e.target.value;
        if (mode === 'next') renderNextMode(); else renderCardMode();
      });

      const inputA = document.getElementById('fcNewA');
      const inputB = document.getElementById('fcNewB');
      const listA  = document.getElementById('fcNewAList');
      const listB  = document.getElementById('fcNewBList');
      const addBtn = document.getElementById('fcAddBoutBtn');
      let selA = null, selB = null;

      function checkReady() { addBtn.disabled = !(inputA.value.trim() && inputB.value.trim()); }
      wireAutocomplete(inputA, listA, f => { selA = f; checkReady(); });
      wireAutocomplete(inputB, listB, f => { selB = f; checkReady(); });
      inputA.addEventListener('input', () => { selA = null; checkReady(); });
      inputB.addEventListener('input', () => { selB = null; checkReady(); });

      addBtn.addEventListener('click', () => {
        const nameA = inputA.value.trim(), nameB = inputB.value.trim();
        if (!nameA || !nameB) return;
        const weightEl  = document.getElementById('fcNewWeight');
        const sectionEl = document.getElementById('fcNewSection');
        const tagEl     = document.getElementById('fcNewTag');
        boutSeq++;
        bouts.push({
          _id: boutSeq,
          a: nameA, b: nameB,
          imgA: selA ? (selA.img||'') : (inputA.dataset.img||''),
          imgB: selB ? (selB.img||'') : (inputB.dataset.img||''),
          weight: weightEl ? weightEl.value.trim() : '',
          section: sectionEl ? sectionEl.value : undefined,
          tag: tagEl ? tagEl.value.trim() : undefined,
        });
        render();
      });
    }

    themeBtn.addEventListener('click', () => {
      theme = theme === 'light' ? 'dark' : 'light';
      applyTheme();
    });
    editBtn.addEventListener('click', () => {
      editMode = !editMode;
      editBtn.classList.toggle('active', editMode);
      editPanel.classList.toggle('open', editMode);
      if (editMode) { loadFighters().then(renderEditPanel); }
    });

    // ── Download Poster ──────────────────────────────────────
    // Fighter photos come from a CDN with no Access-Control-Allow-Origin
    // header, so drawing them straight into a <canvas> taints it and blocks
    // export. Fix: re-fetch each image through the backend's same-origin
    // proxy first (swapped to a data: URI, which never taints), then
    // rasterize with html2canvas — NOT a hand-rolled SVG-foreignObject +
    // Image() approach: that route was tried first and, even once fully
    // valid (well-formed XML, verified by opening the exact generated SVG
    // directly in a browser tab, where it rendered perfectly), still failed
    // consistently — but ONLY when loaded via new Image() from a page
    // served over http://, not from about:blank. That's a real, narrow
    // browser quirk around SVG-as-<img> decoding that wasn't worth chasing
    // further; html2canvas walks the DOM and paints it with Canvas 2D
    // primitives instead, sidestepping that whole failure category.
    const API_BASE = 'https://mmabridge-backend.onrender.com';
    let _html2canvasPromise = null;
    function loadHtml2Canvas() {
      if (!_html2canvasPromise) {
        _html2canvasPromise = new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
          s.onload = () => resolve(window.html2canvas);
          s.onerror = () => reject(new Error('Could not load html2canvas'));
          document.head.appendChild(s);
        });
      }
      return _html2canvasPromise;
    }
    async function downloadPosterImage(targetEl, filename) {
      const html2canvas = await loadHtml2Canvas();

      // Swap real fighter photos to same-origin data: URIs in place (not on
      // a detached clone — html2canvas renders far more faithfully against
      // an element that's actually laid out in the live page), then restore
      // the originals afterward regardless of outcome.
      const imgs = [...targetEl.querySelectorAll('img')];
      const originalSrcs = imgs.map(img => img.src);
      await Promise.all(imgs.map(async img => {
        const src = img.getAttribute('src');
        if (!src || src.startsWith('data:')) return;
        try {
          const proxied = `${API_BASE}/api/image-proxy?url=${encodeURIComponent(src)}`;
          const blob = await (await fetch(proxied)).blob();
          const dataUrl = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(blob);
          });
          img.src = dataUrl;
        } catch (e) { /* leave the original src — html2canvas will just skip/blank that one image, not fail the whole export */ }
      }));

      try {
        const bg = getComputedStyle(targetEl).backgroundColor;
        const canvas = await html2canvas(targetEl, { backgroundColor: bg, scale: 2, useCORS: true, logging: false });
        await new Promise((resolve, reject) => {
          canvas.toBlob(blob => {
            if (!blob) { reject(new Error('canvas produced no image data')); return; }
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            // target="_blank" defends against theme.js-style global
            // "fade + navigate on internal link click" handlers (confirmed
            // one exists and hijacks this exact click on matchup.html,
            // which loads theme.js and this page doesn't — but cheap
            // insurance either way).
            a.href = url; a.download = filename; a.target = '_blank';
            document.body.appendChild(a); a.click(); a.remove();
            // Revoking synchronously right after click() races the browser
            // actually starting the download — on a heavier page this can
            // lose the race outright (confirmed: reliable here, but failed
            // 100% of the time on matchup.html, which loads far more
            // scripts and has more event-loop contention). Give it a beat.
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            resolve();
          }, 'image/png');
        });
      } finally {
        imgs.forEach((img, i) => { img.src = originalSrcs[i]; });
      }
    }

    const downloadBtn = document.getElementById('fcDownloadBtn');
    downloadBtn.addEventListener('click', async () => {
      downloadBtn.disabled = true;
      const original = downloadBtn.innerHTML;
      downloadBtn.textContent = 'Preparing...';
      try {
        await downloadPosterImage(document.querySelector('.fc-card'), `${eventName.replace(/[^a-z0-9]+/gi,'-')}.png`);
      } catch (e) {
        downloadBtn.textContent = 'Failed';
        setTimeout(() => { downloadBtn.innerHTML = original; downloadBtn.disabled = false; }, 2000);
        return;
      }
      downloadBtn.innerHTML = original;
      downloadBtn.disabled = false;
    });

    applyTheme();
    render();
  })();
  </script>
</body>
</html>
