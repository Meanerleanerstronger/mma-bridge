<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="images/mma-bridge-logo.png">
  <meta name="robots" content="noindex">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fight Card | MMA Bridge</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600&family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,800;1,900&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh;
      background:#050506;
      font-family:'Inter',sans-serif;
      display:flex; flex-direction:column; align-items:center;
      padding:80px 16px 40px;
    }
    body.fc-light { background:#f6f3ec; }

    /* ── top controls (outside the card, not part of the screenshot) ── */
    .fc-controls {
      position:fixed; top:16px; left:0; right:0; z-index:20;
      display:flex; align-items:center; justify-content:space-between;
      padding:0 16px;
    }
    .fc-back {
      display:inline-flex; align-items:center; gap:6px;
      font-family:'Montserrat',sans-serif; font-weight:700; font-size:.68rem;
      letter-spacing:.08em; text-transform:uppercase;
      color:rgba(255,255,255,.5); text-decoration:none;
      background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14);
      border-radius:20px; padding:8px 16px;
    }
    body.fc-light .fc-back { color:rgba(0,0,0,.55); background:rgba(0,0,0,.05); border-color:rgba(0,0,0,.14); }
    .fc-right-controls { display:flex; gap:8px; }
    .fc-btn {
      font-family:'Montserrat',sans-serif; font-weight:700; font-size:.66rem;
      letter-spacing:.06em; text-transform:uppercase;
      background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.16);
      color:#fff; border-radius:20px; padding:8px 16px; cursor:pointer;
    }
    .fc-btn:hover { background:rgba(255,255,255,.12); }
    .fc-zoom-group { display:flex; align-items:center; gap:4px; }
    .fc-zoom-btn { padding:8px 14px; cursor:pointer; }
    .fc-zoom-label { pointer-events:none; min-width:52px; text-align:center; font-variant-numeric:tabular-nums; }
    .fc-btn.active { background:linear-gradient(165deg, #ffb066 0%, #ff8a3d 45%, #e8691c 100%); border-color:#ff8a3d; color:#0a0a0a; }
    body.fc-light .fc-btn { background:rgba(0,0,0,.05); border-color:rgba(0,0,0,.14); color:#161514; }
    body.fc-light .fc-btn:hover { background:rgba(0,0,0,.1); }
    body.fc-light .fc-btn.active { background:linear-gradient(165deg, #ffb066 0%, #ff8a3d 45%, #e8691c 100%); border-color:#ff8a3d; color:#0a0a0a; }
    .fc-hint-pill {
      text-align:center; margin-top:70px; margin-bottom:-40px;
      font-family:'Inter',sans-serif; font-size:.72rem; color:rgba(255,255,255,.35);
    }
    body.fc-light .fc-hint-pill { color:rgba(0,0,0,.4); }

    /* ── shared card shell ── */
    .fc-card {
      position:relative; width:min(94vw, 720px);
      background:#0b0b0c; border-radius:8px; overflow:hidden;
      box-shadow:0 30px 90px rgba(0,0,0,.6);
      margin-top:24px;
      /* flat pure-black reads as "app screenshot" — a faint diagonal
         hairline texture reads as a printed/designed graphic instead */
      background-image:repeating-linear-gradient(135deg, rgba(255,255,255,.025) 0 1px, transparent 1px 22px);
      /* Next-fight mode's photos/text scale off this — the card's width
         is fixed regardless of bout count, so a 2-matchup list used to
         render at the exact same small size as a 6-matchup list and just
         looked lost/zoomed-out. Set automatically from bout count (fewer
         bouts = bigger number) and adjustable by hand via the Zoom
         buttons; see setZoom() below. */
      --fc-scale: 1;
    }
    body.fc-light .fc-card { background-color:#faf7f1; background-image:repeating-linear-gradient(135deg, rgba(0,0,0,.02) 0 1px, transparent 1px 22px); }

    .fc-header {
      position:relative; padding:18px 24px 14px;
      text-align:center;
      /* no background glow — a soft orange wash behind the header read as
         AI-slop haze rather than depth; plain flat is more premium here. */
    }
    /* badge — the real logo mark, not a fake text-in-a-box. It's a black
       circular badge with its own built-in fill, so it reads the same on
       either theme without needing a light/dark variant. */
    .fc-badge {
      display:block; margin:0 auto 10px;
      width:52px; height:52px;
      filter:drop-shadow(0 6px 14px rgba(0,0,0,.4));
    }
    /* small hard-offset extrusion — a touch of "raised type" depth, not a
       blur/glow — on the biggest word on the page. */
    .fc-event-name {
      font-family:'Barlow Condensed',sans-serif; font-weight:900; font-style:italic;
      text-transform:uppercase; color:#fff;
      font-size:clamp(1.7rem,5.4vw,2.5rem); line-height:.95;
      -webkit-text-stroke:.5px rgba(0,0,0,.3);
      text-shadow:2px 2px 0 rgba(232,105,28,.35);
    }
    body.fc-light .fc-event-name { color:#161514; text-shadow:2px 2px 0 rgba(232,105,28,.3); }
    .fc-event-sub {
      margin-top:6px;
      font-family:'Montserrat',sans-serif; font-weight:700; font-size:.8rem;
      letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.5);
    }
    body.fc-light .fc-event-sub { color:rgba(0,0,0,.5); }

    /* ── CARD MODE — dense 2-column grid of bout cells ── */
    /* Oswald — a tall, tight, no-nonsense condensed grotesque, the closest
       free stand-in for the kind of bold display sans UFC's own graphics
       use (their actual wordmark font is proprietary/not licensable).
       Swapped in for section labels, fighter names, and weight class —
       VS deliberately stays on Barlow Condensed italic, untouched. */
    .fc-section-bar {
      padding:11px 20px; margin-top:4px;
      background:rgba(255,138,61,.12);
      font-family:'Oswald',sans-serif; font-weight:700; font-size:1.05rem;
      letter-spacing:.12em; text-transform:uppercase; color:#ff8a3d;
    }
    /* flex + wrap + center instead of a fixed 2-col grid — a lone fight
       (or an odd count) used to leave a huge dead cell next to it; this
       centers whatever count there actually is instead. */
    .fc-grid {
      padding:10px 12px 16px; display:flex; flex-wrap:wrap;
      justify-content:center; gap:8px;
    }
    .fc-cell {
      position:relative;
      border:1px solid rgba(255,255,255,.09); border-radius:6px;
      padding:0; overflow:hidden;
      background:rgba(255,255,255,.015);
      flex:1 1 320px; max-width:calc(50% - 4px);
    }
    /* rematch/eliminator/whatever-else ribbon — same gradient-sheen
       treatment as the header badge, top-left corner over the photos. */
    .fc-cell-tag {
      position:absolute; top:8px; left:8px; z-index:2;
      background:linear-gradient(165deg, #ffb066 0%, #ff8a3d 45%, #e8691c 100%);
      color:#0a0a0a; border-radius:3px;
      font-family:'Montserrat',sans-serif; font-weight:900; font-size:.6rem;
      letter-spacing:.1em; text-transform:uppercase;
      padding:4px 10px;
      box-shadow:0 4px 12px rgba(0,0,0,.45);
    }
    @media(max-width:520px) { .fc-cell { max-width:100%; } }
    body.fc-light .fc-cell { border-color:rgba(0,0,0,.09); background:rgba(0,0,0,.015); }
    .fc-cell-photos { display:flex; align-items:stretch; background:#101012; }
    body.fc-light .fc-cell-photos { background:#e4ded2; }
    .fc-thumb {
      width:50%; height:132px; flex-shrink:0;
      /* CSS background-image + background-size:cover, NOT an <img> with
         object-fit:cover — html2canvas doesn't honor object-fit on replaced
         elements and just stretches the raw image into the box, which is
         exactly what was squishing/smushing fighters in downloaded PNGs
         even though the live page (real browser layout engine) looked
         correct. background-size:cover rasterizes correctly. */
      background-size:cover;
      /* Source photos are full-body cutouts — centering the crop (the
         default) lands on the torso and chops the head off entirely.
         Anchor toward the top so the face is what actually shows. */
      background-position:center 12%;
      background-repeat:no-repeat;
      /* No background color of its own — the cutout PNGs have transparent
         edges, and a hardcoded dark fill here showed through them even
         in light mode. Let .fc-cell-photos' theme-aware background show
         through instead. */
      background-color:transparent;
      /* Unify photos shot on different backgrounds/lighting into one
         graphic instead of looking like stitched-together stock photos. */
      filter:grayscale(.55) contrast(1.12) brightness(.95);
    }
    .fc-thumb.empty {
      display:flex; align-items:center; justify-content:center;
      color:rgba(255,255,255,.15); font-size:1.8rem; height:132px; width:50%;
      background:#1a1a1c;
    }
    body.fc-light .fc-thumb.empty { background:#d8d0c0; color:rgba(0,0,0,.2); }
    .fc-cell-names {
      display:flex; align-items:flex-start; justify-content:space-between; gap:6px;
      padding:8px 10px 2px;
    }
    .fc-cell-fighter { display:flex; align-items:center; gap:5px; flex:1; min-width:0; }
    .fc-cell-fighter.b { flex-direction:row-reverse; }
    .fc-cell-name {
      font-family:'Oswald',sans-serif; font-weight:700; font-size:.98rem;
      color:#fff; text-transform:uppercase; letter-spacing:.01em;
      line-height:1.15; min-width:0;
    }
    .fc-cell-name.b { text-align:right; }
    body.fc-light .fc-cell-name { color:#161514; }
    .fc-cell-vs {
      font-family:'Barlow Condensed',sans-serif; font-weight:900; font-style:italic;
      font-size:1.3rem; color:#ff8a3d; flex-shrink:0; padding-top:2px;
    }
    .fc-cell-weight {
      text-align:center; padding:2px 10px 10px;
      font-family:'Oswald',sans-serif; font-weight:500; font-size:.85rem;
      letter-spacing:.06em; text-transform:uppercase; color:rgba(255,255,255,.4);
    }
    body.fc-light .fc-cell-weight { color:rgba(0,0,0,.4); }

    /* ── NEXT-FIGHT MODE — stacked matchup list, now with headshots.
       Every size below is a base value multiplied by --fc-scale (set on
       .fc-card, see its comment) instead of a fixed px/rem — that's what
       makes a 2-matchup list render noticeably bigger than a 6-matchup
       one instead of both being squeezed into the exact same small size. ── */
    .fc-next-rows { display:flex; flex-direction:column; }
    /* Generous scaled vertical padding (was 0, relying only on min-height)
       — that's what made rows blur into each other with no way to tell
       where one ends and the next begins. Padding + the border now both
       do real work instead of the border alone. */
    .fc-next-row {
      position:relative; padding:calc(18px * var(--fc-scale)) 22px;
      min-height:calc(104px * var(--fc-scale));
      border-bottom:1px solid rgba(255,255,255,.1);
      /* align-items:stretch (not center) — .fc-next-photo has no height
         of its own and depends on stretch to fill the row; switching this
         to center for the "more elegant spacing" pass silently collapsed
         every photo to zero height (the div was still there, just 0px
         tall, so nothing painted — background-image, live or downloaded). */
      display:flex; align-items:stretch; gap:calc(18px * var(--fc-scale));
    }
    body.fc-light .fc-next-row { border-bottom-color:rgba(0,0,0,.12); }
    .fc-next-row:last-child { border-bottom:none; }
    .fc-next-row:nth-child(odd) { background:rgba(255,138,61,.045); }
    .fc-next-row:nth-child(even) { background:rgba(96,165,250,.045); }
    .fc-next-photo {
      width:calc(84px * var(--fc-scale)); margin:8px 0; border-radius:6px; flex-shrink:0;
      /* Same background-image/cover swap as .fc-thumb — html2canvas
         ignores object-fit and stretches <img> content into its box. */
      background-size:cover;
      background-position:center 12%;
      background-repeat:no-repeat;
      filter:grayscale(.55) contrast(1.12) brightness(.95);
      border:1px solid rgba(255,255,255,.12);
    }
    .fc-next-photo.b-side { order:3; }
    .fc-next-body { flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; }
    /* Tag — a quiet italic label with a short flanking rule instead of a
       loud solid-orange caps chip. Reads like real fight-poster caption
       type ("WORLD FLYWEIGHT CHAMPIONSHIP", "LIGHTWEIGHT BOUT") rather
       than a UI badge. */
    .fc-next-tag {
      display:inline-flex; align-items:center; gap:calc(8px * var(--fc-scale));
      margin-bottom:calc(8px * var(--fc-scale));
      font-family:'Barlow Condensed',sans-serif; font-weight:600; font-style:italic;
      font-size:calc(.66rem * var(--fc-scale));
      letter-spacing:.22em; text-transform:uppercase; color:#e0b378;
    }
    .fc-next-tag::before {
      content:''; display:inline-block; flex-shrink:0;
      width:calc(16px * var(--fc-scale)); height:1px;
      background:currentColor; opacity:.55;
    }
    /* Names — same Barlow Condensed voice as everywhere else on the card
       (not a font swap), just given room to breathe: real line-height
       instead of a cramped 1, a touch of letter-spacing, and a scaled gap
       so the words don't crowd together as --fc-scale climbs on smaller
       fight lists. */
    .fc-next-matchup {
      font-family:'Barlow Condensed',sans-serif; font-weight:800; font-style:italic;
      text-transform:uppercase; color:#fff; line-height:1.12;
      font-size:calc(clamp(1.2rem,4.4vw,1.8rem) * var(--fc-scale));
      letter-spacing:.008em;
      display:flex; align-items:baseline; gap:calc(13px * var(--fc-scale)); flex-wrap:wrap;
    }
    body.fc-light .fc-next-matchup { color:#161514; }
    /* VS — small, quiet, flanked by thin rules (no underline/bold/orange
       fill) instead of shouting at the same volume as the names. */
    .fc-next-matchup .vs {
      display:inline-flex; align-items:center; gap:calc(7px * var(--fc-scale));
      font-size:.46em; font-weight:600; font-style:normal;
      letter-spacing:.2em; text-transform:uppercase;
      color:rgba(255,255,255,.45);
    }
    body.fc-light .fc-next-matchup .vs { color:rgba(0,0,0,.4); }
    .fc-next-matchup .vs::before,
    .fc-next-matchup .vs::after {
      content:''; width:calc(13px * var(--fc-scale)); height:1px;
      background:currentColor; opacity:.6;
    }
    /* Champion mark — a thin gold ring instead of a solid gradient-filled
       circle, which read as a cheap game badge rather than a title mark. */
    .fc-champ-badge {
      display:inline-flex; align-items:center; justify-content:center;
      width:calc(20px * var(--fc-scale)); height:calc(20px * var(--fc-scale));
      border-radius:50%; flex-shrink:0;
      background:transparent;
      border:calc(1.5px * var(--fc-scale)) solid #d9b06e;
      color:#e0bd85; font-family:'Barlow Condensed',sans-serif; font-weight:700; font-style:normal;
      font-size:calc(.7rem * var(--fc-scale));
    }
    .fc-next-weight {
      margin-top:calc(7px * var(--fc-scale));
      font-family:'Barlow Condensed',sans-serif; font-weight:500; font-style:italic;
      font-size:calc(.66rem * var(--fc-scale));
      letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.42);
    }
    body.fc-light .fc-next-weight { color:rgba(0,0,0,.42); }

    .fc-footer {
      padding:12px 24px; text-align:center;
      font-family:'Montserrat',sans-serif; font-weight:800; font-size:.56rem;
      letter-spacing:.2em; text-transform:uppercase; color:rgba(255,255,255,.35);
      border-top:1px solid rgba(255,255,255,.07);
    }
    body.fc-light .fc-footer { color:rgba(0,0,0,.4); border-top-color:rgba(0,0,0,.08); }

    .fc-empty {
      padding:60px 24px; text-align:center;
      font-family:'Inter',sans-serif; color:rgba(255,255,255,.3);
    }

    /* ── EDIT PANEL — lives below the card, never part of the screenshot ── */
    .fc-edit-panel {
      display:none; width:min(94vw, 720px); margin-top:20px;
      background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.1);
      border-radius:8px; padding:18px;
      font-family:'Inter',sans-serif;
    }
    body.fc-light .fc-edit-panel { background:rgba(0,0,0,.02); border-color:rgba(0,0,0,.1); }
    .fc-edit-panel.open { display:block; }
    .fc-edit-title {
      font-family:'Montserrat',sans-serif; font-weight:800; font-size:.7rem;
      letter-spacing:.12em; text-transform:uppercase; color:#ff8a3d;
      margin-bottom:12px;
    }
    .fc-edit-list { display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
    .fc-edit-row {
      display:flex; align-items:center; gap:10px;
      background:rgba(255,255,255,.04); border-radius:6px; padding:8px 12px;
      font-size:.78rem; color:rgba(255,255,255,.85);
    }
    body.fc-light .fc-edit-row { background:rgba(0,0,0,.04); color:rgba(0,0,0,.8); }
    .fc-edit-row-text { flex:1; }
    .fc-edit-remove {
      background:transparent; border:none; color:#e05555; cursor:pointer;
      font-size:.72rem; font-weight:600; padding:4px 8px;
    }
    .fc-add-row {
      display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px;
      position:relative;
    }
    @media(max-width:520px) { .fc-add-row { grid-template-columns:1fr; } }
    .fc-add-row-extra { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
    @media(max-width:520px) { .fc-add-row-extra { grid-template-columns:1fr; } }
    .fc-input {
      background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.14);
      border-radius:6px; padding:9px 12px; color:#fff; font-size:.82rem;
      font-family:'Inter',sans-serif; width:100%;
    }
    body.fc-light .fc-input { background:rgba(0,0,0,.03); border-color:rgba(0,0,0,.14); color:#161514; }
    .fc-autocomplete { position:relative; }
    .fc-autocomplete-list {
      display:none; position:absolute; top:calc(100% + 4px); left:0; right:0;
      max-height:200px; overflow-y:auto; background:#17171a;
      border:1px solid rgba(255,255,255,.14); border-radius:8px; z-index:30;
      box-shadow:0 12px 30px rgba(0,0,0,.5);
    }
    .fc-autocomplete-list.open { display:block; }
    .fc-autocomplete-item {
      padding:9px 12px; font-size:.8rem; color:rgba(255,255,255,.85); cursor:pointer;
    }
    .fc-autocomplete-item:hover { background:rgba(255,138,61,.18); }
    .fc-add-btn {
      background:linear-gradient(165deg, #ffb066 0%, #ff8a3d 45%, #e8691c 100%); border:none; color:#0a0a0a; font-weight:700;
      font-size:.76rem; padding:9px 20px; border-radius:20px; cursor:pointer;
      font-family:'Montserrat',sans-serif; letter-spacing:.04em; text-transform:uppercase;
    }
    .fc-add-btn:disabled { opacity:.4; cursor:not-allowed; }
  </style>
</head>
<body>
  <div class="fc-controls">
    <a class="fc-back" id="fcBack" href="admin.html">&larr; Back</a>
    <div class="fc-right-controls">
      <div class="fc-zoom-group" id="fcZoomGroup" style="display:none">
        <button class="fc-btn fc-zoom-btn" id="fcZoomOut" type="button">&minus;</button>
        <span class="fc-btn fc-zoom-label" id="fcZoomLabel">100%</span>
        <button class="fc-btn fc-zoom-btn" id="fcZoomIn" type="button">&plus;</button>
      </div>
      <button class="fc-btn" id="fcThemeBtn" type="button">🌙 Dark</button>
      <button class="fc-btn" id="fcDownloadBtn" type="button">&#8681; Download</button>
      <button class="fc-btn" id="fcEditBtn" type="button">✎ Edit Fights</button>
    </div>
  </div>

  <div id="fcRoot" class="fc-card"><div class="fc-empty">Loading...</div></div>
  <div class="fc-edit-panel" id="fcEditPanel"></div>

  <script>
  (function(){
    const p = new URLSearchParams(location.search);
    let mode      = p.get('mode') === 'next' ? 'next' : 'card';
    let theme     = p.get('theme') === 'light' ? 'light' : 'dark';
    let eventName = p.get('eventName') || (mode === 'next' ? 'Fights We Want To See' : 'Fight Card');
    let eventSub  = p.get('eventSub') || '';

    function esc(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

    let bouts = [];
    try {
      const raw = p.get('bouts');
      if (raw) bouts = JSON.parse(decodeURIComponent(escape(atob(raw))));
    } catch (e) { bouts = []; }
    bouts.forEach((b, i) => { b._id = i + 1; });
    let boutSeq = bouts.length;

    const root       = document.getElementById('fcRoot');
    const editPanel  = document.getElementById('fcEditPanel');
    const themeBtn   = document.getElementById('fcThemeBtn');
    const editBtn    = document.getElementById('fcEditBtn');
    const zoomGroup  = document.getElementById('fcZoomGroup');
    const zoomLabel  = document.getElementById('fcZoomLabel');
    let editMode = false;

    zoomGroup.style.display = mode === 'next' ? 'flex' : 'none';
    document.getElementById('fcZoomOut').addEventListener('click', () => {
      manualZoom = Math.max(0.6, +(manualZoom - 0.1).toFixed(2));
      applyZoom();
    });
    document.getElementById('fcZoomIn').addEventListener('click', () => {
      manualZoom = Math.min(2, +(manualZoom + 0.1).toFixed(2));
      applyZoom();
    });

    function applyTheme() {
      document.body.classList.toggle('fc-light', theme === 'light');
      themeBtn.textContent = theme === 'light' ? '☀️ Light' : '🌙 Dark';
    }

    function renderCardMode() {
      if (!bouts.length) { root.innerHTML = '<div class="fc-empty">No fights added yet — click Edit Fights to add some.</div>'; return; }
      const sections = [];
      const bySection = new Map();
      bouts.forEach(b => {
        const sec = b.section || 'Fight Card';
        if (!bySection.has(sec)) { bySection.set(sec, []); sections.push(sec); }
        bySection.get(sec).push(b);
      });

      const sectionsHTML = sections.map(sec => `
        <div class="fc-section-bar">${esc(sec)}</div>
        <div class="fc-grid">
          ${bySection.get(sec).map(b => `
            <div class="fc-cell">
              ${b.tag ? `<div class="fc-cell-tag">${esc(b.tag)}</div>` : ''}
              <div class="fc-cell-photos">
                ${b.imgA ? `<div class="fc-thumb" style="background-image:url('${esc(b.imgA)}')"></div>` : '<div class="fc-thumb empty">?</div>'}
                ${b.imgB ? `<div class="fc-thumb" style="background-image:url('${esc(b.imgB)}')"></div>` : '<div class="fc-thumb empty">?</div>'}
              </div>
              <div class="fc-cell-names">
                <div class="fc-cell-fighter">
                  <div class="fc-cell-name">${esc(b.a)}</div>
                </div>
                <div class="fc-cell-vs">VS</div>
                <div class="fc-cell-fighter b">
                  <div class="fc-cell-name b">${esc(b.b)}</div>
                </div>
              </div>
              ${b.weight ? `<div class="fc-cell-weight">${esc(b.weight)}</div>` : ''}
            </div>
          `).join('')}
        </div>
      `).join('');

      root.innerHTML = `
        <div class="fc-header">
          <img class="fc-badge" src="images/mma-bridge-logo.png" alt="MMA Bridge">
          <div class="fc-event-name">${esc(eventName)}</div>
          ${eventSub ? `<div class="fc-event-sub">${esc(eventSub)}</div>` : ''}
        </div>
        ${sectionsHTML}
        <div class="fc-footer">mmabridge.com</div>
      `;
    }

    function renderNextMode() {
      if (!bouts.length) { root.innerHTML = '<div class="fc-empty">No matchups added yet — click Edit Fights to add some.</div>'; return; }
      const rowsHTML = bouts.map(b => `
        <div class="fc-next-row">
          ${b.imgA ? `<div class="fc-next-photo" style="background-image:url('${esc(b.imgA)}')"></div>` : ''}
          <div class="fc-next-body">
            ${b.tag ? `<div class="fc-next-tag">${esc(b.tag)}</div>` : ''}
            <div class="fc-next-matchup">${b.champA ? '<span class="fc-champ-badge">C</span>' : ''}${esc(b.a)} <span class="vs">vs</span> ${b.champB ? '<span class="fc-champ-badge">C</span>' : ''}${esc(b.b)}</div>
            ${b.weight ? `<div class="fc-next-weight">${esc(b.weight)}</div>` : ''}
          </div>
          ${b.imgB ? `<div class="fc-next-photo b-side" style="background-image:url('${esc(b.imgB)}')"></div>` : ''}
        </div>
      `).join('');

      root.innerHTML = `
        <div class="fc-header">
          <img class="fc-badge" src="images/mma-bridge-logo.png" alt="MMA Bridge">
          <div class="fc-event-name">${esc(eventName)}</div>
          ${eventSub ? `<div class="fc-event-sub">${esc(eventSub)}</div>` : ''}
        </div>
        <div class="fc-next-rows">${rowsHTML}</div>
        <div class="fc-footer">mmabridge.com</div>
      `;
    }

    // ── Zoom (next-fight mode only) ──────────────────────────
    // Fewer matchups should render noticeably bigger — a 2-fight list on
    // the same fixed-width card as a 6-fight list used to come out at the
    // exact same small size and just looked lost/zoomed-out. autoScale is
    // recomputed every render from the current bout count; manualZoom is
    // a user-adjustable multiplier on top of it via the +/- buttons.
    let manualZoom = 1;
    function autoScaleForCount(n) {
      if (n <= 2) return 1.6;
      if (n === 3) return 1.35;
      if (n === 4) return 1.15;
      if (n === 5) return 1.05;
      return 1;
    }
    function applyZoom() {
      const scale = mode === 'next' ? autoScaleForCount(bouts.length) * manualZoom : 1;
      root.style.setProperty('--fc-scale', scale);
      zoomLabel.textContent = Math.round(manualZoom * 100) + '%';
    }

    function render() {
      document.title = `${eventName} | MMA Bridge`;
      if (mode === 'next') renderNextMode(); else renderCardMode();
      applyZoom();
      if (editMode) renderEditPanel();
    }

    // ── Fighter search, used only by the edit panel ──
    let fightersCache = null;
    async function loadFighters() {
      if (!fightersCache) {
        try {
          const res = await fetch('data/fighters.json?_=' + Date.now(), { cache:'no-store' });
          fightersCache = await res.json();
        } catch (e) { fightersCache = []; }
      }
      return fightersCache;
    }
    function searchFighters(q) {
      const clean = q.trim().toLowerCase();
      if (!clean || !fightersCache) return [];
      return fightersCache.filter(f => (f.name||'').toLowerCase().includes(clean)).slice(0, 8);
    }

    function wireAutocomplete(inputEl, listEl, onPick) {
      inputEl.addEventListener('input', () => {
        const results = searchFighters(inputEl.value);
        if (!results.length) { listEl.classList.remove('open'); listEl.innerHTML=''; return; }
        listEl.innerHTML = results.map(f => `<div class="fc-autocomplete-item">${esc(f.name)}</div>`).join('');
        listEl.classList.add('open');
        listEl.querySelectorAll('.fc-autocomplete-item').forEach((el,i) => {
          el.addEventListener('click', () => {
            inputEl.value = results[i].name;
            inputEl.dataset.img = results[i].img || '';
            inputEl.dataset.weight = results[i].weightClass || '';
            inputEl.dataset.champ = results[i].ranking === 'Champion' ? '1' : '';
            listEl.classList.remove('open');
            onPick(results[i]);
          });
        });
      });
      inputEl.addEventListener('blur', () => setTimeout(() => listEl.classList.remove('open'), 150));
    }

    function renderEditPanel() {
      const extraFieldsHTML = mode === 'card'
        ? `<input type="text" class="fc-input" id="fcNewWeight" placeholder="Weight class (optional)">
           <select class="fc-input" id="fcNewSection">
             <option value="Main Card">Main Card</option>
             <option value="Co-Main">Co-Main</option>
             <option value="Prelims">Prelims</option>
             <option value="Early Prelims">Early Prelims</option>
           </select>
           <input type="text" class="fc-input" id="fcNewTag" placeholder="Tag (optional, e.g. Rematch)">`
        : `<input type="text" class="fc-input" id="fcNewWeight" placeholder="Weight class (optional)">
           <input type="text" class="fc-input" id="fcNewTag" placeholder="Tag (optional, e.g. Rematch)">`;

      editPanel.innerHTML = `
        <div class="fc-edit-title">Title</div>
        <div class="fc-add-row-extra">
          <input type="text" class="fc-input" id="fcEditEventName" placeholder="Event name (e.g. UFC 331)" value="${esc(eventName)}">
          <input type="text" class="fc-input" id="fcEditEventSub" placeholder="Subtitle (optional, e.g. Sep 8 · Inglewood)" value="${esc(eventSub)}">
        </div>
        <div class="fc-edit-title">${mode === 'card' ? 'Fights on this card' : 'Matchups'} (${bouts.length})</div>
        <div class="fc-edit-list">
          ${bouts.length ? bouts.map(b => `
            <div class="fc-edit-row">
              <div class="fc-edit-row-text">${esc(b.a)} vs ${esc(b.b)}${b.weight ? ' &middot; ' + esc(b.weight) : ''}</div>
              <button class="fc-edit-remove" data-remove="${b._id}" type="button">Remove</button>
            </div>
          `).join('') : `<div style="opacity:.5;font-size:.8rem;">None yet — add one below.</div>`}
        </div>
        <div class="fc-edit-title">Add a fight</div>
        <div class="fc-add-row">
          <div class="fc-autocomplete">
            <input type="text" class="fc-input" id="fcNewA" placeholder="Fighter A" autocomplete="off">
            <div class="fc-autocomplete-list" id="fcNewAList"></div>
          </div>
          <div class="fc-autocomplete">
            <input type="text" class="fc-input" id="fcNewB" placeholder="Fighter B" autocomplete="off">
            <div class="fc-autocomplete-list" id="fcNewBList"></div>
          </div>
        </div>
        <div class="fc-add-row-extra">${extraFieldsHTML}</div>
        <button class="fc-add-btn" id="fcAddBoutBtn" type="button" disabled>+ Add</button>
      `;

      editPanel.querySelectorAll('[data-remove]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = parseInt(btn.dataset.remove, 10);
          bouts = bouts.filter(b => b._id !== id);
          render();
        });
      });

      // Title fields only re-render the poster itself, not the whole edit
      // panel — re-rendering the panel on every keystroke would blow away
      // focus and cursor position mid-type.
      document.getElementById('fcEditEventName').addEventListener('input', e => {
        eventName = e.target.value; document.title = `${eventName} | MMA Bridge`;
        if (mode === 'next') renderNextMode(); else renderCardMode();
      });
      document.getElementById('fcEditEventSub').addEventListener('input', e => {
        eventSub = e.target.value;
        if (mode === 'next') renderNextMode(); else renderCardMode();
      });

      const inputA = document.getElementById('fcNewA');
      const inputB = document.getElementById('fcNewB');
      const listA  = document.getElementById('fcNewAList');
      const listB  = document.getElementById('fcNewBList');
      const addBtn = document.getElementById('fcAddBoutBtn');
      let selA = null, selB = null;

      function checkReady() { addBtn.disabled = !(inputA.value.trim() && inputB.value.trim()); }
      wireAutocomplete(inputA, listA, f => { selA = f; checkReady(); });
      wireAutocomplete(inputB, listB, f => { selB = f; checkReady(); });
      inputA.addEventListener('input', () => { selA = null; checkReady(); });
      inputB.addEventListener('input', () => { selB = null; checkReady(); });

      addBtn.addEventListener('click', () => {
        const nameA = inputA.value.trim(), nameB = inputB.value.trim();
        if (!nameA || !nameB) return;
        const weightEl  = document.getElementById('fcNewWeight');
        const sectionEl = document.getElementById('fcNewSection');
        const tagEl     = document.getElementById('fcNewTag');
        boutSeq++;
        bouts.push({
          _id: boutSeq,
          a: nameA, b: nameB,
          imgA: selA ? (selA.img||'') : (inputA.dataset.img||''),
          imgB: selB ? (selB.img||'') : (inputB.dataset.img||''),
          champA: selA ? (selA.ranking === 'Champion') : !!inputA.dataset.champ,
          champB: selB ? (selB.ranking === 'Champion') : !!inputB.dataset.champ,
          weight: weightEl ? weightEl.value.trim() : '',
          section: sectionEl ? sectionEl.value : undefined,
          tag: tagEl ? tagEl.value.trim() : undefined,
        });
        render();
      });
    }

    themeBtn.addEventListener('click', () => {
      theme = theme === 'light' ? 'dark' : 'light';
      applyTheme();
    });
    editBtn.addEventListener('click', () => {
      editMode = !editMode;
      editBtn.classList.toggle('active', editMode);
      editPanel.classList.toggle('open', editMode);
      if (editMode) { loadFighters().then(renderEditPanel); }
    });

    // ── Download Poster ──────────────────────────────────────
    // Fighter photos come from a CDN with no Access-Control-Allow-Origin
    // header, so drawing them straight into a <canvas> taints it and blocks
    // export. Fix: re-fetch each image through the backend's same-origin
    // proxy first (swapped to a data: URI, which never taints), then
    // rasterize with html2canvas — NOT a hand-rolled SVG-foreignObject +
    // Image() approach: that route was tried first and, even once fully
    // valid (well-formed XML, verified by opening the exact generated SVG
    // directly in a browser tab, where it rendered perfectly), still failed
    // consistently — but ONLY when loaded via new Image() from a page
    // served over http://, not from about:blank. That's a real, narrow
    // browser quirk around SVG-as-<img> decoding that wasn't worth chasing
    // further; html2canvas walks the DOM and paints it with Canvas 2D
    // primitives instead, sidestepping that whole failure category.
    const API_BASE = 'https://mmabridge-backend.onrender.com';
    let _html2canvasPromise = null;
    function loadHtml2Canvas() {
      if (!_html2canvasPromise) {
        _html2canvasPromise = new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
          s.onload = () => resolve(window.html2canvas);
          s.onerror = () => reject(new Error('Could not load html2canvas'));
          document.head.appendChild(s);
        });
      }
      return _html2canvasPromise;
    }
    async function downloadPosterImage(targetEl, filename) {
      const html2canvas = await loadHtml2Canvas();

      // Swap real fighter photos to same-origin data: URIs in place (not on
      // a detached clone — html2canvas renders far more faithfully against
      // an element that's actually laid out in the live page), then restore
      // the originals afterward regardless of outcome.
      // Fighter photos are CSS background-images (not <img src>) — see the
      // .fc-thumb/.fc-next-photo comments for why: html2canvas ignores
      // object-fit on <img> elements and stretches the raw photo into its
      // box, which was squishing/smushing fighters in every downloaded PNG.
      const photoEls = [...targetEl.querySelectorAll('.fc-thumb:not(.empty), .fc-next-photo')];
      const originalBgs = photoEls.map(el => el.style.backgroundImage);
      await Promise.all(photoEls.map(async el => {
        const match = (el.style.backgroundImage || '').match(/url\(["']?(.*?)["']?\)/);
        const src = match && match[1];
        if (!src || src.startsWith('data:')) return;
        try {
          const proxied = `${API_BASE}/api/image-proxy?url=${encodeURIComponent(src)}`;
          // The backend is Render free-tier and sleeps after inactivity —
          // the first request after a while can come back as a cold-start
          // error (502/503) well before the instance is actually warm.
          // A single failed attempt used to just give up silently, leaving
          // the original cross-origin URL in place, which html2canvas then
          // renders as a blank photo (CORS taint) — that's what "photos
          // missing" actually was. Retry a couple times with backoff
          // instead of bailing on the first hiccup.
          let res;
          for (let attempt = 0; attempt < 3; attempt++) {
            try {
              res = await fetch(proxied);
              if (res.ok) break;
            } catch (e) { res = null; }
            if (attempt < 2) await new Promise(r => setTimeout(r, 1500 * (attempt + 1)));
          }
          // fetch() only rejects on network failure, not HTTP error status —
          // a 404 (backend not yet redeployed with this endpoint, which is
          // exactly what happened) resolves "successfully" with an error
          // page body, which then got read as image bytes and written into
          // the background-image as garbage, breaking the photo instead of
          // leaving the original (uncorrupted) url in place.
          if (!res || !res.ok) return;
          const blob = await res.blob();
          const dataUrl = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(blob);
          });
          el.style.backgroundImage = `url("${dataUrl}")`;
        } catch (e) { /* leave the original url — html2canvas will just skip/blank that one image, not fail the whole export */ }
      }));

      try {
        const bg = getComputedStyle(targetEl).backgroundColor;
        const canvas = await html2canvas(targetEl, { backgroundColor: bg, scale: 2, useCORS: true, logging: false });
        await new Promise((resolve, reject) => {
          canvas.toBlob(blob => {
            if (!blob) { reject(new Error('canvas produced no image data')); return; }
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            // target="_blank" defends against theme.js-style global
            // "fade + navigate on internal link click" handlers (confirmed
            // one exists and hijacks this exact click on matchup.html,
            // which loads theme.js and this page doesn't — but cheap
            // insurance either way).
            a.href = url; a.download = filename; a.target = '_blank';
            document.body.appendChild(a); a.click(); a.remove();
            // Revoking synchronously right after click() races the browser
            // actually starting the download — on a heavier page this can
            // lose the race outright (confirmed: reliable here, but failed
            // 100% of the time on matchup.html, which loads far more
            // scripts and has more event-loop contention). Give it a beat.
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            resolve();
          }, 'image/png');
        });
      } finally {
        photoEls.forEach((el, i) => { el.style.backgroundImage = originalBgs[i]; });
      }
    }

    const downloadBtn = document.getElementById('fcDownloadBtn');
    downloadBtn.addEventListener('click', async () => {
      downloadBtn.disabled = true;
      const original = downloadBtn.innerHTML;
      downloadBtn.textContent = 'Preparing...';
      try {
        await downloadPosterImage(document.querySelector('.fc-card'), `${eventName.replace(/[^a-z0-9]+/gi,'-')}.png`);
      } catch (e) {
        downloadBtn.textContent = 'Failed';
        setTimeout(() => { downloadBtn.innerHTML = original; downloadBtn.disabled = false; }, 2000);
        return;
      }
      downloadBtn.innerHTML = original;
      downloadBtn.disabled = false;
    });

    applyTheme();
    render();
  })();
  </script>
</body>
</html>
