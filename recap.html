<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="images/mma-bridge-logo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00e5ff">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <script src="theme.js?v=2.4"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Season Recap — MMA Bridge</title>
  <meta name="description" content="Final standings and season recap for your MMA Bridge group league.">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=6.9" />
  <style>
    .recap-page { max-width: 620px; margin: 0 auto; padding: 64px 20px 100px; }

    .recap-loading { text-align: center; padding: 80px 20px; color: rgba(255,255,255,0.3); font-family:'Inter',sans-serif; font-size:.9rem; }
    .recap-spinner { width:28px;height:28px;border:2.5px solid rgba(255,255,255,.08);border-top-color:#00e5ff;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px; }
    @keyframes spin { to { transform:rotate(360deg); } }

    .recap-eyebrow { font-family:'Montserrat',sans-serif;font-size:.58rem;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:rgba(0,229,255,.7);margin-bottom:10px; }
    .recap-group-name { font-family:'Montserrat',sans-serif;font-weight:900;font-size:clamp(1.8rem,5vw,2.8rem);text-transform:uppercase;letter-spacing:.04em;color:#fff;line-height:1.1;margin:0 0 6px; }
    .recap-group-name span { color:#c8a84b; }
    .recap-period { font-family:'Inter',sans-serif;font-size:.82rem;color:rgba(255,255,255,.35);margin-bottom:36px; }
    .recap-divider { width:40px;height:2px;background:linear-gradient(90deg,#c8a84b,transparent);border-radius:2px;margin-bottom:36px; }

    /* Champion card */
    .recap-champion { padding:28px 24px;background:linear-gradient(135deg,rgba(200,150,12,.12),rgba(200,150,12,.04));border:1.5px solid rgba(200,150,12,.35);border-radius:16px;text-align:center;margin-bottom:28px;position:relative;overflow:hidden; }
    .recap-champion::before { content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#c8a84b,transparent); }
    .recap-ch-crown { font-size:2.2rem;margin-bottom:10px;display:block; }
    .recap-ch-label { font-family:'Montserrat',sans-serif;font-size:.58rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:rgba(200,168,75,.6);margin-bottom:8px; }
    .recap-ch-name { font-family:'Barlow Condensed','Montserrat',sans-serif;font-weight:900;font-size:2rem;letter-spacing:.04em;text-transform:uppercase;color:#fff;margin-bottom:8px; }
    .recap-ch-stats { font-family:'Inter',sans-serif;font-size:.88rem;color:rgba(255,255,255,.55); }
    .recap-ch-stats strong { color:#c8a84b; }

    /* Standings */
    .recap-standings-label { font-family:'Montserrat',sans-serif;font-size:.58rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.25);margin-bottom:14px; }
    .recap-rows { display:flex;flex-direction:column;gap:8px;margin-bottom:32px; }
    .recap-row { display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:10px; }
    .recap-row.recap-row-1 { background:rgba(200,150,12,.07);border-color:rgba(200,150,12,.2); }
    .recap-row.recap-row-2 { background:rgba(200,200,200,.04);border-color:rgba(200,200,200,.12); }
    .recap-row.recap-row-3 { background:rgba(200,120,50,.04);border-color:rgba(200,120,50,.12); }
    .recap-row-rank { font-family:'Montserrat',sans-serif;font-weight:900;font-size:.78rem;min-width:28px;text-align:center; }
    .recap-row-1 .recap-row-rank { color:#c8a84b; }
    .recap-row-2 .recap-row-rank { color:#b0b0b0; }
    .recap-row-3 .recap-row-rank { color:#cd7f32; }
    .recap-row-rank-n { color:rgba(255,255,255,.25); }
    .recap-row-name { font-family:'Inter',sans-serif;font-size:.88rem;color:rgba(255,255,255,.75);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
    .recap-row-score { font-family:'Montserrat',sans-serif;font-size:.78rem;font-weight:700;color:rgba(255,255,255,.45); }
    .recap-row-1 .recap-row-score { color:#c8a84b; }
    .recap-row-pct { font-family:'Montserrat',sans-serif;font-size:.7rem;color:rgba(255,255,255,.25);min-width:42px;text-align:right; }

    /* Event log */
    .recap-events-label { font-family:'Montserrat',sans-serif;font-size:.58rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.25);margin-bottom:14px; }
    .recap-events { display:flex;flex-direction:column;gap:6px;margin-bottom:36px; }
    .recap-ev-row { display:flex;align-items:center;gap:10px;padding:8px 14px;background:rgba(255,255,255,.02);border-radius:8px; }
    .recap-ev-name { font-family:'Inter',sans-serif;font-size:.78rem;color:rgba(255,255,255,.5);flex:1; }
    .recap-ev-winner { font-family:'Montserrat',sans-serif;font-size:.68rem;font-weight:700;color:rgba(200,150,12,.8); }

    /* Share + CTA */
    .recap-actions { display:flex;gap:10px;flex-wrap:wrap; }
    .recap-share-btn { font-family:'Montserrat',sans-serif;font-weight:700;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;padding:11px 20px;border-radius:8px;border:none;cursor:pointer;display:flex;align-items:center;gap:7px;transition:opacity .15s; }
    .recap-share-btn:hover { opacity:.8; }
    .recap-share-btn.primary { background:#c8a84b;color:#040406; }
    .recap-share-btn.secondary { background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.6); }
    .recap-no-group { text-align:center;padding:80px 20px;font-family:'Inter',sans-serif;font-size:.9rem;color:rgba(255,255,255,.3); }
    .recap-no-group a { color:#00e5ff;text-decoration:none; }

    /* light mode */
    body.light-mode .recap-group-name { color:#0a0a0f; }
    body.light-mode .recap-group-name span { color:#7a6000; }
    body.light-mode .recap-eyebrow { color:#006680; }
    body.light-mode .recap-period { color:rgba(0,0,0,.4); }
    body.light-mode .recap-champion { background:rgba(180,130,0,.07);border-color:rgba(180,130,0,.3); }
    body.light-mode .recap-ch-label { color:rgba(120,90,0,.6); }
    body.light-mode .recap-ch-name { color:#0a0a0f; }
    body.light-mode .recap-ch-stats { color:rgba(0,0,0,.5); }
    body.light-mode .recap-row { background:rgba(0,0,0,.02);border-color:rgba(0,0,0,.07); }
    body.light-mode .recap-row-name { color:rgba(0,0,0,.7); }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a class="logo" href="index.html"><img src="images/mma-bridge-logo.png" class="nav-logo-img" alt="MMA Bridge"></a>
      <div id="notifBellMount"></div>
      <ul class="nav-links">
        <li><a href="index.html">Trending</a></li>
        <li><a href="events.html">Upcoming Events</a></li>
        <li><a href="leaderboard.html">Leaderboard</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
      <button class="theme-toggle" id="themeToggle" aria-label="Switch to light mode">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <div class="nav-auth"></div>
      <button class="nav-hamburger" id="nav-hamburger" aria-label="Open menu"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <div class="nav-mobile-overlay" id="nav-mobile-overlay">
    <button class="nav-mobile-close" onclick="document.getElementById('nav-mobile-overlay').classList.remove('open');document.getElementById('nav-hamburger').classList.remove('open');document.body.classList.remove('no-scroll')">✕</button>
    <nav class="nav-mobile-links">
      <a href="index.html">Trending</a>
      <a href="events.html">Upcoming Events</a>
      <a href="leaderboard.html">Leaderboard</a>
      <a href="about.html">About</a>
    </nav>
    <div class="nav-auth-mobile"></div>
  </div>

  <div class="recap-page" id="recapRoot">
    <div class="recap-loading">
      <div class="recap-spinner"></div>
      Loading season recap…
    </div>
  </div>

  <script>
    window.addEventListener('scroll', () => document.querySelector('.navbar').classList.toggle('scrolled', window.scrollY > 10));
    document.getElementById('nav-hamburger')?.addEventListener('click', function() {
      this.classList.toggle('open');
      document.getElementById('nav-mobile-overlay').classList.toggle('open');
      document.body.classList.toggle('no-scroll');
    });

    function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    async function loadRecap() {
      const root = document.getElementById('recapRoot');
      const sb = window._sb;
      const p = new URLSearchParams(location.search);
      let groupCode = p.get('group');

      // If no group code in URL, try to get current user's group
      if (!groupCode && sb) {
        try {
          const { data: { user } } = await sb.auth.getUser();
          if (user) {
            const { data: prof } = await sb.from('profiles').select('group_code').eq('id', user.id).single();
            groupCode = prof?.group_code || null;
          }
        } catch {}
      }

      if (!groupCode || !sb) {
        root.innerHTML = `<div class="recap-no-group">
          No group found. <a href="leaderboard.html">Join or create a group →</a>
        </div>`;
        return;
      }

      try {
        // Load group members
        const { data: members } = await sb.from('profiles')
          .select('id, display_name, group_name, group_season_start')
          .eq('group_code', groupCode);

        if (!members?.length) {
          root.innerHTML = `<div class="recap-no-group">No members found for this group.</div>`;
          return;
        }

        const groupName = members[0]?.group_name || 'Your Group';
        const seasonStart = members[0]?.group_season_start || null;
        const memberIds = members.map(m => m.id);

        // Load all picks
        let picksQuery = sb.from('picks')
          .select('user_id, event_id, fight_key, is_correct, created_at')
          .in('user_id', memberIds)
          .neq('fight_key', 'fotn')
          .neq('fight_key', '__dd__');
        if (seasonStart) picksQuery = picksQuery.gte('created_at', seasonStart);
        const { data: allPicks } = await picksQuery;

        // Score each member
        const scoreMap = {};
        members.forEach(m => { scoreMap[m.id] = { name: m.display_name || 'User', correct: 0, judged: 0, events: new Set() }; });
        (allPicks || []).forEach(p => {
          if (!scoreMap[p.user_id]) return;
          if (p.is_correct !== null && p.is_correct !== undefined) {
            scoreMap[p.user_id].judged++;
            if (p.is_correct) scoreMap[p.user_id].correct++;
          }
          if (p.event_id) scoreMap[p.user_id].events.add(p.event_id);
        });

        const ranked = Object.entries(scoreMap)
          .map(([id, d]) => ({ id, ...d, pct: d.judged >= 3 ? Math.round(100 * d.correct / d.judged) : null }))
          .sort((a, b) => (b.correct - a.correct) || ((b.pct||0) - (a.pct||0)));

        const champion = ranked[0];
        const medals = ['🥇','🥈','🥉'];
        const rankCls = ['recap-row-1','recap-row-2','recap-row-3'];

        // Load events for the log
        const eventsRes = await fetch('data/events.json?v=' + Date.now()).catch(() => fetch('events.json'));
        const eventsData = eventsRes.ok ? await eventsRes.json() : [];
        const completedEvents = eventsData.filter(e => e.status === 'completed').sort((a,b) => new Date(b.isoDate) - new Date(a.isoDate)).slice(0, 8);

        // Per-event winner
        const eventWinnerRows = completedEvents.map(ev => {
          const evScores = {};
          members.forEach(m => { evScores[m.id] = { name: m.display_name || 'User', correct: 0, judged: 0 }; });
          (allPicks || []).filter(p => p.event_id === ev.id).forEach(p => {
            if (!evScores[p.user_id]) return;
            if (p.is_correct !== null && p.is_correct !== undefined) {
              evScores[p.user_id].judged++;
              if (p.is_correct) evScores[p.user_id].correct++;
            }
          });
          const best = Object.values(evScores).filter(s => s.judged > 0).sort((a,b) => b.correct - a.correct)[0];
          if (!best) return '';
          return `<div class="recap-ev-row">
            <div class="recap-ev-name">${esc(ev.name)}</div>
            <div class="recap-ev-winner">🏆 ${esc(best.name)} ${best.correct}/${best.judged}</div>
          </div>`;
        }).filter(Boolean).join('');

        const seasonPeriod = seasonStart
          ? `Season from ${new Date(seasonStart).toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}`
          : 'All-time standings';

        const champStats = champion.judged >= 3
          ? `<strong>${champion.correct}/${champion.judged}</strong> picks correct · <strong>${champion.pct}%</strong> accuracy`
          : `${champion.correct} picks correct`;

        const standingsRows = ranked.map((u, i) => `
          <div class="recap-row ${rankCls[i]||''}">
            <div class="recap-row-rank ${i >= 3 ? 'recap-row-rank-n' : ''}">${medals[i] || (i + 1)}</div>
            <div class="recap-row-name">${esc(u.name)}</div>
            <div class="recap-row-score">${u.correct}/${u.judged}</div>
            <div class="recap-row-pct">${u.pct !== null ? u.pct + '%' : '—'}</div>
          </div>`).join('');

        // Share URL for this group
        const shareUrl = `${location.origin}/recap.html?group=${encodeURIComponent(groupCode)}`;
        const shareText = `${groupName} Season Recap 🏆\nChampion: ${champion.name}\n${champStats}\n${shareUrl}`;

        root.innerHTML = `
          <div class="recap-eyebrow">Season Recap</div>
          <div class="recap-group-name">${esc(groupName)} <span>Season</span></div>
          <div class="recap-period">${esc(seasonPeriod)}</div>
          <div class="recap-divider"></div>

          <div class="recap-champion">
            <span class="recap-ch-crown">👑</span>
            <div class="recap-ch-label">Season Champion</div>
            <div class="recap-ch-name">${esc(champion.name)}</div>
            <div class="recap-ch-stats">${champStats}</div>
          </div>

          <div class="recap-standings-label">Final Standings</div>
          <div class="recap-rows">${standingsRows}</div>

          ${completedEvents.length ? `
          <div class="recap-events-label">Event Winners</div>
          <div class="recap-events">${eventWinnerRows}</div>` : ''}

          <div class="recap-actions">
            <button class="recap-share-btn primary" id="recapShareBtn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
              Share Recap
            </button>
            <a href="leaderboard.html" class="recap-share-btn secondary">View Live Standings</a>
          </div>`;

        document.getElementById('recapShareBtn')?.addEventListener('click', async () => {
          if (navigator.share) {
            navigator.share({ title: `${groupName} Season Recap`, text: shareText, url: shareUrl }).catch(() => copyToClipboard(shareUrl));
          } else {
            copyToClipboard(shareUrl);
          }
        });

        // Update URL with group code for sharing
        if (!p.get('group')) history.replaceState(null, '', `recap.html?group=${encodeURIComponent(groupCode)}`);
      } catch(e) {
        root.innerHTML = `<div class="recap-no-group">Could not load recap. <a href="leaderboard.html">Back to leaderboard →</a></div>`;
      }
    }

    function copyToClipboard(text) {
      navigator.clipboard?.writeText(text).then(() => alert('Link copied!')).catch(() => {
        const el = document.createElement('textarea');
        el.value = text; document.body.appendChild(el);
        el.select(); document.execCommand('copy');
        el.remove(); alert('Link copied!');
      });
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="auth.js?v=3.2"></script>
  <script src="search.js"></script>
  <script src="premium.js?v=3.3"></script>
  <script src="widget.js"></script>
  <script src="notifications.js?v=2.1"></script>
  <script>
    // Wait for Supabase to initialize then load
    setTimeout(loadRecap, 600);
  </script>
</body>
</html>
