    .rc-page { max-width: 640px; margin: 0 auto; padding: 64px 20px 100px; }

    .rc-eyebrow { font-family:'Montserrat',sans-serif;font-size:.72rem;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:rgba(242, 96, 15,.6);margin-bottom:10px; }

    /* Podium */
    /* Reveal sequence */
    .rc-reveal-btn {
      display:block;width:100%;margin-bottom:32px;padding:22px 24px;cursor:pointer;
      background:rgba(242, 96, 15,.1);border:1px solid rgba(242, 96, 15,.35);border-radius:16px;

    .rc-reveal-btn:hover { background:rgba(242, 96, 15,.16);border-color:rgba(242, 96, 15,.55); }
    .rc-reveal-btn:disabled { opacity:.5;cursor:default; }
    .rc-calc { text-align:center;padding:40px 20px;margin-bottom:32px; }
    .rc-calc-pulse {
      width:44px;height:44px;margin:0 auto 16px;border-radius:50%;
      background:rgba(242, 96, 15,.15);border:2px solid rgba(242, 96, 15,.4);
      animation:rc-calc-pulse 1s ease-in-out infinite;
    }
    @keyframes rc-calc-pulse { 0%,100% { transform:scale(1);opacity:1; } 50% { transform:scale(1.25);opacity:.5; } }
    .rc-calc-text { font-family:'Montserrat',sans-serif;font-weight:800;font-size:.9rem;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.5); }

  <script>
  (async () => {
    const root = document.getElementById('rcRoot');
    const sb   = window._sb;
    const esc  = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

    function showErr(msg) { root.innerHTML = `<div class="rc-nogroup">${msg}</div>`; }

    if (!sb) { showErr('Could not connect — try refreshing.'); return; }

    // Wait for auth to initialize
    function waitForAuth(ms = 5000) {
      return new Promise(res => {
        const t0 = Date.now();
        const tick = () => {
          const u = window.MMABridgeAuth?.getUser?.();
          if (u || Date.now() - t0 > ms) res(u || null);
          else setTimeout(tick, 80);
        };
        tick();
      });
    }

    const params    = new URLSearchParams(location.search);
    let groupCode   = params.get('group') || null;

    if (!groupCode) {
      const user = await waitForAuth(5000);
      if (user) {
        const { data: prof } = await sb.from('profiles').select('group_code').eq('id', user.id).single();
        groupCode = prof?.group_code || null;
        if (groupCode) {
          const u = new URL(location.href);
          u.searchParams.set('group', groupCode);
          history.replaceState(null, '', u);
        }
      }
    }

    if (!groupCode) {
      showErr('No group found. <a href="leaderboard.html">Join or create a group on the Leaderboard.</a>');
      return;
    }

    // ── Scoring helpers (identical to leaderboard.js) ──
    const POINTS = { WINNER: 10, METHOD: 5, ROUND: 5, FOTN: 15 };

    const getTier = window.MMATiers.getTier;

    function normalizeMethodBase(m) {
      if (!m) return '';
      const u = m.toUpperCase();
      if (u.includes('KO') || u.includes('TKO')) return 'KO/TKO';
      if (u.includes('SUB') || u.includes('CHOKE') || u.includes('RNC') || u.includes('TRIANGLE') ||
          u.includes('ARMBAR') || u.includes('GUILLOTINE') || u.includes('KIMURA') || u.includes('REAR NAKED')) return 'SUB';
      if (u.includes('DECISION') || ['DEC','UD','SD','MD'].includes(u) ||
          u.endsWith(' UD') || u.endsWith(' SD') || u.endsWith(' MD')) return 'DEC';
      return '';
    }

    function extractRoundNum(m) {
      const match = String(m||'').match(/R\s*(\d)/i);
      return match ? match[1] : '';
    }

    // ── Load events.json for winner/method/FOTN lookups ──
    const allEventsRaw = await fetch('./events.json', { cache: 'no-cache' }).then(r => r.json()).catch(() => []);
    const winnerMap = {}, methodMap = {}, fotnMap = {};
    allEventsRaw.filter(e => e.status === 'completed').forEach(ev => {
      [...(ev.mainCard||[]).map((f,i)=>({f,key:`main-${i}`})),
       ...(ev.prelims||[]).map((f,i)=>({f,key:`prelims-${i}`})),
       ...(ev.earlyPrelims||[]).map((f,i)=>({f,key:`early-${i}`}))
      ].forEach(({f,key}) => {
        if (f.winner) winnerMap[`${ev.id}:${key}`] = f.winner.toLowerCase();
        if (f.method) methodMap[`${ev.id}:${key}`] = f.method;
      });
      if (ev.fotn) fotnMap[ev.id] = ev.fotn.toLowerCase();
    });
    try {
      const { data: dbRes } = await sb.from('fight_results').select('event_id, fight_key, winner, method, fotn');
      (dbRes||[]).forEach(r => {
        const k = `${r.event_id}:${r.fight_key}`;
        if (r.winner) winnerMap[k] = r.winner.toLowerCase();
        if (r.method) methodMap[k] = r.method;
        if (r.fight_key === '__fotn__' && r.fotn) fotnMap[r.event_id] = r.fotn.toLowerCase();
      });
    } catch {}

    // ── Load group members ──
    const { data: members } = await sb.from('profiles')
      .select('id, display_name, avatar_url, group_name, group_season_start, group_season_end')
      .eq('group_code', groupCode);

    if (!members?.length) { showErr('Group not found or has no members.'); return; }

    const groupName   = members[0].group_name || 'Our Group';
    const seasonStart = members[0].group_season_start || null;
    // Bare "YYYY-MM-DD" parses as UTC midnight — push to the last instant
    // of that day so the end date itself is fully included, not excluded.
    const seasonEnd   = members[0].group_season_end
      ? new Date(new Date(members[0].group_season_end).getTime() + 86400000 - 1).toISOString()
      : null;
    const memberIds   = members.map(m => m.id);
    const memberMap   = Object.fromEntries(members.map(m => [m.id, m]));

    // ── Load all picks ──
    const { data: picks } = await sb.from('picks')
      .select('user_id, event_id, fight_key, pick, method, created_at')
      .in('user_id', memberIds);

    if (!picks) { showErr('Could not load picks data.'); return; }

    // ── Build stats (same logic as leaderboard.js buildStatsMap) ──
    const ddMap = {};
    picks.forEach(r => {
      if (r.fight_key === '__dd__' && r.user_id && r.pick) ddMap[`${r.user_id}:${r.event_id}`] = r.pick;
    });

    const statsMap = {};
    memberIds.forEach(id => { statsMap[id] = { total:0, judged:0, correct:0, points:0 }; });

    picks.forEach(r => {
      if (!r.user_id || !statsMap[r.user_id]) return;
      if (r.fight_key === '__dd__') return;
      if (seasonStart && r.created_at && r.created_at < seasonStart) return;
      if (seasonEnd && r.created_at && r.created_at > seasonEnd) return;

      if (r.fight_key === 'fotn') {
        const actual = fotnMap[r.event_id];
        if (actual && r.pick?.toLowerCase() === actual) statsMap[r.user_id].points += POINTS.FOTN;
        return;
      }

      statsMap[r.user_id].total++;
      const wKey   = `${r.event_id}:${r.fight_key}`;
      const winner = winnerMap[wKey];
      if (winner === undefined) return;
      statsMap[r.user_id].judged++;
      const isDD      = ddMap[`${r.user_id}:${r.event_id}`] === r.fight_key;
      const isCorrect = r.pick?.toLowerCase() === winner;
      if (!isCorrect) { if (isDD) statsMap[r.user_id].points -= 10; return; }
      statsMap[r.user_id].correct++;
      let pts = POINTS.WINNER;
      const actualMethod = methodMap[wKey];
      if (r.method && actualMethod) {
        const pb = normalizeMethodBase(r.method), ab = normalizeMethodBase(actualMethod);
        if (pb && ab && pb === ab) {
          pts += POINTS.METHOD;
          if (pb === 'KO/TKO' || pb === 'SUB') {
            const pr = extractRoundNum(r.method), ar = extractRoundNum(actualMethod);
            if (pr && ar && pr === ar) pts += POINTS.ROUND;
          }
        }
      }
      if (isDD) pts *= 2;
      statsMap[r.user_id].points += pts;
    });

    // ── Rank members ──
    const ranked = memberIds.map(id => {
      const s   = statsMap[id];
      const pct = s.judged > 0 ? Math.round((s.correct / s.judged) * 100) : null;
      const tier = getTier(s.judged, pct);
      const m    = memberMap[id];
      return { id, name: m.display_name || 'Anonymous', avatar: m.avatar_url || '', ...s, pct, tier };
    }).sort((a, b) => {
      if (b.points !== a.points) return b.points - a.points;
      if (a.pct !== null && b.pct !== null) return b.pct - a.pct;
      if (a.pct !== null) return -1;
      if (b.pct !== null) return 1;
      return b.total - a.total;
    });

    // ── Per-event winner ──
    const completedEvs = allEventsRaw
      .filter(e => e.status === 'completed' && e.isoDate)
      .sort((a, b) => new Date(b.isoDate) - new Date(a.isoDate))
      .slice(0, 10);

    const eventWinners = completedEvs.map(ev => {
      const evPicks = picks.filter(p => p.event_id === ev.id && p.fight_key !== '__dd__' && p.fight_key !== 'fotn');
      if (!evPicks.length) return null;
      const evMap = {};
      memberIds.forEach(id => { evMap[id] = { correct:0, judged:0 }; });
      evPicks.forEach(p => {
        if (!evMap[p.user_id]) return;
        const w = winnerMap[`${ev.id}:${p.fight_key}`];
        if (w === undefined) return;
        evMap[p.user_id].judged++;
        if (p.pick?.toLowerCase() === w) evMap[p.user_id].correct++;
      });
      const best = Object.entries(evMap)
        .filter(([,s]) => s.judged > 0)
        .sort(([,a],[,b]) => b.correct !== a.correct ? b.correct - a.correct : b.judged - a.judged)[0];
      if (!best) return null;
      const [uid, s] = best;
      return { name: ev.name || ev.id, winner: memberMap[uid]?.display_name || '?', correct: s.correct, judged: s.judged };
    }).filter(Boolean);

    // ── Current user for "you" highlighting ──
    const myUser = window.MMABridgeAuth?.getUser?.();
    const myId   = myUser?.id || null;

    // ── Helpers ──
    function fmtDate(iso) {
      if (!iso) return '';
      return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function initials(name) {
      return (name||'?').trim().split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
    }

    function avatarHtml(u, size=58) {
      const ini  = initials(u.name);
      const fsz  = Math.round(size * 0.36);
      const inner = `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:${fsz}px">${esc(ini)}</div>`;
      if (u.avatar) {
        return `<img src="${esc(u.avatar)}" alt="${esc(u.name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">${inner.replace('display:flex','display:none').replace('none').replace('display:none','display:none').replace('display:flex','display:none')}${inner}`;
      }
      return inner;
    }

    // ── Build HTML ──
    const champ  = ranked[0];
    const second = ranked[1];
    const third  = ranked[2];
    const seasonLabel = (seasonStart || members[0].group_season_end)
      ? `Season ${seasonStart ? 'from ' + fmtDate(seasonStart) : ''}${seasonStart && members[0].group_season_end ? ' ' : ''}${members[0].group_season_end ? 'through ' + fmtDate(members[0].group_season_end) : ''}`
      : 'All-time standings';

    function champHtml() {
      if (!champ) return '';
      const ini = initials(champ.name);
      const avatarInner = champ.avatar
        ? `<img src="${esc(champ.avatar)}" alt="${esc(champ.name)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%" onerror="this.style.display='none'">`
        : `<span>${esc(ini)}</span>`;
      return `
        <div class="rc-champion">
          <div class="rc-ch-label">Season Champion</div>
          <div class="rc-ch-body">
            <div class="rc-ch-avatar">${avatarInner}</div>
            <div>
              <div class="rc-ch-name">${esc(champ.name)}</div>
              <div class="rc-ch-stats">
                <div class="rc-ch-stat">
                  <div class="rc-ch-stat-val">${champ.points}</div>
                  <div class="rc-ch-stat-lbl">total pts</div>
                </div>
                <div class="rc-ch-stat">
                  <div class="rc-ch-stat-val">${champ.pct !== null ? champ.pct + '%' : '—'}</div>
                  <div class="rc-ch-stat-lbl">accuracy</div>
                </div>
                <div class="rc-ch-stat">
                  <div class="rc-ch-stat-val">${champ.correct}/${champ.judged}</div>
                  <div class="rc-ch-stat-lbl">correct</div>
                </div>
              </div>
              <div class="rc-ch-tier" style="color:${champ.tier.color};border-color:${champ.tier.color}44">${champ.tier.name}</div>
            </div>
          </div>
        </div>`;
    }

    function podHtml(u, rankLabel) {
      if (!u) return '';
      return `
        <div class="rc-pod">
          <div class="rc-pod-rank">${esc(rankLabel)}</div>
          <div class="rc-pod-name">${esc(u.name)}</div>
          <div class="rc-pod-stats">
            <div><div class="rc-pod-stat-val">${u.points}</div><div class="rc-pod-stat-lbl">pts</div></div>
            <div><div class="rc-pod-stat-val">${u.pct !== null ? u.pct + '%' : '—'}</div><div class="rc-pod-stat-lbl">accuracy</div></div>
            <div><div class="rc-pod-stat-val">${u.correct}/${u.judged}</div><div class="rc-pod-stat-lbl">correct</div></div>
          </div>
        </div>`;
    }

    const standingsHtml = ranked.map((u, i) => {
      const rank = i + 1;
      const rankCls = rank <= 3 ? ` rc-rank-${rank}` : '';
      const isMe = u.id === myId;
      return `
        <div class="rc-row${isMe ? ' rc-row-me' : ''}">
          <div class="rc-rank${rankCls}">${rank}</div>
          <div class="rc-row-name">${esc(u.name)}${isMe ? ' <span style="font-size:.5rem;opacity:.6">(you)</span>' : ''}</div>
          <div class="rc-row-pts">${u.points}<span style="font-size:.6rem;opacity:.45"> pts</span></div>
          <div class="rc-row-acc">${u.pct !== null ? u.pct + '%' : '—'}</div>
        </div>`;
    }).join('');

    const eventsHtml = eventWinners.length ? `
      <div class="rc-section-lbl">Event Winners</div>
      <div class="rc-events">
        ${eventWinners.map(e => `
          <div class="rc-ev-row">
            <div class="rc-ev-name">${esc(e.name)}</div>
            <div class="rc-ev-winner">${esc(e.winner.split(' ')[0])}</div>
            <div class="rc-ev-score">${e.correct}/${e.judged}</div>
          </div>`).join('')}
      </div>` : '';

    root.innerHTML = `
      <a href="leaderboard.html" class="cx-back">← Leaderboard</a>
      <div class="rc-eyebrow">Season Recap</div>
      <h1 class="rc-title">${esc(groupName)} <span>Season</span></h1>
      <div class="rc-period">${esc(seasonLabel)} · ${ranked.length} member${ranked.length !== 1 ? 's' : ''}</div>
      <div class="rc-divider"></div>

      <div id="rcRevealZone">
        ${champ ? `<button class="rc-reveal-btn" id="rcRevealBtn" type="button">🏆 Reveal Results</button>` : ''}
      </div>

      <div id="rcCalc" class="rc-calc" style="display:none">
        <div class="rc-calc-pulse"></div>
        <div class="rc-calc-text">Calculating standings…</div>
      </div>

      <div id="rcPodiumStage" style="display:none">
        <div class="rc-podium">
          <div class="rc-pod-slot" id="rcPod2"></div>
          <div class="rc-pod-slot" id="rcPod3"></div>
        </div>
        <div id="rcDrumroll" class="rc-drumroll" style="display:none">
          <div class="rc-drumroll-text">Revealing the champion…</div>
        </div>
        <div id="rcChampSlot"></div>
      </div>

      <div id="rcSeeRankZone" style="display:none;text-align:center;margin-bottom:12px">
        <button class="rc-seerank-btn" id="rcSeeRankBtn" type="button">See Full Rankings ↓</button>
      </div>

      <div id="rcStandingsWrap" style="display:none">
        <div class="rc-section-lbl">Full Standings</div>
        <div class="rc-rows">${standingsHtml}</div>
      </div>

      ${eventsHtml}

      <div class="rc-actions">
        <button class="rc-share-btn" id="rcShareBtn" type="button">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          Share Recap
        </button>
        <a class="rc-lb-link" href="leaderboard.html">View Leaderboard</a>
      </div>`;

    // ── Podium reveal sequence ──────────────────────────
    document.getElementById('rcRevealBtn')?.addEventListener('click', function () {
      const btn = this;
      btn.disabled = true;
      document.getElementById('rcCalc').style.display = '';
      btn.closest('#rcRevealZone').style.display = 'none';

      setTimeout(() => {
        document.getElementById('rcCalc').style.display = 'none';
        document.getElementById('rcPodiumStage').style.display = '';

        const pod2 = document.getElementById('rcPod2');
        const pod3 = document.getElementById('rcPod3');
        pod3.innerHTML = podHtml(third, '3rd Place');
        pod3.classList.add('rc-pod-enter');

        setTimeout(() => {
          pod2.innerHTML = podHtml(second, '2nd Place');
          pod2.classList.add('rc-pod-enter');

          setTimeout(() => {
            const drum = document.getElementById('rcDrumroll');
            drum.style.display = '';

            setTimeout(() => {
              drum.style.display = 'none';
              const champSlot = document.getElementById('rcChampSlot');
              champSlot.innerHTML = champHtml();
              champSlot.classList.add('rc-champ-enter');
              if (typeof confetti === 'function') {
                confetti({ particleCount: 140, spread: 90, origin: { y: 0.5 },
                  colors: ['#f2600f', '#ffd700', '#ffffff', '#c24a08'], disableForReducedMotion: true });
              }

              setTimeout(() => {
                document.getElementById('rcSeeRankZone').style.display = '';
              }, 700);
            }, 1200);
          }, 900);
        }, 900);
      }, 1400);
    });

    document.getElementById('rcSeeRankBtn')?.addEventListener('click', function () {
      const wrap = document.getElementById('rcStandingsWrap');
      wrap.style.display = '';
      this.closest('#rcSeeRankZone').style.display = 'none';
      wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    document.getElementById('rcShareBtn').addEventListener('click', () => {
      const url  = `https://mmabridge.com/recap.html?group=${encodeURIComponent(groupCode)}`;
      const text = `${groupName} — Season Recap on MMA Bridge\n${url}`;
      if (navigator.share) {
        navigator.share({ title: `${groupName} Season Recap`, text, url }).catch(() => copyUrl(url));
      } else {
        copyUrl(url);
      }
    });

    function copyUrl(url) {
      navigator.clipboard?.writeText(url).then(() => {
        const btn = document.getElementById('rcShareBtn');
        if (btn) {
          const orig = btn.innerHTML;
          btn.textContent = 'Link copied!';
          setTimeout(() => { btn.innerHTML = orig; }, 2000);
        }
      }).catch(() => { window.prompt('Copy this link:', url); });
    }

  })();
  </script>
  <script src="social-follow.js?v=1.0"></script>
  <script src="site-nudges.js?v=1.0"></script>
</body>
</html>
