<!DOCTYPE html>
<html lang="en">
<head>
  <script src="theme.js"></script>
  <link rel="icon" href="/favicon.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MMA Bridge | Upcoming Events</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />

  <style>
    /* ── BASE ── */
    body {
      background: #060608;
      background-image:
        radial-gradient(ellipse 80% 40% at 15% -5%, rgba(0,229,255,0.04) 0%, transparent 60%),
        radial-gradient(ellipse 60% 35% at 85% 105%, rgba(200,168,75,0.04) 0%, transparent 55%);
    }

    /* ── KEYFRAMES ── */
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes heroIn {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes shimmerSlide {
      0%   { background-position: -300% center; }
      100% { background-position: 300% center; }
    }
    @keyframes pulseCyan {
      0%, 100% { opacity: 1; text-shadow: 0 0 8px rgba(0,229,255,0.6); }
      50%       { opacity: 0.6; text-shadow: none; }
    }
    @keyframes pulseGold {
      0%, 100% { opacity: 1; text-shadow: 0 0 8px rgba(200,168,75,0.7); }
      50%       { opacity: 0.6; text-shadow: none; }
    }
    @keyframes barGrow {
      from { transform: scaleY(0); }
      to   { transform: scaleY(1); }
    }
    @keyframes sectionIn {
      from { opacity: 0; transform: translateX(-10px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    /* ── PAGE ── */
    .ev-page {
      max-width: 960px;
      margin: 0 auto;
      padding: 56px 32px 120px;
    }

    /* ── HERO ── */
    .ev-hero {
      text-align: center;
      margin-bottom: 64px;
      animation: heroIn 0.5s ease both;
    }
    .ev-hero h1 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: clamp(2.2rem, 5.5vw, 3.8rem);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #fff;
      margin: 0 0 10px;
    }
    .ev-hero h1 span {
      background: linear-gradient(120deg, #00e5ff 0%, #80ffea 40%, #00b8d4 70%, #00e5ff 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmerSlide 4s linear infinite;
    }
    .ev-hero p {
      font-family: 'Inter', sans-serif;
      font-size: 0.82rem;
      color: rgba(255,255,255,0.2);
      margin: 0;
      letter-spacing: 0.04em;
    }
    .ev-hero-divider {
      width: 48px;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(0,229,255,0.4), transparent);
      margin: 12px auto 0;
      border-radius: 2px;
    }

    /* ── SECTION HEADER ── */
    .ev-section {
      margin-bottom: 52px;
      animation: sectionIn 0.4s 0.15s ease both;
    }
    .ev-section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .ev-section-accent {
      width: 3px; height: 16px;
      border-radius: 2px; flex-shrink: 0;
    }
    .ev-section-accent.ppv { background: linear-gradient(to bottom, #c8a84b, rgba(200,168,75,0.3)); }
    .ev-section-accent.fn  { background: linear-gradient(to bottom, #00e5ff, rgba(0,229,255,0.3)); }
    .ev-section-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 0.66rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
    }
    .ev-section-count {
      font-family: 'Inter', sans-serif;
      font-size: 0.66rem;
      color: rgba(255,255,255,0.15);
      margin-left: auto;
      background: rgba(255,255,255,0.04);
      padding: 2px 9px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.06);
    }

    /* ── EVENT LABEL ── */
    .duel-event-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 22px 14px 26px;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.02);
      transition: background 0.25s ease;
    }
    .duel-card.ppv .duel-event-label {
      background: rgba(200,168,75,0.05);
      border-bottom-color: rgba(200,168,75,0.12);
    }
    .duel-card.fn  .duel-event-label {
      background: rgba(0,229,255,0.025);
      border-bottom-color: rgba(0,229,255,0.08);
    }
    .duel-card:hover .duel-event-label { background: rgba(255,255,255,0.035); }
    .duel-card.ppv:hover .duel-event-label { background: rgba(200,168,75,0.08); }
    .duel-card.fn:hover  .duel-event-label { background: rgba(0,229,255,0.04); }

    .duel-event-label-text {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 1.55rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fff;
      line-height: 1;
    }
    .duel-card.ppv .duel-event-label-text { color: #c8a84b; }
    .duel-card.fn  .duel-event-label-text { color: #fff; }

    .duel-event-label-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
    }
    .duel-event-label-venue {
      font-family: 'Inter', sans-serif;
      font-size: 0.76rem;
      font-weight: 500;
      color: rgba(255,255,255,0.45);
      text-align: right;
    }
    .duel-event-label-days {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.45);
    }
    .duel-event-label-days.soon {
      color: #00e5ff;
      font-weight: 700;
      animation: pulseCyan 2.2s ease infinite;
    }
    .duel-event-label-days.today {
      color: #c8a84b;
      font-weight: 700;
      animation: pulseGold 2s ease infinite;
    }

    /* ── DUEL CARDS LIST ── */
    .duel-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── DUEL CARD ── */
    .duel-card {
      position: relative;
      background: #0c0c0f;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.3s ease, transform 0.3s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s ease;
      animation: cardIn 0.45s ease both;
    }

    /* Staggered entrance */
    .duel-list .duel-card:nth-child(1)  { animation-delay: 0.06s; }
    .duel-list .duel-card:nth-child(2)  { animation-delay: 0.12s; }
    .duel-list .duel-card:nth-child(3)  { animation-delay: 0.18s; }
    .duel-list .duel-card:nth-child(4)  { animation-delay: 0.24s; }
    .duel-list .duel-card:nth-child(5)  { animation-delay: 0.30s; }
    .duel-list .duel-card:nth-child(6)  { animation-delay: 0.36s; }
    .duel-list .duel-card:nth-child(7)  { animation-delay: 0.40s; }
    .duel-list .duel-card:nth-child(8)  { animation-delay: 0.44s; }
    .duel-list .duel-card:nth-child(n+9) { animation-delay: 0.48s; }

    .duel-card:hover {
      transform: translateX(6px) translateY(-1px);
    }
    .duel-card.fn:hover {
      border-color: rgba(0,229,255,0.22);
      box-shadow:
        -6px 0 0 rgba(0,229,255,0.12),
        0 8px 48px rgba(0,0,0,0.6),
        0 0 0 1px rgba(0,229,255,0.04);
    }
    .duel-card.ppv:hover {
      border-color: rgba(200,168,75,0.28);
      box-shadow:
        -6px 0 0 rgba(200,168,75,0.15),
        0 8px 48px rgba(0,0,0,0.6),
        0 0 0 1px rgba(200,168,75,0.06);
    }

    /* Left accent bar */
    .duel-bar {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      transform-origin: top;
      animation: barGrow 0.5s 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    .duel-card.fn  .duel-bar {
      background: linear-gradient(to bottom, #00e5ff 0%, rgba(0,229,255,0.4) 50%, transparent 100%);
    }
    .duel-card.ppv .duel-bar {
      background: linear-gradient(to bottom, #c8a84b 0%, rgba(200,168,75,0.4) 50%, transparent 100%);
    }

    /* Title fight animated shimmer top border */
    .duel-card.title-fight::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg,
        transparent 0%,
        #8a6a10 10%,
        #c8a84b 30%,
        #fff8c0 50%,
        #c8a84b 70%,
        #8a6a10 90%,
        transparent 100%);
      background-size: 300% auto;
      animation: shimmerSlide 3s linear infinite;
      z-index: 1;
    }

    /* ── MAIN MATCHUP ROW ── */
    .duel-main {
      display: flex;
      align-items: stretch;
      padding-left: 3px;
    }

    .duel-fighter {
      flex: 1;
      padding: 22px 22px 16px;
      min-width: 0;
    }
    .duel-fighter.right { text-align: right; }

    .duel-fname {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: #fff;
      line-height: 1.05;
      margin-bottom: 6px;
      transition: color 0.2s ease;
    }
    .duel-card.ppv .duel-fname { font-size: 1.7rem; }
    .duel-card.fn:hover  .duel-fname { color: rgba(255,255,255,0.95); }
    .duel-card.ppv:hover .duel-fname { color: rgba(255,248,200,0.97); }

    .duel-record {
      font-family: 'Inter', sans-serif;
      font-size: 0.71rem;
      color: rgba(255,255,255,0.22);
      letter-spacing: 0.04em;
    }

    /* Center divider */
    .duel-center {
      flex-shrink: 0;
      width: 82px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 0;
      border-left: 1px solid rgba(255,255,255,0.04);
      border-right: 1px solid rgba(255,255,255,0.04);
      background: rgba(255,255,255,0.012);
      gap: 6px;
      transition: background 0.25s ease;
    }
    .duel-card:hover .duel-center {
      background: rgba(255,255,255,0.02);
    }

    .duel-vs {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 0.62rem;
      letter-spacing: 0.22em;
      color: rgba(255,255,255,0.1);
      transition: color 0.25s ease, text-shadow 0.25s ease;
    }
    .duel-card.fn:hover  .duel-vs {
      color: rgba(0,229,255,0.35);
      text-shadow: 0 0 12px rgba(0,229,255,0.3);
    }
    .duel-card.ppv:hover .duel-vs {
      color: rgba(200,168,75,0.45);
      text-shadow: 0 0 12px rgba(200,168,75,0.3);
    }

    .duel-weight {
      font-family: 'Inter', sans-serif;
      font-size: 0.58rem;
      color: rgba(255,255,255,0.11);
      text-align: center;
      line-height: 1.4;
    }

    /* ── FOOTER ROW ── */
    .duel-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 22px 13px 26px;
      border-top: 1px solid rgba(255,255,255,0.04);
    }

    .duel-footer-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .duel-badge {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 0.44rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 4px;
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }
    .duel-card.fn  .duel-badge {
      background: rgba(0,229,255,0.06);
      border: 1px solid rgba(0,229,255,0.18);
      color: #00e5ff;
    }
    .duel-card.fn:hover .duel-badge {
      background: rgba(0,229,255,0.1);
      box-shadow: 0 0 10px rgba(0,229,255,0.15);
    }
    .duel-card.ppv .duel-badge {
      background: rgba(200,168,75,0.06);
      border: 1px solid rgba(200,168,75,0.22);
      color: #c8a84b;
    }
    .duel-card.ppv:hover .duel-badge {
      background: rgba(200,168,75,0.1);
      box-shadow: 0 0 10px rgba(200,168,75,0.18);
    }

    .duel-event-name {
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.25);
    }

    .duel-footer-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .duel-location {
      font-family: 'Inter', sans-serif;
      font-size: 0.67rem;
      color: rgba(255,255,255,0.15);
      text-align: right;
    }

    .duel-days {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      color: rgba(255,255,255,0.18);
      white-space: nowrap;
    }
    .duel-days.soon { color: #00e5ff; }
    .duel-days.today { color: #c8a84b; }

    /* ── ALSO ON CARD / PRELIM PEEK ── */
    .duel-also {
      padding: 7px 26px 11px;
      display: flex;
      gap: 16px;
      border-top: 1px solid rgba(255,255,255,0.03);
    }
    .duel-also-item {
      font-size: 0.64rem;
      color: rgba(255,255,255,0.13);
      font-family: 'Inter', sans-serif;
    }
    .duel-also-item:first-child { color: rgba(255,255,255,0.2); }

    /* ── TITLE FIGHT LABEL ── */
    .title-label {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.45rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #c8a84b;
      margin-bottom: 5px;
    }

    /* ── DRAWER ── */
    .dr-event-header {
      padding-bottom: 20px;
      margin-bottom: 4px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .dr-event-name {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 1.05rem;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 5px;
    }
    .dr-event-meta {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.3);
      font-family: 'Inter', sans-serif;
    }
    .dr-section { margin-top: 22px; }
    .dr-section-label {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.55rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .dr-section-label::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.06); }
    .dr-fight-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      border-left: 2px solid rgba(255,255,255,0.05);
      margin-bottom: 2px;
      border-radius: 0 6px 6px 0;
      transition: background 0.15s;
    }
    .dr-fight-row:hover { background: rgba(255,255,255,0.02); }
    .dr-fight-row.is-main   { border-left-color: #c8a84b; background: rgba(200,168,75,0.025); }
    .dr-fight-row.is-comain { border-left-color: rgba(0,229,255,0.5); background: rgba(0,229,255,0.015); }
    .dr-fighter {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      color: #fff;
      flex: 1;
    }
    .dr-mid {
      text-align: center;
      padding: 0 12px;
      flex-shrink: 0;
    }
    .dr-title-badge {
      font-size: 0.46rem; font-weight: 800;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: #c8a84b; margin-bottom: 3px;
    }
    .dr-weight { font-size: 0.5rem; font-weight: 700; color: rgba(255,255,255,0.18); text-transform: uppercase; letter-spacing: 0.08em; }
    .dr-rounds { font-size: 0.42rem; font-weight: 600; color: rgba(255,255,255,0.1); text-transform: uppercase; margin-top: 2px; }

    /* ── LIGHT MODE ── */
    body.light-mode { background: #f0f0f3; }
    body.light-mode .duel-card { background: #fff; border-color: rgba(0,0,0,0.07); }
    body.light-mode .duel-card.fn:hover {
      border-color: rgba(0,180,210,0.3);
      box-shadow: -6px 0 0 rgba(0,180,210,0.1), 0 8px 32px rgba(0,0,0,0.1);
    }
    body.light-mode .duel-card.ppv:hover {
      border-color: rgba(180,140,40,0.3);
      box-shadow: -6px 0 0 rgba(180,140,40,0.12), 0 8px 32px rgba(0,0,0,0.1);
    }
    body.light-mode .duel-fname { color: #111; }
    body.light-mode .duel-record { color: rgba(0,0,0,0.3); }
    body.light-mode .duel-center { background: rgba(0,0,0,0.015); border-color: rgba(0,0,0,0.05); }
    body.light-mode .duel-vs { color: rgba(0,0,0,0.1); }
    body.light-mode .duel-weight { color: rgba(0,0,0,0.2); }
    body.light-mode .duel-footer { border-color: rgba(0,0,0,0.05); }
    body.light-mode .duel-event-name { color: rgba(0,0,0,0.4); }
    body.light-mode .duel-location { color: rgba(0,0,0,0.25); }
    body.light-mode .duel-days { color: rgba(0,0,0,0.25); }
    body.light-mode .duel-event-label { background: rgba(0,0,0,0.03); border-color: rgba(0,0,0,0.08); }
    body.light-mode .duel-card.ppv .duel-event-label { background: rgba(200,168,75,0.07); border-color: rgba(200,168,75,0.18); }
    body.light-mode .duel-card.fn  .duel-event-label { background: rgba(0,200,220,0.04); border-color: rgba(0,200,220,0.13); }
    body.light-mode .duel-event-label-text { color: #111; }
    body.light-mode .duel-card.ppv .duel-event-label-text { color: #7a5e0e; }
    body.light-mode .duel-event-label-venue { color: rgba(0,0,0,0.35); }
    body.light-mode .duel-event-label-days { color: rgba(0,0,0,0.3); }
    body.light-mode .duel-also { border-color: rgba(0,0,0,0.04); }
    body.light-mode .duel-also-item { color: rgba(0,0,0,0.2); }
    body.light-mode .duel-also-item:first-child { color: rgba(0,0,0,0.35); }
    body.light-mode .ev-hero h1 { color: #111; }
    body.light-mode .ev-section-title { color: rgba(0,0,0,0.6); }
    body.light-mode .ev-section-header { border-color: rgba(0,0,0,0.07); }
    body.light-mode .ev-section-count { background: rgba(0,0,0,0.04); border-color: rgba(0,0,0,0.08); color: rgba(0,0,0,0.3); }
    body.light-mode .ev-hero-divider { background: linear-gradient(90deg, transparent, rgba(0,150,180,0.3), transparent); }

    @media (max-width: 768px) {
      .ev-page { padding: 24px 12px 80px; }
      .ev-hero h1 { font-size: clamp(1.6rem, 7vw, 2.4rem); }
      .duel-list { gap: 12px; }
      .duel-card { border-radius: 12px; }
      .duel-event-label { padding: 13px 14px 12px 18px; }
      .duel-event-label-text { font-size: 1.2rem; }
      .duel-fname { font-size: 1.1rem !important; }
      .duel-center { width: 54px; }
      .duel-location { display: none; }
      .duel-fighter { padding: 16px 14px 12px; }
      .duel-footer { padding: 8px 14px 12px 18px; }
      .duel-also { padding: 6px 18px 10px; gap: 10px; }
    }
    @media (max-width: 400px) {
      .duel-event-label-text { font-size: 1rem; }
      .duel-fname { font-size: 0.95rem !important; }
      .duel-center { width: 46px; }
    }
  </style>
</head>

      <form class="search-box" id="site-search-form" action="results.html" method="GET">
        <input id="site-search" name="q" type="text" placeholder="Search fighters, events..." autocomplete="off" />
        <span class="search-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M21 21l-4.3-4.3m1.8-5.2a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </span>
      </form>
      <button class="nav-hamburger" id="nav-hamburger" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>

  </nav>

  <div class="nav-mobile-overlay" id="nav-mobile-overlay">
    <button class="nav-mobile-close" onclick="document.getElementById('nav-mobile-overlay').classList.remove('open');document.getElementById('nav-hamburger').classList.remove('open');document.body.classList.remove('no-scroll')">✕</button>

        <input name="q" type="text" placeholder="Search fighters, events..." autocomplete="off" />

  <div class="ev-page">
    <div class="ev-hero">
      <h1>Upcoming <span>Events</span></h1>
      <p>Click any card to see the full fight card</p>
      <div class="ev-hero-divider"></div>
    </div>

    <div class="ev-section" id="sectionAll">
      <div class="ev-section-header">
        <div class="ev-section-accent fn"></div>
        <div class="ev-section-title">All Events</div>
        <div class="ev-section-count" id="evCount"></div>
      </div>
      <div class="duel-list" id="listAll"></div>
    </div>
  </div>

  <!-- Drawer -->
  <div id="fightDrawer" class="drawer" aria-hidden="true">
    <div class="drawer-backdrop" id="drawerClose"></div>
    <aside class="drawer-panel">
      <div class="drawer-top" style="padding:20px 18px 18px;">
        <div class="drawer-title" id="drawerTitle" style="font-family:'Montserrat',sans-serif;font-weight:900;font-size:1.4rem;text-transform:uppercase;letter-spacing:0.04em;color:#fff;">Event</div>
        <button class="drawer-x" id="drawerX" aria-label="Close">✕</button>
      </div>
      <div class="drawer-content" id="drawerContent"></div>
    </aside>
  </div>

  <script>
    function esc(s) {
      return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function slugify(s) {
      return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/['']/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
    }
    function daysUntil(iso) {
      return Math.max(0, Math.ceil((new Date(iso + 'T00:00:00') - new Date()) / 86400000));
    }
    function getMainFight(ev) {
      const mc = ev.mainCard || [];
      return mc.find(f => f.slot === 'main') || mc[0] || null;
    }
    function getCoMain(ev) {
      const mc = ev.mainCard || [];
      return mc.find(f => f.slot === 'comain') || null;
    }
    function splitName(full) {
      const parts = (full||'').trim().split(' ');
      if (parts.length <= 1) return { first: '', last: full };
      const last = parts.pop();
      return { first: parts.join(' '), last };
    }

    let fightersDB = {};

    function getRecord(name) {
      const slug = slugify(name);
      return fightersDB[slug]?.record || '';
    }

    function buildDuelCard(ev, type) {
      const isPPV   = type === 'ppv';
      const cls     = isPPV ? 'ppv' : 'fn';
      const main    = getMainFight(ev);
      const coMain  = getCoMain(ev);
      if (!main) return null;

      const days    = ev.isoDate ? daysUntil(ev.isoDate) : null;
      const dayLabel = days === null ? '' : days === 0 ? 'TODAY' : days === 1 ? 'TOMORROW' : `${days}d away`;
      const soon    = days !== null && days <= 7;
      const isTitle = !!main.titleFight;

      const aName  = splitName(main.a);
      const bName  = splitName(main.b);
      const aRec   = getRecord(main.a);
      const bRec   = getRecord(main.b);

      // Also on card — co-main + prelim count
      const prelims = ev.prelims || [];
      const early   = ev.earlyPrelims || [];
      const totalFights = (ev.mainCard||[]).length + prelims.length + early.length;

      const card = document.createElement('div');
      card.className = `duel-card ${cls}${isTitle ? ' title-fight' : ''}`;

      // Build short event label — just the event identifier, no fighter names
      const rawName = ev.name || '';
      let eventLabel = rawName;
      // "UFC Fight Night: Burns vs. Malott" -> "Fight Night"  (fighter names already shown in card)
      if (rawName.includes('UFC Fight Night:')) {
        // Extract location hint if available
        const loc = ev.location ? ev.location.split(',')[0] : '';
        eventLabel = loc ? `Fight Night — ${loc}` : 'UFC Fight Night';
      } else if (rawName.startsWith('UFC Freedom ')) {
        // "UFC Freedom 250: Topuria vs. Gaethje" -> "UFC Freedom 250"
        const match = rawName.match(/UFC Freedom \d+/);
        eventLabel = match ? match[0] : 'UFC Freedom';
      } else {
        // "UFC 328: Chimaev vs. Strickland" -> "UFC 328"
        const match = rawName.match(/UFC \d+/);
        eventLabel = match ? match[0] : rawName.split(':')[0].trim();
      }

      card.innerHTML = `
        <div class="duel-bar"></div>
        <div class="duel-event-label">
          <span class="duel-event-label-text">${esc(eventLabel)}</span>
          <div class="duel-event-label-right">
            ${dayLabel ? `<span class="duel-event-label-days${soon ? ' soon' : days===0 ? ' today' : ''}">${dayLabel}</span>` : ''}
            ${ev.venue ? `<span class="duel-event-label-venue">${esc(ev.venue)}</span>` : ev.location ? `<span class="duel-event-label-venue">${esc(ev.location)}</span>` : ''}
          </div>
        </div>
        <div class="duel-main">
          <div class="duel-fighter">
            ${isTitle ? `<div class="title-label">🏆 ${esc(main.weight)} Title</div>` : ''}
            <div class="duel-fname">
              ${aName.first ? `<span style="font-size:0.6em;font-weight:700;letter-spacing:0.04em;color:rgba(255,255,255,0.45);display:block;margin-bottom:1px;">${esc(aName.first)}</span>` : ''}
              ${esc(aName.last)}
            </div>
            ${aRec ? `<div class="duel-record">${esc(aRec)}</div>` : ''}
          </div>

          <div class="duel-center">
            <div class="duel-vs">VS</div>
            <div class="duel-weight">${esc(main.weight||'')}</div>
            ${main.rounds ? `<div class="duel-weight" style="margin-top:2px;opacity:0.7;">${esc(main.rounds)}</div>` : ''}
          </div>

          <div class="duel-fighter right">
            ${isTitle ? `<div class="title-label" style="text-align:right;">🏆 ${esc(main.weight)} Title</div>` : ''}
            <div class="duel-fname">
              ${bName.first ? `<span style="font-size:0.6em;font-weight:700;letter-spacing:0.04em;color:rgba(255,255,255,0.45);display:block;margin-bottom:1px;text-align:right;">${esc(bName.first)}</span>` : ''}
              ${esc(bName.last)}
            </div>
            ${bRec ? `<div class="duel-record">${esc(bRec)}</div>` : ''}
          </div>
        </div>

        ${coMain ? `
        <div class="duel-also">
          <div class="duel-also-item">Co-Main: ${esc(coMain.a)} vs ${esc(coMain.b)}</div>
          ${totalFights > 2 ? `<div class="duel-also-item">+${totalFights - 1} more fights</div>` : ''}
        </div>` : totalFights > 1 ? `
        <div class="duel-also">
          <div class="duel-also-item">${totalFights} fights total on the card</div>
        </div>` : ''}

        <div class="duel-footer">
          <div class="duel-footer-left">
            <div class="duel-badge">${isPPV ? 'PPV' : 'Fight Night'}</div>
            <div class="duel-event-name">${esc(ev.date||'')}</div>
          </div>
          <div class="duel-footer-right">
            <div class="duel-location">${esc(ev.location||'')}</div>

          </div>
        </div>
      `;

      card.addEventListener('click', () => openDrawer(ev));
      return card;
    }

    function openDrawer(ev) {
      const drawer = document.getElementById('fightDrawer');
      const isPPV  = ev.type === 'PPV';
      const accent = isPPV ? '#c8a84b' : 'cyan';

      let shortTitle = ev.name || '';
      if (shortTitle.includes('UFC Fight Night:')) {
        shortTitle = ev.location ? 'Fight Night — ' + ev.location.split(',')[0] : 'UFC Fight Night';
      } else {
        shortTitle = shortTitle.split(':')[0].trim();
      }
      document.getElementById('drawerTitle').textContent = shortTitle;

      const mainFight = (ev.mainCard || []).find(f => f.slot === 'main') || (ev.mainCard||[])[0];

      function fightRow(f) {
        const isMain   = f.slot === 'main';
        const isComain = f.slot === 'comain';
        const size   = isMain ? '1.05rem' : isComain ? '0.92rem' : '0.82rem';
        const fw     = isMain ? '900' : isComain ? '800' : '700';
        const lb     = isMain ? accent : isComain ? 'rgba(0,229,255,0.5)' : 'rgba(255,255,255,0.07)';
        const bg     = isMain ? (isPPV ? 'rgba(200,168,75,0.05)' : 'rgba(0,255,255,0.03)') : isComain ? 'rgba(0,229,255,0.015)' : 'transparent';
        const pad    = isMain ? '15px' : isComain ? '12px' : '10px';
        return `<div style="display:flex;align-items:center;justify-content:space-between;padding:${pad} 14px;border-bottom:1px solid rgba(255,255,255,0.05);border-left:2px solid ${lb};background:${bg};margin-bottom:2px;border-radius:0 6px 6px 0;">
          <span style="font-family:'Montserrat',sans-serif;font-weight:${fw};font-size:${size};color:#fff;flex:1;">${esc(f.a)}</span>
          <div style="text-align:center;padding:0 10px;flex-shrink:0;">
            ${f.titleFight ? `<div style="font-size:0.42rem;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:#c8a84b;margin-bottom:2px;">🏆 Title</div>` : ''}
            <div style="font-size:0.46rem;font-weight:700;color:rgba(255,255,255,0.35);text-transform:uppercase;letter-spacing:0.08em;">${esc(f.weight||'')}</div>
            <div style="font-size:0.4rem;color:rgba(255,255,255,0.2);margin-top:1px;">${esc(f.rounds||'')}</div>
          </div>
          <span style="font-family:'Montserrat',sans-serif;font-weight:${fw};font-size:${size};color:#fff;flex:1;text-align:right;">${esc(f.b)}</span>
        </div>`;
      }

      function section(label, fights, color) {
        if (!fights || !fights.length) return '';
        return `<div style="margin-top:20px;">
          <div style="font-family:'Montserrat',sans-serif;font-size:0.54rem;font-weight:800;letter-spacing:0.2em;text-transform:uppercase;color:${color};margin-bottom:10px;display:flex;align-items:center;gap:10px;">${label}<div style="flex:1;height:1px;background:rgba(255,255,255,0.06);"></div></div>
          ${fights.map(fightRow).join('')}
        </div>`;
      }

      document.getElementById('drawerContent').innerHTML =

        (ev.poster ? `
        <div style="width:100%;height:200px;overflow:hidden;position:relative;flex-shrink:0;">
          <img src="${esc(ev.poster)}" alt=""
            style="width:100%;height:100%;object-fit:cover;object-position:center 18%;display:block;"
            onerror="this.parentElement.style.display='none'">
          <div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(8,8,8,0.92) 0%,rgba(0,0,0,0.15) 55%,transparent 100%);"></div>
          <div style="position:absolute;bottom:14px;left:18px;right:18px;">
            <div style="font-family:'Montserrat',sans-serif;font-size:0.52rem;font-weight:800;letter-spacing:0.18em;text-transform:uppercase;color:${accent};margin-bottom:4px;">${isPPV ? '⚡ PPV' : '🥊 Fight Night'}</div>
            <div style="font-family:'Inter',sans-serif;font-size:0.72rem;color:rgba(255,255,255,0.5);">${esc(ev.date||'')}${ev.location ? ' · ' + esc(ev.location) : ''}${ev.venue ? ' · ' + esc(ev.venue) : ''}</div>
          </div>
        </div>` : '') +

        '' +

        `<div style="padding:0 4px 24px;">
          ${section('Main Card',     ev.mainCard,     accent)}
          ${section('Prelims',       ev.prelims,      '#00e5ff')}
          ${section('Early Prelims', ev.earlyPrelims, 'rgba(255,255,255,0.3)')}
        </div>`;

      drawer.setAttribute('aria-hidden', 'false');
      drawer.classList.add('open');
      document.body.classList.add('no-scroll');
    }
    function closeDrawer() {
      const drawer = document.getElementById('fightDrawer');
      drawer.setAttribute('aria-hidden', 'true');
      drawer.classList.remove('open');
      document.body.classList.remove('no-scroll');
    }

    document.getElementById('drawerClose').addEventListener('click', closeDrawer);
    document.getElementById('drawerX').addEventListener('click', closeDrawer);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

    async function loadEvents() {
      const [evRes, fRes] = await Promise.all([
        fetch('events.json'),
        fetch('fighters.json').catch(() => ({ json: () => ({}) }))
      ]);
      const all = await evRes.json();
      fightersDB = await fRes.json().catch(() => ({}));

      const upcoming = all
        .filter(e => e.status === 'upcoming')
        .sort((a, b) => new Date(a.isoDate) - new Date(b.isoDate));

      // Single chronological list — no PPV/FN split
      const list = document.getElementById('listAll');
      upcoming.forEach(e => {
        const type = e.type === 'PPV' ? 'ppv' : 'fn';
        const card = buildDuelCard(e, type);
        if (card) list.appendChild(card);
      });
      document.getElementById('evCount').textContent = `${upcoming.length} event${upcoming.length !== 1 ? 's' : ''}`;
    }

    loadEvents();
  </script>
  <script src="chat.js"></script>
