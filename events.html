<!DOCTYPE html>
<html lang="en">
<head>
  <script src="theme.js"></script>
  <link rel="icon" href="/favicon.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MMA Bridge | Upcoming Events</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    body { background: #080808; }

    .ev-page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 48px 40px 100px;
    }

    .ev-header {
      display: flex; align-items: baseline; gap: 14px;
      margin-bottom: 40px;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .ev-header-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.72rem; font-weight: 800;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: rgba(255,255,255,0.85);
    }

    .ev-header-sub {
      font-size: 0.62rem; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: rgba(255,255,255,0.18);
    }

    /* ── Grid ── */
    .ev-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    /* ── Card ── */
    .ev-card {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      aspect-ratio: 3/4;
      background: #0d0d0d;
      border: 1px solid rgba(255,255,255,0.07);
      transition: transform 0.22s, border-color 0.22s, box-shadow 0.22s;
    }

    .ev-card:hover {
      transform: translateY(-5px);
      border-color: rgba(255,255,255,0.16);
      box-shadow: 0 16px 48px rgba(0,0,0,0.6);
    }

    .ev-card.ppv {
      border-color: rgba(200,168,75,0.18);
    }

    .ev-card.ppv:hover {
      border-color: rgba(200,168,75,0.4);
      box-shadow: 0 16px 48px rgba(200,168,75,0.1);
    }

    /* Next event — wider, landscape */
    .ev-card.next-up {
      grid-column: span 3;
      aspect-ratio: 16/6;
    }

    /* ── Poster fills entire card ── */
    .ev-poster-img {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      transition: transform 0.4s;
    }

    .ev-card:hover .ev-poster-img {
      transform: scale(1.04);
    }

    /* Gradient overlay — info lives at bottom */
    .ev-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        transparent 30%,
        rgba(0,0,0,0.5) 60%,
        rgba(0,0,0,0.92) 100%
      );
    }

    .ev-card.next-up .ev-overlay {
      background: linear-gradient(
        to right,
        transparent 35%,
        rgba(0,0,0,0.75) 65%,
        rgba(0,0,0,0.95) 100%
      );
    }

    /* Badge top-left */
    .ev-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      font-size: 0.46rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 4px 9px;
      border-radius: 4px;
      z-index: 2;
    }

    .ev-badge.fn {
      background: rgba(0,229,255,0.15);
      color: #00e5ff;
      border: 1px solid rgba(0,229,255,0.25);
    }

    .ev-badge.ppv {
      background: rgba(200,168,75,0.18);
      color: #c8a84b;
      border: 1px solid rgba(200,168,75,0.3);
    }

    .ev-badge.next {
      left: auto;
      right: 14px;
      background: #00e5ff;
      color: #000;
    }

    /* Info overlaid at bottom */
    .ev-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px 18px 18px;
      z-index: 2;
    }

    .ev-card.next-up .ev-info {
      top: 0;
      left: auto;
      width: 52%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 32px 48px;
    }

    .ev-location {
      font-size: 0.5rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-bottom: 6px;
    }

    .ev-name {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.1rem;
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      line-height: 1.2;
      margin-bottom: 10px;
    }

    .ev-card.ppv .ev-name { font-size: 1.2rem; }

    .ev-card.next-up .ev-name {
      font-size: 2rem;
      margin-bottom: 12px;
    }

    .ev-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .ev-date {
      font-size: 0.6rem;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .ev-venue {
      font-size: 0.55rem;
      color: rgba(255,255,255,0.22);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    .ev-days {
      display: flex;
      align-items: baseline;
      gap: 3px;
    }

    .ev-days-num {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.6rem;
      font-weight: 900;
      line-height: 1;
      color: rgba(255,255,255,0.18);
    }

    .ev-card.ppv .ev-days-num { color: rgba(200,168,75,0.5); }
    .ev-card.next-up .ev-days-num { font-size: 2.4rem; color: rgba(255,255,255,0.55); }

    .ev-days-label {
      font-size: 0.44rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
    }

    @media (max-width: 900px) {
      .ev-grid { grid-template-columns: repeat(2, 1fr); }
      .ev-card.next-up { grid-column: span 2; aspect-ratio: 16/7; }
    }

    @media (max-width: 580px) {
      .ev-grid { grid-template-columns: 1fr; }
      .ev-card.next-up { grid-column: span 1; aspect-ratio: 3/4; }
      .ev-card.next-up .ev-overlay { background: linear-gradient(to bottom, transparent 30%, rgba(0,0,0,0.92) 100%); }
      .ev-card.next-up .ev-info { top: auto; left: 0; width: 100%; padding: 20px 18px 18px; justify-content: flex-end; }
      .ev-card.next-up .ev-name { font-size: 1.4rem; }
      .ev-page { padding: 24px 16px 60px; }
    }
  </style>
</head>

<body>
  <nav class="navbar">
    <div class="nav-container">
      <a class="logo" href="index.html" style="text-decoration:none;">
        <span class="logo-mma">MMA</span>
        <img src="images/Cage.svg" class="logo-icon" alt="cage icon">
        <span class="logo-bridge">Bridge</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Trending</a></li>
        <li><a href="events.html" class="active">Upcoming Events</a></li>
        <li><a href="pfp.html">PFP</a></li>
        <li><a href="reviews.html">Review</a></li>
        <li><a href="lucas.html">Lucas Bot</a></li>
      </ul>
      <form class="search-box" id="site-search-form" action="results.html" method="GET">
        <input id="site-search" name="q" type="text" placeholder="Search fighters, events..." autocomplete="off" />
        <span class="search-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M21 21l-4.3-4.3m1.8-5.2a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </span>
      </form>
    </div>
  </nav>

  <div class="ev-page">
    <div class="ev-header">
      <span class="ev-header-title">Upcoming Events</span>
      <span class="ev-header-sub">Click any event to see the full card</span>
    </div>
    <div class="ev-grid" id="ev-grid"></div>
  </div>

  <!-- Drawer -->
  <div id="fightDrawer" class="drawer" aria-hidden="true">
    <div class="drawer-backdrop" id="drawerClose"></div>
    <aside class="drawer-panel">
      <div class="drawer-top">
        <div class="drawer-title" id="drawerTitle">Fight</div>
        <button class="drawer-x" id="drawerX" aria-label="Close">✕</button>
      </div>
      <div class="drawer-content" id="drawerContent"></div>
    </aside>
  </div>

  <script>
    function daysUntil(iso) {
      return Math.max(0, Math.ceil((new Date(iso + 'T00:00:00') - new Date()) / 86400000));
    }

    async function loadEvents() {
      const res = await fetch('events.json');
      const all = await res.json();
      const upcoming = all
        .filter(e => e.status === 'upcoming')
        .sort((a, b) => new Date(a.isoDate) - new Date(b.isoDate));

      const grid = document.getElementById('ev-grid');

      upcoming.forEach((e, i) => {
        const isFirst = i === 0;
        const days = daysUntil(e.isoDate);
        const isPPV = e.type === 'PPV';
        const shortName = e.name
          .replace('UFC Fight Night: ', '')
          .replace('UFC Freedom ', 'Freedom ');

        const card = document.createElement('div');
        card.className = 'ev-card' + (isPPV ? ' ppv' : '') + (isFirst ? ' next-up' : '');

        card.innerHTML = `
          <div class="ev-poster-img" style="background-image:url('${e.poster}');"></div>
          <div class="ev-overlay"></div>
          <span class="ev-badge ${isPPV ? 'ppv' : 'fn'}">${isPPV ? '⚡ PPV' : '🥊 Fight Night'}</span>
          ${isFirst ? '<span class="ev-badge next">Next Up</span>' : ''}
          <div class="ev-info">
            <div class="ev-location">${e.location}</div>
            <div class="ev-name">${shortName}</div>
            <div class="ev-venue">${e.venue}</div>
            <div class="ev-meta-row">
              <div class="ev-date">${e.date}</div>
              <div class="ev-days">
                <span class="ev-days-num">${days}</span>
                <span class="ev-days-label">&nbsp;days</span>
              </div>
            </div>
          </div>
        `;

        card.addEventListener('click', () => openDrawer(e, all));
        grid.appendChild(card);
      });
    }

    function openDrawer(ev, all) {
      const drawer = document.getElementById('fightDrawer');
      document.getElementById('drawerTitle').textContent = ev.name;

      function fightRow(f, sectionType) {
        const isMain = f.slot === 'main';
        const isComain = f.slot === 'comain';
        const isOpener = f.slot === 'opener';
        const isPrelimMain = sectionType === 'prelims' && f.slot === 'main';
        const fontSize = isMain ? '1.4rem' : isComain ? '1.15rem' : isPrelimMain ? '1rem' : isOpener ? '0.82rem' : '0.9rem';
        const fontWeight = (isMain || isComain || isPrelimMain) ? '900' : '700';
        const paddingTop = isMain ? '30px' : isComain ? '24px' : isPrelimMain ? '18px' : isOpener ? '12px' : '16px';
        const nameColor = (isMain || isComain) ? '#fff' : isOpener ? 'rgba(255,255,255,0.45)' : 'rgba(255,255,255,0.8)';
        const accentColor = isMain ? '#c8a84b' : isComain ? '#00e5ff' : 'rgba(255,255,255,0.08)';
        const bgColor = isMain ? 'rgba(200,168,75,0.04)' : isComain ? 'rgba(0,229,255,0.03)' : 'transparent';
        const titleBadge = f.titleFight ? '<div style="font-size:0.5rem;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;color:#c8a84b;margin-bottom:4px;">&#127942; Title Fight</div>' : '';
        const midHtml = '<div style="text-align:center;flex-shrink:0;padding:0 16px;">' + titleBadge +
          '<div style="font-size:0.52rem;font-weight:700;color:rgba(255,255,255,0.22);text-transform:uppercase;letter-spacing:0.1em;">' + f.weight + '</div>' +
          '<div style="font-size:0.44rem;font-weight:600;color:rgba(255,255,255,0.12);text-transform:uppercase;letter-spacing:0.08em;margin-top:2px;">' + f.rounds + '</div>' +
          '</div>';
        const rowStyle = 'display:flex;align-items:center;justify-content:space-between;padding:' + paddingTop + ' 12px;border-bottom:1px solid rgba(255,255,255,0.05);background:' + bgColor + ';border-left:2px solid ' + accentColor + ';margin-bottom:2px;border-radius:0 6px 6px 0;';
        const nameStyle = 'font-family:Montserrat,sans-serif;font-weight:' + fontWeight + ';font-size:' + fontSize + ';color:' + nameColor + ';flex:1;letter-spacing:0.02em;';
        return '<div style="' + rowStyle + '"><span style="' + nameStyle + '">' + f.a + '</span>' + midHtml + '<span style="' + nameStyle + 'text-align:right;">' + f.b + '</span></div>';
      }

      const main = ev.mainCard || [];
      const prelims = ev.prelims || [];
      const early = ev.earlyPrelims || [];

      function section(label, fights, type, accent) {
        if (!fights.length) return '';
        const labelHtml = '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;"><span style="font-size:0.56rem;font-weight:800;letter-spacing:0.2em;text-transform:uppercase;color:' + accent + ';">' + label + '</span><div style="flex:1;height:1px;background:rgba(255,255,255,0.06);"></div></div>';
        return '<div style="margin-top:24px;">' + labelHtml + fights.map(function(f) { return fightRow(f, type); }).join('') + '</div>';
      }

      document.getElementById('drawerContent').innerHTML =
        section('Main Card', main, 'main', '#c8a84b') +
        section('Prelims', prelims, 'prelims', '#00e5ff') +
        section('Early Prelims', early, 'early', 'rgba(255,255,255,0.25)');

      drawer.setAttribute('aria-hidden', 'false');
      drawer.classList.add('open');
    }

    document.getElementById('drawerClose').addEventListener('click', closeDrawer);
    document.getElementById('drawerX').addEventListener('click', closeDrawer);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

    function closeDrawer() {
      const drawer = document.getElementById('fightDrawer');
      drawer.setAttribute('aria-hidden', 'true');
      drawer.classList.remove('open');
    }

    loadEvents();
  </script>
  <script src="chat.js"></script>
</body>
</html>
