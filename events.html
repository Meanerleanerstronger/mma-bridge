<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MMA Bridge | Upcoming Events</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Pacifico&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- NAVBAR (MATCHES INDEX) -->
  <nav class="navbar">
    <div class="nav-container">

      <a class="logo" href="index.html" style="text-decoration:none;">
        <span class="logo-mma">MMA</span>
        <img src="images/Cage.svg" class="logo-icon" alt="cage icon">
        <span class="logo-bridge">Bridge</span>
      </a>

      <ul class="nav-links">
        <li><a href="index.html">Trending</a></li>
        <li><a href="events.html" class="active">Upcoming Events</a></li>
        <li><a href="pfp.html">PFP</a></li>
        <li><a href="reviews.html">Review</a></li>
        <li><a href="lucas.html">Lucas Bot</a></li>
      </ul>

      <!-- SEARCH (SAME AS INDEX so spacing stays perfect) -->
      <form class="search-box" id="site-search-form" action="results.html" method="GET">
        <input id="site-search" name="q" type="text" placeholder="Search fighters, events..." autocomplete="off" />
        <span class="search-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M21 21l-4.3-4.3m1.8-5.2a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </span>
      </form>

    </div>
  </nav>

  <!-- PAGE -->
  <main class="page">
    <header class="page-header">
      <h1 class="page-title">Upcoming Events</h1>
      <p class="page-sub">Click an event to see the full card. Rate the hype. Lock your FOTN pick.</p>
    </header>

    <section id="events-list" class="events-list">
      <!-- JS injects events here -->
    </section>
  </main>

  <!-- Fighter Panel (drawer) -->
  <div id="fightDrawer" class="drawer" aria-hidden="true">
    <div class="drawer-backdrop" id="drawerClose"></div>

    <aside class="drawer-panel">
      <div class="drawer-top">
        <div class="drawer-title" id="drawerTitle">Fight</div>
        <button class="drawer-x" id="drawerX" aria-label="Close">✕</button>
      </div>

      <div class="drawer-content" id="drawerContent">
        <!-- JS injects content -->
      </div>
    </aside>
  </div>

  <script type="module" src="events.js"></script>
  <script src="chat.js"></script> 
</body>
</html>
