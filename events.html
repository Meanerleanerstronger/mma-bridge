<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script src="theme.js?v=2.1"></script>
  <link rel="icon" href="/favicon.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MMA Bridge | Upcoming Events</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2.1" />

  <style>
    /* ── BASE ── */
    body {
      background: #060608;
      background-image:
        radial-gradient(ellipse 80% 40% at 15% -5%, rgba(0,229,255,0.03) 0%, transparent 60%),
        radial-gradient(ellipse 60% 35% at 85% 105%, rgba(200,168,75,0.03) 0%, transparent 55%);
    }

    /* ── KEYFRAMES ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes heroIn {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes shimmer {
      0%   { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    @keyframes pulseCyan {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.55; }
    }
    @keyframes pulseGold {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.55; }
    }

    /* ── PAGE ── */
    .ev-page {
      max-width: 980px;
      margin: 0 auto;
      padding: 52px 28px 120px;
    }

    /* ── HERO ── */
    .ev-hero {
      text-align: center;
      margin-bottom: 52px;
      animation: heroIn 0.45s ease both;
    }
    .ev-hero h1 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: clamp(2rem, 5vw, 3.4rem);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #fff;
      margin: 0 0 10px;
    }
    .ev-hero h1 span {
      background: linear-gradient(120deg, #00e5ff 0%, #80ffea 45%, #00b8d4 70%, #00e5ff 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 4s linear infinite;
    }
    .ev-hero-sub {
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.04em;
    }
    .ev-hero-divider {
      width: 44px; height: 2px;
      background: linear-gradient(90deg, transparent, rgba(0,229,255,0.35), transparent);
      margin: 12px auto 0;
      border-radius: 2px;
    }

    /* ── COUNT BAR ── */
    .ev-count-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      animation: fadeUp 0.4s 0.1s ease both;
    }
    .ev-count-accent {
      width: 3px; height: 14px; border-radius: 2px;
      background: linear-gradient(to bottom, #00e5ff, rgba(0,229,255,0.2));
    }
    .ev-count-label {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
    }
    .ev-count-pill {
      font-family: 'Inter', sans-serif;
      font-size: 0.65rem;
      color: rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      padding: 2px 10px;
      border-radius: 20px;
      margin-left: auto;
    }

    /* ── EVENT LIST ── */
    .ev-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── EVENT ROW ── */
    .ev-row {
      background: #0c0c0f;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px;
      overflow: hidden;
      animation: fadeUp 0.4s ease both;
      transition: border-color 0.25s;
    }
    .ev-row:nth-child(1)  { animation-delay: 0.05s; }
    .ev-row:nth-child(2)  { animation-delay: 0.10s; }
    .ev-row:nth-child(3)  { animation-delay: 0.15s; }
    .ev-row:nth-child(4)  { animation-delay: 0.20s; }
    .ev-row:nth-child(5)  { animation-delay: 0.25s; }
    .ev-row:nth-child(6)  { animation-delay: 0.30s; }
    .ev-row:nth-child(n+7){ animation-delay: 0.34s; }

    .ev-row.fn:hover  { border-color: rgba(0,229,255,0.2); }
    .ev-row.ppv:hover { border-color: rgba(200,168,75,0.25); }
    .ev-row.fn.expanded  { border-color: rgba(0,229,255,0.2); }
    .ev-row.ppv.expanded { border-color: rgba(200,168,75,0.22); }

    /* Gold shimmer top border for PPV */
    .ev-row.ppv {
      border-top: 2px solid transparent;
      background-clip: padding-box;
      position: relative;
    }
    .ev-row.ppv::before {
      content: '';
      position: absolute;
      top: -2px; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg,
        transparent 0%, #8a6a10 15%, #c8a84b 35%, #fff8c0 50%,
        #c8a84b 65%, #8a6a10 85%, transparent 100%);
      background-size: 250% auto;
      animation: shimmer 4s linear infinite;
    }

    /* ── ROW HEADER (clickable) ── */
    .ev-row-header {
      display: flex;
      align-items: stretch;
      cursor: pointer;
      padding: 0;
      transition: background 0.2s;
    }
    .ev-row.fn:hover  .ev-row-header { background: rgba(0,229,255,0.02); }
    .ev-row.ppv:hover .ev-row-header { background: rgba(200,168,75,0.025); }
    .ev-row.expanded  .ev-row-header { background: rgba(255,255,255,0.018); }

    /* ── POSTER THUMBNAIL ── */
    .ev-poster-wrap {
      flex-shrink: 0;
      width: 92px;
      position: relative;
      overflow: hidden;
      border-radius: 12px 0 0 12px;
    }
    .ev-row.expanded .ev-poster-wrap { border-radius: 12px 0 0 0; }
    .ev-poster {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
      transition: transform 0.4s ease;
    }
    .ev-row-header:hover .ev-poster { transform: scale(1.04); }
    .ev-poster-placeholder {
      width: 100%;
      height: 100%;
      min-height: 116px;
      background: linear-gradient(160deg, #141418 0%, #0e0e12 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
    }
    /* Gradient overlay on poster for left fade */
    .ev-poster-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, transparent 55%, #0c0c0f 100%);
      pointer-events: none;
    }

    /* ── EVENT INFO ── */
    .ev-info {
      flex: 1;
      min-width: 0;
      padding: 16px 14px 16px 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 7px;
    }

    .ev-top-row {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
    }

    .ev-badge {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 0.42rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .ev-badge.fn {
      background: rgba(0,229,255,0.07);
      border: 1px solid rgba(0,229,255,0.2);
      color: #00e5ff;
    }
    .ev-badge.ppv {
      background: rgba(200,168,75,0.07);
      border: 1px solid rgba(200,168,75,0.25);
      color: #c8a84b;
    }

    .ev-name {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 1rem;
      color: #fff;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ev-row.ppv .ev-name { color: #e8c85a; }

    /* Title fight indicator */
    .ev-title-crown {
      font-size: 0.7rem;
      opacity: 0.9;
      flex-shrink: 0;
    }

    /* ── MATCHUP ── */
    .ev-matchup {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }
    .ev-fighter-name {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 0.96rem;
      color: #fff;
      letter-spacing: 0.02em;
      line-height: 1;
      text-transform: uppercase;
    }
    .ev-row.ppv .ev-fighter-name { font-size: 1.08rem; }
    .ev-vs-divider {
      font-family: 'Inter', sans-serif;
      font-size: 0.6rem;
      font-weight: 600;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.08em;
    }

    /* ── EVENT SUB (weight / venue) ── */
    .ev-sub {
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.25);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── RIGHT META ── */
    .ev-meta-right {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      padding: 16px 14px 16px 10px;
      gap: 5px;
    }
    .ev-days {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      color: rgba(255,255,255,0.25);
      white-space: nowrap;
    }
    .ev-days.soon  { color: #00e5ff; animation: pulseCyan 2.2s ease infinite; }
    .ev-days.today { color: #c8a84b; animation: pulseGold 2s ease infinite; }
    .ev-date-small {
      font-family: 'Inter', sans-serif;
      font-size: 0.68rem;
      color: rgba(255,255,255,0.2);
      white-space: nowrap;
      text-align: right;
    }
    .ev-location-small {
      font-family: 'Inter', sans-serif;
      font-size: 0.62rem;
      color: rgba(255,255,255,0.14);
      text-align: right;
      max-width: 120px;
      line-height: 1.3;
    }

    /* ── EXPAND CHEVRON ── */
    .ev-chevron {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      color: rgba(255,255,255,0.18);
      transition: color 0.2s, transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    .ev-row-header:hover .ev-chevron { color: rgba(255,255,255,0.38); }
    .ev-row.fn.expanded  .ev-row-header .ev-chevron { color: #00e5ff; transform: rotate(180deg); }
    .ev-row.ppv.expanded .ev-row-header .ev-chevron { color: #c8a84b; transform: rotate(180deg); }
    .ev-chevron svg {
      width: 16px; height: 16px;
      fill: none; stroke: currentColor;
      stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
    }

    /* ── ACCORDION PANEL ── */
    .ev-card-panel {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.42s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .ev-row.expanded .ev-card-panel {
      max-height: 2400px;
    }

    .ev-card-inner {
      border-top: 1px solid rgba(255,255,255,0.05);
      padding: 20px 20px 24px 20px;
    }

    /* ── FIGHT CARD SECTION LABEL ── */
    .fc-section-label {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 0.5rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .fc-section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.06);
    }
    .fc-section { margin-top: 18px; }
    .fc-section:first-child { margin-top: 0; }

    /* ── FIGHT ROW ── */
    .fc-fight {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      padding: 11px 14px;
      border-radius: 8px;
      border-left: 2px solid rgba(255,255,255,0.05);
      border-bottom: 1px solid rgba(255,255,255,0.035);
      margin-bottom: 3px;
      transition: background 0.15s;
    }
    .fc-fight:hover { background: rgba(255,255,255,0.02); }
    .fc-fight.is-main {
      border-left-color: #c8a84b;
      background: rgba(200,168,75,0.03);
      padding: 14px;
    }
    .fc-fight.is-comain {
      border-left-color: rgba(0,229,255,0.45);
      background: rgba(0,229,255,0.015);
    }
    .ev-row.fn .fc-fight.is-main {
      border-left-color: #00e5ff;
      background: rgba(0,229,255,0.03);
    }

    .fc-fighter {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 0.82rem;
      color: #fff;
      line-height: 1.2;
    }
    .fc-fight.is-main   .fc-fighter { font-size: 1rem; }
    .fc-fight.is-comain .fc-fighter { font-size: 0.88rem; }
    .fc-fighter.right { text-align: right; }

    .fc-mid {
      text-align: center;
      padding: 0 10px;
      min-width: 80px;
    }
    .fc-title-badge {
      font-size: 0.4rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #c8a84b;
      margin-bottom: 3px;
    }
    .fc-weight {
      font-family: 'Inter', sans-serif;
      font-size: 0.5rem;
      font-weight: 700;
      color: rgba(255,255,255,0.3);
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }
    .fc-rounds {
      font-family: 'Inter', sans-serif;
      font-size: 0.42rem;
      color: rgba(255,255,255,0.15);
      margin-top: 2px;
    }

    /* ── CO-MAIN PEEK (below fold summary row) ── */
    .ev-peek {
      padding: 7px 14px 9px 106px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-top: 1px solid rgba(255,255,255,0.03);
    }
    .ev-peek-item {
      font-family: 'Inter', sans-serif;
      font-size: 0.64rem;
      color: rgba(255,255,255,0.18);
    }
    .ev-peek-item:first-child { color: rgba(255,255,255,0.28); }
    .ev-peek-dot {
      width: 2px; height: 2px; border-radius: 50%;
      background: rgba(255,255,255,0.1);
      flex-shrink: 0;
    }

    /* ── LIGHT MODE ── */
    body.light-mode .ev-row { background: #fff; border-color: rgba(0,0,0,0.07); }
    body.light-mode .ev-row.fn:hover  { border-color: rgba(0,180,210,0.25); }
    body.light-mode .ev-row.ppv:hover { border-color: rgba(180,140,40,0.25); }
    body.light-mode .ev-poster-wrap::after { background: linear-gradient(to right, transparent 55%, #fff 100%); }
    body.light-mode .ev-row.fn.expanded  .ev-row-header { background: rgba(0,229,255,0.02); }
    body.light-mode .ev-row.ppv.expanded .ev-row-header { background: rgba(200,168,75,0.03); }
    body.light-mode .ev-name  { color: #111; }
    body.light-mode .ev-row.ppv .ev-name { color: #6e4e00; }
    body.light-mode .ev-fighter-name { color: #111; }
    body.light-mode .ev-vs-divider { color: rgba(0,0,0,0.2); }
    body.light-mode .ev-sub   { color: rgba(0,0,0,0.35); }
    body.light-mode .ev-days  { color: rgba(0,0,0,0.3); }
    body.light-mode .ev-date-small { color: rgba(0,0,0,0.3); }
    body.light-mode .ev-location-small { color: rgba(0,0,0,0.2); }
    body.light-mode .ev-hero h1 { color: #111; }
    body.light-mode .ev-hero-sub { color: rgba(0,0,0,0.35); }
    body.light-mode .ev-count-label { color: rgba(0,0,0,0.5); }
    body.light-mode .ev-count-pill { color: rgba(0,0,0,0.3); background: rgba(0,0,0,0.04); border-color: rgba(0,0,0,0.07); }
    body.light-mode .ev-count-bar { border-color: rgba(0,0,0,0.07); }
    body.light-mode .ev-card-inner { border-color: rgba(0,0,0,0.06); }
    body.light-mode .fc-fighter { color: #111; }
    body.light-mode .fc-fight { border-bottom-color: rgba(0,0,0,0.05); border-left-color: rgba(0,0,0,0.1); }
    body.light-mode .fc-fight.is-main { background: rgba(200,168,75,0.05); border-left-color: #c8a84b; }
    body.light-mode .fc-fight.is-comain { background: rgba(0,200,220,0.03); border-left-color: rgba(0,180,210,0.5); }
    body.light-mode .ev-row.fn .fc-fight.is-main { background: rgba(0,200,220,0.04); border-left-color: rgba(0,180,210,0.7); }
    body.light-mode .fc-weight { color: rgba(0,0,0,0.35); }
    body.light-mode .fc-rounds { color: rgba(0,0,0,0.2); }
    body.light-mode .ev-peek-item { color: rgba(0,0,0,0.22); }
    body.light-mode .ev-peek-item:first-child { color: rgba(0,0,0,0.35); }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .ev-page { padding: 28px 12px 80px; }
      .ev-poster-wrap { width: 76px; }
      .ev-poster-placeholder { min-height: 100px; font-size: 1.3rem; }
      .ev-name { font-size: 0.88rem; }
      .ev-fighter-name { font-size: 0.88rem; }
      .ev-row.ppv .ev-fighter-name { font-size: 0.96rem; }
      .ev-location-small { display: none; }
      .ev-meta-right { padding: 12px 10px 12px 6px; }
      .ev-info { padding: 12px 8px 12px 12px; }
      .ev-peek { padding-left: 88px; }
    }
    @media (max-width: 480px) {
      .ev-poster-wrap { width: 64px; }
      .ev-info { padding: 10px 6px 10px 10px; }
      .ev-name { font-size: 0.8rem; }
      .ev-fighter-name { font-size: 0.8rem; }
      .ev-row.ppv .ev-fighter-name { font-size: 0.88rem; }
      .ev-meta-right { padding: 10px 8px 10px 4px; }
      .ev-days { font-size: 0.65rem; }
      .ev-date-small { display: none; }
      .ev-chevron { width: 32px; }
      .fc-fight { padding: 9px 10px; }
      .fc-fighter { font-size: 0.74rem; }
      .fc-fight.is-main .fc-fighter { font-size: 0.88rem; }
      .fc-mid { min-width: 66px; padding: 0 6px; }
      .ev-peek { padding-left: 74px; gap: 6px; }
    }
  </style>
</head>

  </div>

  <script>
    function esc(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function daysUntil(iso) {
      return Math.ceil((new Date(iso + 'T00:00:00') - new Date()) / 86400000);
    }
    function getMainFight(ev) {
      const mc = ev.mainCard || [];
      return mc.find(f => f.slot === 'main') || mc[0] || null;
    }
    function getCoMain(ev) {
      return (ev.mainCard || []).find(f => f.slot === 'comain') || null;
    }
    function lastName(full) {
      const parts = (full || '').trim().split(' ');
      return parts.length > 1 ? parts[parts.length - 1] : full;
    }
    function shortEventLabel(ev) {
      const raw = ev.name || '';
      if (raw.includes('UFC Fight Night:') || raw.includes('UFC Fight Night —')) {
        const loc = ev.location ? ev.location.split(',')[0] : '';
        return loc ? `FIGHT NIGHT — ${loc.toUpperCase()}` : 'UFC FIGHT NIGHT';
      }
      const m = raw.match(/UFC (\d+)/);
      if (m) return `UFC ${m[1]}`;
      return raw.split(':')[0].trim().toUpperCase();
    }

    function buildFightRow(f, accentColor) {
      const isMain   = f.slot === 'main';
      const isComain = f.slot === 'comain';
      const cls = isMain ? 'is-main' : isComain ? 'is-comain' : '';
      return `
        <div class="fc-fight ${cls}">
          <div class="fc-fighter">${esc(f.a)}</div>
          <div class="fc-mid">
            ${f.titleFight ? `<div class="fc-title-badge">🏆 Title</div>` : ''}
            <div class="fc-weight">${esc(f.weight || '')}</div>
            ${f.rounds ? `<div class="fc-rounds">${esc(f.rounds)}</div>` : ''}
          </div>
          <div class="fc-fighter right">${esc(f.b)}</div>
        </div>`;
    }

    function buildSection(label, fights, color, accentColor) {
      if (!fights || !fights.length) return '';
      return `
        <div class="fc-section">
          <div class="fc-section-label" style="color:${color}">${esc(label)}</div>
          ${fights.map(f => buildFightRow(f, accentColor)).join('')}
        </div>`;
    }

    function buildRow(ev) {
      const isPPV   = ev.type === 'PPV';
      const cls     = isPPV ? 'ppv' : 'fn';
      const accent  = isPPV ? '#c8a84b' : '#00e5ff';
      const main    = getMainFight(ev);
      const coMain  = getCoMain(ev);
      if (!main) return null;

      const days = ev.isoDate ? daysUntil(ev.isoDate) : null;
      const dayLabel = days === null ? '' : days <= 0 ? 'TODAY' : days === 1 ? 'TOMORROW' : `${days}D AWAY`;
      const soon = days !== null && days > 0 && days <= 7;
      const isToday = days !== null && days <= 0;

      const label = shortEventLabel(ev);
      const totalFights = (ev.mainCard || []).length + (ev.prelims || []).length + (ev.earlyPrelims || []).length;

      const row = document.createElement('div');
      row.className = `ev-row ${cls}`;

      const posterHtml = ev.poster
        ? `<img class="ev-poster" src="${esc(ev.poster)}" alt="${esc(ev.name)}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\"ev-poster-placeholder\\">🥊</div>'">`
        : `<div class="ev-poster-placeholder">🥊</div>`;

      const weightSub = main.titleFight
        ? `${esc(main.weight)} Title`
        : esc(main.weight || '');

      const venuePart = ev.venue || ev.location || '';

      row.innerHTML = `
        <div class="ev-row-header">
          <div class="ev-poster-wrap">
            ${posterHtml}
          </div>
          <div class="ev-info">
            <div class="ev-top-row">
              <span class="ev-badge ${cls}">${isPPV ? 'PPV' : 'Fight Night'}</span>
              <span class="ev-name">${esc(label)}</span>
              ${main.titleFight ? `<span class="ev-title-crown">🏆</span>` : ''}
            </div>
            <div class="ev-matchup">
              <span class="ev-fighter-name">${esc(lastName(main.a))}</span>
              <span class="ev-vs-divider">vs</span>
              <span class="ev-fighter-name">${esc(lastName(main.b))}</span>
            </div>
            <div class="ev-sub">${weightSub}${venuePart ? ' · ' + esc(venuePart) : ''}</div>
          </div>
          <div class="ev-meta-right">
            ${dayLabel ? `<div class="ev-days${soon ? ' soon' : isToday ? ' today' : ''}">${dayLabel}</div>` : ''}
            <div class="ev-date-small">${esc(ev.date || '')}</div>
            ${ev.location ? `<div class="ev-location-small">${esc(ev.location)}</div>` : ''}
          </div>
          <div class="ev-chevron">
            <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
        </div>

        ${coMain || totalFights > 1 ? `
        <div class="ev-peek">
          ${coMain ? `<div class="ev-peek-item">Co-Main: ${esc(coMain.a)} vs ${esc(coMain.b)}</div>` : ''}
          ${coMain && totalFights > 2 ? `<div class="ev-peek-dot"></div>` : ''}
          ${totalFights > (coMain ? 2 : 1) ? `<div class="ev-peek-item">+${totalFights - (coMain ? 2 : 1)} more fights</div>` : ''}
        </div>` : ''}

        <div class="ev-card-panel">
          <div class="ev-card-inner">
            ${buildSection('Main Card', ev.mainCard, accent, accent)}
            ${buildSection('Prelims', ev.prelims, '#00e5ff', '#00e5ff')}
            ${buildSection('Early Prelims', ev.earlyPrelims, 'rgba(255,255,255,0.28)', 'rgba(255,255,255,0.2)')}
          </div>
        </div>
      `;

      row.querySelector('.ev-row-header').addEventListener('click', () => {
        const wasOpen = row.classList.contains('expanded');
        row.classList.toggle('expanded', !wasOpen);
      });

      return row;
    }

    async function loadEvents() {
      const res = await fetch('events.json');
      const all = await res.json();

      const upcoming = all
        .filter(e => e.status === 'upcoming')
        .sort((a, b) => new Date(a.isoDate) - new Date(b.isoDate));

      const list = document.getElementById('listAll');
      upcoming.forEach(e => {
        const row = buildRow(e);
        if (row) list.appendChild(row);
      });

      document.getElementById('evCount').textContent = `${upcoming.length} event${upcoming.length !== 1 ? 's' : ''}`;
    }

    loadEvents();
  </script>
  <script src="auth.js?v=2.1"></script>
  <script src="chat.js?v=2.1"></script>
</body>
</html>
