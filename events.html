<!DOCTYPE html>
<html lang="en">
<head>
  <script src="theme.js"></script>
  <link rel="icon" href="/favicon.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MMA Bridge | Upcoming Events</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    body { background: #080808; }

    .ev-page { max-width: 1280px; margin: 0 auto; padding: 40px 36px 80px; }

    .ev-page-header {
      display: flex; align-items: baseline; gap: 14px;
      margin-bottom: 32px;
    }
    .ev-page-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.72rem; font-weight: 800;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: rgba(255,255,255,0.85);
    }
    .ev-page-sub {
      font-size: 0.62rem; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: rgba(255,255,255,0.18);
    }

    /* ── HERO (next event) ── */
    .ev-hero {
      position: relative;
      height: 460px;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      margin-bottom: 12px;
      transition: transform 0.2s;
    }
    .ev-hero:hover { transform: scale(1.005); }

    .ev-hero-bg {
      position: absolute; inset: 0;
      background-size: cover;
      background-position: center;
      transition: transform 0.4s;
    }
    .ev-hero:hover .ev-hero-bg { transform: scale(1.04); }

    .ev-hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(
        105deg,
        rgba(0,0,0,0.93) 0%,
        rgba(0,0,0,0.65) 40%,
        rgba(0,0,0,0.15) 70%,
        rgba(0,0,0,0) 100%
      ), linear-gradient(to top, rgba(0,0,0,0.5) 0%, transparent 40%);
    }

    .ev-hero-content {
      position: absolute; bottom: 0; left: 0;
      padding: 44px 48px;
      max-width: 600px;
    }

    .ev-hero-coming {
      font-size: 0.58rem; font-weight: 800;
      letter-spacing: 0.24em; text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-bottom: 6px;
    }

    .ev-hero-tag {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.6rem; font-weight: 800;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: #c8a84b; margin-bottom: 12px;
    }

    .ev-hero-tag.fn-tag { color: #00e5ff; }

    .ev-hero-name {
      font-family: 'Montserrat', sans-serif;
      font-size: 3rem; font-weight: 900;
      text-transform: uppercase; color: #fff;
      line-height: 0.95; letter-spacing: 0.02em;
      margin-bottom: 14px;
    }

    .ev-hero-meta {
      display: flex; gap: 20px; align-items: center;
      flex-wrap: wrap;
    }
    .ev-hero-date { font-size: 0.75rem; font-weight: 600; color: rgba(255,255,255,0.7); }
    .ev-hero-loc { font-size: 0.65rem; font-weight: 500; color: rgba(255,255,255,0.3); letter-spacing: 0.06em; text-transform: uppercase; }

    .ev-hero-countdown {
      position: absolute; top: 28px; right: 28px;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px; padding: 14px 20px;
      text-align: center; backdrop-filter: blur(8px);
    }
    .ev-hero-days { font-family: 'Montserrat', sans-serif; font-size: 2.2rem; font-weight: 900; color: #fff; line-height: 1; }
    .ev-hero-days-label { font-size: 0.55rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.3); margin-top: 3px; }

    .ev-hero-view {
      position: absolute; bottom: 44px; right: 28px;
      font-size: 0.62rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px; padding: 8px 16px;
      transition: all 0.15s;
    }
    .ev-hero:hover .ev-hero-view { color: #fff; background: rgba(255,255,255,0.1); }

    /* ── Section label ── */
    .ev-section {
      display: flex; align-items: center; gap: 16px;
      margin: 28px 0 14px;
    }
    .ev-section-label {
      font-size: 0.58rem; font-weight: 800;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: rgba(255,255,255,0.15); white-space: nowrap;
    }
    .ev-section-line { flex: 1; height: 1px; background: rgba(255,255,255,0.05); }

    /* ── 2-column poster grid ── */
    .ev-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .ev-card {
      position: relative; height: 240px;
      border-radius: 14px; overflow: hidden;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.06);
      transition: transform 0.2s, border-color 0.2s;
    }
    .ev-card:hover { transform: translateY(-3px); border-color: rgba(255,255,255,0.14); }
    .ev-card.ppv-card { border-color: rgba(200,168,75,0.15); }
    .ev-card.ppv-card:hover { border-color: rgba(200,168,75,0.35); }

    .ev-card-bg {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      transition: transform 0.4s;
    }
    .ev-card:hover .ev-card-bg { transform: scale(1.05); }

    .ev-card-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(
        to right,
        rgba(0,0,0,0.9) 0%,
        rgba(0,0,0,0.55) 45%,
        rgba(0,0,0,0.1) 100%
      ), linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 50%);
    }

    .ev-card-content {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 20px 22px;
    }

    .ev-card-tag {
      font-size: 0.55rem; font-weight: 800;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: #00e5ff; margin-bottom: 6px;
    }
    .ev-card-tag.ppv { color: #c8a84b; }

    .ev-card-name {
      font-family: 'Montserrat', sans-serif;
      font-size: 1rem; font-weight: 900;
      text-transform: uppercase; color: #fff;
      letter-spacing: 0.02em; line-height: 1.15;
      margin-bottom: 6px;
    }

    .ev-card-meta {
      font-size: 0.6rem; color: rgba(255,255,255,0.35);
      text-transform: uppercase; letter-spacing: 0.06em;
    }

    .ev-card-days {
      position: absolute; top: 14px; right: 14px;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px; padding: 6px 10px;
      text-align: center;
    }
    .ev-card-days-num { font-family: 'Montserrat', sans-serif; font-size: 1rem; font-weight: 900; color: #fff; line-height: 1; }
    .ev-card-days-label { font-size: 0.48rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.3); }

    /* light mode */
    body.light-mode { background: #f0f0f0; }

    @media (max-width: 860px) {
      .ev-grid { grid-template-columns: 1fr; }
      .ev-hero { height: 340px; }
      .ev-hero-name { font-size: 2rem; }
      .ev-hero-content { padding: 28px 24px; }
      .ev-page { padding: 24px 16px 60px; }
    }
  </style>
</head>

<body>
  <nav class="navbar">
    <div class="nav-container">
      <a class="logo" href="index.html" style="text-decoration:none;">
        <span class="logo-mma">MMA</span>
        <img src="images/Cage.svg" class="logo-icon" alt="cage icon">
        <span class="logo-bridge">Bridge</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Trending</a></li>
        <li><a href="events.html" class="active">Upcoming Events</a></li>
        <li><a href="pfp.html">PFP</a></li>
        <li><a href="reviews.html">Review</a></li>
        <li><a href="lucas.html">Lucas Bot</a></li>
      </ul>
      <button class="theme-toggle" id="themeToggle" title="Toggle light/dark mode">
        <div class="toggle-track"><div class="toggle-thumb"></div></div>
        <span class="toggle-label">LIGHT</span>
      </button>
      <form class="search-box" id="site-search-form" action="results.html" method="GET">
        <input id="site-search" name="q" type="text" placeholder="Search fighters, events..." autocomplete="off" />
        <span class="search-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M21 21l-4.3-4.3m1.8-5.2a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </span>
      </form>
    </div>
  </nav>

  <div class="ev-page">
    <div class="ev-page-header">
      <span class="ev-page-title">Upcoming Events</span>
      <span class="ev-page-sub">Click any event to see the full card</span>
    </div>

    <!-- Hero + grid injected by JS -->
    <div id="events-root"></div>
  </div>

  <!-- Fighter Drawer -->
  <div id="fightDrawer" class="drawer" aria-hidden="true">
    <div class="drawer-backdrop" id="drawerClose"></div>
    <aside class="drawer-panel">
      <div class="drawer-top">
        <div class="drawer-title" id="drawerTitle">Fight</div>
        <button class="drawer-x" id="drawerX" aria-label="Close">✕</button>
      </div>
      <div class="drawer-content" id="drawerContent"></div>
    </aside>
  </div>

  <script>
    // Countdown helper
    function daysUntil(isoDate) {
      const now = new Date();
      const target = new Date(isoDate + 'T00:00:00');
      return Math.max(0, Math.ceil((target - now) / 86400000));
    }

    async function loadEvents() {
      const res = await fetch('events.json');
      const all = await res.json();
      const upcoming = all.filter(e => e.status === 'upcoming')
                          .sort((a, b) => new Date(a.isoDate) - new Date(b.isoDate));

      if (!upcoming.length) return;

      const root = document.getElementById('events-root');
      const hero = upcoming[0];
      const rest = upcoming.slice(1);
      const heroIsPPV = hero.type === 'PPV';
      const heroDays = daysUntil(hero.isoDate);

      // Hero
      root.innerHTML = `
        <div class="ev-hero" data-event="${hero.id}">
          <div class="ev-hero-bg" style="background-image:url('${hero.poster}');"></div>
          <div class="ev-hero-overlay"></div>
          <div class="ev-hero-content">
            <div class="ev-hero-coming">Coming Up</div>
            <div class="ev-hero-tag ${heroIsPPV ? '' : 'fn-tag'}">${heroIsPPV ? '⚡ PPV Event' : '🥊 Fight Night'} · ${hero.location}</div>
            <div class="ev-hero-name">${hero.name.replace('UFC ', '').replace(': ', '<br>')}</div>
            <div class="ev-hero-meta">
              <span class="ev-hero-date">${hero.date}</span>
              <span class="ev-hero-loc">${hero.venue}</span>
            </div>
          </div>
          <div class="ev-hero-countdown">
            <div class="ev-hero-days">${heroDays}</div>
            <div class="ev-hero-days-label">Days Away</div>
          </div>
          <div class="ev-hero-view">View Full Card →</div>
        </div>
      `;

      if (rest.length) {
        // Section label
        const section = document.createElement('div');
        section.className = 'ev-section';
        section.innerHTML = '<span class="ev-section-label">More Events</span><div class="ev-section-line"></div>';
        root.appendChild(section);

        // Grid
        const grid = document.createElement('div');
        grid.className = 'ev-grid';
        grid.innerHTML = rest.map(e => {
          const isPPV = e.type === 'PPV';
          const days = daysUntil(e.isoDate);
          const shortName = e.name.replace('UFC Fight Night: ', '').replace('UFC ', '').replace('UFC Freedom ', 'Freedom ');
          return `
            <div class="ev-card ${isPPV ? 'ppv-card' : ''}" data-event="${e.id}">
              <div class="ev-card-bg" style="background-image:url('${e.poster}');"></div>
              <div class="ev-card-overlay"></div>
              <div class="ev-card-days">
                <div class="ev-card-days-num">${days}</div>
                <div class="ev-card-days-label">Days</div>
              </div>
              <div class="ev-card-content">
                <div class="ev-card-tag ${isPPV ? 'ppv' : ''}">${isPPV ? '⚡ PPV' : '🥊 Fight Night'} · ${e.location}</div>
                <div class="ev-card-name">${shortName}</div>
                <div class="ev-card-meta">${e.date} · ${e.venue}</div>
              </div>
            </div>
          `;
        }).join('');
        root.appendChild(grid);
      }

      // Click handlers — open drawer
      root.querySelectorAll('[data-event]').forEach(el => {
        el.addEventListener('click', () => {
          const ev = all.find(e => e.id === el.dataset.event);
          if (ev) openEventDrawer(ev);
        });
      });
    }

    function openEventDrawer(ev) {
      const drawer = document.getElementById('fightDrawer');
      const title = document.getElementById('drawerTitle');
      const content = document.getElementById('drawerContent');
      title.textContent = ev.name;

      function fightRow(f) {
        return `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05);">
          <span style="font-family:'Montserrat',sans-serif;font-weight:700;font-size:0.8rem;color:#fff;">${f.a}</span>
          <span style="font-size:0.65rem;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:0.06em;">${f.weight} · ${f.rounds}</span>
          <span style="font-family:'Montserrat',sans-serif;font-weight:700;font-size:0.8rem;color:#fff;">${f.b}</span>
        </div>`;
      }

      const main = ev.mainCard || [];
      const prelims = ev.prelims || [];
      const early = ev.earlyPrelims || [];

      content.innerHTML = `
        <div style="padding:16px 0;">
          <div style="font-size:0.58rem;font-weight:800;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.3);margin-bottom:10px;">Main Card</div>
          ${main.map(fightRow).join('')}
          ${prelims.length ? `<div style="font-size:0.58rem;font-weight:800;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.3);margin:18px 0 10px;">Prelims</div>${prelims.map(fightRow).join('')}` : ''}
          ${early.length ? `<div style="font-size:0.58rem;font-weight:800;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.3);margin:18px 0 10px;">Early Prelims</div>${early.map(fightRow).join('')}` : ''}
        </div>
      `;

      drawer.setAttribute('aria-hidden', 'false');
      drawer.classList.add('drawer--open');
    }

    document.getElementById('drawerClose').addEventListener('click', closeDrawer);
    document.getElementById('drawerX').addEventListener('click', closeDrawer);
    function closeDrawer() {
      const drawer = document.getElementById('fightDrawer');
      drawer.setAttribute('aria-hidden', 'true');
      drawer.classList.remove('drawer--open');
    }

    loadEvents();
  </script>
  <script src="chat.js"></script>
</body>
</html>
