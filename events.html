<!DOCTYPE html>
<html lang="en">
<head>
  <script src="theme.js"></script>
  <link rel="icon" href="/favicon.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MMA Bridge | Upcoming Events</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    body { background: #080808; }

    .ev-page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 48px 44px 100px;
    }

    .ev-header {
      display: flex; align-items: baseline; gap: 14px;
      margin-bottom: 44px;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .ev-header-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.72rem; font-weight: 800;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: rgba(255,255,255,0.85);
    }

    .ev-header-sub {
      font-size: 0.62rem; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: rgba(255,255,255,0.18);
    }

    /* ── Cinematic row ── */
    .ev-list { display: flex; flex-direction: column; gap: 8px; }

    .ev-row {
      display: grid;
      grid-template-columns: 240px 1fr auto;
      height: 160px;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      background: #0f0f0f;
      border: 1px solid rgba(255,255,255,0.05);
      transition: border-color 0.18s, transform 0.18s;
      position: relative;
    }

    .ev-row:hover {
      border-color: rgba(255,255,255,0.12);
      transform: translateX(4px);
    }

    .ev-row.ppv {
      border-color: rgba(200,168,75,0.12);
    }

    .ev-row.ppv:hover {
      border-color: rgba(200,168,75,0.3);
    }

    /* poster left */
    .ev-poster {
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .ev-poster-img {
      position: absolute; inset: 0;
      background-size: cover;
      background-position: center top;
      transition: transform 0.4s;
    }

    .ev-row:hover .ev-poster-img { transform: scale(1.06); }

    .ev-poster-fade {
      position: absolute; inset: 0;
      background: linear-gradient(to right, transparent 50%, #0f0f0f 100%);
    }

    /* body */
    .ev-body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 32px;
      gap: 7px;
      min-width: 0;
    }

    .ev-type {
      font-size: 0.58rem; font-weight: 800;
      letter-spacing: 0.18em; text-transform: uppercase;
    }

    .ev-type.ppv { color: #c8a84b; }
    .ev-type.fn { color: #00e5ff; }

    .ev-name {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.25rem; font-weight: 900;
      color: #fff; text-transform: uppercase;
      letter-spacing: 0.02em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .ev-row.ppv .ev-name { font-size: 1.45rem; }

    .ev-meta {
      font-size: 0.68rem;
      color: rgba(255,255,255,0.3);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      display: flex; gap: 12px; align-items: center;
    }

    .ev-next-badge {
      font-size: 0.5rem; font-weight: 800;
      letter-spacing: 0.12em; text-transform: uppercase;
      background: #00e5ff; color: #000;
      padding: 2px 7px; border-radius: 3px;
    }

    /* right side */
    .ev-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      padding: 0 32px;
      gap: 8px;
      flex-shrink: 0;
    }

    .ev-days-num {
      font-family: 'Montserrat', sans-serif;
      font-size: 2.2rem; font-weight: 900;
      line-height: 1;
      color: rgba(255,255,255,0.12);
    }

    .ev-row.ppv .ev-days-num { color: rgba(200,168,75,0.35); }

    .ev-row:first-child .ev-days-num { color: rgba(255,255,255,0.5); }

    .ev-days-label {
      font-size: 0.55rem; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: rgba(255,255,255,0.18);
    }

    .ev-view {
      font-size: 0.58rem; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: rgba(255,255,255,0.2);
      transition: color 0.15s;
    }

    .ev-row:hover .ev-view { color: rgba(255,255,255,0.6); }

    /* section divider */
    .ev-divider {
      display: flex; align-items: center; gap: 14px;
      margin: 32px 0 12px;
    }

    .ev-divider-label {
      font-size: 0.56rem; font-weight: 800;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: rgba(255,255,255,0.13); white-space: nowrap;
    }

    .ev-divider-line { flex: 1; height: 1px; background: rgba(255,255,255,0.05); }

    /* light mode */
    body.light-mode { background: #f0f0f0; }
    body.light-mode .ev-row { background: #fff; border-color: rgba(0,0,0,0.06); }
    body.light-mode .ev-name { color: #111; }
    body.light-mode .ev-poster-fade { background: linear-gradient(to right, transparent 50%, #fff 100%); }

    @media (max-width: 700px) {
      .ev-row { grid-template-columns: 120px 1fr auto; height: 110px; }
      .ev-name { font-size: 0.88rem; }
      .ev-row.ppv .ev-name { font-size: 0.95rem; }
      .ev-body { padding: 0 16px; }
      .ev-right { padding: 0 16px; }
      .ev-days-num { font-size: 1.4rem; }
      .ev-page { padding: 24px 16px 60px; }
    }
  </style>
</head>

<body>
  <nav class="navbar">
    <div class="nav-container">
      <a class="logo" href="index.html" style="text-decoration:none;">
        <span class="logo-mma">MMA</span>
        <img src="images/Cage.svg" class="logo-icon" alt="cage icon">
        <span class="logo-bridge">Bridge</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Trending</a></li>
        <li><a href="events.html" class="active">Upcoming Events</a></li>
        <li><a href="pfp.html">PFP</a></li>
        <li><a href="reviews.html">Review</a></li>
        <li><a href="lucas.html">Lucas Bot</a></li>
      </ul>
      <form class="search-box" id="site-search-form" action="results.html" method="GET">
        <input id="site-search" name="q" type="text" placeholder="Search fighters, events..." autocomplete="off" />
        <span class="search-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M21 21l-4.3-4.3m1.8-5.2a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </span>
      </form>
    </div>
  </nav>

  <div class="ev-page">
    <div class="ev-header">
      <span class="ev-header-title">Upcoming Events</span>
      <span class="ev-header-sub">Click any event to see the full card</span>
    </div>
    <div class="ev-list" id="ev-list"></div>
  </div>

  <!-- Fighter Drawer -->
  <div id="fightDrawer" class="drawer" aria-hidden="true">
    <div class="drawer-backdrop" id="drawerClose"></div>
    <aside class="drawer-panel">
      <div class="drawer-top">
        <div class="drawer-title" id="drawerTitle">Fight</div>
        <button class="drawer-x" id="drawerX" aria-label="Close">✕</button>
      </div>
      <div class="drawer-content" id="drawerContent"></div>
    </aside>
  </div>

  <script>
    function daysUntil(iso) {
      return Math.max(0, Math.ceil((new Date(iso + 'T00:00:00') - new Date()) / 86400000));
    }

    async function loadEvents() {
      const res = await fetch('events.json');
      const all = await res.json();
      const upcoming = all
        .filter(e => e.status === 'upcoming')
        .sort((a, b) => new Date(a.isoDate) - new Date(b.isoDate));

      const list = document.getElementById('ev-list');

      function makeRow(e, isFirst) {
        const days = daysUntil(e.isoDate);
        const isPPV = e.type === 'PPV';
        const shortName = e.name
          .replace('UFC Fight Night: ', '')
          .replace('UFC Freedom ', 'Freedom ');

        const row = document.createElement('div');
        row.className = 'ev-row' + (isPPV ? ' ppv' : '');
        row.dataset.event = e.id;
        row.innerHTML = `
          <div class="ev-poster">
            <div class="ev-poster-img" style="background-image:url('${e.poster}');${e.id === 'ufc-freedom-250-topuria-vs-gaethje' ? 'background-size: 85%; background-position: center;' : ''}"></div>
            <div class="ev-poster-fade"></div>
          </div>
          <div class="ev-body">
            <div class="ev-type ${isPPV ? 'ppv' : 'fn'}">
              ${isPPV ? '⚡ PPV' : '🥊 Fight Night'} · ${e.location}
            </div>
            <div class="ev-name">${shortName}</div>
            <div class="ev-meta">
              <span>${e.date}</span>
              <span>${e.venue}</span>
              ${isFirst ? '<span class="ev-next-badge">Next Up</span>' : ''}
            </div>
          </div>
          <div class="ev-right">
            <div class="ev-days-num">${days}</div>
            <div class="ev-days-label">Days Away</div>
            <div class="ev-view">View Card →</div>
          </div>
        `;
        row.addEventListener('click', () => openDrawer(e, all));
        return row;
      }

      // Chronological — no grouping
      upcoming.forEach((e, i) => list.appendChild(makeRow(e, i === 0)));
    }

    function openDrawer(ev, all) {
      const drawer = document.getElementById('fightDrawer');
      document.getElementById('drawerTitle').textContent = ev.name;

      function fightRow(f, sectionType) {
        const isMain = f.slot === 'main';
        const isComain = f.slot === 'comain';
        const isPrelimMain = sectionType === 'prelims' && f.slot === 'main';
        const isPrelimComain = sectionType === 'prelims' && f.slot === 'comain';

        const fontSize = isMain ? '1.35rem' : isComain ? '1.1rem' : isPrelimMain ? '1rem' : isPrelimComain ? '0.9rem' : '0.82rem';
        const fontWeight = (isMain || isComain || isPrelimMain) ? '900' : '700';
        const padding = isMain ? '28px 0' : isComain ? '22px 0' : '16px 0';
        const borderColor = isMain ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.04)';
        const nameColor = (isMain || isComain) ? '#fff' : 'rgba(255,255,255,0.85)';
        const weightSize = isMain ? '0.65rem' : isComain ? '0.6rem' : '0.55rem';
        const weightColor = isMain ? 'rgba(255,255,255,0.4)' : 'rgba(255,255,255,0.22)';

        return `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:${padding};border-bottom:1px solid ${borderColor};">
            <span style="font-family:'Montserrat',sans-serif;font-weight:${fontWeight};font-size:${fontSize};color:${nameColor};flex:1;letter-spacing:0.02em;">${f.a}</span>
            <div style="text-align:center;flex-shrink:0;padding:0 20px;">
              <div style="font-size:${weightSize};color:${weightColor};text-transform:uppercase;letter-spacing:0.1em;font-weight:600;">${f.weight}</div>
              <div style="font-size:0.5rem;color:rgba(255,255,255,0.18);text-transform:uppercase;letter-spacing:0.08em;margin-top:3px;">${f.titleFight ? '🏆 TITLE' : f.rounds}</div>
            </div>
            <span style="font-family:'Montserrat',sans-serif;font-weight:${fontWeight};font-size:${fontSize};color:${nameColor};flex:1;text-align:right;letter-spacing:0.02em;">${f.b}</span>
          </div>`;
      }

      const main = ev.mainCard || [];
      const prelims = ev.prelims || [];
      const early = ev.earlyPrelims || [];

      function section(label, fights, type) {
        if (!fights.length) return '';
        return `
          <div style="font-size:0.58rem;font-weight:800;letter-spacing:0.2em;text-transform:uppercase;color:rgba(255,255,255,0.2);margin:28px 0 8px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,0.06);">${label}</div>
          ${fights.map(f => fightRow(f, type)).join('')}`;
      }

      document.getElementById('drawerContent').innerHTML = `
        <div style="padding:0 4px;">
          ${section('Main Card', main, 'main')}
          ${section('Prelims', prelims, 'prelims')}
          ${section('Early Prelims', early, 'early')}
        </div>`;

      drawer.setAttribute('aria-hidden', 'false');
      drawer.classList.add('open');
    }

    document.getElementById('drawerClose').addEventListener('click', closeDrawer);
    document.getElementById('drawerX').addEventListener('click', closeDrawer);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

    function closeDrawer() {
      const drawer = document.getElementById('fightDrawer');
      drawer.setAttribute('aria-hidden', 'true');
      drawer.classList.remove('open');
    }

    loadEvents();
  </script>
  <script src="chat.js"></script>
</body>
</html>
