name: Daily Social Post

on:
  schedule:
    - cron: '0 18 * * *'   # once daily, 6pm UTC — adjust to whenever you want it to post
  workflow_dispatch:        # lets you trigger a run manually from the Actions tab to test

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies (Puppeteer + Sharp)
        run: npm install

      - name: Generate today's post
        run: node scripts/social-post-daily.js

      - name: Check whether a post was generated
        id: check
        run: |
          if [ -f social/latest.json ]; then
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "generated=false" >> "$GITHUB_OUTPUT"
          fi

      # Nothing auto-posts anywhere from here — review + post yourself from
      # admin.html's Marketing Buddy tab, which reads these files directly:
      # copy a caption + download its image for Twitter, or click
      # "Post to Instagram" to publish via the API once those credentials
      # are set up on Render. Keeps you in control of which of the (up to 3)
      # options actually goes out, instead of the workflow picking one.
      - name: Commit poster images
        if: steps.check.outputs.generated == 'true'
        run: |
          git config user.name  "Social Post Bot"
          git config user.email "bot@mmabridge.com"
          git add social/
          if git diff --staged --quiet; then
            echo "No image changes to commit"
          else
            git commit -m "chore(auto): daily social post $(date -u +%Y-%m-%d)"
            git push
          fi
