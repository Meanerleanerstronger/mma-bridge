name: UFC Data Sync

on:
  schedule:
    # Every 6 hours — picks up new events, posters, card updates
    - cron: '0 */6 * * *'
    # Every 30 min on Sat + Sun UTC — catches results as they come in on fight nights
    - cron: '*/30 * * * 6,0'
  workflow_dispatch: # Manual trigger from GitHub Actions UI

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run UFC sync
        id: sync
        run: node scripts/ufc-sync.js

      - name: Commit & push if changed
        run: |
          git config user.name  "UFC Sync Bot"
          git config user.email "bot@mmabridge.com"
          git add events.json data/events.json
          if git diff --staged --quiet; then
            echo "✅ No changes to commit"
          else
            CHANGES="${{ steps.sync.outputs.changes }}"
            git commit -m "chore(auto): ${CHANGES:-sync UFC data}"
            git push
          fi
