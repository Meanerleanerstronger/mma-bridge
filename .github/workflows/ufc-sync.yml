name: UFC Data Sync

on:
  schedule:
    # Every 6 hours — picks up new events, posters, card updates
    - cron: '0 */6 * * *'
    # Every 15 min, every day — UFC cards aren't only on weekends (Fight
    # Nights land on weekdays too). This is what detects a live-today event
    # and wakes the backend's tight ~60s poller (live_poll.py); the actual
    # in-fight result speed comes from that, not this interval — this just
    # bounds the worst case for "how late could the wake-up itself be."
    - cron: '*/15 * * * *'
  workflow_dispatch: # Manual trigger from GitHub Actions UI

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run UFC sync
        id: sync
        env:
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: node scripts/ufc-sync.js

      - name: Commit & push if changed
        run: |
          git config user.name  "UFC Sync Bot"
          git config user.email "bot@mmabridge.com"
          git add events.json data/events.json data/fighters.json
          if git diff --staged --quiet; then
            echo "✅ No changes to commit"
          else
            CHANGES="${{ steps.sync.outputs.changes }}"
            git commit -m "chore(auto): ${CHANGES:-sync UFC data}"
            git push
          fi
