name: Fighter Stats Sync

on:
  workflow_dispatch:
  schedule:
    # Daily while working through the ~538-fighter backlog (this job was
    # running weekly already but silently produced zero results every time
    # due to two bugs now fixed — a wrong CSS class in the stats parser, and
    # ufcstats.com's own search-by-name being non-functional). Once the
    # backlog clears this reverts to being a light maintenance job.
    - cron: '0 9 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies (Puppeteer)
        run: npm install

      - name: Run fighter stats sync
        run: node scripts/fighter-stats-sync.js --limit 100

      - name: Commit & push if changed
        run: |
          git config user.name  "Fighter Stats Bot"
          git config user.email "bot@mmabridge.com"
          git add data/fighters.json
          if git diff --staged --quiet; then
            echo "✅ No changes to commit"
          else
            git commit -m "chore(auto): sync fighter career stats from ufcstats.com"
            git push
          fi
