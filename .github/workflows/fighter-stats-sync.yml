name: Fighter Stats Sync (Manual)

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (Puppeteer)
        run: npm install

      - name: Run fighter stats sync
        run: node scripts/fighter-stats-sync.js

      - name: Commit & push if changed
        run: |
          git config user.name  "Fighter Stats Bot"
          git config user.email "bot@mmabridge.com"
          git add data/fighters.json
          if git diff --staged --quiet; then
            echo "✅ No changes to commit"
          else
            git commit -m "chore(auto): sync fighter career stats from ufcstats.com"
            git push
          fi
