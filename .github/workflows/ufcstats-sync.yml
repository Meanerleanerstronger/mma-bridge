name: UFCStats Fight Stats Sync

on:
  schedule:
    - cron: '0 10 * * 1-5'       # Weekdays at 10:00 UTC
    - cron: '0 */6 * * 6,0'      # Every 6 hours on Sat + Sun
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run ufcstats sync
        run: node scripts/ufcstats-sync.js

      - name: Commit & push if changed
        run: |
          git config user.name  "UFCStats Bot"
          git config user.email "bot@mmabridge.com"
          git add data/fight-stats/
          if git diff --staged --quiet; then
            echo "✅ No new fight stats"
          else
            git commit -m "chore(auto): sync UFC fight stats from ufcstats.com"
            git push
          fi
