name: Rankings Sync

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run rankings sync
        run: node scripts/rankings-sync.js

      - name: Commit & push if changed
        run: |
          git config user.name  "Rankings Sync Bot"
          git config user.email "bot@mmabridge.com"
          git add data/rankings.json
          if git diff --staged --quiet; then
            echo "✅ No changes to commit"
          else
            git commit -m "chore(auto): sync UFC divisional rankings"
            git push
          fi
