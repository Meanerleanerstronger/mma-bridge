<!DOCTYPE html>
<html lang="en">
<head>
  <script src="theme.js"></script>
  <link rel="icon" href="/favicon.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MMA Bridge | Reviews</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Pacifico&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />

  <style>
    /* ── KEYFRAMES ── */
    @keyframes shimmerSlide {
      0%   { background-position: -300% center; }
      100% { background-position: 300% center; }
    }
    @keyframes heroIn {
      from { opacity: 0; transform: translateY(-14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes rv-shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    @keyframes accentGrow {
      from { transform: scaleY(0); opacity: 0; }
      to   { transform: scaleY(1); opacity: 1; }
    }

    body {
      background: #060608;
      background-image:
        radial-gradient(ellipse 60% 35% at 100% 0%, rgba(0,229,255,0.04) 0%, transparent 55%),
        radial-gradient(ellipse 50% 30% at 0% 100%, rgba(200,168,75,0.03) 0%, transparent 50%);
    }

    /* ── HERO ── */
    .rv-hero {
      padding: 52px 40px 40px;
      text-align: center;
      animation: heroIn 0.5s ease both;
    }
    .rv-hero h1 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: clamp(2.2rem, 5vw, 3.6rem);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #fff;
      margin: 0 0 8px;
    }
    .rv-hero h1 span {
      background: linear-gradient(120deg, #00e5ff 0%, #80ffea 40%, #00b8d4 70%, #00e5ff 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmerSlide 4s linear infinite;
    }
    .rv-hero p {
      color: rgba(255,255,255,0.3);
      font-family: 'Inter', sans-serif;
      font-size: 0.88rem;
      margin: 0 0 28px;
      letter-spacing: 0.02em;
    }
    .rv-search-wrap {
      max-width: 480px;
      margin: 0 auto;
      position: relative;
    }
    .rv-search-wrap input {
      width: 100%;
      background: #0e0e12;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.92rem;
      padding: 13px 42px 13px 18px;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    .rv-search-wrap input:focus {
      border-color: rgba(0,229,255,0.45);
      box-shadow: 0 0 0 3px rgba(0,229,255,0.08), 0 0 24px rgba(0,229,255,0.06);
    }
    .rv-search-wrap input::placeholder { color: rgba(255,255,255,0.2); }
    .rv-search-icon {
      position: absolute; right: 14px; top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,0.25); pointer-events: none;
      transition: color 0.2s;
    }
    .rv-search-wrap input:focus + .rv-search-icon { color: rgba(0,229,255,0.5); }
    .rv-search-icon svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* ── ROWS ── */
    .rv-rows { padding: 20px 0 80px; }
    .rv-row { margin-bottom: 52px; }

    .rv-row-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      margin-bottom: 18px;
    }
    .rv-row-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.85);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .row-accent {
      display: inline-block;
      width: 3px; height: 16px;
      background: linear-gradient(to bottom, #00e5ff, rgba(0,229,255,0.3));
      border-radius: 2px;
      flex-shrink: 0;
      transform-origin: top;
      animation: accentGrow 0.4s 0.2s ease both;
    }
    .rv-row-count {
      font-family: 'Inter', sans-serif;
      font-size: 0.66rem;
      color: rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 20px;
      padding: 2px 10px;
    }

    /* Scroll container */
    .rv-scroll-outer { position: relative; }
    .rv-scroll {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      padding: 8px 40px 20px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .rv-scroll::-webkit-scrollbar { display: none; }

    /* Arrow buttons */
    .rv-arrow {
      position: absolute;
      top: 50%; transform: translateY(-60%);
      z-index: 10;
      background: rgba(6,6,8,0.85);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.6);
      width: 40px; height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      transition: background 0.2s, border-color 0.2s, color 0.2s, box-shadow 0.2s, transform 0.2s cubic-bezier(0.34,1.56,0.64,1);
      backdrop-filter: blur(8px);
      opacity: 0.7;
    }
    .rv-arrow:hover {
      background: rgba(0,229,255,0.1);
      border-color: rgba(0,229,255,0.4);
      color: #00e5ff;
      opacity: 1;
      transform: translateY(-60%) scale(1.1);
      box-shadow: 0 0 18px rgba(0,229,255,0.2);
    }
    .rv-arrow.left { left: 6px; }
    .rv-arrow.right { right: 6px; }

    /* ── PPV CARD ── */
    .rv-card {
      flex-shrink: 0;
      cursor: pointer;
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: #0e0e12;
      border: 1px solid rgba(255,255,255,0.08);
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), border-color 0.25s, box-shadow 0.3s;
    }
    .rv-card.ppv { width: 260px; height: 340px; }
    .rv-card.fn  { width: 220px; height: 290px; }

    .rv-card:hover {
      transform: translateY(-10px) scale(1.02);
      border-color: rgba(0,229,255,0.4);
      box-shadow: 0 28px 60px rgba(0,0,0,0.75), 0 0 0 1px rgba(0,229,255,0.08), 0 0 40px rgba(0,229,255,0.06);
    }

    /* Full bleed image */
    .rv-card .card-poster {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: top center;
      transition: transform 0.5s cubic-bezier(0.22,1,0.36,1);
    }
    .rv-card:hover .card-poster { transform: scale(1.08); }

    .rv-card .card-placeholder {
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, #141418 0%, #0a0a0e 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 3rem;
    }

    .rv-card .card-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(0,0,0,0.96) 0%,
        rgba(0,0,0,0.62) 35%,
        rgba(0,0,0,0.1) 65%,
        transparent 100%
      );
      z-index: 1;
    }

    /* Text overlaid at bottom */
    .rv-card .card-info {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 14px 16px 18px;
      z-index: 2;
    }
    .rv-card .card-name {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: #fff;
      line-height: 1.2;
      margin-bottom: 5px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
    }
    .rv-card.ppv .card-name { font-size: 1.1rem; }
    .rv-card .card-matchup {
      font-family: 'Inter', sans-serif;
      font-size: 0.71rem;
      color: rgba(255,255,255,0.58);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 1px 6px rgba(0,0,0,0.9);
    }

    /* Type badge top-left */
    .rv-card .card-badge {
      position: absolute;
      top: 12px; left: 12px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 0.5rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 4px 9px;
      border-radius: 4px;
      backdrop-filter: blur(10px);
      z-index: 3;
    }
    .rv-card.ppv .card-badge {
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,210,0,0.45);
      color: #ffd700;
    }
    .rv-card.fn .card-badge {
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(0,229,255,0.35);
      color: #00e5ff;
    }

    /* Community rating badge top-right */
    .rv-card .card-rating {
      position: absolute;
      top: 12px; right: 12px;
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(0,229,255,0.3);
      color: #00e5ff;
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 0.58rem;
      padding: 4px 9px;
      border-radius: 4px;
      backdrop-filter: blur(8px);
      z-index: 3;
    }

    /* Bottom glow line on hover — slides in */
    .rv-card::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #00e5ff 30%, #80ffea 50%, #00e5ff 70%, transparent);
      background-size: 200% auto;
      opacity: 0;
      transition: opacity 0.25s;
      animation: shimmerSlide 3s linear infinite;
      z-index: 4;
    }
    .rv-card:hover::after { opacity: 1; }

    /* ── SKELETON ── */
    .rv-skel {
      flex-shrink: 0;
      border-radius: 12px;
      overflow: hidden;
      background: #0e0e12;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .rv-skel.ppv { width: 220px; }
    .rv-skel.fn  { width: 190px; }
    .rv-skel-poster {
      width: 100%; aspect-ratio: 2/3;
      background: linear-gradient(90deg, #121216 25%, #1a1a20 50%, #121216 75%);
      background-size: 200% 100%;
      animation: rv-shimmer 1.4s infinite;
    }
    .rv-skel-info { padding: 10px 13px 13px; background: #0e0e12; }
    .rv-skel-line {
      height: 8px; border-radius: 4px; margin-bottom: 7px;
      background: linear-gradient(90deg, #121216 25%, #1a1a20 50%, #121216 75%);
      background-size: 200% 100%;
      animation: rv-shimmer 1.4s infinite;
    }
    .rv-skel-line.s { width: 55%; }

    /* Search results */
    #rvSearchPanel .rv-scroll {
      flex-wrap: wrap;
      overflow-x: visible;
      padding: 0 40px 20px;
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-container">
      <a class="logo" href="index.html" style="text-decoration:none;">
        <span class="logo-mma">MMA</span>
        <img src="images/Cage.svg" class="logo-icon" alt="cage icon">
        <span class="logo-bridge">Bridge</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Trending</a></li>
        <li><a href="events.html">Upcoming Events</a></li>
        <li><a href="pfp.html">PFP</a></li>
        <li><a href="reviews.html" class="active">Review</a></li>
        <li><a href="lucas.html">Lucas Bot</a></li>
      </ul>
      <form class="search-box" id="site-search-form" action="results.html" method="GET">
        <input id="site-search" name="q" type="text" placeholder="Search fighters, events..." autocomplete="off" />
        <span class="search-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M21 21l-4.3-4.3m1.8-5.2a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </span>
      </form>
    </div>
  </nav>

  <!-- HERO -->
  <div class="rv-hero">
    <h1>Event <span>Reviews</span></h1>
    <p>Rate the hype. Lock your Fight of the Night pick.</p>
    <div class="rv-search-wrap">
      <input type="text" id="rvSearch" placeholder="Search events…" autocomplete="off" />
      <span class="rv-search-icon">
        <svg viewBox="0 0 24 24"><path d="M21 21l-4.3-4.3m1.8-5.2a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      </span>
    </div>
  </div>

  <!-- Main rows (shown when not searching) -->
  <div class="rv-rows" id="rvRows">
    <!-- PPV Row -->
    <div class="rv-row" id="rowPPV">
      <div class="rv-row-header">
        <div class="rv-row-title"><span class="row-accent"></span>PPV Events</div>
        <div class="rv-row-count" id="ppvCount"></div>
      </div>
      <div class="rv-scroll-outer">
        <button class="rv-arrow left" data-target="scrollPPV">&#8592;</button>
        <div class="rv-scroll" id="scrollPPV">
          <div class="rv-skel ppv"><div class="rv-skel-poster"></div><div class="rv-skel-info"><div class="rv-skel-line"></div><div class="rv-skel-line s"></div></div></div>
          <div class="rv-skel ppv"><div class="rv-skel-poster"></div><div class="rv-skel-info"><div class="rv-skel-line"></div><div class="rv-skel-line s"></div></div></div>
          <div class="rv-skel ppv"><div class="rv-skel-poster"></div><div class="rv-skel-info"><div class="rv-skel-line"></div><div class="rv-skel-line s"></div></div></div>
        </div>
        <button class="rv-arrow right" data-target="scrollPPV">&#8594;</button>
      </div>
    </div>

    <!-- Fight Night Row -->
    <div class="rv-row" id="rowFN">
      <div class="rv-row-header">
        <div class="rv-row-title"><span class="row-accent"></span>Fight Nights</div>
        <div class="rv-row-count" id="fnCount"></div>
      </div>
      <div class="rv-scroll-outer">
        <button class="rv-arrow left" data-target="scrollFN">&#8592;</button>
        <div class="rv-scroll" id="scrollFN">
          <div class="rv-skel fn"><div class="rv-skel-poster"></div><div class="rv-skel-info"><div class="rv-skel-line"></div><div class="rv-skel-line s"></div></div></div>
          <div class="rv-skel fn"><div class="rv-skel-poster"></div><div class="rv-skel-info"><div class="rv-skel-line"></div><div class="rv-skel-line s"></div></div></div>
          <div class="rv-skel fn"><div class="rv-skel-poster"></div><div class="rv-skel-info"><div class="rv-skel-line"></div><div class="rv-skel-line s"></div></div></div>
        </div>
        <button class="rv-arrow right" data-target="scrollFN">&#8594;</button>
      </div>
    </div>
  </div>

  <!-- Search results panel -->
  <div id="rvSearchPanel" style="display:none; padding:0 0 80px;">
    <div class="rv-row-header" style="padding:0 40px 0; margin-bottom:16px;">
      <div class="rv-row-title"><span class="row-accent"></span><span id="searchLabel">Results</span></div>
    </div>
    <div class="rv-scroll" id="searchGrid" style="flex-wrap:wrap; overflow-x:visible; padding:0 40px 20px;"></div>
    <div id="searchEmpty" style="display:none; padding:20px 40px; color:rgba(255,255,255,0.25); font-family:'Inter',sans-serif; font-size:0.88rem;">No events found.</div>
  </div>

  <script type="module" src="reviews.js"></script>
  <script src="chat.js"></script>
</body>
</html>
