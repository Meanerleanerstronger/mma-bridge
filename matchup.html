<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="images/mma-bridge-logo.png">
  <link rel="shortcut icon" type="image/png" href="images/mma-bridge-logo.png">
  <link rel="apple-touch-icon" href="images/mma-bridge-logo.png">
  <meta name="theme-color" content="#ff8a3d">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <script src="theme.js?v=2.7"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fight Matchup | MMA Bridge</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600&family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,800;1,900&family=Newsreader:ital,wght@0,400;0,500;1,400;1,500&family=Oswald:wght@700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css?v=9.22" />
  <style>
    *, *::before, *::after { box-sizing:border-box; }
    body { background:#040407; min-height:100vh; }

    /* ── BACK BAR ── */
    /* Was a bare colored text link floating with no background at all —
       looked unfinished next to the page's otherwise bold poster-style
       design. Given the same real pill treatment as the other back
       buttons across the site (fighter.html, fightcard.html). */
    .mu-back {
      display:inline-flex; align-items:center; gap:7px;
      font-family:'Montserrat',sans-serif; font-weight:700; font-size:.6rem;
      letter-spacing:.14em; text-transform:uppercase;
      color:rgba(255,255,255,.55); text-decoration:none;
      margin:16px 0 0 24px; padding:8px 16px;
      background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14);
      border-radius:20px;
      transition:color .18s, background .18s, border-color .18s;
    }
    .mu-back:hover { color:#ff8a3d; background:rgba(255,138,61,.1); border-color:rgba(255,138,61,.3); }

    /* ── HERO — poster-style: diagonal corner-color wash, bigger vivid
       photos, VS medallion, big shadowed type. Replaces the previous
       deliberately-flat "plain dark ground + hairline divider" version. ── */
    .mu-hero {
      position:relative; overflow:hidden;
      min-height:480px;
      background:#050506;
      margin-top:10px;
      transition:min-height .3s ease;
    }
    /* Flat near-black hero — same "no glow, no diagonal wash" call already
       made for Classic mode below applies here too, since this is the view
       almost everyone actually sees. */
    .mu-hero-glow-a, .mu-hero-glow-b, .mu-hero-noise, .mu-hero-slash { display:none; }

    /* fighter images — bigger, full color */
    .mu-hero-imgs {
      position:absolute; inset:0;
      display:grid; grid-template-columns:1fr 1fr;
      pointer-events:none; z-index:1;
    }
    .mu-hero-img-wrap { display:flex; align-items:flex-end; overflow:hidden; }
    .mu-hero-img-wrap.a { justify-content:flex-start; padding-left:1%; }
    .mu-hero-img-wrap.b { justify-content:flex-end; padding-right:1%; }
    .mu-hero-img {
      height:440px; width:auto; max-width:62%;
      object-fit:contain; object-position:bottom center;
      filter:grayscale(0.05) contrast(1.06);
      opacity:.97;
    }
    .mu-hero-img-wrap.a .mu-hero-img {
      filter:grayscale(0.05) contrast(1.06) drop-shadow(0 10px 26px rgba(0,0,0,.85));
    }
    .mu-hero-img-wrap.b .mu-hero-img {
      transform:scaleX(-1);
      filter:grayscale(0.05) contrast(1.06) drop-shadow(0 10px 26px rgba(0,0,0,.85));
    }

    /* text overlay */
    .mu-hero-text {
      position:relative; z-index:3;
      display:grid; grid-template-columns:1fr auto 1fr;
      align-items:flex-end;
      padding:36px 28px 28px;
      min-height:480px;
      transition:min-height .3s ease;
    }
    .mu-hero-side { display:flex; flex-direction:column; gap:9px; }
    .mu-hero-side.b { align-items:flex-end; text-align:right; }

    .mu-fighter-name {
      font-family:'Barlow Condensed',sans-serif; font-weight:900; font-style:italic;
      font-size:clamp(2.6rem,6.8vw,5.4rem);
      text-transform:uppercase; letter-spacing:.005em; line-height:.88;
      text-decoration:none; transition:opacity .2s;
      display:inline-block;
      color:#fff;
      -webkit-text-stroke:1px rgba(0,0,0,.4);
      text-shadow:0 3px 0 rgba(0,0,0,.9), 0 8px 34px rgba(0,0,0,.75);
    }
    .mu-fighter-name.a { text-shadow:0 3px 0 rgba(0,0,0,.9), 0 8px 34px rgba(255,138,61,.35); }
    .mu-fighter-name.b { text-shadow:0 3px 0 rgba(0,0,0,.9), 0 8px 34px rgba(96,165,250,.3); }
    .mu-fighter-name:hover { opacity:.85; }

    .mu-fighter-chips { display:flex; gap:5px; flex-wrap:wrap; }
    .mu-hero-side.b .mu-fighter-chips { justify-content:flex-end; }
    .mu-chip {
      font-family:'Montserrat',sans-serif; font-weight:700; font-size:.46rem;
      letter-spacing:.1em; text-transform:uppercase;
      padding:3px 8px; border-radius:2px;
      border:1px solid rgba(255,255,255,.16);
      color:rgba(255,255,255,.55);
    }
    /* gold champion badge + record chip — extra poster-style flavor beyond
       the plain nationality/stance tags. */
    .mu-chip.champ {
      color:#1a1206; border-color:transparent;
      background:linear-gradient(135deg,#f4d99a,#c9922f 55%,#8a5f1c);
      font-weight:800;
    }
    .mu-chip.record {
      color:#ff8a3d; border-color:rgba(255,138,61,.4);
      font-variant-numeric:tabular-nums;
    }
    .mu-hero-side.b .mu-chip.record { color:#60a5fa; border-color:rgba(96,165,250,.4); }

    /* VS medallion — plain lit badge, no spinning graphic behind it. */
    .mu-vs-center {
      text-align:center; padding:0 6px;
      display:flex; flex-direction:column; align-items:center; gap:8px;
      padding-bottom:10px;
    }
    .mu-vs-badge {
      width:56px; height:56px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      background:#141414;
      border:1.5px solid rgba(255,138,61,.4);
    }
    .mu-vs-text {
      font-family:'Barlow Condensed',sans-serif; font-weight:900; font-style:italic;
      font-size:1.05rem; letter-spacing:.02em;
      color:#fff; text-shadow:0 2px 6px rgba(0,0,0,.7);
    }
    .mu-vs-weight {
      font-family:'Montserrat',sans-serif; font-weight:700; font-size:.62rem;
      letter-spacing:.12em; text-transform:uppercase;
      color:rgba(255,255,255,.45); white-space:nowrap;
    }
    /* optional custom tag (e.g. "REMATCH") above the VS medallion in
       Poster (banner) mode — same gradient-sheen fill as the site's other
       shiny badges, not a glow. */
    .mu-poster-tag {
      background:linear-gradient(165deg, #ffb066 0%, #ff8a3d 45%, #e8691c 100%);
      color:#0a0a0a; border-radius:20px;
      font-family:'Montserrat',sans-serif; font-weight:900; font-size:.5rem;
      letter-spacing:.14em; text-transform:uppercase;
      padding:4px 12px; white-space:nowrap;
    }

    /* bottom fade */
    .mu-hero-fade {
      position:absolute; bottom:0; left:0; right:0; height:100px;
      background:linear-gradient(to top,#040407 0%,transparent 100%);
      pointer-events:none; z-index:2;
    }

    /* ── VIEW TOGGLE ── */
    .mu-view-toggle {
      display:inline-flex; gap:2px; margin:16px 24px 0;
      border:1px solid rgba(255,255,255,.12); border-radius:20px; padding:2px;
    }
    .mu-view-btn {
      font-family:'Montserrat',sans-serif; font-weight:800; font-size:.6rem;
      letter-spacing:.1em; text-transform:uppercase;
      padding:7px 16px; border-radius:18px; border:none; cursor:pointer;
      background:transparent; color:rgba(255,255,255,.4);
      transition:background .18s, color .18s;
    }
    .mu-view-btn.active { background:#ff8a3d; color:#0a0a0a; }
    .mu-view-btn:hover:not(.active) { color:#fff; }

    /* ── POSTER MODE — full-bleed, chrome hidden, always dark regardless
       of site theme (a promo poster shouldn't adapt to light mode),
       sized so a straight screenshot is ready to post as-is. ── */
    body.mu-poster-mode { background:#050506 !important; }
    body.mu-poster-mode .navbar,
    body.mu-poster-mode .mu-back,
    body.mu-poster-mode .mu-content,
    body.mu-poster-mode .mu-split-bar,
    /* Floating chrome (Lucas chat launcher, "Live on MMA Bridge" activity
       widget, notification bell) — same reasoning as the social pipeline's
       screenshot bot hiding these: they'd show up in anyone's real
       screenshot too, and don't belong in a shareable poster. */
    body.mu-poster-mode #lw-btn,
    body.mu-poster-mode #lw-window,
    body.mu-poster-mode #lw-widget,
    body.mu-poster-mode #lw-tab,
    body.mu-poster-mode #notifBellMount { display:none !important; }
    /* Center the hero at its natural content height (the same height that
       already reads well in Full mode) inside the viewport — stretching it
       to a forced 100vh left a dead gap up top with align-items:flex-end
       shoving the actual photos/names down near the bottom edge, cropped
       off-screen. Centering, not stretching, is the fix. */
    body.mu-poster-mode #muRoot {
      min-height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }
    body.mu-poster-mode .mu-view-toggle {
      position:fixed; top:16px; left:16px; margin:0; z-index:20;
    }
    body.mu-poster-mode .mu-fighter-name { font-size:clamp(3rem,9vw,7rem); }
    .mu-poster-controls {
      position:fixed; top:16px; right:16px; z-index:20;
      display:none; align-items:center; gap:8px;
    }
    body.mu-poster-mode .mu-poster-controls { display:flex; }
    .mu-poster-exit {
      background:rgba(0,0,0,.55); backdrop-filter:blur(8px);
      border:1px solid rgba(255,255,255,.2); border-radius:20px;
      color:#fff; font-family:'Montserrat',sans-serif; font-weight:700;
      font-size:.62rem; letter-spacing:.08em; text-transform:uppercase;
      padding:9px 18px; cursor:pointer; white-space:nowrap;
    }

    /* poster theme toggle — separate from the site-wide theme, since a
       promo poster shouldn't inherit whatever mode the visitor happens to
       be browsing in. Dark is the default look; light flips the negative
       space (the container itself) to white/cream while keeping the
       per-side color wash. */
    .mu-poster-theme {
      flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      width:34px; height:34px;
      background:rgba(0,0,0,.55); backdrop-filter:blur(8px);
      border:1px solid rgba(255,255,255,.2); border-radius:50%;
      color:#fff; font-size:.85rem; cursor:pointer;
    }

    /* poster brand watermark — small corner tag so a re-shared screenshot
       still reads as MMA Bridge content even cropped loosely. */
    .mu-poster-brand {
      position:absolute; left:24px; bottom:16px; z-index:3;
      display:none;
      font-family:'Montserrat',sans-serif; font-weight:800; font-size:.56rem;
      letter-spacing:.22em; text-transform:uppercase;
      color:rgba(255,255,255,.4);
    }
    body.mu-poster-mode .mu-poster-brand { display:block; }

    /* poster event line — plain, big, sits below the hero (not overlaid on
       the photos) so it never fights with the fighters for space and stays
       legible in one line regardless of theme. */
    .mu-poster-eventline {
      display:none;
      text-align:center;
      padding:18px 20px;
      background:#050506;
      font-family:'Barlow Condensed',sans-serif; font-weight:800; font-style:italic;
      font-size:clamp(1.3rem,3.6vw,2.1rem); letter-spacing:.01em; text-transform:uppercase;
      color:rgba(255,255,255,.9);
    }
    body.mu-poster-mode .mu-poster-eventline.has-text { display:block; }

    /* poster grain/texture — repurposes the previously-unused
       .mu-hero-noise element instead of leaving the poster a flat gradient
       ("less boring" — diagonal hairline texture reads as a print poster
       instead of a plain screenshot). */
    body.mu-poster-mode .mu-hero-noise {
      display:block; position:absolute; inset:0; z-index:0; pointer-events:none;
      background-image:repeating-linear-gradient(45deg, rgba(255,255,255,.03) 0 2px, transparent 2px 14px);
      mix-blend-mode:overlay;
    }
    body.mu-poster-mode .mu-vs-weight {
      font-size:.56rem; padding:4px 12px; border-radius:2px;
      border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.06);
      transform:rotate(-2deg);
    }

    /* ── POSTER LIGHT MODE — independent of the toggle above; flips the
       negative space white/cream instead of near-black. ── */
    body.mu-poster-mode.mu-poster-light { background:#f6f3ec !important; }
    body.mu-poster-mode.mu-poster-light .mu-hero { background:#f6f3ec; }
    body.mu-poster-mode.mu-poster-light .mu-hero-fade { background:linear-gradient(to top,#f6f3ec 0%,transparent 100%); }
    body.mu-poster-mode.mu-poster-light .mu-hero-glow-a { background:linear-gradient(120deg, rgba(255,138,61,.24) 0%, rgba(255,138,61,.03) 55%, transparent 75%); }
    body.mu-poster-mode.mu-poster-light .mu-hero-glow-b { background:linear-gradient(240deg, rgba(37,99,235,.2) 0%, rgba(37,99,235,.03) 55%, transparent 75%); }
    body.mu-poster-mode.mu-poster-light .mu-hero-noise { background-image:repeating-linear-gradient(45deg, rgba(0,0,0,.025) 0 2px, transparent 2px 14px); mix-blend-mode:multiply; }
    body.mu-poster-mode.mu-poster-light .mu-fighter-name {
      color:#161514; -webkit-text-stroke:1px rgba(255,255,255,.6);
      text-shadow:0 3px 0 rgba(255,255,255,.75), 0 8px 30px rgba(0,0,0,.15);
    }
    body.mu-poster-mode.mu-poster-light .mu-fighter-name.a { text-shadow:0 3px 0 rgba(255,255,255,.75), 0 8px 30px rgba(255,138,61,.3); }
    body.mu-poster-mode.mu-poster-light .mu-fighter-name.b { text-shadow:0 3px 0 rgba(255,255,255,.75), 0 8px 30px rgba(37,99,235,.28); }
    body.mu-poster-mode.mu-poster-light .mu-vs-badge {
      background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.95), rgba(230,225,215,.6) 70%);
      border-color:rgba(0,0,0,.15);
      box-shadow:0 0 0 1px rgba(0,0,0,.08), 0 0 26px rgba(255,138,61,.25), inset 0 0 14px rgba(0,0,0,.06);
    }
    body.mu-poster-mode.mu-poster-light .mu-vs-text { color:#161514; text-shadow:0 1px 2px rgba(255,255,255,.7); }
    body.mu-poster-mode.mu-poster-light .mu-vs-weight { color:rgba(0,0,0,.55); border-color:rgba(0,0,0,.18); background:rgba(0,0,0,.04); }
    body.mu-poster-mode.mu-poster-light .mu-poster-brand { color:rgba(0,0,0,.4); }
    body.mu-poster-mode.mu-poster-light .mu-poster-eventline { background:#f6f3ec; color:rgba(0,0,0,.8); }
    body.mu-poster-mode.mu-poster-light .mu-poster-exit,
    body.mu-poster-mode.mu-poster-light .mu-poster-theme {
      background:rgba(255,255,255,.7); border-color:rgba(0,0,0,.16); color:#161514;
    }
    body.mu-poster-mode.mu-poster-light .mu-view-toggle,
    body.mu-classic-mode.mu-poster-light .mu-view-toggle { border-color:rgba(0,0,0,.16); }
    body.mu-poster-mode.mu-poster-light .mu-view-btn,
    body.mu-classic-mode.mu-poster-light .mu-view-btn { color:rgba(0,0,0,.4); }
    body.mu-poster-mode.mu-poster-light .mu-view-btn:hover:not(.active),
    body.mu-classic-mode.mu-poster-light .mu-view-btn:hover:not(.active) { color:#161514; }
    body.mu-classic-mode.mu-poster-light .mu-poster-exit,
    body.mu-classic-mode.mu-poster-light .mu-poster-theme {
      background:rgba(255,255,255,.7); border-color:rgba(0,0,0,.16); color:#161514;
    }

    /* ── CLASSIC MODE — a second, distinct poster style: official
       fight-poster layout (both fighters standing side by side facing
       forward, stacked name lockup, event badge, bottom info bar) rather
       than the split-screen banner of Poster mode. Orange/black or
       orange/white only — deliberately not a copy of any promotion's
       actual poster art or logo, just the same genre of layout. ── */
    body.mu-classic-mode { background:#050506 !important; }
    body.mu-classic-mode .navbar,
    body.mu-classic-mode .mu-back,
    body.mu-classic-mode .mu-content,
    body.mu-classic-mode .mu-split-bar,
    body.mu-classic-mode .mu-hero,
    body.mu-classic-mode #lw-btn,
    body.mu-classic-mode #lw-window,
    body.mu-classic-mode #lw-widget,
    body.mu-classic-mode #lw-tab,
    body.mu-classic-mode #notifBellMount { display:none !important; }
    body.mu-classic-mode .mu-view-toggle { position:fixed; top:16px; left:16px; margin:0; z-index:20; }
    body.mu-classic-mode .mu-poster-controls { display:flex; }
    body.mu-classic-mode .mu-poster-exit,
    body.mu-classic-mode .mu-poster-theme { background:rgba(0,0,0,.55); border-color:rgba(255,255,255,.2); color:#fff; }

    .mu-classic-wrap {
      display:none;
      min-height:100vh; padding:80px 16px 32px;
      align-items:center; justify-content:center;
    }
    body.mu-classic-mode .mu-classic-wrap { display:flex; }

    /* Third pass — explicit feedback: the radial spotlight glow and the
       colored drop-shadow rim-light on the photos both read as "AI slop,"
       not premium. Everything glow-based is gone: no radial gradient, no
       blurred text-shadow, no drop-shadow rim-light. Background is a flat
       near-black with a scattered orange speckle texture instead (crisp
       dots, not a soft blur). Solid-fill elements (badge, VS) get a tight
       linear-gradient sheen for a "shiny" quality that's a hard highlight,
       not a diffuse glow — those read completely differently even though
       both involve a gradient. Names switch to italic Barlow Condensed
       (this site's own established type voice elsewhere, e.g. the banner
       Poster mode) instead of upright Montserrat, which was reading as a
       direct copy of UFC's own poster typography rather than "inspired by." */
    .mu-classic-card {
      position:relative; overflow:hidden;
      width:min(92vw, 520px); aspect-ratio:4/5;
      /* Grounding shadow baked into the background — a soft dark ellipse
         under where the fighters' feet land — so they read as standing ON
         something instead of pasted onto flat color with a hard cutout
         edge and no contact shadow (the single biggest "cheap cutout"
         tell). */
      background:
        radial-gradient(ellipse 62% 15% at 50% 79%, rgba(0,0,0,.55), transparent 70%),
        #0a0908;
      border-radius:4px;
      /* inset line = a real frame edge (crisp, not a blur) instead of a
         borderless image dump; outer shadow keeps the card feeling lifted
         off the page. */
      box-shadow:inset 0 0 0 1px rgba(232,105,28,.3), 0 30px 90px rgba(0,0,0,.65);
      font-family:'Montserrat',sans-serif;
    }
    /* scattered speckle texture — two dot layers at different scales/
       offsets so it reads as irregular grain, not a repeating pattern. */
    .mu-classic-card::before {
      content:''; position:absolute; inset:0; z-index:0; pointer-events:none;
      background-image:
        radial-gradient(circle, rgba(255,138,61,.5) 1px, transparent 1.6px),
        radial-gradient(circle, rgba(255,138,61,.28) 1px, transparent 1.6px);
      background-size:29px 29px, 17px 17px;
      background-position:0 0, 8px 12px;
      opacity:.55;
    }
    /* vignette — plain edge-darkening (NOT a colored glow/blur), the
       classic photography/poster trick that pulls the eye to the center
       and keeps flat corners from feeling empty. Sits above the photos so
       it actually darkens their outer edges too. */
    .mu-classic-card::after {
      content:''; position:absolute; inset:0; z-index:2; pointer-events:none;
      background:radial-gradient(ellipse at 50% 45%, transparent 52%, rgba(0,0,0,.5) 100%);
    }
    /* logo — top-dead-center of the card. The event-name badge that used
       to sit below it is gone (moved to plain text at the bottom, next to
       the location line — see .mu-classic-eventline) — with only the logo
       up here now, far less headroom is needed above the fighters. */
    .mu-classic-logo {
      position:absolute; top:3%; left:50%; z-index:3;
      transform:translateX(-50%);
      width:68px; height:68px;
      filter:drop-shadow(0 6px 14px rgba(0,0,0,.4));
    }
    /* optional custom tag (e.g. "REMATCH") — small ribbon, top-left corner. */
    .mu-classic-tagline {
      position:absolute; top:6%; left:20px; z-index:3;
      background:linear-gradient(165deg, #ff9a4d 0%, #e8691c 60%, #c65a12 100%);
      color:#0a0a0a; border-radius:3px;
      font-family:'Montserrat',sans-serif; font-weight:900;
      font-size:.62rem; letter-spacing:.1em; text-transform:uppercase;
      padding:6px 12px;
      box-shadow:0 6px 16px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.45), inset 0 -2px 0 rgba(0,0,0,.18);
    }
    /* Bigger fighters now that there's no badge eating vertical space —
       top pulled back up (only the small logo needs headroom) and the max
       width opened up so they fill more of the frame. */
    .mu-classic-photos {
      position:absolute; left:0; right:0; bottom:23%; top:13%; z-index:1;
      display:flex; align-items:flex-end; justify-content:center;
    }
    .mu-classic-img {
      height:100%; width:auto; max-width:68%;
      object-fit:contain; object-position:bottom center;
      filter:contrast(1.12) saturate(1.02);
    }
    .mu-classic-img.a { margin-right:-3%; z-index:2; }
    .mu-classic-img.b { margin-left:-3%; z-index:1; }
    /* name lockup sits bottom-left, both fighters stacked together —
       not split across the poster. */
    .mu-classic-textblock {
      position:absolute; left:20px; right:20px; z-index:3;
      bottom:22px;
    }
    .mu-classic-name-row { display:flex; align-items:baseline; gap:9px; }
    /* Names go back to flipping per mode — white on the dark card, black
       on the light one (see the light-mode override below) — while VS
       below stays the constant orange accent in both. Extruded "3D poster
       type" — a few crisp, hard-offset (NOT blurred) stacked shadow layers
       behind the letterforms — is what actually reads as premium/
       game-title depth; a flat fill always reads flat no matter the
       color. */
    .mu-classic-name {
      font-family:'Barlow Condensed',sans-serif;
      font-weight:800; font-style:italic; text-transform:uppercase;
      font-size:clamp(1.6rem,7vw,2.5rem); line-height:.94;
      color:#fff; letter-spacing:.005em;
      text-shadow:2px 2px 0 rgba(40,16,4,.9), 4px 4px 0 rgba(20,8,2,.55);
    }
    .mu-classic-vsline {
      display:flex; align-items:baseline; gap:12px;
      font-family:'Barlow Condensed',sans-serif;
      font-weight:800; font-style:italic; text-transform:uppercase;
      font-size:clamp(1.6rem,7vw,2.5rem); line-height:.94;
      color:#fff; letter-spacing:.005em;
      text-shadow:2px 2px 0 rgba(40,16,4,.9), 4px 4px 0 rgba(20,8,2,.55);
    }
    /* VS — solid color + the same extrusion, NOT a background-clip:text
       gradient fill. html2canvas doesn't support background-clip:text (the
       same category of limitation that was squishing fighter photos on
       download elsewhere on the site) — it silently drops the clip and
       just paints the gradient as a solid rectangle, which is exactly what
       turned "VS" into a blank orange blob in every downloaded poster.
       Stays the constant orange accent in BOTH modes now (names are what
       flips white/black instead). */
    .mu-classic-vsline .vs {
      font-family:'Barlow Condensed',sans-serif;
      font-style:italic; font-weight:900;
      color:#e8691c;
      text-shadow:2px 2px 0 rgba(40,16,4,.9), 4px 4px 0 rgba(20,8,2,.55);
      font-size:.85em;
    }
    /* champion / rematch-number superscript tags */
    .mu-classic-tag {
      display:inline-flex; align-items:center; justify-content:center;
      width:16px; height:16px; border-radius:3px;
      background:linear-gradient(165deg, #ff9a4d 0%, #e8691c 60%, #c65a12 100%);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.45), inset 0 -1px 0 rgba(0,0,0,.18);
      color:#0a0a0a;
      font-family:'Montserrat',sans-serif; font-weight:800; font-size:.55rem;
      transform:translateY(-6px);
    }
    .mu-classic-weight {
      margin-top:10px;
      font-style:italic;
      font-weight:600; font-size:.66rem;
      letter-spacing:.06em; text-transform:uppercase;
      color:rgba(255,255,255,.6);
    }
    /* event name — moved down here as plain text (no badge/container),
       sitting right above the location line — bigger than the location
       now, since it's the more important of the two lines. */
    .mu-classic-eventline {
      margin-top:14px;
      font-family:'Barlow Condensed',sans-serif;
      font-weight:800; font-style:normal; text-transform:uppercase;
      font-size:clamp(1.2rem,4.4vw,1.6rem); line-height:1;
      color:#e8691c;
      text-shadow:1px 1px 0 rgba(40,16,4,.8);
    }
    /* date/location — white on the dark card / black on the light one
       (was the same orange as the event name above, which made the two
       lines blur together — this gives the location its own identity). */
    .mu-classic-location {
      margin-top:8px;
      font-family:'Barlow Condensed',sans-serif;
      font-weight:800; font-style:normal; text-transform:uppercase;
      font-size:clamp(.9rem,3.4vw,1.15rem); line-height:1;
      color:#fff;
      text-shadow:1px 1px 0 rgba(0,0,0,.5);
    }
    .mu-classic-brandline {
      position:absolute; left:20px; right:20px; bottom:8px; z-index:3;
      display:flex; align-items:center; justify-content:space-between;
      font-family:'Montserrat',sans-serif; font-weight:700; font-size:.5rem;
      letter-spacing:.1em; text-transform:uppercase;
      color:rgba(255,255,255,.35);
    }

    /* Classic + light — mostly WHITE card now (was a solid orange field),
       orange kept as the accent: badge, tag, VS, names, location all stay
       the exact same rich #e8691c used in dark mode (see .mu-classic-name
       etc. above — no per-mode color override needed anymore, only the
       card's own background/texture/vignette/shadow-color change here). */
    body.mu-classic-mode.mu-poster-light .mu-classic-card {
      background:
        radial-gradient(ellipse 62% 15% at 50% 79%, rgba(0,0,0,.22), transparent 70%),
        #f6f3ec;
    }
    body.mu-classic-mode.mu-poster-light .mu-classic-card::before {
      background-image:
        radial-gradient(circle, rgba(232,105,28,.4) 1px, transparent 1.6px),
        radial-gradient(circle, rgba(232,105,28,.22) 1px, transparent 1.6px);
      background-size:29px 29px, 17px 17px;
      background-position:0 0, 8px 12px;
      opacity:.55;
    }
    /* lighter vignette — a heavy dark edge-darken that works on near-black
       just reads as dirty smudging on white. */
    body.mu-classic-mode.mu-poster-light .mu-classic-card::after {
      background:radial-gradient(ellipse at 50% 45%, transparent 60%, rgba(0,0,0,.14) 100%);
    }
    /* names flip to black on the light card (white on the dark one); VS
       stays the constant orange in both, so no override needed for it
       here — only its shadow already reads fine on white as-is. */
    body.mu-classic-mode.mu-poster-light .mu-classic-name,
    body.mu-classic-mode.mu-poster-light .mu-classic-vsline {
      color:#161514;
      text-shadow:2px 2px 0 rgba(255,255,255,.55), 4px 4px 0 rgba(255,255,255,.3);
    }
    /* ...but that override also caught the nested .vs span — put its
       orange back on top since names and VS diverge in color now. */
    body.mu-classic-mode.mu-poster-light .mu-classic-vsline .vs {
      color:#e8691c;
      text-shadow:2px 2px 0 rgba(0,0,0,.22), 4px 4px 0 rgba(0,0,0,.12);
    }
    body.mu-classic-mode.mu-poster-light .mu-classic-eventline {
      text-shadow:1px 1px 0 rgba(0,0,0,.18);
    }
    body.mu-classic-mode.mu-poster-light .mu-classic-location {
      color:#161514;
      text-shadow:1px 1px 0 rgba(255,255,255,.5);
    }
    body.mu-classic-mode.mu-poster-light .mu-classic-card {
      box-shadow:inset 0 0 0 1px rgba(232,105,28,.4), 0 30px 90px rgba(0,0,0,.22);
    }
    body.mu-classic-mode.mu-poster-light .mu-classic-weight { color:rgba(0,0,0,.55); }
    body.mu-classic-mode.mu-poster-light .mu-classic-brandline { color:rgba(0,0,0,.4); }
    body.mu-classic-mode.mu-poster-light { background:#f6f3ec !important; }

    /* ── SPLIT BAR ── */
    .mu-split-bar {
      display:grid; grid-template-columns:1fr 1fr; height:2px;
    }
    .mu-split-a { background:linear-gradient(90deg,transparent 0%,#ff8a3d 100%); }
    .mu-split-b { background:linear-gradient(90deg,#60a5fa 0%,transparent 100%); }

    /* ── CONTENT ── */
    .mu-content { max-width:860px; margin:0 auto; padding:0 20px 100px; }

    /* ── PANELS (shared) — flat ledger surface, no glass/blur ── */
    .mu-panel {
      margin-top:20px;
      border:1px solid rgba(255,255,255,.09);
      border-radius:4px; overflow:hidden;
      background:rgba(255,255,255,.015);
    }
    .mu-panel-header {
      padding:12px 20px;
      border-bottom:1px solid rgba(255,255,255,.07);
      font-family:'Montserrat',sans-serif; font-weight:700;
      font-size:.55rem; letter-spacing:.18em; text-transform:uppercase;
      color:rgba(255,255,255,.5);
      display:flex; align-items:center; gap:10px;
    }
    .mu-panel-header::after { content:''; flex:1; height:1px; background:rgba(255,255,255,.07); }

    /* ── TABS ── */
    .mu-tabs {
      display:flex; gap:0; border-bottom:1px solid rgba(255,255,255,.07);
      margin:28px 0 0;
    }
    .mu-tab {
      padding:12px 20px; font-family:'Montserrat',sans-serif;
      font-weight:800; font-size:.6rem; letter-spacing:.14em;
      text-transform:uppercase; color:rgba(255,255,255,.28);
      border:none; background:none; cursor:pointer;
      border-bottom:2px solid transparent; margin-bottom:-1px;
      transition:color .18s, border-color .18s;
    }
    .mu-tab:hover { color:rgba(255,255,255,.6); }
    .mu-tab.active { color:#ff8a3d; border-bottom-color:#ff8a3d; }
    .mu-tab-panel { display:none; }
    .mu-tab-panel.active { display:block; }

    /* ── RESUME TAB ── */
    .mu-resume-section { margin-top:0; }
    .mu-resume-block {
      padding:18px 22px;
      border-bottom:1px solid rgba(255,255,255,.04);
    }
    .mu-resume-block:last-child { border-bottom:none; }
    .mu-resume-label {
      font-family:'Montserrat',sans-serif; font-weight:800;
      font-size:.52rem; letter-spacing:.2em; text-transform:uppercase;
      color:#ff8a3d; opacity:.75; margin-bottom:14px;
    }
    .mu-common-row {
      display:grid; grid-template-columns:1fr auto 1fr;
      align-items:center; gap:10px; padding:10px 8px;
      margin:0 -8px;
      border-radius:3px;
      border-bottom:1px solid rgba(255,255,255,.05);
      transition:background .15s;
    }
    .mu-common-row:hover { background:rgba(255,255,255,.025); }
    .mu-common-row:last-child { border-bottom:none; }
    .mu-common-result {
      display:inline-flex; align-items:center; justify-content:center;
      min-width:24px; height:20px; padding:0 6px; border-radius:2px;
      font-family:'Montserrat',sans-serif; font-weight:800;
      font-size:.6rem; letter-spacing:.02em;
      border:1px solid currentColor;
    }
    .mu-common-result.w { color:#4ade80; }
    .mu-common-result.l { color:#f87171; }
    .mu-common-opponent {
      font-family:'Montserrat',sans-serif; font-weight:700; font-size:.6rem;
      color:rgba(255,255,255,.6); text-align:center;
      text-transform:uppercase; letter-spacing:.04em;
      text-decoration:none; transition:color .15s;
    }
    .mu-common-opponent:hover { color:#ff8a3d; }
    .mu-common-method {
      font-family:'Inter',sans-serif; font-size:.72rem;
      color:rgba(255,255,255,.4); margin-top:3px;
    }
    .mu-common-sub {
      font-size:.52rem; color:rgba(255,255,255,.24);
      font-family:'Montserrat',sans-serif; margin-bottom:10px; letter-spacing:.06em;
    }
    .mu-form-name {
      font-family:'Montserrat',sans-serif; font-size:.52rem; font-weight:700;
      color:rgba(255,255,255,.45); letter-spacing:.08em; text-transform:uppercase;
      margin-bottom:8px;
    }
    .mu-form-name.b { text-align:right; }
    .mu-form-row {
      display:flex; gap:5px; flex-wrap:wrap;
    }
    /* left fighter's pips pack toward the right of their column, i.e.
       toward the center VS divider — see formPips() for why. */
    .mu-form-row.pack-center { justify-content:flex-end; }
    .mu-form-pip {
      position:relative;
      width:28px; height:28px; border-radius:3px;
      display:flex; align-items:center; justify-content:center;
      font-family:'Montserrat',sans-serif; font-weight:800; font-size:.68rem;
      border:1px solid currentColor;
      text-decoration:none; cursor:pointer;
      transition:background .15s, transform .15s;
    }
    .mu-form-pip.w { color:#4ade80; }
    .mu-form-pip.l { color:#f87171; }
    .mu-form-pip:hover { background:currentColor; transform:translateY(-1px); }
    .mu-form-pip.w:hover .mu-form-pip-letter,
    .mu-form-pip.l:hover .mu-form-pip-letter { color:#0a0a0a; }
    /* custom hover tooltip — replaces relying on the native title attribute
       (slow to appear, unstyled) so "who'd they beat/lose to" is
       immediately visible on hover. */
    .mu-form-tip {
      display:none;
      position:absolute; bottom:calc(100% + 8px); left:50%;
      transform:translateX(-50%);
      background:#111; border:1px solid rgba(255,255,255,.14);
      border-radius:6px; padding:6px 10px;
      font-family:'Inter',sans-serif; font-size:.64rem; font-weight:500;
      color:rgba(255,255,255,.85); white-space:nowrap;
      z-index:10; pointer-events:none;
      box-shadow:0 8px 22px rgba(0,0,0,.5);
    }
    .mu-form-pip:hover .mu-form-tip { display:block; }
    .mu-form-sub {
      font-family:'Inter',sans-serif; font-size:.72rem;
      color:rgba(255,255,255,.4); margin-top:6px;
    }
    .mu-form-full {
      display:inline-block;
      font-family:'Montserrat',sans-serif; font-weight:800; font-size:.52rem;
      letter-spacing:.1em; text-transform:uppercase;
      color:#ff8a3d; text-decoration:none; margin-top:10px;
      border:1px solid rgba(255,138,61,.4); border-radius:20px;
      padding:7px 16px;
      transition:background .15s, color .15s, border-color .15s;
    }
    .mu-form-full:hover { background:#ff8a3d; color:#0a0a0a; border-color:#ff8a3d; }
    .mu-form-full.b { float:right; }
    .mu-form-name-row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .mu-form-name-row.b { flex-direction:row-reverse; }
    .mu-form-section {
      display:grid; grid-template-columns:1fr 1px 1fr; gap:16px; align-items:start;
    }
    .mu-form-divider { background:rgba(255,255,255,.08); align-self:stretch; }
    .mu-h2h-banner {
      text-align:center; padding:14px;
      font-family:'Inter',sans-serif; font-weight:500; font-style:normal;
      font-size:.92rem; color:rgba(255,255,255,.85);
      border:1px solid rgba(255,138,61,.3);
      border-radius:3px; margin-bottom:4px;
    }
    .mu-h2h-tag {
      display:block;
      font-family:'Montserrat',sans-serif; font-weight:800; font-style:normal;
      font-size:.56rem; letter-spacing:.22em; text-transform:uppercase;
      color:#ff8a3d; opacity:.8; margin-bottom:6px;
    }
    .mu-no-common {
      text-align:center; padding:20px;
      font-family:'Inter',sans-serif; font-size:.72rem;
      color:rgba(255,255,255,.25);
    }

    /* ── STAT ROWS ── */
    .mu-stat-row {
      display:grid; grid-template-columns:1fr 106px 1fr;
      align-items:center; padding:14px 20px;
      border-bottom:1px solid rgba(255,255,255,.06);
      transition:background .15s;
    }
    .mu-stat-row:last-child { border-bottom:none; }
    .mu-stat-row:hover { background:rgba(255,255,255,.02); }

    .mu-stat-val {
      font-family:'Barlow Condensed',sans-serif; font-weight:700;
      font-size:1.22rem; line-height:1;
      font-variant-numeric: tabular-nums;
    }
    .mu-stat-val.a { color:rgba(255,255,255,.9); }
    .mu-stat-val.b { color:rgba(255,255,255,.9); text-align:right; }
    .mu-stat-val.a.edge { color:#ff8a3d; }
    .mu-stat-val.b.edge { color:#60a5fa; }
    .mu-stat-val.a.edge::after  { content:' \25b2'; font-size:.55em; opacity:.7; }
    .mu-stat-val.b.edge::before { content:'\25b2 '; font-size:.55em; opacity:.7; }

    .mu-stat-label {
      text-align:center;
      font-family:'Montserrat',sans-serif; font-weight:700;
      font-size:.66rem; letter-spacing:.1em; text-transform:uppercase;
      color:rgba(255,255,255,.4);
    }

    /* ── ODDS ── */
    .mu-odds-body { display:grid; grid-template-columns:1fr 1fr; }
    .mu-odds-side { padding:22px; text-align:center; }
    .mu-odds-side.a { border-right:1px solid rgba(255,255,255,.07); }
    .mu-odds-name {
      font-family:'Montserrat',sans-serif; font-weight:700; font-size:.58rem;
      letter-spacing:.08em; text-transform:uppercase;
      color:rgba(255,255,255,.42); margin-bottom:10px;
    }
    .mu-odds-num {
      font-family:'Barlow Condensed',sans-serif; font-weight:800;
      font-size:2.7rem; line-height:1; letter-spacing:-.01em;
      font-variant-numeric: tabular-nums;
    }
    .mu-odds-num.fav { color:#4ade80; }
    .mu-odds-num.dog { color:#f87171; }
    .mu-odds-prob {
      font-family:'Inter',sans-serif; font-size:.62rem; font-weight:500;
      color:rgba(255,255,255,.32); margin-top:8px;
    }
    .mu-odds-note {
      padding:9px 20px; border-top:1px solid rgba(255,255,255,.06);
      font-family:'Inter',sans-serif; font-size:.52rem;
      color:rgba(255,255,255,.18); text-align:center;
    }

    /* ── PICKS CTA — flat, confident, no gradient-glow button ── */
    .mu-cta { margin-top:24px; text-align:center; }
    .mu-picks-btn {
      display:inline-flex; align-items:center; gap:10px;
      background:#ff8a3d;
      border:none; color:#0a0a0a;
      font-family:'Montserrat',sans-serif; font-weight:800;
      font-size:.7rem; letter-spacing:.1em; text-transform:uppercase;
      padding:14px 36px; border-radius:3px; cursor:pointer; text-decoration:none;
      transition:background .18s;
    }
    .mu-picks-btn:hover { background:#ffad70; }

    /* ── LOADING ── */
    .mu-loading {
      text-align:center; padding:140px 24px;
      font-family:'Inter',sans-serif; font-size:.84rem;
      color:rgba(255,255,255,.22);
    }

    /* ── LIGHT MODE ── */
    body.light-mode .mu-fighter-name.a { color:#a06b00; }
    body.light-mode .mu-fighter-name.b { color:#1d4ed8; }
    body.light-mode .mu-hero { background:#f4f4f8; }
    body.light-mode .mu-hero-fade { background:linear-gradient(to top,#faf8f3 0%,transparent 100%); }
    body.light-mode .mu-stat-val.a { color:#a06b00; }
    body.light-mode .mu-stat-val.b { color:#1d4ed8; }
    body.light-mode .mu-panel { background:rgba(0,0,0,.015); border-color:rgba(0,0,0,.09); }
    body.light-mode .mu-back { color:rgba(0,0,0,.5); background:rgba(0,0,0,.04); border-color:rgba(0,0,0,.1); }
    body.light-mode .mu-back:hover { color:#e06b1a; background:rgba(224,107,26,.08); border-color:rgba(224,107,26,.3); }
    body.light-mode .mu-chip { color:rgba(0,0,0,.6); border-color:rgba(0,0,0,.16); }
    body.light-mode .mu-vs-text { color:rgba(0,0,0,.5); }
    body.light-mode .mu-vs-weight { color:rgba(0,0,0,.35); }
    body.light-mode .mu-panel-header { color:rgba(0,0,0,.55); border-bottom-color:rgba(0,0,0,.09); }
    body.light-mode .mu-panel-header::after { background:rgba(0,0,0,.09); }
    body.light-mode .mu-tabs { border-bottom-color:rgba(0,0,0,.1); }
    body.light-mode .mu-tab { color:rgba(0,0,0,.35); }
    body.light-mode .mu-tab:hover { color:rgba(0,0,0,.7); }
    body.light-mode .mu-tab.active { color:#e06b1a; border-bottom-color:#e06b1a; }
    body.light-mode .mu-resume-block { border-bottom-color:rgba(0,0,0,.07); }
    body.light-mode .mu-resume-label { color:#e06b1a; }
    body.light-mode .mu-common-row { border-bottom-color:rgba(0,0,0,.06); }
    body.light-mode .mu-common-row:hover { background:rgba(0,0,0,.03); }
    body.light-mode .mu-common-opponent { color:rgba(0,0,0,.65); }
    body.light-mode .mu-common-opponent:hover { color:#e06b1a; }
    body.light-mode .mu-common-method { color:rgba(0,0,0,.45); }
    body.light-mode .mu-common-sub { color:rgba(0,0,0,.32); }
    body.light-mode .mu-form-name { color:rgba(0,0,0,.55); }
    body.light-mode .mu-form-divider { background:rgba(0,0,0,.1); }
    body.light-mode .mu-form-sub { color:rgba(0,0,0,.4); }
    body.light-mode .mu-form-tip { background:#fff; border-color:rgba(0,0,0,.14); color:rgba(0,0,0,.75); box-shadow:0 8px 22px rgba(0,0,0,.18); }
    body.light-mode .mu-form-full { color:#e06b1a; border-color:rgba(224,107,26,.4); }
    body.light-mode .mu-form-full:hover { background:#e06b1a; color:#fff; border-color:#e06b1a; }
    body.light-mode .mu-no-common { color:rgba(0,0,0,.35); }
    body.light-mode .mu-h2h-banner { color:rgba(0,0,0,.75); border-color:rgba(224,107,26,.4); }
    body.light-mode .mu-h2h-tag { color:#e06b1a; }
    body.light-mode .mu-stat-row { border-bottom-color:rgba(0,0,0,.07); }
    body.light-mode .mu-stat-row:hover { background:rgba(0,0,0,.03); }
    body.light-mode .mu-stat-label { color:rgba(0,0,0,.42); }
    body.light-mode .mu-odds-side.a { border-right-color:rgba(0,0,0,.09); }
    body.light-mode .mu-odds-name { color:rgba(0,0,0,.5); }
    body.light-mode .mu-odds-prob { color:rgba(0,0,0,.48); }
    body.light-mode .mu-odds-note { border-top-color:rgba(0,0,0,.07); color:rgba(0,0,0,.35); }
    body.light-mode .mu-loading { color:rgba(0,0,0,.35); }
    body.light-mode .mu-picks-btn { color:#fff; }

    /* ── MOBILE ── */
    @media(max-width:600px){
      .mu-hero { min-height:340px; }
      .mu-hero-text { min-height:340px; padding:20px 14px 20px; }
      .mu-fighter-name { font-size:1.9rem; }
      .mu-hero-img { height:300px; }
      .mu-vs-badge { width:42px; height:42px; }
      .mu-vs-text { font-size:.82rem; }
      .mu-stat-row { grid-template-columns:1fr 78px 1fr; padding:12px 14px; }
      .mu-stat-val { font-size:1.05rem; }
      .mu-stat-label { font-size:.58rem; }
      .mu-odds-num { font-size:2.4rem; }
      body.mu-poster-mode .mu-fighter-name { font-size:clamp(2.2rem,10vw,3.2rem); }
      /* Poster/Classic mode's view-toggle (top-left) and controls
         (top-right) fit side by side on desktop but collide once a third
         "Classic" button was added — on narrow screens stack them into two
         rows instead of overlapping. */
      body.mu-poster-mode .mu-view-toggle,
      body.mu-classic-mode .mu-view-toggle { top:10px; left:10px; }
      .mu-view-btn { padding:6px 10px; font-size:.52rem; }
      body.mu-poster-mode .mu-poster-controls,
      body.mu-classic-mode .mu-poster-controls { top:52px; left:10px; right:10px; }
      .mu-poster-exit { font-size:.55rem; padding:7px 12px; }
      .mu-poster-theme { width:30px; height:30px; font-size:.75rem; }
    }
    @media(max-width:420px){
      .mu-classic-textblock { bottom:18px; }
      .mu-classic-name, .mu-classic-vsline { font-size:clamp(1.3rem,7.6vw,1.9rem); }
      .mu-classic-location,
      .mu-classic-eventline { font-size:clamp(.8rem,4.4vw,1.1rem); }
    }
  </style>
</head>

    <span id="muBackLabel">Back</span>

  <!-- Poster/Classic switching is admin-only now (driven by ?poster=1 /
       ?classic=1 from admin.html's Dream H2H generator) — this bar stays
       hidden on the public page since there's nothing left to switch
       between. The "full" button is kept (never shown) so setView()'s
       querySelectorAll has something to operate on. -->

  </div>

  <div class="mu-poster-controls">

    <button class="mu-poster-theme" id="muPosterDownload" type="button" title="Download poster">&#8681;</button>
    <button class="mu-poster-exit" id="muPosterExit" type="button">✕ Exit Poster View</button>
  </div>

  <div id="muRoot" class="mu-loading">Loading matchup...</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="auth.js?v=3.3"></script>
  <script src="search.js"></script>
  <script src="ux.js?v=1.0"></script>
  <script src="premium.js?v=3.10"></script>
  <script src="animations.js?v=2.0"></script>
  <script src="chat.js?v=2.5"></script>
<script src="lucas-moments.js?v=1.3"></script>
  <script src="fighter-modal.js?v=1.1"></script>
  <script src="notifications.js?v=2.6"></script>
  <script src="micro.js?v=1.0"></script>
  <script>
  (function(){
    const API = 'https://mmabridge-backend.onrender.com/api';
    const p   = new URLSearchParams(location.search);
    const eventId = p.get('event') || '';
    const nameA   = p.get('a') || '';
    const nameB   = p.get('b') || '';
    const weight  = p.get('weight') || '';
    const imgA    = p.get('imgA') || '';
    const imgB    = p.get('imgB') || '';
    // NOTE: deliberately not named `location` — that would shadow
    // window.location for the rest of this scope (including the
    // `location.search` read above, due to const hoisting) and break the
    // page outright.
    const eventNameParam = p.get('eventName') || '';
    const venueParam     = p.get('location') || '';
    const tagParam       = p.get('tag') || '';

    if (nameA && nameB) document.title = `${nameA} vs ${nameB} | MMA Bridge`;

    /* back link — dynamic based on where user came from */
    const backLink  = document.getElementById('muBackLink');
    const backLabel = document.getElementById('muBackLabel');
    const fromPage  = p.get('from') || '';
    if (fromPage === 'picks' && eventId) {
      backLink.href = `picks.html?event=${encodeURIComponent(eventId)}`;
      if (backLabel) backLabel.textContent = 'Back to picks';
    } else if (fromPage === 'events' && eventId) {
      backLink.href = `events.html?id=${encodeURIComponent(eventId)}`;
      if (backLabel) backLabel.textContent = 'Back to event';
    } else if (eventId) {
      backLink.href = `events.html?id=${encodeURIComponent(eventId)}`;
      if (backLabel) backLabel.textContent = 'Back to event';
    }

    function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
    function fmtOdds(n){ return n > 0 ? '+'+n : String(n); }
    function impliedProb(n){
      const pct = n < 0 ? (-n / (-n + 100)) * 100 : (100 / (n + 100)) * 100;
      return Math.round(pct) + '%';
    }
    /* Strips accents before dropping non-letters — plain .replace(/[^a-z]/g,'')
       alone deletes characters like í/á/ř wholesale instead of folding them to
       their base letter, so "Jiří Procházka" (fighters.json's spelling) silently
       failed to match "Jiri Prochazka" (how several events.json entries spell
       the same fighter) and every downstream lookup — photo, stats, last5 —
       came back empty for those cards. Found by testing the resume tab, not
       hypothetically: verify against real accented names before assuming this
       kind of matcher is fine as-is. */
    function normName(s){
      return s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z]/g,'');
    }
    function fuzzyMatch(a, b){
      if (!a || !b) return false;
      const ca = normName(a), cb = normName(b);
      return ca === cb || ca.includes(cb) || cb.includes(ca);
    }
    function edge(va, vb, higher){
      const na = parseFloat(String(va).replace(/[^0-9.]/g,'')),
            nb = parseFloat(String(vb).replace(/[^0-9.]/g,''));
      if (isNaN(na)||isNaN(nb)||na===nb) return {a:'',b:''};
      const aWins = higher ? na>nb : na<nb;
      return {a:aWins?'edge':'', b:aWins?'':'edge'};
    }
    function recStr(f){ const r=f.record; return r?`${r.wins}-${r.losses}${r.draws?'-'+r.draws:''}`:'—'; }

    Promise.all([
      fetch('data/fighters.json?_='+Date.now(),{cache:'no-store'}).then(r=>r.json()).catch(()=>[]),
      fetch(`${API}/odds/${encodeURIComponent(eventId)}`).then(r=>r.json()).catch(()=>({odds:[]})),
      eventId ? fetch('data/events.json?_='+Date.now(),{cache:'no-store'}).then(r=>r.json()).catch(()=>[]) : Promise.resolve([]),
    ]).then(([fighters, oddsData, eventsArr]) => {

      const fA = fighters.find(f=>fuzzyMatch(f.name,nameA)) || {};
      const fB = fighters.find(f=>fuzzyMatch(f.name,nameB)) || {};

      const oddsEntry = (oddsData.odds||[]).find(o=>
        (fuzzyMatch(o.a,nameA)||fuzzyMatch(o.b,nameA)) &&
        (fuzzyMatch(o.a,nameB)||fuzzyMatch(o.b,nameB))
      );
      let oddsForA=null, oddsForB=null;
      if (oddsEntry) {
        const aIsA = fuzzyMatch(oddsEntry.a,nameA);
        oddsForA = aIsA ? oddsEntry.odds_a : oddsEntry.odds_b;
        oddsForB = aIsA ? oddsEntry.odds_b : oddsEntry.odds_a;
      }
      /* JSON odds fallback when API returns nothing */
      if (oddsForA===null && oddsForB===null && eventId && eventsArr.length) {
        const ev = eventsArr.find(e=>e.id===eventId);
        if (ev) {
          const allF=[...(ev.mainCard||[]),...(ev.prelims||[]),...(ev.earlyPrelims||[])];
          const fight=allF.find(f=>(fuzzyMatch(f.a,nameA)||fuzzyMatch(f.b,nameA)));
          if (fight && fight.odds && fight.odds.a && fight.odds.b) {
            const aIsA=fuzzyMatch(fight.a,nameA);
            oddsForA=aIsA?parseInt(fight.odds.a):parseInt(fight.odds.b);
            oddsForB=aIsA?parseInt(fight.odds.b):parseInt(fight.odds.a);
          }
        }
      }

      /* stat rows */
      const reachEdge  = edge(fA.reach||0, fB.reach||0, true);
      const heightEdge = edge(fA.height||0, fB.height||0, true);
      const ageEdge    = edge(fA.age||99, fB.age||99, false);

      const statRows = [
        { label:'RECORD',      a:recStr(fA),                          b:recStr(fB),                          eA:'',            eB:'' },
        { label:'HEIGHT',      a:fA.height||'—',                     b:fB.height||'—',                     eA:heightEdge.a,  eB:heightEdge.b },
        { label:'REACH',       a:fA.reach||'—',                      b:fB.reach||'—',                      eA:reachEdge.a,   eB:reachEdge.b },
        { label:'STANCE',      a:fA.stance||'—',                     b:fB.stance||'—',                     eA:'',            eB:'' },
        { label:'AGE',         a:fA.age||'—',                        b:fB.age||'—',                        eA:ageEdge.a,     eB:ageEdge.b },
        { label:'NATIONALITY', a:(fA.flag||'')+' '+(fA.nationality||'—'), b:(fB.flag||'')+' '+(fB.nationality||'—'), eA:'', eB:'' },
        { label:'STYLE',       a:fA.style||'—',                      b:fB.style||'—',                      eA:'',            eB:'' },
      ];

      const statsHTML = statRows.map(r=>`
        <div class="mu-stat-row">
          <div class="mu-stat-val a ${r.eA}">${esc(String(r.a))}</div>
          <div class="mu-stat-label">${r.label}</div>
          <div class="mu-stat-val b ${r.eB}">${esc(String(r.b))}</div>
        </div>`).join('');

      /* odds */
      const oddsHTML = (oddsForA!==null && oddsForB!==null) ? `
        <div class="mu-panel" style="margin-top:16px">
          <div class="mu-panel-header">Betting Odds</div>
          <div class="mu-odds-body">
            <div class="mu-odds-side a">
              <div class="mu-odds-name">${esc(nameA)}</div>
              <div class="mu-odds-num ${oddsForA<0?'fav':'dog'}">${fmtOdds(oddsForA)}</div>
              <div class="mu-odds-prob">Implied ${impliedProb(oddsForA)}</div>
            </div>
            <div class="mu-odds-side b">
              <div class="mu-odds-name">${esc(nameB)}</div>
              <div class="mu-odds-num ${oddsForB<0?'fav':'dog'}">${fmtOdds(oddsForB)}</div>
              <div class="mu-odds-prob">Implied ${impliedProb(oddsForB)}</div>
            </div>
          </div>
          <div class="mu-odds-note">Odds via The Odds API · for entertainment only</div>
        </div>` : '';  // end oddsHTML

      /* fighter images */
      const shotA = imgA || fA.img || '';
      const shotB = imgB || fB.img || '';
      const imgsHTML = (shotA||shotB) ? `
        <div class="mu-hero-imgs">
          <div class="mu-hero-img-wrap a">
            ${shotA?`<img class="mu-hero-img" src="${esc(shotA)}" alt="${esc(nameA)}" onerror="this.style.display='none'">`:''}
          </div>
          <div class="mu-hero-img-wrap b">
            ${shotB?`<img class="mu-hero-img" src="${esc(shotB)}" alt="${esc(nameB)}" onerror="this.style.display='none'">`:''}
          </div>
        </div>` : '';

      /* chips */
      function chips(f){
        const c=[];
        if(f.ranking === 'Champion') c.push(`<span class="mu-chip champ">&#9813; Champion</span>`);
        if(f.record) c.push(`<span class="mu-chip record">${esc(recStr(f))}</span>`);
        if(f.nationality) c.push(`<span class="mu-chip nat">${f.flag||''} ${f.nationality}</span>`);
        if(f.stance) c.push(`<span class="mu-chip">${f.stance}</span>`);
        return c.length ? `<div class="mu-fighter-chips">${c.join('')}</div>` : '';
      }

      const profileA = `fighter.html?${fA.id ? `id=${encodeURIComponent(fA.id)}` : `name=${encodeURIComponent(nameA)}`}`;
      const profileB = `fighter.html?${fB.id ? `id=${encodeURIComponent(fB.id)}` : `name=${encodeURIComponent(nameB)}`}`;
      const picksHref = eventId ? `picks.html?event=${encodeURIComponent(eventId)}` : 'events.html';

      /* poster event banner text — an explicit ?eventName=/&location= (used
         by the admin Dream H2H generator for un-booked matchups) always wins
         over the auto-lookup, since there's no real eventId to look up. */
      let eventLine = '';
      let classicEventName = eventNameParam;
      let classicLocation  = venueParam;
      const evForLine = (eventId && eventsArr.length) ? eventsArr.find(e=>e.id===eventId) : null;
      if (eventNameParam || venueParam) {
        eventLine = [eventNameParam, venueParam].filter(Boolean).join(' · ');
      } else if (evForLine) {
        const parts = [evForLine.name || ''];
        if (evForLine.date) {
          const d = new Date(evForLine.date);
          if (!isNaN(d)) parts.push(d.toLocaleDateString('en-US',{month:'short',day:'numeric'}));
        }
        eventLine = parts.filter(Boolean).join(' · ');
      }
      if (!classicEventName && evForLine) classicEventName = evForLine.name || '';
      if (!classicLocation && evForLine) classicLocation = evForLine.location || evForLine.venue || '';

      /* ── RESUME DATA ── */
      function resumeHTML(fA, fB, nA, nB) {
        /* Rematch detection — check BOTH fighters' records (not just A's),
           since last5 data can be asymmetric, and spell the actual result
           of the first meeting out explicitly (winner, method, event)
           rather than a vague "went WIN/LOSS". */
        function findAllH2H(otherName, last5) {
          const clean = normName(otherName).slice(0,5);
          return (last5||[]).filter(f => f.opponent && normName(f.opponent).includes(clean));
        }
        const h2hAllFromA = findAllH2H(nB, fA.last5);
        const h2hAllFromB = findAllH2H(nA, fB.last5);
        // last5 is newest-first, so the OLDEST available meeting (what we
        // call "first meeting" here — earliest one this data can see) is
        // the last item in the filtered list, not the first.
        const h2hFromA = h2hAllFromA[h2hAllFromA.length - 1];
        const h2hFromB = h2hAllFromB[h2hAllFromB.length - 1];
        const h2hMatch = h2hFromA || h2hFromB;
        const meetingCount = Math.max(h2hAllFromA.length, h2hAllFromB.length);
        let h2hBanner = '';
        if (h2hMatch) {
          // The result on record is from ONE fighter's perspective (W/L/D/NC)
          // — only 'W'/'L' imply an actual winner. Treating anything else as
          // an automatic loss (the old `=== 'W' ? A : B` check) misreports a
          // No Contest or Draw as a definite result, which is just wrong.
          const perspective = h2hFromA
            ? { result: h2hFromA.result, subjectIsA: true }
            : { result: h2hFromB.result, subjectIsA: false };
          const subject = perspective.subjectIsA ? nA : nB;
          const other   = perspective.subjectIsA ? nB : nA;
          const result  = (perspective.result || '').toUpperCase();
          const bits = [];
          if (result === 'W')       bits.push(`${esc(subject)} beat ${esc(other)}`);
          else if (result === 'L')  bits.push(`${esc(other)} beat ${esc(subject)}`);
          else if (result === 'D')  bits.push(`${esc(subject)} and ${esc(other)} fought to a draw`);
          else if (result === 'NC') bits.push(`${esc(subject)} vs ${esc(other)} was ruled a No Contest`);
          else                      bits.push(`${esc(subject)} vs ${esc(other)}`);
          // Skip the method for NC/D — it's typically just "NC"/"Draw" again,
          // redundant with the sentence already built above.
          if (h2hMatch.method && result !== 'NC' && result !== 'D') bits.push(`(${esc(h2hMatch.method)})`);
          if (h2hMatch.event)  bits.push(`at ${esc(h2hMatch.event)}`);
          const meetingPhrase = meetingCount > 1 ? `in their first of ${meetingCount} recent meetings` : 'in their only meeting on record';
          h2hBanner = `<div class="mu-h2h-banner"><span class="mu-h2h-tag">Rematch</span>${bits.join(' ')} ${meetingPhrase}</div>`;
        }

        const oppsA = new Map();
        for (const f of (fA.last5||[])) if (f.opponent) oppsA.set(normName(f.opponent), f);
        const common = [];
        for (const f of (fB.last5||[])) {
          if (!f.opponent) continue;
          const key = normName(f.opponent);
          if (oppsA.has(key)) common.push({ opponent:f.opponent, resultA:oppsA.get(key).result||'', methodA:oppsA.get(key).method||'', resultB:f.result||'', methodB:f.method||'' });
        }
        const commonHTML = common.length ? common.map(c=>`
          <div class="mu-common-row">
            <div>
              <div class="mu-common-result ${c.resultA.toLowerCase()}">${esc(c.resultA)}</div>
              <div class="mu-common-method">${esc((c.methodA.split(' ')[0])||'')}</div>
            </div>
            <a class="mu-common-opponent" href="fighter.html?name=${encodeURIComponent(c.opponent)}">${esc(c.opponent)}</a>
            <div style="text-align:right">
              <div class="mu-common-result ${c.resultB.toLowerCase()}">${esc(c.resultB)}</div>
              <div class="mu-common-method">${esc((c.methodB.split(' ')[0])||'')}</div>
            </div>
          </div>`).join('') : `<div class="mu-no-common">No common opponents in recent fight history</div>`;

        /* Recent-form pips converge toward the VS divider in the middle —
           each fighter's most recent fight sits nearest the center, oldest
           furthest out, so the row reads like a timeline walking toward
           "now" from both sides at once instead of two identical
           newest-on-the-left lists that don't relate to the page layout. */
        function formPips(fights, isLeftFighter) {
          let last5 = (fights||[]).slice(0,5);
          // Left fighter: oldest-to-newest left-to-right, so the newest
          // fight ends up rightmost, closest to the center divider.
          if (isLeftFighter) last5 = last5.slice().reverse();
          const pips = last5.map(f=>{
            const result = (f.result||'').toUpperCase();
            const verb = result === 'W' ? 'Beat' : result === 'L' ? 'Lost to' : 'Drew';
            const opp = f.opponent || 'unknown';
            const tip = `${verb} ${opp}${f.method ? ' &middot; ' + esc(f.method) : ''}`;
            const href = f.opponent ? `fighter.html?name=${encodeURIComponent(f.opponent)}` : '#';
            return `<a class="mu-form-pip ${result.toLowerCase()}" href="${href}">
              <span class="mu-form-pip-letter">${esc(result)}</span>
              <span class="mu-form-tip">${tip}</span>
            </a>`;
          }).join('');
          const rowClass = isLeftFighter ? ' pack-center' : '';
          const caption = isLeftFighter ? 'Oldest to newest, right = most recent' : 'Newest to oldest, left = most recent';
          return `<div class="mu-form-row${rowClass}">${pips}</div><div class="mu-form-sub">${caption} &middot; hover for details</div>`;
        }

        const fullResumeA = `fighter.html?${fA.id ? `id=${encodeURIComponent(fA.id)}` : `name=${encodeURIComponent(nA)}`}`;
        const fullResumeB = `fighter.html?${fB.id ? `id=${encodeURIComponent(fB.id)}` : `name=${encodeURIComponent(nB)}`}`;

        return `
          <div class="mu-resume-section">
            ${h2hBanner ? `<div class="mu-resume-block">${h2hBanner}</div>` : ''}
            <div class="mu-resume-block">
              <div class="mu-resume-label">Common Opponents</div>
              <div class="mu-common-sub">${esc(nA)} left &middot; ${esc(nB)} right</div>
              ${commonHTML}
            </div>
            <div class="mu-resume-block">
              <div class="mu-resume-label">Recent Form</div>
              <div class="mu-form-section">
                <div>
                  <div class="mu-form-name-row">
                    <div class="mu-form-name">${esc(nA)}</div>
                  </div>
                  ${formPips(fA.last5, true)}
                  <a class="mu-form-full" href="${fullResumeA}">Full Resume</a>
                </div>
                <div class="mu-form-divider"></div>
                <div>
                  <div class="mu-form-name-row b">
                    <div class="mu-form-name b">${esc(nB)}</div>
                  </div>
                  ${formPips(fB.last5, false)}
                  <a class="mu-form-full b" href="${fullResumeB}">Full Resume</a>
                </div>
              </div>
            </div>
          </div>`;
      }

      document.getElementById('muRoot').innerHTML = `
        <div class="mu-hero">
          <div class="mu-hero-glow-a"></div>
          <div class="mu-hero-glow-b"></div>
          <div class="mu-hero-slash"></div>
          <div class="mu-hero-noise"></div>
          <div class="mu-poster-brand">MMA Bridge</div>
          ${imgsHTML}
          <div class="mu-hero-text">
            <div class="mu-hero-side a">
              <a class="mu-fighter-name a" href="${profileA}">${esc(nameA)}</a>
              ${chips(fA)}
            </div>
            <div class="mu-vs-center">
              ${tagParam?`<div class="mu-poster-tag">${esc(tagParam)}</div>`:''}
              <div class="mu-vs-badge"><div class="mu-vs-text">VS</div></div>
              ${weight?`<div class="mu-vs-weight">${esc(weight)}</div>`:''}
            </div>
            <div class="mu-hero-side b">
              <a class="mu-fighter-name b" href="${profileB}">${esc(nameB)}</a>
              ${chips(fB)}
            </div>
          </div>
          <div class="mu-hero-fade"></div>
        </div>
        <div class="mu-poster-eventline${eventLine?' has-text':''}">${esc(eventLine)}</div>

        <div class="mu-classic-wrap">
          <div class="mu-classic-card">
            <img class="mu-classic-logo" src="images/mma-bridge-logo.png" alt="MMA Bridge">
            ${tagParam?`<div class="mu-classic-tagline">${esc(tagParam)}</div>`:''}
            <div class="mu-classic-photos">
              ${shotA?`<img class="mu-classic-img a" src="${esc(shotA)}" alt="${esc(nameA)}" onerror="this.style.display='none'">`:''}
              ${shotB?`<img class="mu-classic-img b" src="${esc(shotB)}" alt="${esc(nameB)}" onerror="this.style.display='none'">`:''}
            </div>
            <div class="mu-classic-textblock">
              <div class="mu-classic-name-row">
                <div class="mu-classic-name">${esc(nameA)}</div>
                ${fA.ranking === 'Champion' ? `<span class="mu-classic-tag">C</span>` : ''}
              </div>
              <div class="mu-classic-vsline">
                <span class="vs">vs</span>${esc(nameB)}
              </div>
              ${weight?`<div class="mu-classic-weight">${esc(weight)}</div>`:''}
              ${classicEventName?`<div class="mu-classic-eventline">${esc(classicEventName)}</div>`:''}
              ${classicLocation?`<div class="mu-classic-location">${esc(classicLocation)}</div>`:''}
            </div>
            <div class="mu-classic-brandline">
              <span>MMA Bridge</span>
              <span>mmabridge.com</span>
            </div>
          </div>
        </div>

        <div class="mu-split-bar"><div class="mu-split-a"></div><div class="mu-split-b"></div></div>
        <div class="mu-content">
          <div class="mu-tabs">
            <button class="mu-tab active" data-tab="stats">Stats</button>
            <button class="mu-tab" data-tab="resume">Resume</button>
            ${oddsHTML !== '' ? '<button class="mu-tab" data-tab="odds">Odds</button>' : ''}
          </div>
          <div class="mu-tab-panel active" data-panel="stats">
            <div class="mu-panel" style="margin-top:16px">
              <div class="mu-panel-header">Fighter Comparison</div>
              ${statsHTML}
            </div>
          </div>
          <div class="mu-tab-panel" data-panel="resume">
            <div class="mu-panel" style="margin-top:16px">
              <div class="mu-panel-header">Fighter Resumes</div>
              ${resumeHTML(fA, fB, nameA, nameB)}
            </div>
          </div>
          ${oddsHTML !== '' ? `<div class="mu-tab-panel" data-panel="odds">${oddsHTML}</div>` : ''}
          <div class="mu-cta">
            <a class="mu-picks-btn" href="${picksHref}">Make Your Picks &rarr;</a>
          </div>
        </div>
      `;

      document.querySelectorAll('.mu-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.mu-tab').forEach(t=>t.classList.remove('active'));
          document.querySelectorAll('.mu-tab-panel').forEach(p=>p.classList.remove('active'));
          btn.classList.add('active');
          const panel = document.querySelector(`.mu-tab-panel[data-panel="${btn.dataset.tab}"]`);
          if (panel) panel.classList.add('active');
        });
      });

      document.title = `${nameA} vs ${nameB} | MMA Bridge`;

      // ── Poster / Full view toggle ──
      const viewToggle  = document.getElementById('muViewToggle');
      const posterExit  = document.getElementById('muPosterExit');
      const posterTheme = document.getElementById('muPosterTheme');
      // Deliberately not unhiding viewToggle here — Poster/Classic are
      // admin.html-only now, reached via ?poster=1/?classic=1, not a
      // visible button on the public page (see the div's own comment).

      function setView(view) {
        document.body.classList.toggle('mu-poster-mode', view === 'poster');
        document.body.classList.toggle('mu-classic-mode', view === 'classic');
        viewToggle.querySelectorAll('.mu-view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
        posterExit.textContent = view === 'classic' ? '✕ Exit Classic View' : '✕ Exit Poster View';
        window.scrollTo(0, 0);
      }
      viewToggle.querySelectorAll('.mu-view-btn').forEach(btn => {
        btn.addEventListener('click', () => setView(btn.dataset.view));
      });
      posterExit.addEventListener('click', () => setView('full'));

      // ?poster=1 / ?classic=1 — used by the admin "Dream H2H Poster"
      // generator to open straight into a given view instead of making the
      // admin click twice.
      if (p.get('poster') === '1') setView('poster');
      if (p.get('classic') === '1') setView('classic');

      // ?theme=light|dark — lets the automated poster-generation script
      // (scripts/generate-h2h-poster.js) pick the theme headlessly, since
      // there's no click to drive it there.
      if (p.get('theme') === 'light') {
        document.body.classList.add('mu-poster-light');
        posterTheme.textContent = '☀️';
      }

      // poster-only light/dark toggle, independent of the site's own theme
      posterTheme.addEventListener('click', () => {
        const isLight = document.body.classList.toggle('mu-poster-light');
        posterTheme.textContent = isLight ? '☀️' : '🌙';
      });

      // ── Download Poster ──────────────────────────────────────
      // Same html2canvas-based approach as fightcard.html — see that file's
      // comment for why the initial SVG-foreignObject attempt was dropped
      // (it rendered perfectly via direct navigation, but failed
      // consistently only when decoded via new Image() on a live http://
      // page — a narrow browser quirk not worth chasing further).
      const API_BASE_DL = 'https://mmabridge-backend.onrender.com';
      let _html2canvasPromise = null;
      function loadHtml2Canvas() {
        if (!_html2canvasPromise) {
          _html2canvasPromise = new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
            s.onload = () => resolve(window.html2canvas);
            s.onerror = () => reject(new Error('Could not load html2canvas'));
            document.head.appendChild(s);
          });
        }
        return _html2canvasPromise;
      }
      async function downloadPosterImage(targetEl, filename) {
        const html2canvas = await loadHtml2Canvas();
        const imgs = [...targetEl.querySelectorAll('img')];
        const originalSrcs = imgs.map(img => img.src);
        await Promise.all(imgs.map(async img => {
          const src = img.getAttribute('src');
          if (!src || src.startsWith('data:')) return;
          try {
            const proxied = `${API_BASE_DL}/api/image-proxy?url=${encodeURIComponent(src)}`;
            // Render free-tier cold-start can return an error well before
            // the instance is actually warm — retry a couple times with
            // backoff instead of giving up on the first hiccup (which used
            // to silently leave a cross-origin src in place that
            // html2canvas then renders as a blank photo).
            let res;
            for (let attempt = 0; attempt < 3; attempt++) {
              try {
                res = await fetch(proxied);
                if (res.ok) break;
              } catch (e) { res = null; }
              if (attempt < 2) await new Promise(r => setTimeout(r, 1500 * (attempt + 1)));
            }
            // fetch() only rejects on network failure, not on HTTP error
            // status — a 404 (e.g. backend not yet redeployed with this
            // endpoint) resolves "successfully" with an error page body,
            // which then got read as if it were image bytes and written
            // into img.src as garbage, breaking the photo instead of just
            // leaving the original (uncorrupted) src in place. Checking
            // res.ok is what was missing.
            if (!res || !res.ok) return;
            const blob = await res.blob();
            const dataUrl = await new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = () => resolve(reader.result);
              reader.onerror = reject;
              reader.readAsDataURL(blob);
            });
            img.src = dataUrl;
          } catch (e) {}
        }));
        try {
          const bg = getComputedStyle(targetEl).backgroundColor;
          const canvas = await html2canvas(targetEl, { backgroundColor: bg, scale: 2, useCORS: true, logging: false });
          await new Promise((resolve, reject) => {
            canvas.toBlob(blob => {
              if (!blob) { reject(new Error('canvas produced no image data')); return; }
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              // target="_blank" isn't for opening a new tab here — it's
              // what makes theme.js's global "fade + navigate on internal
              // link click" handler leave this anchor alone. That handler
              // only excludes href starting with #/http/mailto or
              // target === "_blank", and blob: URLs matched none of the
              // first three — it was hijacking this click, preventDefault-
              // ing the real download, and manually navigating the whole
              // page to the blob URL instead (which 404s once the browser
              // gets to it, taking the rest of the page down with it).
              a.href = url; a.download = filename; a.target = '_blank';
              document.body.appendChild(a); a.click(); a.remove();
              // Revoking synchronously right after click() races the
              // browser actually starting the download — confirmed this
              // loses the race consistently on this page (many more
              // scripts loaded than fightcard.html means more event-loop
              // contention). Give it a beat.
              setTimeout(() => URL.revokeObjectURL(url), 1000);
              resolve();
            }, 'image/png');
          });
        } finally {
          imgs.forEach((img, i) => { img.src = originalSrcs[i]; });
        }
      }

      const posterDownload = document.getElementById('muPosterDownload');
      posterDownload.addEventListener('click', async () => {
        posterDownload.disabled = true;
        const original = posterDownload.innerHTML;
        posterDownload.textContent = '...';

        const isClassic = document.body.classList.contains('mu-classic-mode');
        let target, restore = () => {};
        if (isClassic) {
          target = document.querySelector('.mu-classic-card');
        } else {
          // Poster (banner) mode's event name/location line is a sibling
          // AFTER .mu-hero, not inside it (kept that way so it never
          // overlaps the fighters) — temporarily move both into an
          // offscreen wrapper so they capture as one image, then put them
          // straight back where they came from either way.
          const hero = document.querySelector('.mu-hero');
          const heroParent = hero.parentNode, heroNext = hero.nextSibling;
          const eventline = document.querySelector('.mu-poster-eventline.has-text');
          const elParent = eventline ? eventline.parentNode : null;
          const elNext = eventline ? eventline.nextSibling : null;
          const wrapper = document.createElement('div');
          wrapper.style.cssText = 'position:fixed; left:-9999px; top:0; display:inline-block;';
          document.body.appendChild(wrapper);
          wrapper.appendChild(hero);
          if (eventline) wrapper.appendChild(eventline);
          target = wrapper;
          restore = () => {
            heroParent.insertBefore(hero, heroNext);
            if (eventline) elParent.insertBefore(eventline, elNext);
            wrapper.remove();
          };
        }

        try {
          await downloadPosterImage(target, `${(nameA + '-vs-' + nameB).replace(/[^a-z0-9-]+/gi, '-')}.png`);
        } catch (e) {
          posterDownload.textContent = '✕';
          setTimeout(() => { posterDownload.innerHTML = original; posterDownload.disabled = false; }, 2000);
          restore();
          return;
        }
        restore();
        posterDownload.innerHTML = original;
        posterDownload.disabled = false;
      });
    });

    window.addEventListener('scroll', () => {
      document.querySelector('.navbar').classList.toggle('scrolled', window.scrollY > 10);
    });
  })();
  </script>
</body>
</html>
