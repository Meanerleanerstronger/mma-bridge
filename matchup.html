<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="images/mma-bridge-logo.png">
  <link rel="shortcut icon" type="image/png" href="images/mma-bridge-logo.png">
  <link rel="apple-touch-icon" href="images/mma-bridge-logo.png">
  <meta name="theme-color" content="#f0b429">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <script src="theme.js?v=2.7"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fight Matchup | MMA Bridge</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,900&family=Montserrat:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=9.4" />
  <style>
    body { background:#060608; min-height:100vh; }

    /* ── BACK BAR ── */
    .mu-back {
      display:inline-flex; align-items:center; gap:7px;
      font-family:'Montserrat',sans-serif; font-weight:700; font-size:.6rem;
      letter-spacing:.14em; text-transform:uppercase;
      color:rgba(255,255,255,.3); text-decoration:none;
      padding:18px 24px 0; transition:color .18s;
    }
    .mu-back:hover { color:#f0b429; }

    /* ── HERO ── */
    .mu-hero {
      position:relative; overflow:hidden;
      min-height:340px;
      background:#08080c;
      margin-top:12px;
    }
    /* diagonal split glow */
    .mu-hero::before {
      content:''; position:absolute; inset:0;
      background:linear-gradient(115deg,
        rgba(240,180,41,.12) 0%,
        rgba(240,180,41,.05) 38%,
        transparent 50%,
        rgba(96,165,250,.05) 62%,
        rgba(96,165,250,.12) 100%);
      pointer-events:none;
    }
    /* center vertical line */
    .mu-hero::after {
      content:''; position:absolute; top:0; bottom:0;
      left:50%; width:1px;
      background:linear-gradient(180deg,transparent,rgba(255,255,255,.07) 20%,rgba(255,255,255,.07) 80%,transparent);
      pointer-events:none;
    }

    /* fighter images */
    .mu-hero-imgs {
      position:absolute; inset:0;
      display:grid; grid-template-columns:1fr 1fr;
      pointer-events:none;
    }
    .mu-hero-img-wrap { position:relative; overflow:hidden; display:flex; align-items:flex-end; }
    .mu-hero-img-wrap.a { justify-content:flex-start; padding-left:5%; }
    .mu-hero-img-wrap.b { justify-content:flex-end; padding-right:5%; }
    .mu-hero-img {
      height:320px; width:auto; max-width:55%;
      object-fit:contain; object-position:bottom center;
      filter:drop-shadow(0 0 30px rgba(0,0,0,.9));
      opacity:.85;
    }
    .mu-hero-img-wrap.a .mu-hero-img { filter:drop-shadow(0 0 30px rgba(0,0,0,.9)) drop-shadow(-8px 0 20px rgba(240,180,41,.18)); }
    .mu-hero-img-wrap.b .mu-hero-img { filter:drop-shadow(0 0 30px rgba(0,0,0,.9)) drop-shadow(8px 0 20px rgba(96,165,250,.18)); transform:scaleX(-1); }

    /* name block sitting on top of images */
    .mu-hero-text {
      position:relative; z-index:2;
      display:grid; grid-template-columns:1fr auto 1fr;
      align-items:flex-end;
      padding:32px 24px 24px;
      min-height:340px;
    }
    .mu-hero-side { display:flex; flex-direction:column; gap:6px; }
    .mu-hero-side.b { align-items:flex-end; text-align:right; }

    .mu-fighter-name {
      font-family:'Barlow Condensed',sans-serif; font-weight:900;
      font-size:clamp(2rem,5vw,3.8rem);
      text-transform:uppercase; letter-spacing:.01em; line-height:.95;
      text-decoration:none; transition:opacity .18s;
    }
    .mu-fighter-name:hover { opacity:.8; }
    .mu-fighter-name.a { color:#f0b429; text-shadow:0 0 40px rgba(240,180,41,.3); }
    .mu-fighter-name.b { color:#60a5fa; text-shadow:0 0 40px rgba(96,165,250,.3); }

    .mu-fighter-chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; }
    .mu-hero-side.b .mu-fighter-chips { justify-content:flex-end; }
    .mu-chip {
      font-family:'Montserrat',sans-serif; font-weight:700; font-size:.48rem;
      letter-spacing:.1em; text-transform:uppercase;
      padding:3px 9px; border-radius:4px;
      border:1px solid rgba(255,255,255,.1);
      color:rgba(255,255,255,.5); background:rgba(255,255,255,.04);
    }
    .mu-chip.nat { border-color:rgba(255,255,255,.15); }

    /* center VS block */
    .mu-vs-center {
      text-align:center; padding:0 12px;
      display:flex; flex-direction:column; align-items:center; gap:4px;
      padding-bottom:4px;
    }
    .mu-vs-text {
      font-family:'Barlow Condensed',sans-serif; font-weight:900;
      font-size:clamp(.9rem,2.5vw,1.2rem);
      color:rgba(255,255,255,.15); letter-spacing:.2em;
      text-transform:uppercase;
    }
    .mu-vs-weight {
      font-family:'Montserrat',sans-serif; font-weight:800; font-size:.5rem;
      letter-spacing:.18em; text-transform:uppercase;
      color:rgba(255,255,255,.25); white-space:nowrap;
    }

    /* bottom gradient on hero */
    .mu-hero-fade {
      position:absolute; bottom:0; left:0; right:0; height:80px;
      background:linear-gradient(to top, #060608, transparent);
      pointer-events:none; z-index:1;
    }

    /* ── SPLIT BAR ── */
    .mu-split-bar {
      display:grid; grid-template-columns:1fr 1fr;
      height:3px; margin:0;
    }
    .mu-split-a { background:linear-gradient(90deg,transparent,#f0b429); }
    .mu-split-b { background:linear-gradient(90deg,#60a5fa,transparent); }

    /* ── CONTENT WRAPPER ── */
    .mu-content { max-width:860px; margin:0 auto; padding:0 20px 100px; }

    /* ── STAT ROWS ── */
    .mu-stats-panel {
      margin-top:28px;
      border:1px solid rgba(255,255,255,.07);
      border-radius:14px;
      overflow:hidden;
      background:rgba(255,255,255,.015);
    }
    .mu-stats-header {
      padding:14px 20px;
      border-bottom:1px solid rgba(255,255,255,.06);
      font-family:'Montserrat',sans-serif; font-weight:800;
      font-size:.55rem; letter-spacing:.2em; text-transform:uppercase;
      color:rgba(255,255,255,.22);
      display:flex; align-items:center; gap:10px;
    }
    .mu-stats-header::after { content:''; flex:1; height:1px; background:rgba(255,255,255,.05); }

    .mu-stat-row {
      display:grid; grid-template-columns:1fr 100px 1fr;
      align-items:center; padding:16px 20px;
      border-bottom:1px solid rgba(255,255,255,.04);
      transition:background .15s;
    }
    .mu-stat-row:last-child { border-bottom:none; }
    .mu-stat-row:hover { background:rgba(255,255,255,.02); }

    .mu-stat-val {
      font-family:'Barlow Condensed',sans-serif; font-weight:800;
      font-size:1.25rem; line-height:1;
    }
    .mu-stat-val.a { color:#f0b429; }
    .mu-stat-val.b { color:#60a5fa; text-align:right; }
    .mu-stat-val.a.edge {
      color:#ffd960;
      text-shadow:0 0 14px rgba(255,217,96,.35);
    }
    .mu-stat-val.b.edge {
      color:#93c5fd;
      text-shadow:0 0 14px rgba(147,197,253,.35);
    }
    .mu-stat-val.a.edge::after  { content:' ▲'; font-size:.6em; opacity:.7; }
    .mu-stat-val.b.edge::before { content:'▲ '; font-size:.6em; opacity:.7; }

    .mu-stat-label {
      text-align:center;
      font-family:'Montserrat',sans-serif; font-weight:800;
      font-size:.5rem; letter-spacing:.16em; text-transform:uppercase;
      color:rgba(255,255,255,.28);
    }

    /* ── ODDS ── */
    .mu-odds-panel {
      margin-top:16px;
      border:1px solid rgba(255,255,255,.07);
      border-radius:14px; overflow:hidden;
      background:rgba(255,255,255,.015);
    }
    .mu-odds-header {
      padding:14px 20px;
      border-bottom:1px solid rgba(255,255,255,.06);
      font-family:'Montserrat',sans-serif; font-weight:800;
      font-size:.55rem; letter-spacing:.2em; text-transform:uppercase;
      color:rgba(255,255,255,.22);
      display:flex; align-items:center; gap:10px;
    }
    .mu-odds-header::after { content:''; flex:1; height:1px; background:rgba(255,255,255,.05); }
    .mu-odds-body {
      display:grid; grid-template-columns:1fr 1fr;
    }
    .mu-odds-side {
      padding:22px 24px; text-align:center;
    }
    .mu-odds-side.a { border-right:1px solid rgba(255,255,255,.05); }
    .mu-odds-name {
      font-family:'Montserrat',sans-serif; font-weight:700; font-size:.6rem;
      letter-spacing:.08em; text-transform:uppercase;
      color:rgba(255,255,255,.4); margin-bottom:8px;
    }
    .mu-odds-num {
      font-family:'Barlow Condensed',sans-serif; font-weight:900;
      font-size:2.8rem; line-height:1;
    }
    .mu-odds-num.fav { color:#4ade80; text-shadow:0 0 20px rgba(74,222,128,.25); }
    .mu-odds-num.dog { color:#f87171; }
    .mu-odds-prob {
      font-family:'Inter',sans-serif; font-size:.65rem; font-weight:500;
      color:rgba(255,255,255,.3); margin-top:6px;
    }
    .mu-odds-note {
      padding:10px 20px;
      border-top:1px solid rgba(255,255,255,.04);
      font-family:'Inter',sans-serif; font-size:.55rem;
      color:rgba(255,255,255,.15); text-align:center;
    }

    /* ── PICKS CTA ── */
    .mu-cta {
      margin-top:28px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap;
    }
    .mu-picks-btn {
      display:inline-flex; align-items:center; gap:8px;
      background:linear-gradient(135deg,#7a3100,#d46400 52%,#f0a500);
      border:none; color:#fff;
      font-family:'Montserrat',sans-serif; font-weight:800;
      font-size:.7rem; letter-spacing:.1em; text-transform:uppercase;
      padding:14px 32px; border-radius:10px; cursor:pointer; text-decoration:none;
      box-shadow:0 4px 24px rgba(240,140,0,.3);
      transition:transform .18s, box-shadow .18s;
    }
    .mu-picks-btn:hover { transform:translateY(-2px); box-shadow:0 10px 32px rgba(240,140,0,.5); }

    /* ── LOADING ── */
    .mu-loading {
      text-align:center; padding:120px 24px;
      font-family:'Inter',sans-serif; font-size:.84rem;
      color:rgba(255,255,255,.22);
    }

    /* ── LIGHT MODE ── */
    body.light-mode .mu-fighter-name.a { color:#b8820a; }
    body.light-mode .mu-fighter-name.b { color:#2563eb; }
    body.light-mode .mu-hero { background:#f0f0f5; }
    body.light-mode .mu-hero::before {
      background:linear-gradient(115deg,rgba(184,130,10,.1) 0%,transparent 50%,rgba(37,99,235,.1) 100%);
    }
    body.light-mode .mu-stat-val.a { color:#b8820a; }
    body.light-mode .mu-stat-val.b { color:#2563eb; }
    body.light-mode .mu-stats-panel,
    body.light-mode .mu-odds-panel { background:rgba(0,0,0,.03); border-color:rgba(0,0,0,.08); }
    body.light-mode .mu-stat-label { color:rgba(0,0,0,.38); }

    /* ── MOBILE ── */
    @media(max-width:600px){
      .mu-hero-text { grid-template-columns:1fr auto 1fr; padding:20px 14px 18px; min-height:240px; }
      .mu-fighter-name { font-size:1.5rem; }
      .mu-hero-img { height:220px; }
      .mu-stat-row { grid-template-columns:1fr 80px 1fr; padding:13px 14px; }
      .mu-stat-val { font-size:1rem; }
      .mu-stat-label { font-size:.44rem; }
      .mu-odds-num { font-size:2.2rem; }
      .mu-odds-body { grid-template-columns:1fr 1fr; }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-container">
      <a class="logo" href="index.html">
        <img src="images/mma-bridge-logo.png" class="nav-logo-img" alt="MMA Bridge">
      </a>
      <div id="notifBellMount"></div>
      <ul class="nav-links">
        <li><a href="index.html">Trending</a></li>
        <li><a href="events.html" class="active">Events</a></li>
        <li><a href="pfp.html">Rankings</a></li>
        <li><a href="reviews.html">Review</a></li>
        <li><a href="lucas.html">Lucas Bot</a></li>
        <li><a href="leaderboard.html">Leaderboard</a></li>
      </ul>
      <button class="theme-toggle" id="themeToggle" aria-label="Switch theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <div class="nav-auth"></div>
      <button class="nav-hamburger" id="nav-hamburger"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <a class="mu-back" id="muBackLink" href="events.html">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Back to event
  </a>

  <div id="muRoot" class="mu-loading">Loading matchup...</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="auth.js?v=3.2"></script>
  <script src="search.js"></script>
  <script src="chat.js?v=2.4"></script>
  <script src="fighter-modal.js?v=1.1"></script>
  <script src="notifications.js?v=2.4"></script>
  <script src="micro.js?v=1.0"></script>
  <script>
  (function(){
    const API = 'https://mmabridge-backend.onrender.com/api';
    const p   = new URLSearchParams(location.search);
    const eventId = p.get('event') || '';
    const nameA   = p.get('a') || '';
    const nameB   = p.get('b') || '';
    const weight  = p.get('weight') || '';
    const imgA    = p.get('imgA') || '';
    const imgB    = p.get('imgB') || '';

    if (nameA && nameB) document.title = `${nameA} vs ${nameB} | MMA Bridge`;

    const backLink = document.getElementById('muBackLink');
    if (eventId) backLink.href = `events.html?id=${encodeURIComponent(eventId)}`;

    function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
    function fmtOdds(n){ return n > 0 ? '+'+n : String(n); }
    function impliedProb(n){
      const pct = n < 0 ? (-n / (-n + 100)) * 100 : (100 / (n + 100)) * 100;
      return Math.round(pct) + '%';
    }
    function fuzzyMatch(a, b){
      if (!a || !b) return false;
      const clean = s => s.toLowerCase().replace(/[^a-z]/g,'');
      const ca = clean(a), cb = clean(b);
      return ca === cb || ca.includes(cb) || cb.includes(ca);
    }
    function edge(va, vb, higher){
      const na = parseFloat(String(va).replace(/[^0-9.]/g,'')),
            nb = parseFloat(String(vb).replace(/[^0-9.]/g,''));
      if (isNaN(na)||isNaN(nb)||na===nb) return {a:'',b:''};
      const aWins = higher ? na>nb : na<nb;
      return {a:aWins?'edge':'', b:aWins?'':'edge'};
    }
    function recStr(f){ const r=f.record; return r?`${r.wins}-${r.losses}${r.draws?'-'+r.draws:''}`:'—'; }

    Promise.all([
      fetch('data/fighters.json?_='+Date.now(),{cache:'no-store'}).then(r=>r.json()).catch(()=>[]),
      fetch(`${API}/odds/${encodeURIComponent(eventId)}`).then(r=>r.json()).catch(()=>({odds:[]})),
    ]).then(([fighters, oddsData]) => {

      const fA = fighters.find(f=>fuzzyMatch(f.name,nameA)) || {};
      const fB = fighters.find(f=>fuzzyMatch(f.name,nameB)) || {};

      const oddsEntry = (oddsData.odds||[]).find(o=>
        (fuzzyMatch(o.a,nameA)||fuzzyMatch(o.b,nameA)) &&
        (fuzzyMatch(o.a,nameB)||fuzzyMatch(o.b,nameB))
      );
      let oddsForA=null, oddsForB=null;
      if (oddsEntry) {
        const aIsA = fuzzyMatch(oddsEntry.a,nameA);
        oddsForA = aIsA ? oddsEntry.odds_a : oddsEntry.odds_b;
        oddsForB = aIsA ? oddsEntry.odds_b : oddsEntry.odds_a;
      }

      /* stat rows */
      const reachEdge  = edge(fA.reach||0, fB.reach||0, true);
      const heightEdge = edge(fA.height||0, fB.height||0, true);
      const ageEdge    = edge(fA.age||99, fB.age||99, false);

      const statRows = [
        { label:'RECORD',      a:recStr(fA),                          b:recStr(fB),                          eA:'',            eB:'' },
        { label:'HEIGHT',      a:fA.height||'—',                     b:fB.height||'—',                     eA:heightEdge.a,  eB:heightEdge.b },
        { label:'REACH',       a:fA.reach||'—',                      b:fB.reach||'—',                      eA:reachEdge.a,   eB:reachEdge.b },
        { label:'STANCE',      a:fA.stance||'—',                     b:fB.stance||'—',                     eA:'',            eB:'' },
        { label:'AGE',         a:fA.age||'—',                        b:fB.age||'—',                        eA:ageEdge.a,     eB:ageEdge.b },
        { label:'NATIONALITY', a:(fA.flag||'')+' '+(fA.nationality||'—'), b:(fB.flag||'')+' '+(fB.nationality||'—'), eA:'', eB:'' },
        { label:'STYLE',       a:fA.style||'—',                      b:fB.style||'—',                      eA:'',            eB:'' },
      ];

      const statsHTML = statRows.map(r=>`
        <div class="mu-stat-row">
          <div class="mu-stat-val a ${r.eA}">${esc(String(r.a))}</div>
          <div class="mu-stat-label">${r.label}</div>
          <div class="mu-stat-val b ${r.eB}">${esc(String(r.b))}</div>
        </div>`).join('');

      /* odds */
      const oddsHTML = (oddsForA!==null && oddsForB!==null) ? `
        <div class="mu-odds-panel">
          <div class="mu-odds-header">Betting Odds</div>
          <div class="mu-odds-body">
            <div class="mu-odds-side a">
              <div class="mu-odds-name">${esc(nameA)}</div>
              <div class="mu-odds-num ${oddsForA<0?'fav':'dog'}">${fmtOdds(oddsForA)}</div>
              <div class="mu-odds-prob">Implied ${impliedProb(oddsForA)}</div>
            </div>
            <div class="mu-odds-side b">
              <div class="mu-odds-name">${esc(nameB)}</div>
              <div class="mu-odds-num ${oddsForB<0?'fav':'dog'}">${fmtOdds(oddsForB)}</div>
              <div class="mu-odds-prob">Implied ${impliedProb(oddsForB)}</div>
            </div>
          </div>
          <div class="mu-odds-note">Odds via The Odds API · for entertainment only</div>
        </div>` : '';

      /* fighter images */
      const shotA = imgA || fA.img || '';
      const shotB = imgB || fB.img || '';
      const imgsHTML = (shotA||shotB) ? `
        <div class="mu-hero-imgs">
          <div class="mu-hero-img-wrap a">
            ${shotA?`<img class="mu-hero-img" src="${esc(shotA)}" alt="${esc(nameA)}" onerror="this.style.display='none'">`:''}
          </div>
          <div class="mu-hero-img-wrap b">
            ${shotB?`<img class="mu-hero-img" src="${esc(shotB)}" alt="${esc(nameB)}" onerror="this.style.display='none'">`:''}
          </div>
        </div>` : '';

      /* chips */
      function chips(f){
        const c=[];
        if(f.nationality) c.push(`<span class="mu-chip nat">${f.flag||''} ${f.nationality}</span>`);
        if(f.stance) c.push(`<span class="mu-chip">${f.stance}</span>`);
        return c.length ? `<div class="mu-fighter-chips">${c.join('')}</div>` : '';
      }

      const profileA = fA.id ? `profile.html?fighter=${encodeURIComponent(fA.id)}` : `#`;
      const profileB = fB.id ? `profile.html?fighter=${encodeURIComponent(fB.id)}` : `#`;
      const picksHref = eventId ? `picks.html?event=${encodeURIComponent(eventId)}` : 'events.html';

      document.getElementById('muRoot').innerHTML = `
        <div class="mu-hero">
          ${imgsHTML}
          <div class="mu-hero-text">
            <div class="mu-hero-side a">
              <a class="mu-fighter-name a" href="${profileA}">${esc(nameA)}</a>
              ${chips(fA)}
            </div>
            <div class="mu-vs-center">
              <div class="mu-vs-text">VS</div>
              ${weight?`<div class="mu-vs-weight">${esc(weight)}</div>`:''}
            </div>
            <div class="mu-hero-side b">
              <a class="mu-fighter-name b" href="${profileB}">${esc(nameB)}</a>
              ${chips(fB)}
            </div>
          </div>
          <div class="mu-hero-fade"></div>
        </div>
        <div class="mu-split-bar"><div class="mu-split-a"></div><div class="mu-split-b"></div></div>
        <div class="mu-content">
          <div class="mu-stats-panel">
            <div class="mu-stats-header">Fighter Comparison</div>
            ${statsHTML}
          </div>
          ${oddsHTML}
          <div class="mu-cta">
            <a class="mu-picks-btn" href="${picksHref}">Make Your Picks →</a>
          </div>
        </div>
      `;
      document.title = `${nameA} vs ${nameB} | MMA Bridge`;
    });

    window.addEventListener('scroll', () => {
      document.querySelector('.navbar').classList.toggle('scrolled', window.scrollY > 10);
    });
  })();
  </script>
</body>
</html>
