<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="images/mma-bridge-logo.png">
  <link rel="shortcut icon" type="image/png" href="images/mma-bridge-logo.png">
  <link rel="apple-touch-icon" href="images/mma-bridge-logo.png">
  <meta name="theme-color" content="#d97b3f">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <script src="theme.js?v=2.7"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fight Matchup | MMA Bridge</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600&family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,800;1,900&family=Newsreader:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css?v=9.21" />
  <style>
    *, *::before, *::after { box-sizing:border-box; }
    body { background:#040407; min-height:100vh; }

    /* ── BACK BAR ── */
    .mu-back {
      display:inline-flex; align-items:center; gap:7px;
      font-family:'Montserrat',sans-serif; font-weight:700; font-size:.6rem;
      letter-spacing:.14em; text-transform:uppercase;
      color:rgba(255,255,255,.32); text-decoration:none;
      padding:16px 24px 0; transition:color .18s;
    }
    .mu-back:hover { color:#d97b3f; }

    /* ── HERO — poster-style: diagonal corner-color wash, bigger vivid
       photos, VS medallion, big shadowed type. Replaces the previous
       deliberately-flat "plain dark ground + hairline divider" version. ── */
    .mu-hero {
      position:relative; overflow:hidden;
      min-height:480px;
      background:#050506;
      margin-top:10px;
      transition:min-height .3s ease;
    }
    /* diagonal corner-color wash — the single biggest lever for reading as
       a poster instead of a spec sheet. Two angled panels meeting in a
       jagged seam down the middle, amber left / steel right. */
    .mu-hero-glow-a, .mu-hero-glow-b {
      position:absolute; top:0; bottom:0; width:62%; z-index:0;
      pointer-events:none;
    }
    .mu-hero-glow-a {
      left:0;
      clip-path:polygon(0 0, 100% 0, 84% 100%, 0 100%);
      background:linear-gradient(120deg, rgba(217,123,63,.32) 0%, rgba(217,123,63,.05) 55%, transparent 75%);
    }
    .mu-hero-glow-b {
      right:0;
      clip-path:polygon(16% 0, 100% 0, 100% 100%, 0 100%);
      background:linear-gradient(240deg, rgba(96,165,250,.26) 0%, rgba(96,165,250,.04) 55%, transparent 75%);
    }
    .mu-hero-noise { display:none; }
    /* diagonal wireframe grid — a generic interlocking-diamond line motif
       (not any specific promotion's actual poster art) layered over the
       color wash for extra graphic energy; masked out toward the bottom so
       it doesn't fight with the fighter names sitting there. */
    .mu-hero-grid {
      position:absolute; inset:0; z-index:0; pointer-events:none;
      opacity:.16;
      background-image:
        repeating-linear-gradient(45deg, rgba(255,255,255,.55) 0 1.5px, transparent 1.5px 58px),
        repeating-linear-gradient(-45deg, rgba(255,255,255,.55) 0 1.5px, transparent 1.5px 58px);
      -webkit-mask-image:linear-gradient(to bottom, black 0%, black 55%, transparent 92%);
      mask-image:linear-gradient(to bottom, black 0%, black 55%, transparent 92%);
    }
    body.light-mode .mu-hero-grid { opacity:.09; background-image:
        repeating-linear-gradient(45deg, rgba(0,0,0,.55) 0 1.5px, transparent 1.5px 58px),
        repeating-linear-gradient(-45deg, rgba(0,0,0,.55) 0 1.5px, transparent 1.5px 58px); }
    .mu-hero-slash {
      position:absolute; top:0; bottom:0; left:0; width:3px; height:100%;
      transform-origin:top left;
      background:linear-gradient(180deg,
        transparent 0%, rgba(255,255,255,.5) 15%,
        rgba(255,255,255,.75) 50%, rgba(255,255,255,.5) 85%, transparent 100%);
      box-shadow:0 0 24px rgba(217,123,63,.5);
      left:calc(50% - 1px);
      clip-path:polygon(46% 0, 54% 0, 68% 100%, 60% 100%);
      pointer-events:none; z-index:2;
    }

    /* fighter images — bigger, full color, per-side rim glow */
    .mu-hero-imgs {
      position:absolute; inset:0;
      display:grid; grid-template-columns:1fr 1fr;
      pointer-events:none; z-index:1;
    }
    .mu-hero-img-wrap { display:flex; align-items:flex-end; overflow:hidden; }
    .mu-hero-img-wrap.a { justify-content:flex-start; padding-left:1%; }
    .mu-hero-img-wrap.b { justify-content:flex-end; padding-right:1%; }
    .mu-hero-img {
      height:440px; width:auto; max-width:62%;
      object-fit:contain; object-position:bottom center;
      filter:grayscale(0.05) contrast(1.06);
      opacity:.97;
    }
    .mu-hero-img-wrap.a .mu-hero-img {
      filter:grayscale(0.05) contrast(1.06) drop-shadow(-6px 18px 34px rgba(217,123,63,.35)) drop-shadow(0 10px 26px rgba(0,0,0,.85));
    }
    .mu-hero-img-wrap.b .mu-hero-img {
      transform:scaleX(-1);
      filter:grayscale(0.05) contrast(1.06) drop-shadow(6px 18px 34px rgba(96,165,250,.3)) drop-shadow(0 10px 26px rgba(0,0,0,.85));
    }

    /* text overlay */
    .mu-hero-text {
      position:relative; z-index:3;
      display:grid; grid-template-columns:1fr auto 1fr;
      align-items:flex-end;
      padding:36px 28px 28px;
      min-height:480px;
      transition:min-height .3s ease;
    }
    .mu-hero-side { display:flex; flex-direction:column; gap:9px; }
    .mu-hero-side.b { align-items:flex-end; text-align:right; }

    .mu-fighter-name {
      font-family:'Barlow Condensed',sans-serif; font-weight:900; font-style:italic;
      font-size:clamp(2.6rem,6.8vw,5.4rem);
      text-transform:uppercase; letter-spacing:.005em; line-height:.88;
      text-decoration:none; transition:opacity .2s;
      display:inline-block;
      color:#fff;
      -webkit-text-stroke:1px rgba(0,0,0,.4);
      text-shadow:0 3px 0 rgba(0,0,0,.9), 0 8px 34px rgba(0,0,0,.75);
    }
    .mu-fighter-name.a { text-shadow:0 3px 0 rgba(0,0,0,.9), 0 8px 34px rgba(217,123,63,.35); }
    .mu-fighter-name.b { text-shadow:0 3px 0 rgba(0,0,0,.9), 0 8px 34px rgba(96,165,250,.3); }
    .mu-fighter-name:hover { opacity:.85; }

    .mu-fighter-chips { display:flex; gap:5px; flex-wrap:wrap; }
    .mu-hero-side.b .mu-fighter-chips { justify-content:flex-end; }
    .mu-chip {
      font-family:'Montserrat',sans-serif; font-weight:700; font-size:.46rem;
      letter-spacing:.1em; text-transform:uppercase;
      padding:3px 8px; border-radius:2px;
      border:1px solid rgba(255,255,255,.16);
      color:rgba(255,255,255,.55);
    }
    /* gold champion badge + record chip — extra poster-style flavor beyond
       the plain nationality/stance tags. */
    .mu-chip.champ {
      color:#1a1206; border-color:transparent;
      background:linear-gradient(135deg,#f4d99a,#c9922f 55%,#8a5f1c);
      font-weight:800;
    }
    .mu-chip.record {
      color:#d97b3f; border-color:rgba(217,123,63,.4);
      font-variant-numeric:tabular-nums;
    }
    .mu-hero-side.b .mu-chip.record { color:#60a5fa; border-color:rgba(96,165,250,.4); }

    /* VS medallion — was plain italic serif text, now a lit badge with a
       slow-spinning color sunburst behind it for extra poster energy. */
    .mu-vs-center {
      position:relative;
      text-align:center; padding:0 6px;
      display:flex; flex-direction:column; align-items:center; gap:8px;
      padding-bottom:10px;
    }
    .mu-vs-center::before {
      content:''; position:absolute; top:0; left:50%;
      width:130px; height:130px; margin-left:-65px; margin-top:-37px;
      background:repeating-conic-gradient(from 0deg,
        rgba(217,123,63,.22) 0deg 9deg, transparent 9deg 20deg,
        rgba(96,165,250,.18) 20deg 29deg, transparent 29deg 40deg);
      border-radius:50%;
      animation:mu-sunburst-spin 22s linear infinite;
      z-index:-1;
      pointer-events:none;
    }
    @keyframes mu-sunburst-spin { to { transform:rotate(360deg); } }
    .mu-vs-badge {
      width:56px; height:56px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.1), rgba(10,10,10,.5) 70%);
      border:1.5px solid rgba(255,255,255,.3);
      box-shadow:0 0 0 1px rgba(0,0,0,.4), 0 0 26px rgba(217,123,63,.35), inset 0 0 14px rgba(0,0,0,.5);
      animation:mu-vs-pulse 2.6s ease-in-out infinite;
    }
    @keyframes mu-vs-pulse {
      0%,100% { box-shadow:0 0 0 1px rgba(0,0,0,.4), 0 0 22px rgba(217,123,63,.3), inset 0 0 14px rgba(0,0,0,.5); }
      50%     { box-shadow:0 0 0 1px rgba(0,0,0,.4), 0 0 34px rgba(217,123,63,.55), inset 0 0 14px rgba(0,0,0,.5); }
    }
    .mu-vs-text {
      font-family:'Barlow Condensed',sans-serif; font-weight:900; font-style:italic;
      font-size:1.05rem; letter-spacing:.02em;
      color:#fff; text-shadow:0 2px 6px rgba(0,0,0,.7);
    }
    .mu-vs-weight {
      font-family:'Montserrat',sans-serif; font-weight:700; font-size:.48rem;
      letter-spacing:.16em; text-transform:uppercase;
      color:rgba(255,255,255,.4); white-space:nowrap;
    }

    /* bottom fade */
    .mu-hero-fade {
      position:absolute; bottom:0; left:0; right:0; height:100px;
      background:linear-gradient(to top,#040407 0%,transparent 100%);
      pointer-events:none; z-index:2;
    }

    /* ── VIEW TOGGLE ── */
    .mu-view-toggle {
      display:inline-flex; gap:2px; margin:16px 24px 0;
      border:1px solid rgba(255,255,255,.12); border-radius:20px; padding:2px;
    }
    .mu-view-btn {
      font-family:'Montserrat',sans-serif; font-weight:800; font-size:.6rem;
      letter-spacing:.1em; text-transform:uppercase;
      padding:7px 16px; border-radius:18px; border:none; cursor:pointer;
      background:transparent; color:rgba(255,255,255,.4);
      transition:background .18s, color .18s;
    }
    .mu-view-btn.active { background:#d97b3f; color:#0a0a0a; }
    .mu-view-btn:hover:not(.active) { color:#fff; }

    /* ── POSTER MODE — full-bleed, chrome hidden, always dark regardless
       of site theme (a promo poster shouldn't adapt to light mode),
       sized so a straight screenshot is ready to post as-is. ── */
    body.mu-poster-mode { background:#050506 !important; }
    body.mu-poster-mode .navbar,
    body.mu-poster-mode .mu-back,
    body.mu-poster-mode .mu-content,
    body.mu-poster-mode .mu-split-bar,
    /* Floating chrome (Lucas chat launcher, "Live on MMA Bridge" activity
       widget, notification bell) — same reasoning as the social pipeline's
       screenshot bot hiding these: they'd show up in anyone's real
       screenshot too, and don't belong in a shareable poster. */
    body.mu-poster-mode #lw-btn,
    body.mu-poster-mode #lw-window,
    body.mu-poster-mode #lw-widget,
    body.mu-poster-mode #lw-tab,
    body.mu-poster-mode #notifBellMount { display:none !important; }
    /* Center the hero at its natural content height (the same height that
       already reads well in Full mode) inside the viewport — stretching it
       to a forced 100vh left a dead gap up top with align-items:flex-end
       shoving the actual photos/names down near the bottom edge, cropped
       off-screen. Centering, not stretching, is the fix. */
    body.mu-poster-mode #muRoot {
      min-height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }
    body.mu-poster-mode .mu-view-toggle {
      position:fixed; top:16px; left:16px; margin:0; z-index:20;
    }
    body.mu-poster-mode .mu-fighter-name { font-size:clamp(3rem,9vw,7rem); }
    .mu-poster-controls {
      position:fixed; top:16px; right:16px; z-index:20;
      display:none; align-items:center; gap:8px;
    }
    body.mu-poster-mode .mu-poster-controls { display:flex; }
    .mu-poster-exit {
      background:rgba(0,0,0,.55); backdrop-filter:blur(8px);
      border:1px solid rgba(255,255,255,.2); border-radius:20px;
      color:#fff; font-family:'Montserrat',sans-serif; font-weight:700;
      font-size:.62rem; letter-spacing:.08em; text-transform:uppercase;
      padding:9px 18px; cursor:pointer; white-space:nowrap;
    }

    /* poster theme toggle — separate from the site-wide theme, since a
       promo poster shouldn't inherit whatever mode the visitor happens to
       be browsing in. Dark is the default look; light flips the negative
       space (the container itself) to white/cream while keeping the
       per-side color wash. */
    .mu-poster-theme {
      flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      width:34px; height:34px;
      background:rgba(0,0,0,.55); backdrop-filter:blur(8px);
      border:1px solid rgba(255,255,255,.2); border-radius:50%;
      color:#fff; font-size:.85rem; cursor:pointer;
    }

    /* poster brand watermark — small corner tag so a re-shared screenshot
       still reads as MMA Bridge content even cropped loosely. */
    .mu-poster-brand {
      position:absolute; left:24px; bottom:16px; z-index:3;
      display:none;
      font-family:'Montserrat',sans-serif; font-weight:800; font-size:.56rem;
      letter-spacing:.22em; text-transform:uppercase;
      color:rgba(255,255,255,.4);
    }
    body.mu-poster-mode .mu-poster-brand { display:block; }

    /* poster event banner — small stamped strip above the VS badge with
       the card name/date when known, so the poster carries more than just
       two names floating in empty space. */
    .mu-poster-eventline {
      position:absolute; top:20px; left:50%; transform:translateX(-50%);
      z-index:3; display:none;
      font-family:'Montserrat',sans-serif; font-weight:800; font-size:.58rem;
      letter-spacing:.24em; text-transform:uppercase;
      color:rgba(255,255,255,.55);
      padding:6px 16px; border:1px solid rgba(255,255,255,.18); border-radius:20px;
      background:rgba(0,0,0,.35); backdrop-filter:blur(6px);
      white-space:nowrap;
    }
    body.mu-poster-mode .mu-poster-eventline.has-text { display:block; }

    /* poster grain/texture — repurposes the previously-unused
       .mu-hero-noise element instead of leaving the poster a flat gradient
       ("less boring" — diagonal hairline texture reads as a print poster
       instead of a plain screenshot). */
    body.mu-poster-mode .mu-hero-noise {
      display:block; position:absolute; inset:0; z-index:0; pointer-events:none;
      background-image:repeating-linear-gradient(45deg, rgba(255,255,255,.03) 0 2px, transparent 2px 14px);
      mix-blend-mode:overlay;
    }
    body.mu-poster-mode .mu-vs-weight {
      font-size:.56rem; padding:4px 12px; border-radius:2px;
      border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.06);
      transform:rotate(-2deg);
    }

    /* ── POSTER LIGHT MODE — independent of the toggle above; flips the
       negative space white/cream instead of near-black. ── */
    body.mu-poster-mode.mu-poster-light { background:#f6f3ec !important; }
    body.mu-poster-mode.mu-poster-light .mu-hero { background:#f6f3ec; }
    body.mu-poster-mode.mu-poster-light .mu-hero-fade { background:linear-gradient(to top,#f6f3ec 0%,transparent 100%); }
    body.mu-poster-mode.mu-poster-light .mu-hero-glow-a { background:linear-gradient(120deg, rgba(217,123,63,.24) 0%, rgba(217,123,63,.03) 55%, transparent 75%); }
    body.mu-poster-mode.mu-poster-light .mu-hero-glow-b { background:linear-gradient(240deg, rgba(37,99,235,.2) 0%, rgba(37,99,235,.03) 55%, transparent 75%); }
    body.mu-poster-mode.mu-poster-light .mu-hero-noise { background-image:repeating-linear-gradient(45deg, rgba(0,0,0,.025) 0 2px, transparent 2px 14px); mix-blend-mode:multiply; }
    body.mu-poster-mode.mu-poster-light .mu-hero-grid { opacity:.09; background-image:
        repeating-linear-gradient(45deg, rgba(0,0,0,.55) 0 1.5px, transparent 1.5px 58px),
        repeating-linear-gradient(-45deg, rgba(0,0,0,.55) 0 1.5px, transparent 1.5px 58px); }
    body.mu-poster-mode.mu-poster-light .mu-fighter-name {
      color:#161514; -webkit-text-stroke:1px rgba(255,255,255,.6);
      text-shadow:0 3px 0 rgba(255,255,255,.75), 0 8px 30px rgba(0,0,0,.15);
    }
    body.mu-poster-mode.mu-poster-light .mu-fighter-name.a { text-shadow:0 3px 0 rgba(255,255,255,.75), 0 8px 30px rgba(217,123,63,.3); }
    body.mu-poster-mode.mu-poster-light .mu-fighter-name.b { text-shadow:0 3px 0 rgba(255,255,255,.75), 0 8px 30px rgba(37,99,235,.28); }
    body.mu-poster-mode.mu-poster-light .mu-vs-badge {
      background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.95), rgba(230,225,215,.6) 70%);
      border-color:rgba(0,0,0,.15);
      box-shadow:0 0 0 1px rgba(0,0,0,.08), 0 0 26px rgba(217,123,63,.25), inset 0 0 14px rgba(0,0,0,.06);
    }
    body.mu-poster-mode.mu-poster-light .mu-vs-text { color:#161514; text-shadow:0 1px 2px rgba(255,255,255,.7); }
    body.mu-poster-mode.mu-poster-light .mu-vs-weight { color:rgba(0,0,0,.55); border-color:rgba(0,0,0,.18); background:rgba(0,0,0,.04); }
    body.mu-poster-mode.mu-poster-light .mu-poster-brand,
    body.mu-poster-mode.mu-poster-light .mu-poster-eventline { color:rgba(0,0,0,.4); }
    body.mu-poster-mode.mu-poster-light .mu-poster-eventline { background:rgba(255,255,255,.55); border-color:rgba(0,0,0,.14); }
    body.mu-poster-mode.mu-poster-light .mu-poster-exit,
    body.mu-poster-mode.mu-poster-light .mu-poster-theme {
      background:rgba(255,255,255,.7); border-color:rgba(0,0,0,.16); color:#161514;
    }
    body.mu-poster-mode.mu-poster-light .mu-view-toggle { border-color:rgba(0,0,0,.16); }
    body.mu-poster-mode.mu-poster-light .mu-view-btn { color:rgba(0,0,0,.4); }
    body.mu-poster-mode.mu-poster-light .mu-view-btn:hover:not(.active) { color:#161514; }

    /* ── SPLIT BAR ── */
    .mu-split-bar {
      display:grid; grid-template-columns:1fr 1fr; height:2px;
    }
    .mu-split-a { background:linear-gradient(90deg,transparent 0%,#d97b3f 100%); }
    .mu-split-b { background:linear-gradient(90deg,#60a5fa 0%,transparent 100%); }

    /* ── CONTENT ── */
    .mu-content { max-width:860px; margin:0 auto; padding:0 20px 100px; }

    /* ── PANELS (shared) — flat ledger surface, no glass/blur ── */
    .mu-panel {
      margin-top:20px;
      border:1px solid rgba(255,255,255,.09);
      border-radius:4px; overflow:hidden;
      background:rgba(255,255,255,.015);
    }
    .mu-panel-header {
      padding:12px 20px;
      border-bottom:1px solid rgba(255,255,255,.07);
      font-family:'Montserrat',sans-serif; font-weight:700;
      font-size:.55rem; letter-spacing:.18em; text-transform:uppercase;
      color:rgba(255,255,255,.5);
      display:flex; align-items:center; gap:10px;
    }
    .mu-panel-header::after { content:''; flex:1; height:1px; background:rgba(255,255,255,.07); }

    /* ── TABS ── */
    .mu-tabs {
      display:flex; gap:0; border-bottom:1px solid rgba(255,255,255,.07);
      margin:28px 0 0;
    }
    .mu-tab {
      padding:12px 20px; font-family:'Montserrat',sans-serif;
      font-weight:800; font-size:.6rem; letter-spacing:.14em;
      text-transform:uppercase; color:rgba(255,255,255,.28);
      border:none; background:none; cursor:pointer;
      border-bottom:2px solid transparent; margin-bottom:-1px;
      transition:color .18s, border-color .18s;
    }
    .mu-tab:hover { color:rgba(255,255,255,.6); }
    .mu-tab.active { color:#d97b3f; border-bottom-color:#d97b3f; }
    .mu-tab-panel { display:none; }
    .mu-tab-panel.active { display:block; }

    /* ── RESUME TAB ── */
    .mu-resume-section { margin-top:0; }
    .mu-resume-block {
      padding:18px 22px;
      border-bottom:1px solid rgba(255,255,255,.04);
    }
    .mu-resume-block:last-child { border-bottom:none; }
    .mu-resume-label {
      font-family:'Montserrat',sans-serif; font-weight:800;
      font-size:.52rem; letter-spacing:.2em; text-transform:uppercase;
      color:#d97b3f; opacity:.75; margin-bottom:14px;
    }
    .mu-common-row {
      display:grid; grid-template-columns:1fr auto 1fr;
      align-items:center; gap:10px; padding:10px 8px;
      margin:0 -8px;
      border-radius:3px;
      border-bottom:1px solid rgba(255,255,255,.05);
      transition:background .15s;
    }
    .mu-common-row:hover { background:rgba(255,255,255,.025); }
    .mu-common-row:last-child { border-bottom:none; }
    .mu-common-result {
      display:inline-flex; align-items:center; justify-content:center;
      min-width:24px; height:20px; padding:0 6px; border-radius:2px;
      font-family:'Montserrat',sans-serif; font-weight:800;
      font-size:.6rem; letter-spacing:.02em;
      border:1px solid currentColor;
    }
    .mu-common-result.w { color:#4ade80; }
    .mu-common-result.l { color:#f87171; }
    .mu-common-opponent {
      font-family:'Montserrat',sans-serif; font-weight:700; font-size:.6rem;
      color:rgba(255,255,255,.6); text-align:center;
      text-transform:uppercase; letter-spacing:.04em;
      text-decoration:none; transition:color .15s;
    }
    .mu-common-opponent:hover { color:#d97b3f; }
    .mu-common-method {
      font-family:'Inter',sans-serif; font-size:.55rem;
      color:rgba(255,255,255,.32); margin-top:3px;
    }
    .mu-common-sub {
      font-size:.52rem; color:rgba(255,255,255,.24);
      font-family:'Montserrat',sans-serif; margin-bottom:10px; letter-spacing:.06em;
    }
    .mu-form-name {
      font-family:'Montserrat',sans-serif; font-size:.52rem; font-weight:700;
      color:rgba(255,255,255,.45); letter-spacing:.08em; text-transform:uppercase;
      margin-bottom:8px;
    }
    .mu-form-name.b { text-align:right; }
    .mu-form-row {
      display:flex; gap:5px; flex-wrap:wrap;
    }
    .mu-form-row.b { justify-content:flex-end; }
    .mu-form-pip {
      position:relative;
      width:28px; height:28px; border-radius:3px;
      display:flex; align-items:center; justify-content:center;
      font-family:'Montserrat',sans-serif; font-weight:800; font-size:.68rem;
      border:1px solid currentColor;
      text-decoration:none; cursor:pointer;
      transition:background .15s, transform .15s;
    }
    .mu-form-pip.w { color:#4ade80; }
    .mu-form-pip.l { color:#f87171; }
    .mu-form-pip:hover { background:currentColor; transform:translateY(-1px); }
    .mu-form-pip.w:hover .mu-form-pip-letter,
    .mu-form-pip.l:hover .mu-form-pip-letter { color:#0a0a0a; }
    /* custom hover tooltip — replaces relying on the native title attribute
       (slow to appear, unstyled) so "who'd they beat/lose to" is
       immediately visible on hover. */
    .mu-form-tip {
      display:none;
      position:absolute; bottom:calc(100% + 8px); left:50%;
      transform:translateX(-50%);
      background:#111; border:1px solid rgba(255,255,255,.14);
      border-radius:6px; padding:6px 10px;
      font-family:'Inter',sans-serif; font-size:.64rem; font-weight:500;
      color:rgba(255,255,255,.85); white-space:nowrap;
      z-index:10; pointer-events:none;
      box-shadow:0 8px 22px rgba(0,0,0,.5);
    }
    .mu-form-pip:hover .mu-form-tip { display:block; }
    .mu-form-sub {
      font-family:'Inter',sans-serif; font-size:.52rem;
      color:rgba(255,255,255,.3); margin-top:6px;
    }
    .mu-form-full {
      display:inline-flex; align-items:center; gap:4px;
      font-family:'Montserrat',sans-serif; font-weight:700; font-size:.5rem;
      letter-spacing:.1em; text-transform:uppercase;
      color:#d97b3f; text-decoration:none; margin-top:8px;
      opacity:.85; transition:opacity .15s;
    }
    .mu-form-full:hover { opacity:1; }
    .mu-form-name-row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .mu-form-name-row.b { flex-direction:row-reverse; }
    .mu-form-section {
      display:grid; grid-template-columns:1fr 1px 1fr; gap:16px; align-items:start;
    }
    .mu-form-divider { background:rgba(255,255,255,.08); align-self:stretch; }
    .mu-h2h-banner {
      text-align:center; padding:14px;
      font-family:'Newsreader',serif; font-weight:500; font-style:italic;
      font-size:1.05rem; color:#d97b3f;
      border:1px solid rgba(217,123,63,.3);
      border-radius:3px; margin-bottom:4px;
    }
    .mu-no-common {
      text-align:center; padding:20px;
      font-family:'Inter',sans-serif; font-size:.72rem;
      color:rgba(255,255,255,.25);
    }

    /* ── STAT ROWS ── */
    .mu-stat-row {
      display:grid; grid-template-columns:1fr 106px 1fr;
      align-items:center; padding:14px 20px;
      border-bottom:1px solid rgba(255,255,255,.06);
      transition:background .15s;
    }
    .mu-stat-row:last-child { border-bottom:none; }
    .mu-stat-row:hover { background:rgba(255,255,255,.02); }

    .mu-stat-val {
      font-family:'Barlow Condensed',sans-serif; font-weight:700;
      font-size:1.22rem; line-height:1;
      font-variant-numeric: tabular-nums;
    }
    .mu-stat-val.a { color:rgba(255,255,255,.9); }
    .mu-stat-val.b { color:rgba(255,255,255,.9); text-align:right; }
    .mu-stat-val.a.edge { color:#d97b3f; }
    .mu-stat-val.b.edge { color:#60a5fa; }
    .mu-stat-val.a.edge::after  { content:' \25b2'; font-size:.55em; opacity:.7; }
    .mu-stat-val.b.edge::before { content:'\25b2 '; font-size:.55em; opacity:.7; }

    .mu-stat-label {
      text-align:center;
      font-family:'Montserrat',sans-serif; font-weight:700;
      font-size:.48rem; letter-spacing:.14em; text-transform:uppercase;
      color:rgba(255,255,255,.3);
    }

    /* ── ODDS ── */
    .mu-odds-body { display:grid; grid-template-columns:1fr 1fr; }
    .mu-odds-side { padding:22px; text-align:center; }
    .mu-odds-side.a { border-right:1px solid rgba(255,255,255,.07); }
    .mu-odds-name {
      font-family:'Montserrat',sans-serif; font-weight:700; font-size:.58rem;
      letter-spacing:.08em; text-transform:uppercase;
      color:rgba(255,255,255,.42); margin-bottom:10px;
    }
    .mu-odds-num {
      font-family:'Barlow Condensed',sans-serif; font-weight:800;
      font-size:2.7rem; line-height:1; letter-spacing:-.01em;
      font-variant-numeric: tabular-nums;
    }
    .mu-odds-num.fav { color:#4ade80; }
    .mu-odds-num.dog { color:#f87171; }
    .mu-odds-prob {
      font-family:'Inter',sans-serif; font-size:.62rem; font-weight:500;
      color:rgba(255,255,255,.32); margin-top:8px;

    .mu-odds-note {
      padding:9px 20px; border-top:1px solid rgba(255,255,255,.06);
      font-family:'Inter',sans-serif; font-size:.52rem;
      color:rgba(255,255,255,.18); text-align:center;
    }

    /* ── PICKS CTA — flat, confident, no gradient-glow button ── */
    .mu-cta { margin-top:24px; text-align:center; }
    .mu-picks-btn {
      display:inline-flex; align-items:center; gap:10px;
      background:#d97b3f;
      border:none; color:#0a0a0a;
      font-family:'Montserrat',sans-serif; font-weight:800;
      font-size:.7rem; letter-spacing:.1em; text-transform:uppercase;
      padding:14px 36px; border-radius:3px; cursor:pointer; text-decoration:none;
      transition:background .18s;
    }
    .mu-picks-btn:hover { background:#e8935c; }

    /* ── LOADING ── */
    .mu-loading {
      text-align:center; padding:140px 24px;
      font-family:'Inter',sans-serif; font-size:.84rem;
      color:rgba(255,255,255,.22);
    }

    /* ── LIGHT MODE ── */
    body.light-mode .mu-fighter-name.a { color:#a06b00; }
    body.light-mode .mu-fighter-name.b { color:#1d4ed8; }
    body.light-mode .mu-hero { background:#f4f4f8; }
    body.light-mode .mu-hero-fade { background:linear-gradient(to top,#faf8f3 0%,transparent 100%); }
    body.light-mode .mu-stat-val.a { color:#a06b00; }

    body.light-mode .mu-back { color:rgba(0,0,0,.35); }
    body.light-mode .mu-back:hover { color:#b8611e; }
    body.light-mode .mu-chip { color:rgba(0,0,0,.6); border-color:rgba(0,0,0,.16); }
    body.light-mode .mu-vs-text { color:rgba(0,0,0,.5); }
    body.light-mode .mu-vs-weight { color:rgba(0,0,0,.35); }
    body.light-mode .mu-panel-header { color:rgba(0,0,0,.55); border-bottom-color:rgba(0,0,0,.09); }
    body.light-mode .mu-panel-header::after { background:rgba(0,0,0,.09); }
    body.light-mode .mu-tabs { border-bottom-color:rgba(0,0,0,.1); }
    body.light-mode .mu-tab { color:rgba(0,0,0,.35); }
    body.light-mode .mu-tab:hover { color:rgba(0,0,0,.7); }
    body.light-mode .mu-tab.active { color:#b8611e; border-bottom-color:#b8611e; }
    body.light-mode .mu-resume-block { border-bottom-color:rgba(0,0,0,.07); }
    body.light-mode .mu-resume-label { color:#b8611e; }
    body.light-mode .mu-common-row { border-bottom-color:rgba(0,0,0,.06); }
    body.light-mode .mu-common-row:hover { background:rgba(0,0,0,.03); }

    body.light-mode .mu-form-tip { background:#fff; border-color:rgba(0,0,0,.14); color:rgba(0,0,0,.75); box-shadow:0 8px 22px rgba(0,0,0,.18); }
    body.light-mode .mu-form-full { color:#b8611e; }
    body.light-mode .mu-no-common { color:rgba(0,0,0,.35); }
    body.light-mode .mu-h2h-banner { color:#b8611e; border-color:rgba(184,97,30,.4); }

    body.light-mode .mu-stat-row:hover { background:rgba(0,0,0,.03); }

    /* ── MOBILE ── */

      .mu-hero { min-height:340px; }

  </style>

<script src="lucas-moments.js?v=1.3"></script>

  <script src="micro.js?v=1.0"></script>
  <script>
  (function(){
    const API = 'https://mmabridge-backend.onrender.com/api';
    const p   = new URLSearchParams(location.search);
    const eventId = p.get('event') || '';
    const nameA   = p.get('a') || '';
    const nameB   = p.get('b') || '';
    const weight  = p.get('weight') || '';
    const imgA    = p.get('imgA') || '';
    const imgB    = p.get('imgB') || '';
    // NOTE: deliberately not named `location` — that would shadow
    // window.location for the rest of this scope (including the
    // `location.search` read above, due to const hoisting) and break the
    // page outright.
    const eventNameParam = p.get('eventName') || '';
    const venueParam     = p.get('location') || '';

    if (nameA && nameB) document.title = `${nameA} vs ${nameB} | MMA Bridge`;

    /* back link — dynamic based on where user came from */
    const backLink  = document.getElementById('muBackLink');
    const backLabel = document.getElementById('muBackLabel');
    const fromPage  = p.get('from') || '';
    if (fromPage === 'picks' && eventId) {
      backLink.href = `picks.html?event=${encodeURIComponent(eventId)}`;
      if (backLabel) backLabel.textContent = 'Back to picks';
    } else if (fromPage === 'events' && eventId) {
      backLink.href = `events.html?id=${encodeURIComponent(eventId)}`;
      if (backLabel) backLabel.textContent = 'Back to event';
    } else if (eventId) {
      backLink.href = `events.html?id=${encodeURIComponent(eventId)}`;
      if (backLabel) backLabel.textContent = 'Back to event';
    }

    function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
    function fmtOdds(n){ return n > 0 ? '+'+n : String(n); }
    function impliedProb(n){
      const pct = n < 0 ? (-n / (-n + 100)) * 100 : (100 / (n + 100)) * 100;
      return Math.round(pct) + '%';
    }
    function fuzzyMatch(a, b){
      if (!a || !b) return false;
      const clean = s => s.toLowerCase().replace(/[^a-z]/g,'');
      const ca = clean(a), cb = clean(b);
      return ca === cb || ca.includes(cb) || cb.includes(ca);
    }
    function edge(va, vb, higher){
      const na = parseFloat(String(va).replace(/[^0-9.]/g,'')),
            nb = parseFloat(String(vb).replace(/[^0-9.]/g,''));
      if (isNaN(na)||isNaN(nb)||na===nb) return {a:'',b:''};
      const aWins = higher ? na>nb : na<nb;
      return {a:aWins?'edge':'', b:aWins?'':'edge'};
    }
    function recStr(f){ const r=f.record; return r?`${r.wins}-${r.losses}${r.draws?'-'+r.draws:''}`:'—'; }

    Promise.all([
      fetch('data/fighters.json?_='+Date.now(),{cache:'no-store'}).then(r=>r.json()).catch(()=>[]),
      fetch(`${API}/odds/${encodeURIComponent(eventId)}`).then(r=>r.json()).catch(()=>({odds:[]})),
      eventId ? fetch('data/events.json?_='+Date.now(),{cache:'no-store'}).then(r=>r.json()).catch(()=>[]) : Promise.resolve([]),
    ]).then(([fighters, oddsData, eventsArr]) => {

      const fA = fighters.find(f=>fuzzyMatch(f.name,nameA)) || {};
      const fB = fighters.find(f=>fuzzyMatch(f.name,nameB)) || {};

      const oddsEntry = (oddsData.odds||[]).find(o=>
        (fuzzyMatch(o.a,nameA)||fuzzyMatch(o.b,nameA)) &&
        (fuzzyMatch(o.a,nameB)||fuzzyMatch(o.b,nameB))
      );
      let oddsForA=null, oddsForB=null;
      if (oddsEntry) {
        const aIsA = fuzzyMatch(oddsEntry.a,nameA);
        oddsForA = aIsA ? oddsEntry.odds_a : oddsEntry.odds_b;
        oddsForB = aIsA ? oddsEntry.odds_b : oddsEntry.odds_a;
      }
      /* JSON odds fallback when API returns nothing */
      if (oddsForA===null && oddsForB===null && eventId && eventsArr.length) {
        const ev = eventsArr.find(e=>e.id===eventId);
        if (ev) {
          const allF=[...(ev.mainCard||[]),...(ev.prelims||[]),...(ev.earlyPrelims||[])];
          const fight=allF.find(f=>(fuzzyMatch(f.a,nameA)||fuzzyMatch(f.b,nameA)));
          if (fight && fight.odds && fight.odds.a && fight.odds.b) {
            const aIsA=fuzzyMatch(fight.a,nameA);
            oddsForA=aIsA?parseInt(fight.odds.a):parseInt(fight.odds.b);
            oddsForB=aIsA?parseInt(fight.odds.b):parseInt(fight.odds.a);
          }
        }
      }

      /* stat rows */
      const reachEdge  = edge(fA.reach||0, fB.reach||0, true);
      const heightEdge = edge(fA.height||0, fB.height||0, true);
      const ageEdge    = edge(fA.age||99, fB.age||99, false);

      const statRows = [
        { label:'RECORD',      a:recStr(fA),                          b:recStr(fB),                          eA:'',            eB:'' },
        { label:'HEIGHT',      a:fA.height||'—',                     b:fB.height||'—',                     eA:heightEdge.a,  eB:heightEdge.b },
        { label:'REACH',       a:fA.reach||'—',                      b:fB.reach||'—',                      eA:reachEdge.a,   eB:reachEdge.b },
        { label:'STANCE',      a:fA.stance||'—',                     b:fB.stance||'—',                     eA:'',            eB:'' },
        { label:'AGE',         a:fA.age||'—',                        b:fB.age||'—',                        eA:ageEdge.a,     eB:ageEdge.b },
        { label:'NATIONALITY', a:(fA.flag||'')+' '+(fA.nationality||'—'), b:(fB.flag||'')+' '+(fB.nationality||'—'), eA:'', eB:'' },
        { label:'STYLE',       a:fA.style||'—',                      b:fB.style||'—',                      eA:'',            eB:'' },
      ];

      const statsHTML = statRows.map(r=>`
        <div class="mu-stat-row">
          <div class="mu-stat-val a ${r.eA}">${esc(String(r.a))}</div>
          <div class="mu-stat-label">${r.label}</div>
          <div class="mu-stat-val b ${r.eB}">${esc(String(r.b))}</div>
        </div>`).join('');

      /* odds */
      const oddsHTML = (oddsForA!==null && oddsForB!==null) ? `
        <div class="mu-panel" style="margin-top:16px">
          <div class="mu-panel-header">Betting Odds</div>
          <div class="mu-odds-body">
            <div class="mu-odds-side a">
              <div class="mu-odds-name">${esc(nameA)}</div>
              <div class="mu-odds-num ${oddsForA<0?'fav':'dog'}">${fmtOdds(oddsForA)}</div>
              <div class="mu-odds-prob">Implied ${impliedProb(oddsForA)}</div>
            </div>
            <div class="mu-odds-side b">
              <div class="mu-odds-name">${esc(nameB)}</div>
              <div class="mu-odds-num ${oddsForB<0?'fav':'dog'}">${fmtOdds(oddsForB)}</div>
              <div class="mu-odds-prob">Implied ${impliedProb(oddsForB)}</div>
            </div>
          </div>
          <div class="mu-odds-note">Odds via The Odds API · for entertainment only</div>
        </div>` : '';  // end oddsHTML

      /* fighter images */
      const shotA = imgA || fA.img || '';
      const shotB = imgB || fB.img || '';
      const imgsHTML = (shotA||shotB) ? `
        <div class="mu-hero-imgs">
          <div class="mu-hero-img-wrap a">
            ${shotA?`<img class="mu-hero-img" src="${esc(shotA)}" alt="${esc(nameA)}" onerror="this.style.display='none'">`:''}
          </div>
          <div class="mu-hero-img-wrap b">
            ${shotB?`<img class="mu-hero-img" src="${esc(shotB)}" alt="${esc(nameB)}" onerror="this.style.display='none'">`:''}
          </div>
        </div>` : '';

      /* chips */
      function chips(f){
        const c=[];
        if(f.ranking === 'Champion') c.push(`<span class="mu-chip champ">&#9813; Champion</span>`);
        if(f.record) c.push(`<span class="mu-chip record">${esc(recStr(f))}</span>`);
        if(f.nationality) c.push(`<span class="mu-chip nat">${f.flag||''} ${f.nationality}</span>`);
        if(f.stance) c.push(`<span class="mu-chip">${f.stance}</span>`);
        return c.length ? `<div class="mu-fighter-chips">${c.join('')}</div>` : '';
      }

      const profileA = `fighter.html?${fA.id ? `id=${encodeURIComponent(fA.id)}` : `name=${encodeURIComponent(nameA)}`}`;
      const profileB = `fighter.html?${fB.id ? `id=${encodeURIComponent(fB.id)}` : `name=${encodeURIComponent(nameB)}`}`;
      const picksHref = eventId ? `picks.html?event=${encodeURIComponent(eventId)}` : 'events.html';

      /* poster event banner text — an explicit ?eventName=/&location= (used
         by the admin Dream H2H generator for un-booked matchups) always wins
         over the auto-lookup, since there's no real eventId to look up. */
      let eventLine = '';
      if (eventNameParam || venueParam) {
        eventLine = [eventNameParam, venueParam].filter(Boolean).join(' · ');
      } else if (eventId && eventsArr.length) {
        const evForLine = eventsArr.find(e=>e.id===eventId);
        if (evForLine) {
          const parts = [evForLine.name || ''];
          if (evForLine.date) {
            const d = new Date(evForLine.date);
            if (!isNaN(d)) parts.push(d.toLocaleDateString('en-US',{month:'short',day:'numeric'}));
          }
          eventLine = parts.filter(Boolean).join(' · ');
        }
      }

      /* ── RESUME DATA ── */
      function resumeHTML(fA, fB, nA, nB) {
        const h2hFights = (fA.last5||[]).filter(f =>
          f.opponent && f.opponent.toLowerCase().replace(/[^a-z]/g,'').includes(nB.toLowerCase().replace(/[^a-z]/g,'').slice(0,5))
        );
        const h2hBanner = h2hFights.length ? `<div class="mu-h2h-banner">They've fought before &mdash; ${esc(nA)} went ${h2hFights[0].result==='W'?'WIN':'LOSS'} vs ${esc(nB)}</div>` : '';

        const oppsA = new Map();
        for (const f of (fA.last5||[])) if (f.opponent) oppsA.set(f.opponent.toLowerCase().replace(/[^a-z]/g,''), f);
        const common = [];
        for (const f of (fB.last5||[])) {
          if (!f.opponent) continue;
          const key = f.opponent.toLowerCase().replace(/[^a-z]/g,'');
          if (oppsA.has(key)) common.push({ opponent:f.opponent, resultA:oppsA.get(key).result||'', methodA:oppsA.get(key).method||'', resultB:f.result||'', methodB:f.method||'' });
        }
        const commonHTML = common.length ? common.map(c=>`
          <div class="mu-common-row">
            <div>
              <div class="mu-common-result ${c.resultA.toLowerCase()}">${esc(c.resultA)}</div>
              <div class="mu-common-method">${esc((c.methodA.split(' ')[0])||'')}</div>
            </div>
            <a class="mu-common-opponent" href="fighter.html?name=${encodeURIComponent(c.opponent)}">${esc(c.opponent)}</a>
            <div style="text-align:right">
              <div class="mu-common-result ${c.resultB.toLowerCase()}">${esc(c.resultB)}</div>
              <div class="mu-common-method">${esc((c.methodB.split(' ')[0])||'')}</div>
            </div>
          </div>`).join('') : `<div class="mu-no-common">No common opponents in recent fight history</div>`;

        function formPips(fights, reverse) {
          const last5 = (fights||[]).slice(0,5);
          const pips = last5.map(f=>{
            const result = (f.result||'').toUpperCase();
            const verb = result === 'W' ? 'Beat' : result === 'L' ? 'Lost to' : 'Drew';
            const opp = f.opponent || 'unknown';
            const tip = `${verb} ${opp}${f.method ? ' &middot; ' + esc(f.method) : ''}`;
            const href = f.opponent ? `fighter.html?name=${encodeURIComponent(f.opponent)}` : '#';
            return `<a class="mu-form-pip ${result.toLowerCase()}" href="${href}">
              <span class="mu-form-pip-letter">${esc(result)}</span>
              <span class="mu-form-tip">${tip}</span>
            </a>`;
          }).join('');
          return `<div class="mu-form-row${reverse?' b':''}">${pips}</div><div class="mu-form-sub">Last 5 fights (newest left) &middot; hover for details</div>`;
        }

        const fullResumeA = `fighter.html?${fA.id ? `id=${encodeURIComponent(fA.id)}` : `name=${encodeURIComponent(nA)}`}`;
        const fullResumeB = `fighter.html?${fB.id ? `id=${encodeURIComponent(fB.id)}` : `name=${encodeURIComponent(nB)}`}`;

        return `
          <div class="mu-resume-section">
            ${h2hBanner ? `<div class="mu-resume-block">${h2hBanner}</div>` : ''}
            <div class="mu-resume-block">
              <div class="mu-resume-label">Common Opponents</div>
              <div class="mu-common-sub">${esc(nA)} left &middot; ${esc(nB)} right</div>
              ${commonHTML}
            </div>
            <div class="mu-resume-block">
              <div class="mu-resume-label">Recent Form</div>
              <div class="mu-form-section">
                <div>
                  <div class="mu-form-name-row">
                    <div class="mu-form-name">${esc(nA)}</div>
                  </div>
                  ${formPips(fA.last5, false)}
                  <a class="mu-form-full" href="${fullResumeA}">Full Resume &rarr;</a>
                </div>
                <div class="mu-form-divider"></div>
                <div>
                  <div class="mu-form-name-row b">
                    <div class="mu-form-name b">${esc(nB)}</div>
                  </div>
                  ${formPips(fB.last5, true)}
                  <a class="mu-form-full" href="${fullResumeB}" style="float:right">Full Resume &rarr;</a>
                </div>
              </div>
            </div>
          </div>`;
      }

      document.getElementById('muRoot').innerHTML = `
        <div class="mu-hero">
          <div class="mu-hero-glow-a"></div>
          <div class="mu-hero-glow-b"></div>
          <div class="mu-hero-grid"></div>
          <div class="mu-hero-slash"></div>
          <div class="mu-hero-noise"></div>
          <div class="mu-poster-brand">MMA Bridge</div>
          <div class="mu-poster-eventline${eventLine?' has-text':''}">${esc(eventLine)}</div>
          ${imgsHTML}
          <div class="mu-hero-text">
            <div class="mu-hero-side a">
              <a class="mu-fighter-name a" href="${profileA}">${esc(nameA)}</a>
              ${chips(fA)}
            </div>
            <div class="mu-vs-center">
              <div class="mu-vs-badge"><div class="mu-vs-text">VS</div></div>
              ${weight?`<div class="mu-vs-weight">${esc(weight)}</div>`:''}
            </div>
            <div class="mu-hero-side b">
              <a class="mu-fighter-name b" href="${profileB}">${esc(nameB)}</a>
              ${chips(fB)}
            </div>
          </div>
          <div class="mu-hero-fade"></div>
        </div>
        <div class="mu-split-bar"><div class="mu-split-a"></div><div class="mu-split-b"></div></div>
        <div class="mu-content">
          <div class="mu-tabs">
            <button class="mu-tab active" data-tab="stats">Stats</button>
            <button class="mu-tab" data-tab="resume">Resume</button>
            ${oddsHTML !== '' ? '<button class="mu-tab" data-tab="odds">Odds</button>' : ''}
          </div>
          <div class="mu-tab-panel active" data-panel="stats">
            <div class="mu-panel" style="margin-top:16px">
              <div class="mu-panel-header">Fighter Comparison</div>
              ${statsHTML}
            </div>
          </div>
          <div class="mu-tab-panel" data-panel="resume">
            <div class="mu-panel" style="margin-top:16px">
              <div class="mu-panel-header">Fighter Resumes</div>
              ${resumeHTML(fA, fB, nameA, nameB)}
            </div>
          </div>
          ${oddsHTML !== '' ? `<div class="mu-tab-panel" data-panel="odds">${oddsHTML}</div>` : ''}
          <div class="mu-cta">
            <a class="mu-picks-btn" href="${picksHref}">Make Your Picks &rarr;</a>
          </div>
        </div>
      `;

      document.querySelectorAll('.mu-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.mu-tab').forEach(t=>t.classList.remove('active'));
          document.querySelectorAll('.mu-tab-panel').forEach(p=>p.classList.remove('active'));
          btn.classList.add('active');
          const panel = document.querySelector(`.mu-tab-panel[data-panel="${btn.dataset.tab}"]`);
          if (panel) panel.classList.add('active');
        });
      });

      document.title = `${nameA} vs ${nameB} | MMA Bridge`;

      // ── Poster / Full view toggle ──
      const viewToggle  = document.getElementById('muViewToggle');
      const posterExit  = document.getElementById('muPosterExit');
      const posterTheme = document.getElementById('muPosterTheme');
      viewToggle.style.display = 'inline-flex';

      function setView(view) {
        document.body.classList.toggle('mu-poster-mode', view === 'poster');
        viewToggle.querySelectorAll('.mu-view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
        window.scrollTo(0, 0);
      }
      viewToggle.querySelectorAll('.mu-view-btn').forEach(btn => {
        btn.addEventListener('click', () => setView(btn.dataset.view));
      });
      posterExit.addEventListener('click', () => setView('full'));

      // ?poster=1 — used by the admin "Dream H2H Poster" generator to open
      // straight into Poster view instead of making the admin click twice.
      if (p.get('poster') === '1') setView('poster');

      // poster-only light/dark toggle, independent of the site's own theme
      posterTheme.addEventListener('click', () => {
        const isLight = document.body.classList.toggle('mu-poster-light');
        posterTheme.textContent = isLight ? '☀️' : '🌙';
      });
    });

    window.addEventListener('scroll', () => {
      document.querySelector('.navbar').classList.toggle('scrolled', window.scrollY > 10);
    });
  })();
  </script>
</body>
</html>
