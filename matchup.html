<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="images/mma-bridge-logo.png">
  <link rel="shortcut icon" type="image/png" href="images/mma-bridge-logo.png">
  <link rel="apple-touch-icon" href="images/mma-bridge-logo.png">
  <meta name="theme-color" content="#d97b3f">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <script src="theme.js?v=2.7"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fight Matchup | MMA Bridge</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600&family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css?v=9.17" />
  <style>
    *, *::before, *::after { box-sizing:border-box; }
    body { background:#040407; min-height:100vh; }

    /* ── BACK BAR ── */
    .mu-back {
      display:inline-flex; align-items:center; gap:7px;
      font-family:'Montserrat',sans-serif; font-weight:700; font-size:.6rem;
      letter-spacing:.14em; text-transform:uppercase;
      color:rgba(255,255,255,.28); text-decoration:none;
      padding:16px 24px 0; transition:color .18s;
    }
    .mu-back:hover { color:#d97b3f; }

    /* ── HERO ── */
    .mu-hero {
      position:relative; overflow:hidden;
      min-height:400px;
      background:linear-gradient(180deg,#0a0a10 0%,#060608 100%);
      margin-top:10px;
    }
    /* full radial glows — one each side */
    .mu-hero-glow-a {
      position:absolute; top:-20%; left:-5%;
      width:55%; height:140%;
      background:radial-gradient(ellipse at 30% 50%,rgba(217,123,63,.16) 0%,transparent 65%);
      pointer-events:none;
    }
    .mu-hero-glow-b {
      position:absolute; top:-20%; right:-5%;
      width:55%; height:140%;
      background:radial-gradient(ellipse at 70% 50%,rgba(96,165,250,.16) 0%,transparent 65%);
      pointer-events:none;
    }
    /* center slash */
    .mu-hero-slash {
      position:absolute; top:0; bottom:0;
      left:calc(50% - 1px); width:2px;
      background:linear-gradient(180deg,
        transparent 0%,
        rgba(255,255,255,.06) 15%,
        rgba(255,255,255,.12) 50%,
        rgba(255,255,255,.06) 85%,
        transparent 100%);
      pointer-events:none; z-index:1;
    }
    /* noise grain texture */
    .mu-hero-noise {
      position:absolute; inset:0; pointer-events:none; z-index:0; opacity:.03;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size:200px 200px;
    }

    /* fighter images */
    .mu-hero-imgs {
      position:absolute; inset:0;
      display:grid; grid-template-columns:1fr 1fr;
      pointer-events:none; z-index:1;
    }
    .mu-hero-img-wrap { display:flex; align-items:flex-end; overflow:hidden; }
    .mu-hero-img-wrap.a { justify-content:flex-start; padding-left:2%; }
    .mu-hero-img-wrap.b { justify-content:flex-end; padding-right:2%; }
    .mu-hero-img {
      height:380px; width:auto; max-width:58%;
      object-fit:contain; object-position:bottom center;
      opacity:.9;
    }
    .mu-hero-img-wrap.a .mu-hero-img {
      filter:
        drop-shadow(0 0 60px rgba(0,0,0,1))
        drop-shadow(-6px 0 30px rgba(217,123,63,.25))
        drop-shadow(0 20px 40px rgba(0,0,0,.8));
    }
    .mu-hero-img-wrap.b .mu-hero-img {
      transform:scaleX(-1);
      filter:
        drop-shadow(0 0 60px rgba(0,0,0,1))
        drop-shadow(6px 0 30px rgba(96,165,250,.25))
        drop-shadow(0 20px 40px rgba(0,0,0,.8));
    }

    /* text overlay */
    .mu-hero-text {
      position:relative; z-index:3;
      display:grid; grid-template-columns:1fr auto 1fr;
      align-items:flex-end;
      padding:36px 28px 28px;
      min-height:400px;
    }
    .mu-hero-side { display:flex; flex-direction:column; gap:8px; }
    .mu-hero-side.b { align-items:flex-end; text-align:right; }

    .mu-fighter-name {
      font-family:'Barlow Condensed',sans-serif; font-weight:900; font-style:italic;
      font-size:clamp(2.2rem,5.5vw,4.2rem);
      text-transform:uppercase; letter-spacing:.01em; line-height:.92;
      text-decoration:none; transition:filter .2s;
      display:block;
    }
    .mu-fighter-name.a {
      color:#fff;
      text-shadow:
        0 0 50px rgba(217,123,63,.35),
        0 2px 0 rgba(0,0,0,.9),
        0 4px 20px rgba(0,0,0,.7);
    }
    .mu-fighter-name.b {
      color:#fff;
      text-shadow:
        0 0 50px rgba(96,165,250,.35),
        0 2px 0 rgba(0,0,0,.9),
        0 4px 20px rgba(0,0,0,.7);
    }
    .mu-fighter-name:hover { filter:brightness(1.2); }

    .mu-fighter-chips { display:flex; gap:5px; flex-wrap:wrap; }
    .mu-hero-side.b .mu-fighter-chips { justify-content:flex-end; }
    .mu-chip {
      font-family:'Montserrat',sans-serif; font-weight:700; font-size:.46rem;
      letter-spacing:.1em; text-transform:uppercase;
      padding:3px 8px; border-radius:4px;
      border:1px solid rgba(255,255,255,.12);
      color:rgba(255,255,255,.5); background:rgba(0,0,0,.4);
      backdrop-filter:blur(4px);
    }

    /* VS center */
    .mu-vs-center {
      text-align:center; padding:0 10px;
      display:flex; flex-direction:column; align-items:center; gap:5px;
      padding-bottom:6px;
    }
    .mu-vs-text {
      font-family:'Barlow Condensed',sans-serif; font-weight:900;
      font-size:clamp(1rem,2.5vw,1.35rem);
      letter-spacing:.25em; text-transform:uppercase;
      background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.1));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text;
    }
    .mu-vs-weight {
      font-family:'Montserrat',sans-serif; font-weight:800; font-size:.48rem;
      letter-spacing:.18em; text-transform:uppercase;
      color:rgba(255,255,255,.22); white-space:nowrap;
    }

    /* bottom fade */
    .mu-hero-fade {
      position:absolute; bottom:0; left:0; right:0; height:100px;
      background:linear-gradient(to top,#040407 0%,transparent 100%);
      pointer-events:none; z-index:2;
    }

    /* ── SPLIT BAR ── */
    .mu-split-bar {
      display:grid; grid-template-columns:1fr 1fr; height:2px;
    }
    .mu-split-a { background:linear-gradient(90deg,transparent 0%,#d97b3f 100%); }
    .mu-split-b { background:linear-gradient(90deg,#60a5fa 0%,transparent 100%); }

    /* ── CONTENT ── */
    .mu-content { max-width:860px; margin:0 auto; padding:0 20px 100px; }

    /* ── PANELS (shared) ── */
    .mu-panel {
      margin-top:20px;
      border:1px solid rgba(255,255,255,.08);
      border-radius:16px; overflow:hidden;
      background:rgba(255,255,255,.02);
      box-shadow:0 4px 40px rgba(0,0,0,.5), 0 1px 0 rgba(255,255,255,.04) inset;
      backdrop-filter:blur(8px);
    }
    .mu-panel-header {
      padding:13px 22px;
      border-bottom:1px solid rgba(255,255,255,.06);
      font-family:'Montserrat',sans-serif; font-weight:800;
      font-size:.52rem; letter-spacing:.22em; text-transform:uppercase;
      color:rgba(255,255,255,.25);
      display:flex; align-items:center; gap:10px;
    }
    .mu-panel-header::after { content:''; flex:1; height:1px; background:rgba(255,255,255,.06); }

    /* ── TABS ── */
    .mu-tabs {
      display:flex; gap:0; border-bottom:1px solid rgba(255,255,255,.07);
      margin:28px 0 0;
    }
    .mu-tab {
      padding:12px 20px; font-family:'Montserrat',sans-serif;
      font-weight:800; font-size:.6rem; letter-spacing:.14em;
      text-transform:uppercase; color:rgba(255,255,255,.28);
      border:none; background:none; cursor:pointer;
      border-bottom:2px solid transparent; margin-bottom:-1px;
      transition:color .18s, border-color .18s;
    }
    .mu-tab:hover { color:rgba(255,255,255,.6); }
    .mu-tab.active { color:#d97b3f; border-bottom-color:#d97b3f; }
    .mu-tab-panel { display:none; }
    .mu-tab-panel.active { display:block; }

    /* ── RESUME TAB ── */
    .mu-resume-section { margin-top:0; }
    .mu-resume-block {
      padding:18px 22px;
      border-bottom:1px solid rgba(255,255,255,.04);
    }
    .mu-resume-block:last-child { border-bottom:none; }
    .mu-resume-label {
      font-family:'Montserrat',sans-serif; font-weight:800;
      font-size:.52rem; letter-spacing:.2em; text-transform:uppercase;
      color:#d97b3f; opacity:.75; margin-bottom:14px;
    }
    .mu-common-row {
      display:grid; grid-template-columns:1fr auto 1fr;
      align-items:center; gap:10px; padding:10px 8px;
      margin:0 -8px;
      border-radius:8px;
      border-bottom:1px solid rgba(255,255,255,.03);
      transition:background .15s;
    }
    .mu-common-row:hover { background:rgba(255,255,255,.025); }
    .mu-common-row:last-child { border-bottom:none; }
    .mu-common-result {
      display:inline-flex; align-items:center; justify-content:center;
      min-width:26px; height:22px; padding:0 6px; border-radius:5px;
      font-family:'Montserrat',sans-serif; font-weight:800;
      font-size:.62rem; letter-spacing:.02em;
    }
    .mu-common-result.w { color:#4ade80; background:rgba(74,222,128,.13); border:1px solid rgba(74,222,128,.2); }
    .mu-common-result.l { color:#f87171; background:rgba(248,113,113,.1); border:1px solid rgba(248,113,113,.16); }
    .mu-common-opponent {
      font-family:'Montserrat',sans-serif; font-weight:700; font-size:.6rem;
      color:rgba(255,255,255,.55); text-align:center;
      text-transform:uppercase; letter-spacing:.04em;
      text-decoration:none; transition:color .15s;
    }
    .mu-common-opponent:hover { color:#d97b3f; }
    .mu-common-method {
      font-family:'Inter',sans-serif; font-size:.55rem;
      color:rgba(255,255,255,.3); margin-top:3px;
    }
    .mu-common-sub {
      font-size:.52rem; color:rgba(255,255,255,.2);
      font-family:'Montserrat',sans-serif; margin-bottom:10px; letter-spacing:.06em;
    }
    .mu-form-name {
      font-family:'Montserrat',sans-serif; font-size:.52rem; font-weight:700;
      color:rgba(255,255,255,.4); letter-spacing:.08em; text-transform:uppercase;
      margin-bottom:8px;
    }
    .mu-form-name.b { text-align:right; }
    .mu-form-row {
      display:flex; gap:5px; flex-wrap:wrap;
    }
    .mu-form-row.b { justify-content:flex-end; }
    .mu-form-pip {
      width:30px; height:30px; border-radius:7px;
      display:flex; align-items:center; justify-content:center;
      font-family:'Barlow Condensed',sans-serif; font-weight:900; font-size:.9rem;
      transition:transform .15s;
    }
    .mu-form-pip:hover { transform:translateY(-2px); }
    .mu-form-pip.w { background:rgba(74,222,128,.15); color:#4ade80; border:1px solid rgba(74,222,128,.2); }
    .mu-form-pip.l { background:rgba(248,113,113,.12); color:#f87171; border:1px solid rgba(248,113,113,.18); }
    .mu-form-sub {
      font-family:'Inter',sans-serif; font-size:.52rem;
      color:rgba(255,255,255,.28); margin-top:5px;
    }
    .mu-form-section {
      display:grid; grid-template-columns:1fr 1px 1fr; gap:16px; align-items:start;
    }
    .mu-form-divider { background:rgba(255,255,255,.06); align-self:stretch; }
    .mu-h2h-banner {
      text-align:center; padding:16px;
      font-family:'Barlow Condensed',sans-serif; font-weight:900;
      font-size:1.1rem; color:#d97b3f;
      text-transform:uppercase; letter-spacing:.06em;
      background:rgba(217,123,63,.06);
      border-radius:8px; margin-bottom:4px;
    }
    .mu-no-common {
      text-align:center; padding:20px;
      font-family:'Inter',sans-serif; font-size:.72rem;
      color:rgba(255,255,255,.22);
    }

    /* ── STAT ROWS ── */
    .mu-stat-row {
      display:grid; grid-template-columns:1fr 106px 1fr;
      align-items:center; padding:15px 22px;
      border-bottom:1px solid rgba(255,255,255,.04);
      transition:background .15s;
    }
    .mu-stat-row:last-child { border-bottom:none; }
    .mu-stat-row:hover { background:rgba(255,255,255,.025); }

    .mu-stat-val {
      font-family:'Barlow Condensed',sans-serif; font-weight:800;
      font-size:1.28rem; line-height:1;
    }
    .mu-stat-val.a { color:rgba(255,255,255,.92); }
    .mu-stat-val.b { color:rgba(255,255,255,.92); text-align:right; }
    .mu-stat-val.a.edge {
      color:#fff;
      text-shadow:0 0 14px rgba(217,123,63,.5);
    }
    .mu-stat-val.b.edge {
      color:#fff;
      text-shadow:0 0 14px rgba(96,165,250,.5);
    }
    .mu-stat-val.a.edge::after  { content:' ▲'; font-size:.55em; opacity:.65; }
    .mu-stat-val.b.edge::before { content:'▲ '; font-size:.55em; opacity:.65; }

    .mu-stat-label {
      text-align:center;
      font-family:'Montserrat',sans-serif; font-weight:800;
      font-size:.48rem; letter-spacing:.16em; text-transform:uppercase;
      color:rgba(255,255,255,.25);
    }

    /* ── ODDS ── */
    .mu-odds-body { display:grid; grid-template-columns:1fr 1fr; }
    .mu-odds-side { padding:24px; text-align:center; }
    .mu-odds-side.a { border-right:1px solid rgba(255,255,255,.05); }
    .mu-odds-name {
      font-family:'Montserrat',sans-serif; font-weight:700; font-size:.58rem;
      letter-spacing:.08em; text-transform:uppercase;
      color:rgba(255,255,255,.38); margin-bottom:10px;
    }
    .mu-odds-num {
      font-family:'Barlow Condensed',sans-serif; font-weight:900;
      font-size:3rem; line-height:1; letter-spacing:-.01em;
    }
    .mu-odds-num.fav {
      color:#4ade80;
      text-shadow:0 0 30px rgba(74,222,128,.35),0 0 8px rgba(74,222,128,.15);
    }
    .mu-odds-num.dog { color:#f87171; }
    .mu-odds-prob {
      font-family:'Inter',sans-serif; font-size:.62rem; font-weight:500;
      color:rgba(255,255,255,.28); margin-top:8px;
    }
    .mu-odds-note {
      padding:9px 20px; border-top:1px solid rgba(255,255,255,.04);
      font-family:'Inter',sans-serif; font-size:.52rem;
      color:rgba(255,255,255,.14); text-align:center;
    }

    /* ── PICKS CTA ── */
    .mu-cta { margin-top:24px; text-align:center; }
    .mu-picks-btn {
      display:inline-flex; align-items:center; gap:10px;
      background:linear-gradient(135deg,#7a3100 0%,#c85800 45%,#f0a500 100%);
      border:none; color:#fff;
      font-family:'Montserrat',sans-serif; font-weight:800;
      font-size:.7rem; letter-spacing:.12em; text-transform:uppercase;
      padding:15px 38px; border-radius:12px; cursor:pointer; text-decoration:none;
      box-shadow:0 4px 30px rgba(240,140,0,.35),0 1px 0 rgba(255,220,100,.2) inset;
      transition:transform .18s, box-shadow .18s;
    }
    .mu-picks-btn:hover {
      transform:translateY(-3px) scale(1.02);
      box-shadow:0 14px 40px rgba(240,140,0,.55),0 1px 0 rgba(255,220,100,.2) inset;
    }

    /* ── LOADING ── */
    .mu-loading {
      text-align:center; padding:140px 24px;
      font-family:'Inter',sans-serif; font-size:.84rem;
      color:rgba(255,255,255,.2);
    }

    /* ── LIGHT MODE ── */
    body.light-mode .mu-fighter-name.a { color:#a06b00; }
    body.light-mode .mu-fighter-name.b { color:#1d4ed8; }
    body.light-mode .mu-hero { background:#f4f4f8; }
    body.light-mode .mu-hero-fade { background:linear-gradient(to top,#faf8f3 0%,transparent 100%); }
    body.light-mode .mu-stat-val.a { color:#a06b00; }
    body.light-mode .mu-stat-val.b { color:#1d4ed8; }
    body.light-mode .mu-panel { background:rgba(0,0,0,.02); border-color:rgba(0,0,0,.08); }
    body.light-mode .mu-back { color:rgba(0,0,0,.35); }
    body.light-mode .mu-back:hover { color:#b8611e; }
    body.light-mode .mu-chip { color:rgba(0,0,0,.6); background:rgba(0,0,0,.05); border-color:rgba(0,0,0,.12); }
    body.light-mode .mu-vs-text { background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.22)); -webkit-background-clip:text; background-clip:text; }
    body.light-mode .mu-vs-weight { color:rgba(0,0,0,.35); }
    body.light-mode .mu-panel-header { color:rgba(0,0,0,.4); border-bottom-color:rgba(0,0,0,.08); }
    body.light-mode .mu-panel-header::after { background:rgba(0,0,0,.08); }
    body.light-mode .mu-tabs { border-bottom-color:rgba(0,0,0,.1); }
    body.light-mode .mu-tab { color:rgba(0,0,0,.35); }
    body.light-mode .mu-tab:hover { color:rgba(0,0,0,.7); }
    body.light-mode .mu-tab.active { color:#b8611e; border-bottom-color:#b8611e; }
    body.light-mode .mu-resume-block { border-bottom-color:rgba(0,0,0,.06); }
    body.light-mode .mu-resume-label { color:#b8611e; }
    body.light-mode .mu-common-row { border-bottom-color:rgba(0,0,0,.05); }
    body.light-mode .mu-common-row:hover { background:rgba(0,0,0,.03); }
    body.light-mode .mu-common-opponent { color:rgba(0,0,0,.62); }
    body.light-mode .mu-common-opponent:hover { color:#b8611e; }
    body.light-mode .mu-common-method { color:rgba(0,0,0,.42); }
    body.light-mode .mu-common-sub { color:rgba(0,0,0,.32); }
    body.light-mode .mu-form-name { color:rgba(0,0,0,.5); }
    body.light-mode .mu-form-divider { background:rgba(0,0,0,.09); }
    body.light-mode .mu-form-sub { color:rgba(0,0,0,.38); }
    body.light-mode .mu-no-common { color:rgba(0,0,0,.35); }
    body.light-mode .mu-h2h-banner { background:rgba(184,97,30,.08); color:#b8611e; }
    body.light-mode .mu-stat-row { border-bottom-color:rgba(0,0,0,.06); }
    body.light-mode .mu-stat-row:hover { background:rgba(0,0,0,.03); }
    body.light-mode .mu-stat-label { color:rgba(0,0,0,.4); }
    body.light-mode .mu-odds-side.a { border-right-color:rgba(0,0,0,.08); }
    body.light-mode .mu-odds-name { color:rgba(0,0,0,.5); }
    body.light-mode .mu-odds-prob { color:rgba(0,0,0,.45); }
    body.light-mode .mu-odds-note { border-top-color:rgba(0,0,0,.06); color:rgba(0,0,0,.32); }
    body.light-mode .mu-loading { color:rgba(0,0,0,.35); }

    /* ── MOBILE ── */
    @media(max-width:600px){
      .mu-hero-text { min-height:280px; padding:20px 14px 20px; }
      .mu-fighter-name { font-size:1.6rem; }
      .mu-hero-img { height:260px; }
      .mu-stat-row { grid-template-columns:1fr 78px 1fr; padding:12px 14px; }
      .mu-stat-val { font-size:1.05rem; }
      .mu-stat-label { font-size:.42rem; }
      .mu-odds-num { font-size:2.4rem; }
    }
  </style>
</head>

    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    <span id="muBackLabel">Back</span>
  </a>

  <div id="muRoot" class="mu-loading">Loading matchup...</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="auth.js?v=3.2"></script>
  <script src="search.js"></script>
  <script src="ux.js?v=1.0"></script>
  <script src="premium.js?v=3.10"></script>
  <script src="animations.js?v=2.0"></script>
  <script src="chat.js?v=2.4"></script>
<script src="lucas-moments.js?v=1.3"></script>
  <script src="fighter-modal.js?v=1.1"></script>
  <script src="notifications.js?v=2.5"></script>
  <script src="micro.js?v=1.0"></script>
  <script>
  (function(){
    const API = 'https://mmabridge-backend.onrender.com/api';
    const p   = new URLSearchParams(location.search);
    const eventId = p.get('event') || '';
    const nameA   = p.get('a') || '';
    const nameB   = p.get('b') || '';
    const weight  = p.get('weight') || '';
    const imgA    = p.get('imgA') || '';
    const imgB    = p.get('imgB') || '';

    if (nameA && nameB) document.title = `${nameA} vs ${nameB} | MMA Bridge`;

    /* back link — dynamic based on where user came from */
    const backLink  = document.getElementById('muBackLink');
    const backLabel = document.getElementById('muBackLabel');
    const fromPage  = p.get('from') || '';
    if (fromPage === 'picks' && eventId) {
      backLink.href = `picks.html?event=${encodeURIComponent(eventId)}`;
      if (backLabel) backLabel.textContent = 'Back to picks';
    } else if (fromPage === 'events' && eventId) {
      backLink.href = `events.html?id=${encodeURIComponent(eventId)}`;
      if (backLabel) backLabel.textContent = 'Back to event';
    } else if (eventId) {
      backLink.href = `events.html?id=${encodeURIComponent(eventId)}`;
      if (backLabel) backLabel.textContent = 'Back to event';
    }

    function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
    function fmtOdds(n){ return n > 0 ? '+'+n : String(n); }
    function impliedProb(n){
      const pct = n < 0 ? (-n / (-n + 100)) * 100 : (100 / (n + 100)) * 100;
      return Math.round(pct) + '%';
    }
    function fuzzyMatch(a, b){
      if (!a || !b) return false;
      const clean = s => s.toLowerCase().replace(/[^a-z]/g,'');
      const ca = clean(a), cb = clean(b);
      return ca === cb || ca.includes(cb) || cb.includes(ca);
    }
    function edge(va, vb, higher){
      const na = parseFloat(String(va).replace(/[^0-9.]/g,'')),
            nb = parseFloat(String(vb).replace(/[^0-9.]/g,''));
      if (isNaN(na)||isNaN(nb)||na===nb) return {a:'',b:''};
      const aWins = higher ? na>nb : na<nb;
      return {a:aWins?'edge':'', b:aWins?'':'edge'};
    }
    function recStr(f){ const r=f.record; return r?`${r.wins}-${r.losses}${r.draws?'-'+r.draws:''}`:'—'; }

    Promise.all([
      fetch('data/fighters.json?_='+Date.now(),{cache:'no-store'}).then(r=>r.json()).catch(()=>[]),
      fetch(`${API}/odds/${encodeURIComponent(eventId)}`).then(r=>r.json()).catch(()=>({odds:[]})),
      eventId ? fetch('data/events.json?_='+Date.now(),{cache:'no-store'}).then(r=>r.json()).catch(()=>[]) : Promise.resolve([]),
    ]).then(([fighters, oddsData, eventsArr]) => {

      const fA = fighters.find(f=>fuzzyMatch(f.name,nameA)) || {};
      const fB = fighters.find(f=>fuzzyMatch(f.name,nameB)) || {};

      const oddsEntry = (oddsData.odds||[]).find(o=>
        (fuzzyMatch(o.a,nameA)||fuzzyMatch(o.b,nameA)) &&
        (fuzzyMatch(o.a,nameB)||fuzzyMatch(o.b,nameB))
      );
      let oddsForA=null, oddsForB=null;
      if (oddsEntry) {
        const aIsA = fuzzyMatch(oddsEntry.a,nameA);
        oddsForA = aIsA ? oddsEntry.odds_a : oddsEntry.odds_b;
        oddsForB = aIsA ? oddsEntry.odds_b : oddsEntry.odds_a;
      }
      /* JSON odds fallback when API returns nothing */
      if (oddsForA===null && oddsForB===null && eventId && eventsArr.length) {
        const ev = eventsArr.find(e=>e.id===eventId);
        if (ev) {
          const allF=[...(ev.mainCard||[]),...(ev.prelims||[]),...(ev.earlyPrelims||[])];
          const fight=allF.find(f=>(fuzzyMatch(f.a,nameA)||fuzzyMatch(f.b,nameA)));
          if (fight && fight.odds && fight.odds.a && fight.odds.b) {
            const aIsA=fuzzyMatch(fight.a,nameA);
            oddsForA=aIsA?parseInt(fight.odds.a):parseInt(fight.odds.b);
            oddsForB=aIsA?parseInt(fight.odds.b):parseInt(fight.odds.a);
          }
        }
      }

      /* stat rows */
      const reachEdge  = edge(fA.reach||0, fB.reach||0, true);
      const heightEdge = edge(fA.height||0, fB.height||0, true);
      const ageEdge    = edge(fA.age||99, fB.age||99, false);

      const statRows = [
        { label:'RECORD',      a:recStr(fA),                          b:recStr(fB),                          eA:'',            eB:'' },
        { label:'HEIGHT',      a:fA.height||'—',                     b:fB.height||'—',                     eA:heightEdge.a,  eB:heightEdge.b },
        { label:'REACH',       a:fA.reach||'—',                      b:fB.reach||'—',                      eA:reachEdge.a,   eB:reachEdge.b },
        { label:'STANCE',      a:fA.stance||'—',                     b:fB.stance||'—',                     eA:'',            eB:'' },
        { label:'AGE',         a:fA.age||'—',                        b:fB.age||'—',                        eA:ageEdge.a,     eB:ageEdge.b },
        { label:'NATIONALITY', a:(fA.flag||'')+' '+(fA.nationality||'—'), b:(fB.flag||'')+' '+(fB.nationality||'—'), eA:'', eB:'' },
        { label:'STYLE',       a:fA.style||'—',                      b:fB.style||'—',                      eA:'',            eB:'' },
      ];

      const statsHTML = statRows.map(r=>`
        <div class="mu-stat-row">
          <div class="mu-stat-val a ${r.eA}">${esc(String(r.a))}</div>
          <div class="mu-stat-label">${r.label}</div>
          <div class="mu-stat-val b ${r.eB}">${esc(String(r.b))}</div>
        </div>`).join('');

      /* odds */
      const oddsHTML = (oddsForA!==null && oddsForB!==null) ? `
        <div class="mu-panel" style="margin-top:16px">
          <div class="mu-panel-header">Betting Odds</div>
          <div class="mu-odds-body">
            <div class="mu-odds-side a">
              <div class="mu-odds-name">${esc(nameA)}</div>
              <div class="mu-odds-num ${oddsForA<0?'fav':'dog'}">${fmtOdds(oddsForA)}</div>
              <div class="mu-odds-prob">Implied ${impliedProb(oddsForA)}</div>
            </div>
            <div class="mu-odds-side b">
              <div class="mu-odds-name">${esc(nameB)}</div>
              <div class="mu-odds-num ${oddsForB<0?'fav':'dog'}">${fmtOdds(oddsForB)}</div>
              <div class="mu-odds-prob">Implied ${impliedProb(oddsForB)}</div>
            </div>
          </div>
          <div class="mu-odds-note">Odds via The Odds API · for entertainment only</div>
        </div>` : '';  // end oddsHTML

      /* fighter images */
      const shotA = imgA || fA.img || '';
      const shotB = imgB || fB.img || '';
      const imgsHTML = (shotA||shotB) ? `
        <div class="mu-hero-imgs">
          <div class="mu-hero-img-wrap a">
            ${shotA?`<img class="mu-hero-img" src="${esc(shotA)}" alt="${esc(nameA)}" onerror="this.style.display='none'">`:''}
          </div>
          <div class="mu-hero-img-wrap b">
            ${shotB?`<img class="mu-hero-img" src="${esc(shotB)}" alt="${esc(nameB)}" onerror="this.style.display='none'">`:''}
          </div>
        </div>` : '';

      /* chips */
      function chips(f){
        const c=[];
        if(f.nationality) c.push(`<span class="mu-chip nat">${f.flag||''} ${f.nationality}</span>`);
        if(f.stance) c.push(`<span class="mu-chip">${f.stance}</span>`);
        return c.length ? `<div class="mu-fighter-chips">${c.join('')}</div>` : '';
      }

      const profileA = `fighter.html?${fA.id ? `id=${encodeURIComponent(fA.id)}` : `name=${encodeURIComponent(nameA)}`}`;
      const profileB = `fighter.html?${fB.id ? `id=${encodeURIComponent(fB.id)}` : `name=${encodeURIComponent(nameB)}`}`;
      const picksHref = eventId ? `picks.html?event=${encodeURIComponent(eventId)}` : 'events.html';

      /* ── RESUME DATA ── */
      function resumeHTML(fA, fB, nA, nB) {
        const h2hFights = (fA.last5||[]).filter(f =>
          f.opponent && f.opponent.toLowerCase().replace(/[^a-z]/g,'').includes(nB.toLowerCase().replace(/[^a-z]/g,'').slice(0,5))
        );
        const h2hBanner = h2hFights.length ? `<div class="mu-h2h-banner">&#9876; They've fought before &mdash; ${esc(nA)} went ${h2hFights[0].result==='W'?'WIN':'LOSS'} vs ${esc(nB)}</div>` : '';

        const oppsA = new Map();
        for (const f of (fA.last5||[])) if (f.opponent) oppsA.set(f.opponent.toLowerCase().replace(/[^a-z]/g,''), f);
        const common = [];
        for (const f of (fB.last5||[])) {
          if (!f.opponent) continue;
          const key = f.opponent.toLowerCase().replace(/[^a-z]/g,'');
          if (oppsA.has(key)) common.push({ opponent:f.opponent, resultA:oppsA.get(key).result||'', methodA:oppsA.get(key).method||'', resultB:f.result||'', methodB:f.method||'' });
        }
        const commonHTML = common.length ? common.map(c=>`
          <div class="mu-common-row">
            <div>
              <div class="mu-common-result ${c.resultA.toLowerCase()}">${esc(c.resultA)}</div>
              <div class="mu-common-method">${esc((c.methodA.split(' ')[0])||'')}</div>
            </div>
            <a class="mu-common-opponent" href="fighter.html?name=${encodeURIComponent(c.opponent)}">${esc(c.opponent)}</a>
            <div style="text-align:right">
              <div class="mu-common-result ${c.resultB.toLowerCase()}">${esc(c.resultB)}</div>
              <div class="mu-common-method">${esc((c.methodB.split(' ')[0])||'')}</div>
            </div>
          </div>`).join('') : `<div class="mu-no-common">No common opponents in recent fight history</div>`;

        function formPips(fights, reverse) {
          const last5 = (fights||[]).slice(0,5);
          const pips = last5.map(f=>`<div class="mu-form-pip ${(f.result||'').toLowerCase()}" title="${esc(f.opponent||'')} &mdash; ${esc(f.method||'')}">${esc(f.result||'')}</div>`).join('');
          return `<div class="mu-form-row${reverse?' b':''}">${pips}</div><div class="mu-form-sub">Last 5 fights (newest left)</div>`;
        }

        return `
          <div class="mu-resume-section">
            ${h2hBanner ? `<div class="mu-resume-block">${h2hBanner}</div>` : ''}
            <div class="mu-resume-block">
              <div class="mu-resume-label">Common Opponents</div>
              <div class="mu-common-sub">${esc(nA)} left &middot; ${esc(nB)} right</div>
              ${commonHTML}
            </div>
            <div class="mu-resume-block">
              <div class="mu-resume-label">Recent Form</div>
              <div class="mu-form-section">
                <div>
                  <div class="mu-form-name">${esc(nA)}</div>
                  ${formPips(fA.last5, false)}
                </div>
                <div class="mu-form-divider"></div>
                <div>
                  <div class="mu-form-name b">${esc(nB)}</div>
                  ${formPips(fB.last5, true)}
                </div>
              </div>
            </div>
          </div>`;
      }

      document.getElementById('muRoot').innerHTML = `
        <div class="mu-hero">
          <div class="mu-hero-glow-a"></div>
          <div class="mu-hero-glow-b"></div>
          <div class="mu-hero-slash"></div>
          <div class="mu-hero-noise"></div>
          ${imgsHTML}
          <div class="mu-hero-text">
            <div class="mu-hero-side a">
              <a class="mu-fighter-name a" href="${profileA}">${esc(nameA)}</a>
              ${chips(fA)}
            </div>
            <div class="mu-vs-center">
              <div class="mu-vs-text">VS</div>
              ${weight?`<div class="mu-vs-weight">${esc(weight)}</div>`:''}
            </div>
            <div class="mu-hero-side b">
              <a class="mu-fighter-name b" href="${profileB}">${esc(nameB)}</a>
              ${chips(fB)}
            </div>
          </div>
          <div class="mu-hero-fade"></div>
        </div>
        <div class="mu-split-bar"><div class="mu-split-a"></div><div class="mu-split-b"></div></div>
        <div class="mu-content">
          <div class="mu-tabs">
            <button class="mu-tab active" data-tab="stats">Stats</button>
            <button class="mu-tab" data-tab="resume">Resume</button>
            ${oddsHTML !== '' ? '<button class="mu-tab" data-tab="odds">Odds</button>' : ''}
          </div>
          <div class="mu-tab-panel active" data-panel="stats">
            <div class="mu-panel" style="margin-top:16px">
              <div class="mu-panel-header">Fighter Comparison</div>
              ${statsHTML}
            </div>
          </div>
          <div class="mu-tab-panel" data-panel="resume">
            <div class="mu-panel" style="margin-top:16px">
              <div class="mu-panel-header">Fighter Resumes</div>
              ${resumeHTML(fA, fB, nameA, nameB)}
            </div>
          </div>
          ${oddsHTML !== '' ? `<div class="mu-tab-panel" data-panel="odds">${oddsHTML}</div>` : ''}
          <div class="mu-cta">
            <a class="mu-picks-btn" href="${picksHref}">Make Your Picks &rarr;</a>
          </div>
        </div>
      `;

      document.querySelectorAll('.mu-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.mu-tab').forEach(t=>t.classList.remove('active'));
          document.querySelectorAll('.mu-tab-panel').forEach(p=>p.classList.remove('active'));
          btn.classList.add('active');
          const panel = document.querySelector(`.mu-tab-panel[data-panel="${btn.dataset.tab}"]`);
          if (panel) panel.classList.add('active');
        });
      });

      document.title = `${nameA} vs ${nameB} | MMA Bridge`;
    });

    window.addEventListener('scroll', () => {
      document.querySelector('.navbar').classList.toggle('scrolled', window.scrollY > 10);
    });
  })();
  </script>
</body>
</html>
